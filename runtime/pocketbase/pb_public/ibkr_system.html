<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IBKR Overview - Trading Flight</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <link rel="stylesheet" href="/assets/css/ibkr-page-common.css">
    <script src="/assets/js/shared/ibkr-page.js"></script>
    <link rel="stylesheet" href="/assets/css/pages/ibkr_system/page.css">
</head>
<body>
    <div class="page-loading-overlay" id="pageLoading">
        <div class="page-loading-card">
            <div class="page-loading-title" id="pageLoadingTitle">系统概览加载中</div>
            <div class="page-loading-copy" id="pageLoadingCopy">正在同步 healthz / statusz / cron / freshness / events / 回测统计，请稍候。</div>
            <div class="page-loading-bars">
                <div class="page-loading-bar"></div>
                <div class="page-loading-bar"></div>
                <div class="page-loading-bar"></div>
            </div>
        </div>
    </div>

    <div id="nav"></div>

    <div class="page-shell">
        <div id="contextBar"></div>
        <div id="pageBridge"></div>

        <div class="content-area">
            <div class="system-meta-row">
                <div class="refresh-info" id="refreshInfo">加载中...</div>
            </div>

            <div class="status-bar" id="statusBar">
                <div class="status-card">
                    <div class="status-label">IBKR DATA</div>
                    <div class="status-value" id="dataStatus">
                        <div class="status-main"><span class="status-dot dot-gray"></span><span class="status-main-text">--</span></div>
                        <div class="status-sub is-empty">--</div>
                    </div>
                </div>
                <div class="status-card">
                    <div class="status-label">IBKR COMPUTE</div>
                    <div class="status-value" id="computeStatus">
                        <div class="status-main"><span class="status-dot dot-gray"></span><span class="status-main-text">--</span></div>
                        <div class="status-sub is-empty">--</div>
                    </div>
                </div>
                <div class="status-card">
                    <div class="status-label">RUNTIME</div>
                    <div class="status-value" id="runtimeStatus">
                        <div class="status-main"><span class="status-dot dot-gray"></span><span class="status-main-text">--</span></div>
                        <div class="status-sub is-empty">--</div>
                    </div>
                </div>
            </div>

            <div class="section" id="todayStatsSection">
                <div class="section-header">📊 今日统计</div>
                <div class="section-body">
                    <div class="stats-mini" id="todayStats">
                        <div class="stat-mini"><div class="stat-mini-label">ORDERS</div><div class="stat-mini-value">-</div></div>
                        <div class="stat-mini"><div class="stat-mini-label">IBKR BARS</div><div class="stat-mini-value">-</div></div>
                        <div class="stat-mini"><div class="stat-mini-label">IBKR IND</div><div class="stat-mini-value">-</div></div>
                        <div class="stat-mini"><div class="stat-mini-label">IBKR SIG</div><div class="stat-mini-value">-</div></div>
                        <div class="stat-mini"><div class="stat-mini-label">TARGETS</div><div class="stat-mini-value">-</div></div>
                        <div class="stat-mini"><div class="stat-mini-label">EVENTS</div><div class="stat-mini-value">-</div></div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">📡 数据延迟</div>
                <div class="section-body" id="freshnessArea">
                    <div class="loading-text">加载中...</div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <span>🔧 配置</span>
                    <a id="configLink" href="/ibkr_config.html" style="font-size:10px;color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace">编辑 →</a>
                </div>
                <div class="section-body" id="configArea">
                    <div class="loading-text">加载中...</div>
                </div>
            </div>

            <div class="overview-columns">
                <div class="overview-column">
                    <div class="section">
                        <div class="section-header">
                            <span>⚙️ 计算引擎</span>
                            <span id="engineCount" style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace">--</span>
                        </div>
                        <div class="section-body section-scroll engine-scroll" id="engineArea">
                            <div class="loading-text">加载中...</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-header">
                            <span>🧪 最近回测统计</span>
                            <span id="backtestCount" style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace">--</span>
                        </div>
                        <div class="section-body" id="backtestArea">
                            <div class="loading-text">加载中...</div>
                        </div>
                    </div>
                </div>

                <div class="overview-column">
                    <div class="section">
                        <div class="section-header">
                            <span>📋 最近事件</span>
                            <span id="eventCount" style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace">--</span>
                        </div>
                        <div class="section-body section-scroll event-scroll" id="eventArea">
                            <div class="loading-text">加载中...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/pages/ibkr_system/page.js"></script>
</body>
</html>
