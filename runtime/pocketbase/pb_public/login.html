<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>登录</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #080B10;
    --surface: #0E1420;
    --surface2:#141C2E;
    --border:  rgba(99,179,237,0.1);
    --text:    #E2EAF4;
    --muted:   #4A6080;
    --accent:  #63B3ED;
    --long:    #48BB78;
    --short:   #FC8181;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(99,179,237,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,179,237,0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    width: 100%;
    max-width: 360px;
  }

  .logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--accent);
    opacity: 0.7;
    display: block;
    margin-bottom: 6px;
  }

  .logo-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #63B3ED, #4299E1);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.15s;
  }

  .btn-login:active { transform: scale(0.98); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

  .error {
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(252,129,129,0.08);
    border: 1px solid rgba(252,129,129,0.2);
    border-radius: 8px;
    font-size: 12px;
    color: var(--short);
    text-align: center;
    display: none;
  }

  .hint {
    margin-top: 20px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="logo-label">TRADING FLIGHT</span>
    <span class="logo-title">管理登录</span>
  </div>

  <div class="field">
    <label>邮箱</label>
    <input type="email" id="email" placeholder="admin@example.com" autocomplete="email">
  </div>

  <div class="field">
    <label>密码</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="loginBtn" onclick="login()">登录</button>

  <div class="error" id="error"></div>

  <div class="hint">
    登录后 token 保存在本地<br>无需重复登录
  </div>
</div>

<script>
const BASE = 'https://pb.lzw-glory.top'

// 已有 token 直接跳转，失效由目标页的 401/403 处理
if (localStorage.getItem('pb_token')) {
  const redirect = new URLSearchParams(location.search).get('from') || '/ibkr_signals.html'
  location.href = redirect
}

// 回车触发登录
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') login()
})

async function login() {
  const email    = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn      = document.getElementById('loginBtn')
  const errEl    = document.getElementById('error')

  if (!email || !password) {
    showError('请填写邮箱和密码')
    return
  }

  btn.disabled = true
  btn.textContent = '登录中...'
  errEl.style.display = 'none'

  try {
    // PocketBase 0.36+ 使用新的认证端点
    const res = await fetch(`${BASE}/api/collections/_superusers/auth-with-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identity: email, password })
    })

    const data = await res.json()
    console.log('[login] status:', res.status, 'data:', JSON.stringify(data))

    if (!res.ok) {
      showError(data.message || '邮箱或密码错误')
      return
    }

    // PocketBase 0.36+ 返回 data.token
    const token = data.token
    if (!token) {
      showError('登录响应异常：' + JSON.stringify(data))
      return
    }

    // 保存 token（前端会在请求时加 Bearer 前缀）
    localStorage.setItem('pb_token', token)
    console.log('[login] token saved:', token.slice(0, 30) + '...')

    // 跳转到来源页或默认信号页
    const redirect = new URLSearchParams(location.search).get('from') || '/ibkr_signals.html'
    location.href = redirect

  } catch(e) {
    showError('连接失败，请检查网络')
  } finally {
    btn.disabled = false
    btn.textContent = '登录'
  }
}

function showError(msg) {
  const el = document.getElementById('error')
  el.textContent = msg
  el.style.display = 'block'
}
</script>
</body>
</html>
