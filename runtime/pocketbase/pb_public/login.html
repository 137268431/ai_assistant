<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>登录</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/common.css">
<link rel="stylesheet" href="/assets/css/ibkr-page-common.css">
<link rel="stylesheet" href="/assets/css/pages/login/page.css">
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="logo-label">TRADING FLIGHT</span>
    <span class="logo-title">管理登录</span>
  </div>

  <div class="field">
    <label>邮箱</label>
    <input type="email" id="email" placeholder="admin@example.com" autocomplete="email">
  </div>

  <div class="field">
    <label>密码</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="loginBtn" onclick="login()">登录</button>

  <div class="error" id="error"></div>

  <div class="hint">
    登录后 token 保存在本地<br>无需重复登录
  </div>
</div>

<script>
const BASE = 'https://pb.lzw-glory.top'

// 已有 token 直接跳转，失效由目标页的 401/403 处理
if (localStorage.getItem('pb_token')) {
  const redirect = new URLSearchParams(location.search).get('from') || '/ibkr_signals.html'
  location.href = redirect
}

// 回车触发登录
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') login()
})

async function login() {
  const email    = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn      = document.getElementById('loginBtn')
  const errEl    = document.getElementById('error')

  if (!email || !password) {
    showError('请填写邮箱和密码')
    return
  }

  btn.disabled = true
  btn.textContent = '登录中...'
  errEl.style.display = 'none'

  try {
    // PocketBase 0.36+ 使用新的认证端点
    const res = await fetch(`${BASE}/api/collections/_superusers/auth-with-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identity: email, password })
    })

    const data = await res.json()
    console.log('[login] status:', res.status, 'data:', JSON.stringify(data))

    if (!res.ok) {
      showError(data.message || '邮箱或密码错误')
      return
    }

    // PocketBase 0.36+ 返回 data.token
    const token = data.token
    if (!token) {
      showError('登录响应异常：' + JSON.stringify(data))
      return
    }

    // 保存 token（前端会在请求时加 Bearer 前缀）
    localStorage.setItem('pb_token', token)
    console.log('[login] token saved:', token.slice(0, 30) + '...')

    // 跳转到来源页或默认信号页
    const redirect = new URLSearchParams(location.search).get('from') || '/ibkr_signals.html'
    location.href = redirect

  } catch(e) {
    showError('连接失败，请检查网络')
  } finally {
    btn.disabled = false
    btn.textContent = '登录'
  }
}

function showError(msg) {
  const el = document.getElementById('error')
  el.textContent = msg
  el.style.display = 'block'
}
</script>
</body>
</html>
