<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <link rel="stylesheet" href="/assets/css/ibkr-page-common.css">
    <link rel="stylesheet" href="/assets/css/pages/orders/page.css">
</head>
<body>
    <div id="contextBar"></div>
    <div id="pageBridge"></div>
    <div id="pageTopSection"></div>

    <div class="content">
        <div class="search-row">
            <div class="page-toolbar-row">
                <div id="datePicker" style="flex:1;"></div>
                <div id="ordersRefreshControl"></div>
            </div>
            <input class="search-input" id="searchInput" placeholder="搜索 标的 / signal_id / trade_group_id / unique_id / broker_order_id" oninput="onSearchChange(this.value)">
        </div>

        <div class="summary-bar" id="summaryBar">
            <div class="summary-card"><div class="summary-label">TRADE GROUPS</div><div class="summary-value">0</div></div>
            <div class="summary-card"><div class="summary-label">ORDERS</div><div class="summary-value">0</div></div>
            <div class="summary-card"><div class="summary-label">OPEN GROUPS</div><div class="summary-value">0</div></div>
        </div>

        <div id="filterNote"></div>

        <div class="status-tabs">
            <button class="status-tab active" data-status="all" onclick="selectStatus('all', this)">全部<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Init" onclick="selectStatus('Init', this)">Init<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Submitted" onclick="selectStatus('Submitted', this)">Submitted<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Filled" onclick="selectStatus('Filled', this)">Filled<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Canceled" onclick="selectStatus('Canceled', this)">Canceled<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Closed" onclick="selectStatus('Closed', this)">Closed<span class="tab-count">(<span class="count-value">0</span>)</span></button>
        </div>

        <div id="directionTabs"></div>

        <div id="ordersContainer">
            <div class="loading">加载中...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreGroups()" style="display:none;">加载更多</button>
    </div>

    <div id="nav"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const pb = new PocketBase(BASE_URL);
        const ORDER_STATUS_TEXT = {
            Init: '初始化',
            Submitted: '已提交',
            Filled: '已成交',
            Canceled: '已取消',
            Closed: '已平仓'
        };
        const ROLE_TEXT = {
            entry: '主单',
            take_profit: '止盈',
            stop_loss: '止损',
            repair_tp: '修复止盈',
            repair_sl: '修复止损'
        };

        let allOrders = [];
        let allGroups = [];
        let displayedGroups = [];
        let currentDate = new Date().toISOString().split('T')[0];
        let currentStatus = 'all';
        let currentDirection = 'all';
        let currentSearch = '';
        let refreshTimer = null;
        let currentInterval = 30;
        let currentPage = 1;
        const itemsPerPage = 6;
        let currentEnvironment = getCurrentRuntimeEnvironment();
        let filterSignalId = '';
        let filterTradeGroupId = '';
        let resolvedLegacySearch = '';
        let pendingLegacySearchResolution = false;
        let signalValidityMinutes = 30;
        let currentOrdersRequestId = 0;
        let isLoadingOrders = false;
        let isOrdersDatasetPartial = false;
        let currentOrdersSource = 'orders';
        const CONFIG_CACHE_TTL_MS = 5 * 60 * 1000;
        const ORDERS_FETCH_PAGE_SIZE = 200;
        const ORDERS_FETCH_MAX_PAGES = 40;
        const configValueCache = {};

        function pickConfigValue(records, fallbackValue) {
            const priority = { '': 0, global: 1, [currentEnvironment]: 2 };
            let bestRecord = null;
            let bestPriority = -1;

            records.forEach((record) => {
                const recordEnvironment = String(record.environment || '').trim().toLowerCase();
                const recordPriority = priority[recordEnvironment] ?? -1;
                if (recordPriority > bestPriority) {
                    bestPriority = recordPriority;
                    bestRecord = record;
                }
            });

            return bestRecord?.value ?? fallbackValue;
        }

        async function loadConfigValue(key, fallbackValue) {
            const cacheKey = `${currentEnvironment}:${key}`;
            const cached = configValueCache[cacheKey];
            if (cached && cached.expiresAt > Date.now()) {
                return cached.value;
            }
            const result = await apiFetch('config', {
                filter: `key = "${escapeFilterValue(key)}" && (environment = "${currentEnvironment}" || environment = "global" || environment = "")`,
                sort: '-updated',
                perPage: 200,
                page: 1
            });
            const value = pickConfigValue(Array.isArray(result?.items) ? result.items : [], fallbackValue);
            configValueCache[cacheKey] = {
                value,
                expiresAt: Date.now() + CONFIG_CACHE_TTL_MS
            };
            return value;
        }

        async function fetchCollectionFullList(collection, options = {}) {
            const perPage = Math.max(1, Math.min(Number(options.perPage || 200), 200));
            const maxPages = Math.max(1, Number(options.maxPages || ORDERS_FETCH_MAX_PAGES));
            const startPage = Math.max(1, Number(options.startPage || 1));
            const items = [];

            for (let page = startPage; page <= maxPages; page += 1) {
                const result = await apiFetch(collection, {
                    filter: options.filter || '',
                    sort: options.sort || '',
                    perPage,
                    page
                });
                if (options.requestId && options.requestId !== currentOrdersRequestId) {
                    return null;
                }
                const pageItems = Array.isArray(result?.items) ? result.items : [];
                items.push(...pageItems);
                if (pageItems.length < perPage) break;
            }

            return items;
        }

        function parseJsonLike(value) {
            if (!value) return {};
            if (typeof value === 'object') return value;
            try {
                return JSON.parse(value);
            } catch (_) {
                return {};
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function firstDefined() {
            for (const value of arguments) {
                if (value !== undefined && value !== null && value !== '') return value;
            }
            return '';
        }

        function toNumber(value) {
            if (value === null || value === undefined || value === '') return null;
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

        function formatMoney(value) {
            const num = toNumber(value);
            return num === null ? '-' : `$${num.toFixed(2)}`;
        }

        function formatQty(value) {
            const num = toNumber(value);
            return num === null ? '-' : `${num}`;
        }

        function formatTimePair(record) {
            const us = record.us_time || (record.bar_time_ms ? formatBarTimeMsToET(record.bar_time_ms) : '');
            const cn = record.cn_time || '';
            if (!us && !cn) return '-';
            if (!cn) return `${us} ET`;
            return `${us} ET / ${cn} CN`;
        }

        async function loadSignalValidityConfig() {
            try {
                const configValue = await loadConfigValue('signal_validity_minutes', '30');
                signalValidityMinutes = parseInt(configValue, 10) || 30;
            } catch (error) {
                console.warn('[Orders] 加载 signal_validity_minutes 失败，使用默认值 30:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                signalValidityMinutes = 30;
            }
        }

        function getOrdersTimeRange() {
            const startTimeMs = new Date(`${currentDate}T00:00:00Z`).getTime();
            return {
                startTimeMs,
                endTimeMs: startTimeMs + 24 * 60 * 60 * 1000
            };
        }

        function buildOrdersFilter() {
            const { startTimeMs, endTimeMs } = getOrdersTimeRange();
            return `environment = "${currentEnvironment}" && bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}`;
        }

        function buildOrderDetailsFallbackFilter() {
            const environmentFilter = `environment = "${currentEnvironment}"`;
            if (filterSignalId) {
                return `${environmentFilter} && signal_id = "${escapeFilterValue(filterSignalId)}"`;
            }
            if (filterTradeGroupId) {
                return `${environmentFilter} && trade_group_id = "${escapeFilterValue(filterTradeGroupId)}"`;
            }
            if (currentSearch) {
                const safe = escapeFilterValue(currentSearch);
                return `${environmentFilter} && (
                    symbol ~ "${safe}" ||
                    order_id ~ "${safe}" ||
                    broker_order_id ~ "${safe}" ||
                    signal_id ~ "${safe}" ||
                    trade_group_id ~ "${safe}" ||
                    entry_order_unique_id ~ "${safe}" ||
                    parent_order_unique_id ~ "${safe}" ||
                    sibling_order_unique_id ~ "${safe}" ||
                    id ~ "${safe}"
                )`;
            }

            const { startTimeMs, endTimeMs } = getOrdersTimeRange();
            const startTime = `${currentDate} 00:00:00`;
            const endTime = `${currentDate} 23:59:59`;
            return `${environmentFilter} && ((bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}) || (created >= "${escapeFilterValue(startTime)}" && created <= "${escapeFilterValue(endTime)}"))`;
        }

        function formatCountValue(value) {
            const count = Number(value || 0);
            return isOrdersDatasetPartial ? `${count}+` : `${count}`;
        }

        function shouldShowEntryCountdown(order) {
            return Boolean(
                order
                && order.role === 'entry'
                && ['Init', 'Submitted'].includes(order.status)
                && order.bar_time_ms
            );
        }

        function calculateRemainingMs(barTimeMs) {
            if (!barTimeMs) return 0;
            const expiryTime = new Date(Number(barTimeMs) + signalValidityMinutes * 60 * 1000);
            const now = new Date();
            const usEasternTime = new Date(now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC');
            return expiryTime - usEasternTime;
        }

        function formatCountdown(remainingMs) {
            if (remainingMs <= 0) return '';
            const hours = Math.floor(remainingMs / (60 * 60 * 1000));
            const minutes = Math.floor((remainingMs % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((remainingMs % (60 * 1000)) / 1000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function renderCountdown(order, compact = false) {
            if (!shouldShowEntryCountdown(order)) return '';
            const remainingMs = calculateRemainingMs(order.bar_time_ms);
            const label = order.status === 'Submitted' ? '挂单剩余' : '初始化剩余';
            const value = formatCountdown(remainingMs) || '已过期';
            const toneClass = remainingMs <= 0
                ? ' countdown-expired'
                : remainingMs < 5 * 60 * 1000
                    ? ' countdown-critical'
                    : '';
            const compactClass = compact ? ' countdown-inline' : '';

            return `
                <div class="countdown-display${toneClass}${compactClass}" data-bar-time="${escapeHtml(order.bar_time_ms)}">
                    <span class="countdown-label">${escapeHtml(label)}</span>
                    <span class="countdown-value">${escapeHtml(value)}</span>
                </div>
            `;
        }

        function updateCountdowns() {
            const countdownElements = document.querySelectorAll('.countdown-display[data-bar-time]');
            countdownElements.forEach((element) => {
                const barTime = parseInt(element.getAttribute('data-bar-time') || '0', 10);
                const valueNode = element.querySelector('.countdown-value');
                if (!barTime || !valueNode) return;

                const remainingMs = calculateRemainingMs(barTime);
                valueNode.textContent = formatCountdown(remainingMs) || '已过期';
                element.classList.toggle('countdown-critical', remainingMs > 0 && remainingMs < 5 * 60 * 1000);
                element.classList.toggle('countdown-expired', remainingMs <= 0);
            });
        }

        function normalizeExactMatchValue(value) {
            return String(value || '').trim().toUpperCase();
        }

        function parseStructuredSearch(value) {
            const keyword = String(value || '').trim();
            if (!keyword) {
                return { signalId: '', tradeGroupId: '', plainSearch: '' };
            }

            const signalMatch = keyword.match(/^signal_id\s*=\s*(.+)$/i);
            if (signalMatch) {
                return { signalId: signalMatch[1].trim(), tradeGroupId: '', plainSearch: '' };
            }

            const tradeGroupMatch = keyword.match(/^trade_group_id\s*=\s*(.+)$/i);
            if (tradeGroupMatch) {
                return { signalId: '', tradeGroupId: tradeGroupMatch[1].trim(), plainSearch: '' };
            }

            return { signalId: '', tradeGroupId: '', plainSearch: keyword };
        }

        function reconcileSearchAndFilters() {
            const parsed = parseStructuredSearch(currentSearch);
            let changed = false;

            if (parsed.signalId) {
                if (!filterSignalId) {
                    filterSignalId = parsed.signalId;
                }
                currentSearch = '';
                changed = true;
            } else if (parsed.tradeGroupId) {
                if (!filterTradeGroupId) {
                    filterTradeGroupId = parsed.tradeGroupId;
                }
                currentSearch = '';
                changed = true;
            } else if (filterSignalId) {
                const normalizedSearch = normalizeExactMatchValue(parsed.plainSearch);
                if (
                    normalizedSearch === normalizeExactMatchValue(filterSignalId) ||
                    normalizedSearch === normalizeExactMatchValue(`signal_id=${filterSignalId}`)
                ) {
                    currentSearch = '';
                    changed = Boolean(parsed.plainSearch);
                }
            } else if (filterTradeGroupId) {
                const normalizedSearch = normalizeExactMatchValue(parsed.plainSearch);
                if (
                    normalizedSearch === normalizeExactMatchValue(filterTradeGroupId) ||
                    normalizedSearch === normalizeExactMatchValue(`trade_group_id=${filterTradeGroupId}`)
                ) {
                    currentSearch = '';
                    changed = Boolean(parsed.plainSearch);
                }
            }

            if (changed) {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) searchInput.value = currentSearch;
            }

            return changed;
        }

        function buildOrdersPageUrl() {
            return buildPageUrl('/orders.html', {
                signal_id: filterSignalId,
                trade_group_id: filterTradeGroupId,
                search: currentSearch,
                date: currentDate
            });
        }

        function syncOrdersPageUrl() {
            const nextUrl = buildOrdersPageUrl();
            const currentUrl = `${window.location.pathname}${window.location.search}`;
            if (currentUrl !== nextUrl) {
                history.replaceState(null, '', nextUrl);
            }
        }

        function summarizeHeaderValue(value, maxLength = 28) {
            const text = String(value || '').trim();
            if (!text) return '';
            if (text.length <= maxLength) return text;
            return `${text.slice(0, Math.max(0, maxLength - 3))}...`;
        }

        function getOrdersStatusLabel(status = currentStatus) {
            const map = {
                all: '全部状态',
                Init: 'Init',
                Submitted: 'Submitted',
                Filled: 'Filled',
                Canceled: 'Canceled',
                Closed: 'Closed',
            };
            return map[status] || status || '全部状态';
        }

        function getOrdersDirectionLabel(direction = currentDirection) {
            const map = {
                all: '全部方向',
                long: '做多',
                short: '做空',
            };
            return map[direction] || direction || '全部方向';
        }

        function getOrdersSourceLabel() {
            if (currentOrdersSource === 'ibkr_order_details') return 'detail snapshot';
            if (isOrdersDatasetPartial) return 'orders staged';
            return 'orders live';
        }

        function getVisibleGroups() {
            return filterGroups(allGroups);
        }

        function renderOrdersTopSection() {
            const visibleGroups = getVisibleGroups();
            const visibleOrderCount = visibleGroups.reduce((sum, group) => sum + group.orders.length, 0);
            const scopeParts = [];
            if (filterSignalId) scopeParts.push(`signal_id=${summarizeHeaderValue(filterSignalId, 18)}`);
            if (filterTradeGroupId) scopeParts.push(`trade_group_id=${summarizeHeaderValue(filterTradeGroupId, 18)}`);
            if (currentSearch) scopeParts.push(`search=${summarizeHeaderValue(currentSearch, 24)}`);
            if (resolvedLegacySearch) scopeParts.push(`resolved_from=${summarizeHeaderValue(resolvedLegacySearch, 18)}`);
            const scopeText = scopeParts.length ? scopeParts.join(' · ') : '无附加过滤';
            const metaHtml = `
                <div class="meta-line">环境 · ${escapeHtml(getEnvironmentLabel(currentEnvironment))}</div>
                <div class="meta-line">交易日 · ${escapeHtml(currentDate || '--')}</div>
                <div class="meta-line">范围 · ${escapeHtml(scopeText)}</div>
                <div class="meta-line">数据源 · ${escapeHtml(getOrdersSourceLabel())}</div>
            `;
            const statusHtml = `
                <div class="chip-row">
                    <span class="status-chip"><span class="dot" style="color:#4FD1C5"></span>交易组 ${escapeHtml(formatCountValue(visibleGroups.length))}</span>
                    <span class="status-chip"><span class="dot" style="color:#63B3ED"></span>订单 ${escapeHtml(formatCountValue(visibleOrderCount))}</span>
                    <span class="status-chip"><span class="dot" style="color:#F6AD55"></span>${escapeHtml(getOrdersDirectionLabel())}</span>
                    <span class="status-chip"><span class="dot" style="color:#FC8181"></span>${escapeHtml(getOrdersStatusLabel())}</span>
                </div>
            `;
            document.getElementById('pageTopSection').innerHTML = renderPageTopSection({
                kicker: 'Execution Orders',
                title: '订单链工作台',
                copy: '聚焦 trade group、bracket 链路和 broker / PB 对账状态，从这里继续钻取订单明细与账户动作。',
                metaHtml,
                statusHtml,
            });
        }

        function renderOrdersPageChrome() {
            const executionParams = { date: currentDate };
            if (filterSignalId) executionParams.signal_id = filterSignalId;
            if (filterTradeGroupId) executionParams.trade_group_id = filterTradeGroupId;
            document.getElementById('pageBridge').innerHTML = renderExecutionBridge('/orders.html', executionParams);
            renderOrdersTopSection();
            renderFilterNote();
        }

        function resolveLegacySearchContext(orders, keyword) {
            if (!keyword || filterSignalId || filterTradeGroupId) return null;
            const exact = normalizeExactMatchValue(keyword);
            if (!exact) return null;

            const matchedOrders = orders.filter((order) => {
                const fields = [
                    order.unique_id,
                    order.broker_order_id,
                    order.order_id,
                    order.entry_order_unique_id,
                    order.parent_order_unique_id,
                    order.sibling_order_unique_id,
                    order.trade_group_id,
                    order.signal_id
                ];
                return fields.some((field) => normalizeExactMatchValue(field) === exact);
            });

            if (matchedOrders.length === 0) return null;

            const signalIds = [...new Set(matchedOrders.map((order) => order.signal_id).filter(Boolean))];
            const tradeGroupIds = [...new Set(matchedOrders.map((order) => order.trade_group_id).filter(Boolean))];

            return {
                signalId: signalIds.length === 1 ? signalIds[0] : '',
                tradeGroupId: tradeGroupIds.length === 1 ? tradeGroupIds[0] : '',
                source: keyword
            };
        }

        function applyResolvedSearchContext(context) {
            if (!context || (!context.signalId && !context.tradeGroupId)) return false;
            filterSignalId = context.signalId || filterSignalId;
            filterTradeGroupId = context.tradeGroupId || filterTradeGroupId;
            resolvedLegacySearch = context.source || '';
            currentSearch = '';
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            syncOrdersPageUrl();
            return true;
        }

        function initAuth() {
            const token = getToken();
            if (!token) {
                location.href = `/login.html?from=${encodeURIComponent(window.location.pathname + window.location.search)}`;
                return false;
            }
            pb.authStore.save(token, null);
            return true;
        }

        function roleClass(role) {
            if (role === 'entry') return 'role-entry';
            if (role === 'take_profit') return 'role-take-profit';
            if (role === 'repair_tp') return 'role-repair-tp';
            if (role === 'stop_loss') return 'role-stop-loss';
            if (role === 'repair_sl') return 'role-repair-sl';
            return 'role-other';
        }

        function relationClass(status) {
            if (status === 'active') return 'relation-active';
            if (status === 'planned') return 'relation-planned';
            if (status === 'orphaned') return 'relation-orphaned';
            return 'relation-closed';
        }

        function statusClass(status) {
            return `status-${String(status || 'Init').toLowerCase()}`;
        }

        function getOrderTypeText(orderType) {
            return {
                Entry: 'Entry',
                TakeProfit: 'TakeProfit',
                StopLoss: 'StopLoss'
            }[orderType] || orderType || '-';
        }

        function getRoleText(role, orderType) {
            return ROLE_TEXT[role] || getOrderTypeText(orderType);
        }

        function normalizeOrder(raw) {
            const extra = parseJsonLike(raw.extra);
            const orderType = firstDefined(raw.order_type, extra.order_type, 'Entry');
            const role = firstDefined(
                raw.role,
                extra.role,
                orderType === 'Entry' ? 'entry' : orderType === 'TakeProfit' ? 'take_profit' : orderType === 'StopLoss' ? 'stop_loss' : ''
            );
            const uniqueId = firstDefined(raw.unique_id, extra.unique_id, raw.order_id, raw.id);
            const entryOrderUniqueId = firstDefined(raw.entry_order_unique_id, extra.entry_order_unique_id, role === 'entry' ? uniqueId : '', uniqueId);
            const tradeGroupId = firstDefined(raw.trade_group_id, extra.trade_group_id, entryOrderUniqueId, uniqueId);
            const brokerOrderId = firstDefined(raw.broker_order_id, extra.broker_order_id, raw.order_id, '');
            const direction = firstDefined(raw.position_side, raw.direction, extra.position_side, extra.direction, '');
            const barTimeMs = toNumber(firstDefined(raw.bar_time_ms, extra.bar_time_ms));
            const timeKey = barTimeMs || Date.parse(firstDefined(raw.us_time, raw.created, '')) || Date.now();

            return {
                ...raw,
                extra,
                order_type: orderType,
                role,
                unique_id: uniqueId,
                entry_order_unique_id: entryOrderUniqueId,
                trade_group_id: tradeGroupId,
                parent_order_unique_id: firstDefined(raw.parent_order_unique_id, extra.parent_order_unique_id, role !== 'entry' ? entryOrderUniqueId : ''),
                sibling_order_unique_id: firstDefined(raw.sibling_order_unique_id, extra.sibling_order_unique_id, ''),
                relation_status: firstDefined(
                    raw.relation_status,
                    extra.relation_status,
                    role !== 'entry' && raw.status === 'Init' ? 'planned' : '',
                    ['Canceled', 'Closed'].includes(raw.status) ? 'closed' : 'active'
                ),
                broker_order_id: brokerOrderId,
                direction,
                position_side: direction,
                quantity: toNumber(firstDefined(raw.quantity, extra.quantity)),
                filled_qty: toNumber(firstDefined(raw.filled_qty, extra.filled_qty)),
                limit_price: toNumber(firstDefined(raw.limit_price, extra.limit_price)),
                fill_price: toNumber(firstDefined(raw.fill_price, extra.fill_price)),
                tp_price: toNumber(firstDefined(raw.tp_price, extra.tp_price)),
                sl_price: toNumber(firstDefined(raw.sl_price, extra.sl_price)),
                signal_id: firstDefined(raw.signal_id, extra.signal_id, ''),
                bar_time_ms: barTimeMs,
                time_key: timeKey,
                order_time: firstDefined(raw.order_time, extra.order_time, raw.us_time, ''),
                us_time: firstDefined(raw.us_time, extra.us_time, ''),
                cn_time: firstDefined(raw.cn_time, extra.cn_time, ''),
                fill_time: firstDefined(raw.fill_time, extra.fill_time, '')
            };
        }

        function buildLatestOrdersFromDetails(records) {
            const latestByOrder = new Map();
            (Array.isArray(records) ? records : []).forEach((record) => {
                const normalized = normalizeOrder(record);
                const key = normalized.order_id || normalized.broker_order_id || normalized.unique_id || normalized.id;
                if (!key) return;
                const previous = latestByOrder.get(key);
                if (!previous || Number(normalized.time_key || 0) >= Number(previous.time_key || 0)) {
                    latestByOrder.set(key, normalized);
                }
            });
            return Array.from(latestByOrder.values());
        }

        function roleRank(role) {
            return {
                entry: 0,
                take_profit: 1,
                repair_tp: 1,
                stop_loss: 2,
                repair_sl: 2
            }[role] ?? 9;
        }

        function sortOrdersInGroup(left, right) {
            const roleDiff = roleRank(left.role) - roleRank(right.role);
            if (roleDiff !== 0) return roleDiff;
            const timeDiff = (right.time_key || 0) - (left.time_key || 0);
            if (timeDiff !== 0) return timeDiff;
            return String(left.unique_id || '').localeCompare(String(right.unique_id || ''));
        }

        function pickPrimaryOrder(orders) {
            return orders.find((order) => order.role === 'entry')
                || orders.find((order) => order.unique_id === order.entry_order_unique_id)
                || [...orders].sort((a, b) => a.time_key - b.time_key)[0]
                || orders[0];
        }

        function buildTradeGroups(orders) {
            const grouped = new Map();
            orders.forEach((order) => {
                const key = order.trade_group_id || order.entry_order_unique_id || order.unique_id || order.id;
                if (!grouped.has(key)) grouped.set(key, []);
                grouped.get(key).push(order);
            });

            return Array.from(grouped.entries()).map(([groupId, ordersInGroup]) => {
                const ordersSorted = [...ordersInGroup].sort(sortOrdersInGroup);
                const primaryOrder = pickPrimaryOrder(ordersSorted);
                const latestEvent = [...ordersInGroup].sort((a, b) => b.time_key - a.time_key)[0];
                const exitOrder = ordersSorted.find((order) => order.role !== 'entry' && order.status === 'Filled') || null;
                const relationAlert = ordersSorted.find((order) => order.relation_status === 'orphaned') || null;
                return {
                    group_id: groupId,
                    trade_group_id: groupId,
                    orders: ordersSorted,
                    primaryOrder,
                    latestEvent,
                    exitOrder,
                    relationAlert,
                    symbol: primaryOrder?.symbol || latestEvent?.symbol || '-',
                    direction: primaryOrder?.position_side || primaryOrder?.direction || latestEvent?.direction || '',
                    signal_id: primaryOrder?.signal_id || latestEvent?.signal_id || '',
                    status: primaryOrder?.status || latestEvent?.status || 'Init',
                    latest_time: Math.max(...ordersInGroup.map((order) => order.time_key || 0)),
                    activeChildCount: ordersInGroup.filter((order) => order.role !== 'entry' && order.relation_status === 'active').length,
                    plannedChildCount: ordersInGroup.filter((order) => order.role !== 'entry' && order.relation_status === 'planned').length
                };
            }).sort((left, right) => right.latest_time - left.latest_time);
        }

        function matchesSearch(group, keyword) {
            if (!keyword) return true;
            const search = keyword.toUpperCase();
            const fields = [
                group.symbol,
                group.signal_id,
                group.trade_group_id,
                group.primaryOrder?.entry_order_unique_id,
                group.primaryOrder?.broker_order_id,
                ...group.orders.flatMap((order) => [
                    order.unique_id,
                    order.broker_order_id,
                    order.parent_order_unique_id,
                    order.sibling_order_unique_id,
                    order.role,
                    order.order_type,
                    order.signal_id
                ])
            ];
            return fields.some((field) => String(field || '').toUpperCase().includes(search));
        }

        function filterGroups(groups) {
            return groups.filter((group) => {
                if (currentStatus !== 'all' && group.status !== currentStatus) return false;
                if (currentDirection !== 'all' && group.direction !== currentDirection) return false;
                if (filterSignalId && !group.orders.some((order) => order.signal_id === filterSignalId)) return false;
                if (filterTradeGroupId && group.trade_group_id !== filterTradeGroupId) return false;
                if (!matchesSearch(group, currentSearch)) return false;
                return true;
            });
        }

        async function loadOrderDetailsFallback(requestId) {
            const detailRecords = await fetchCollectionFullList('ibkr_order_details', {
                filter: buildOrderDetailsFallbackFilter(),
                sort: '-bar_time_ms,-created',
                perPage: ORDERS_FETCH_PAGE_SIZE,
                maxPages: ORDERS_FETCH_MAX_PAGES,
                requestId
            });
            if (!detailRecords || requestId !== currentOrdersRequestId) return null;
            return buildLatestOrdersFromDetails(detailRecords);
        }

        async function hydrateRemainingOrders(baseFilter, initialItems, requestId) {
            try {
                const remainingItems = await fetchCollectionFullList('orders', {
                    filter: baseFilter,
                    sort: '-bar_time_ms,-created',
                    perPage: ORDERS_FETCH_PAGE_SIZE,
                    startPage: 2,
                    maxPages: ORDERS_FETCH_MAX_PAGES,
                    requestId
                });
                if (!remainingItems || requestId !== currentOrdersRequestId) return;
                applyOrdersDataset([...(initialItems || []), ...remainingItems].map(normalizeOrder), { partial: false, requestId, source: 'orders' });
            } catch (error) {
                console.error('后台补齐订单失败:', error);
            }
        }

        async function loadOrders({ showLoadingState = true } = {}) {
            if (isLoadingOrders) return;
            isLoadingOrders = true;
            const requestId = ++currentOrdersRequestId;

            try {
                const baseFilter = buildOrdersFilter();
                const shouldUseStagedLoad = !currentSearch && !filterSignalId && !filterTradeGroupId;

                if (showLoadingState) {
                    showLoading('加载中...');
                }

                if (shouldUseStagedLoad) {
                    const firstPage = await apiFetch('orders', {
                        filter: baseFilter,
                        sort: '-bar_time_ms,-created',
                        perPage: ORDERS_FETCH_PAGE_SIZE,
                        page: 1
                    });
                    if (requestId !== currentOrdersRequestId) return;

                    const firstPageItems = Array.isArray(firstPage?.items) ? firstPage.items : [];
                    if (!firstPageItems.length) {
                        const fallbackRecords = await loadOrderDetailsFallback(requestId);
                        if (!fallbackRecords || requestId !== currentOrdersRequestId) return;
                        applyOrdersDataset(fallbackRecords, { partial: false, requestId, source: fallbackRecords.length ? 'ibkr_order_details' : 'orders' });
                        return;
                    }
                    const hasMorePages = Number(firstPage?.totalItems || 0) > firstPageItems.length;
                    applyOrdersDataset(firstPageItems.map(normalizeOrder), { partial: hasMorePages, requestId, source: 'orders' });

                    if (hasMorePages) {
                        hydrateRemainingOrders(baseFilter, firstPageItems, requestId);
                    }
                    return;
                }

                const records = await fetchCollectionFullList('orders', {
                    filter: baseFilter,
                    sort: '-bar_time_ms,-created',
                    perPage: ORDERS_FETCH_PAGE_SIZE,
                    maxPages: ORDERS_FETCH_MAX_PAGES,
                    requestId
                });
                if (!records || requestId !== currentOrdersRequestId) return;
                if (!records.length) {
                    const fallbackRecords = await loadOrderDetailsFallback(requestId);
                    if (!fallbackRecords || requestId !== currentOrdersRequestId) return;
                    applyOrdersDataset(fallbackRecords, { partial: false, requestId, source: fallbackRecords.length ? 'ibkr_order_details' : 'orders' });
                    return;
                }
                applyOrdersDataset(records.map(normalizeOrder), { partial: false, requestId, source: 'orders' });
            } catch (error) {
                console.error('加载订单失败:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-text">加载失败: ${escapeHtml(error.message || 'unknown error')}</div>
                    </div>
                `;
            } finally {
                isLoadingOrders = false;
                if (showLoadingState) {
                    hideLoading();
                }
            }
        }

        function getOrderActionHeaders(extra = {}) {
            const headers = { ...extra };
            const token = getToken();
            if (token) headers.Authorization = `Bearer ${token}`;
            return headers;
        }

        async function requestOrderAction(path, uniqueId) {
            return readOrderActionResponse(
                await fetchWithRetry(
                    buildPageUrl(path, {}, { environment: currentEnvironment }),
                    {
                        method: 'POST',
                        headers: getOrderActionHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({
                            id: decodeURIComponent(uniqueId),
                            environment: currentEnvironment
                        })
                    },
                    { attempts: 2, retryDelayMs: 400 }
                )
            );
        }

        async function requestCancelSync(targetId, brokerOrderId) {
            const response = await fetchWithRetry(
                buildPageUrl('/api/custom/ibkr/orders/cancel_sync', {}, { environment: currentEnvironment }),
                {
                    method: 'POST',
                    headers: getOrderActionHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({
                        id: decodeURIComponent(targetId || ''),
                        order_id: decodeURIComponent(brokerOrderId || ''),
                        broker_order_id: decodeURIComponent(brokerOrderId || ''),
                        environment: currentEnvironment
                    })
                },
                { attempts: 2, retryDelayMs: 400 }
            );
            const payload = await response.json().catch(() => ({}));
            if (response.status === 401 || response.status === 403) {
                handleAuthError();
                throw new Error('Authentication failed');
            }
            if (!response.ok || payload?.ok === false) {
                throw new Error(payload?.error || payload?.message || `请求失败 (${response.status})`);
            }
            return payload;
        }

        async function readOrderActionResponse(response) {
            if (response.status === 401 || response.status === 403) {
                handleAuthError();
                throw new Error('Authentication failed');
            }
            const contentType = String(response?.headers?.get('content-type') || '').toLowerCase();
            const isJson = contentType.includes('application/json');
            const payload = isJson
                ? await response.json().catch(() => null)
                : await response.text().catch(() => '');

            if (response.ok) return payload;

            let message = '';
            if (payload && typeof payload === 'object') {
                message = payload.message || payload.error || payload.data?.message || '';
            } else if (typeof payload === 'string' && payload.trim()) {
                const text = payload.trim();
                if (text.startsWith('<')) {
                    const parsed = new DOMParser().parseFromString(text, 'text/html');
                    message = parsed.body?.textContent?.replace(/\s+/g, ' ').trim() || '';
                } else {
                    message = text;
                }
            }

            throw new Error(message || `请求失败 (${response.status})`);
        }

        function viewSignal(signalId) {
            const decoded = decodeURIComponent(signalId);
            location.href = buildPageUrl('/ibkr_signals.html', { signal_id: decoded, date: currentDate });
        }

        function normalizeChartInterval(value, fallback = '5m') {
            const text = String(value || '').trim().toLowerCase();
            const map = {
                '5': '5m',
                '5m': '5m',
                '15': '15m',
                '15m': '15m',
                '30': '30m',
                '30m': '30m',
                '60': '1h',
                '60m': '1h',
                '1h': '1h',
                '1hr': '1h',
                '240': '4h',
                '240m': '4h',
                '4h': '4h',
                '1d': '1d',
                'd': '1d',
                'day': '1d'
            };
            return map[text] || fallback;
        }

        function normalizeDateParam(value, fallback = '') {
            const text = String(value || '').trim();
            return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : fallback;
        }

        function buildGroupChartParams(group) {
            if (!group) return null;
            const anchorOrder = group.primaryOrder || group.latestEvent || group.orders?.[0] || null;
            const anchorExtra = anchorOrder?.extra || {};
            const latestExtra = group.latestEvent?.extra || {};
            const symbol = String(group.symbol || anchorOrder?.symbol || '').trim().toUpperCase();
            if (!symbol) return null;
            return {
                symbol,
                interval: normalizeChartInterval(
                    anchorOrder?.interval
                    || anchorExtra.interval
                    || anchorExtra.chart_tf
                    || latestExtra.interval
                    || latestExtra.chart_tf,
                    '5m'
                ),
                bar_time_ms: Number(anchorOrder?.bar_time_ms || group.latestEvent?.bar_time_ms || anchorExtra.bar_time_ms || latestExtra.bar_time_ms || 0) || ''
            };
        }

        function openTradeGroupChart(groupId) {
            const decoded = decodeURIComponent(groupId);
            const group = allGroups.find((item) => item.trade_group_id === decoded || item.group_id === decoded);
            const params = buildGroupChartParams(group);
            if (!params) {
                showToast('暂无图表上下文');
                return;
            }
            location.href = buildPageUrl('/ibkr_chart.html', params, { environment: currentEnvironment });
        }

        function viewTradeGroup(groupId, signalId = '') {
            const decoded = decodeURIComponent(groupId);
            const decodedSignalId = signalId ? decodeURIComponent(signalId) : '';
            location.href = buildPageUrl('/ibkr_order_details.html', {
                trade_group_id: decoded,
                signal_id: decodedSignalId,
                date: currentDate
            });
        }

        function manualRefresh() {
            spinPageRefreshButton('refreshBtn');
            loadOrders({ showLoadingState: false });
        }

        function changeRefreshInterval(seconds) {
            currentInterval = Number(seconds) || 0;
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            if (currentInterval > 0) {
                refreshTimer = setInterval(() => {
                    if (document.hidden) return;
                    loadOrders({ showLoadingState: false });
                }, currentInterval * 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!initAuth()) return;

            document.getElementById('ordersRefreshControl').innerHTML = renderPageRefreshControl({
                mode: 'polling',
                buttonId: 'refreshBtn',
                intervalId: 'refreshInterval',
                defaultSeconds: 30,
            });
            document.getElementById('contextBar').innerHTML = renderPageContextBar('📋 IBKR 订单', {
                subtitle: '交易组 / bracket / 执行状态 / 跳转明细',
            });
            document.getElementById('nav').innerHTML = renderNav('/orders.html');
            document.getElementById('directionTabs').innerHTML = renderDirectionTabs();
            document.getElementById('datePicker').innerHTML = renderDatePicker();

            const params = new URLSearchParams(window.location.search);
            filterSignalId = params.get('signal_id') || '';
            filterTradeGroupId = params.get('trade_group_id') || '';
            currentSearch = params.get('search') || '';
            currentDate = normalizeDateParam(params.get('date'), currentDate);
            if ((filterSignalId || filterTradeGroupId) && currentSearch) {
                currentSearch = '';
            }
            reconcileSearchAndFilters();
            pendingLegacySearchResolution = Boolean(currentSearch) && !filterSignalId && !filterTradeGroupId;

            document.getElementById('searchInput').value = currentSearch;
            const dateInput = document.getElementById('customDate');
            if (dateInput) dateInput.value = currentDate;
            syncOrdersPageUrl();
            renderOrdersPageChrome();

            await loadSignalValidityConfig();
            await withPageLoading(
                () => loadOrders(),
                {
                    title: '订单页加载中',
                    copy: '正在同步订单分组、执行状态、方向统计和关联查询结果。',
                }
            );
            changeRefreshInterval(30);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && currentInterval > 0) {
                    loadOrders({ showLoadingState: false });
                }
            });
            setInterval(updateCountdowns, 1000);
        });

        window.onEnvironmentChange = function(environment) {
            currentEnvironment = environment;
            location.href = buildOrdersPageUrl();
        };
    </script>
</body>
</html>
