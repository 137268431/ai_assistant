groups:
- name: monitoring-stack
  rules:
  - alert: MonitoringTargetDown
    expr: up{stack="monitoring"} == 0
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: Monitoring target {{ $labels.job }} is down
      description: Prometheus cannot scrape {{ $labels.instance }} for more than three
        minutes.
- name: ibkr-critical-path
  rules:
  - alert: IBKRServiceTargetDown
    expr: up{stack="ibkr"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: IBKR service {{ $labels.service }} is down
      description: Prometheus cannot scrape {{ $labels.instance }}.
  - alert: GatewaySocketNotListening
    expr: max_over_time(ibkr_gateway_socket_listening[2m]) == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: IB Gateway socket is not listening
      description: Gateway source={{ $labels.source }} host={{ $labels.host }} port={{
        $labels.port }} environment={{ $labels.environment }}.
  - alert: BrokerNotReadyOrDisconnected
    expr: (max_over_time(ibkr_broker_connected[2m]) == 0) or (max_over_time(ibkr_broker_ready[2m]) == 0)
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: IB broker is disconnected or not ready
      description: service={{ $labels.service }} environment={{ $labels.environment
        }} client_role={{ $labels.client_role }}.
  - alert: DiskSpaceCritical
    expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint=~"/|/var|/opt"}
      / node_filesystem_size_bytes{fstype!~"tmpfs|overlay", mountpoint=~"/|/var|/opt"}
      < 8
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Disk free space is below 8%
      description: instance={{ $labels.instance }} mountpoint={{ $labels.mountpoint
        }}.
  - alert: AccountBuyingPowerGuardUnavailable
    expr: max by (service, environment, source) (ibkr_account_buying_power_guard_state{source=~"account_snapshot|account_summary",
      state="unavailable"}) > 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Account buying-power guard is unavailable
      description: 账户购买力风控不可用，自动开仓会暂停。service={{ $labels.service }} environment={{
        $labels.environment }}.
  - alert: AccountBuyingPowerRemainingCritical
    expr: (max by (service, environment, source) (ibkr_account_buying_power_remaining_usd{source=~"account_snapshot|account_summary"})
      < max by (service, environment, source) (ibkr_account_buying_power_block_floor_usd{source=~"account_snapshot|account_summary"}))
      and (max by (service, environment, source) (ibkr_account_buying_power_remaining_usd{source=~"account_snapshot|account_summary"})
      >= 0)
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Account buying power is below block floor
      description: 账户剩余购买力低于禁止阈值，新的自动开仓应被阻止。remaining={{ $value }}.
  - alert: GatewayRuntimeStateDown
    expr: (ibkr_gateway_reachable == 0) or (ibkr_gateway_session_authenticated ==
      0) or (ibkr_gateway_websocket_ready == 0)
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Gateway/session/websocket runtime state is down
      description: Gateway reachable、session authenticated 或 websocket ready 为 0，会影响交易或行情链路。service={{
        $labels.service }} environment={{ $labels.environment }}.
- name: ibkr-warning-path
  rules:
  - alert: DiskSpaceLow
    expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint=~"/|/var|/opt"}
      / node_filesystem_size_bytes{fstype!~"tmpfs|overlay", mountpoint=~"/|/var|/opt"}
      < 15
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Disk free space is below 15%
      description: instance={{ $labels.instance }} mountpoint={{ $labels.mountpoint
        }}.
  - alert: HTTPServer5xxHigh
    expr: (sum by (service, route) (rate(ibkr_http_server_requests_total{status_class="5xx"}[5m]))
      / clamp_min(sum by (service, route) (rate(ibkr_http_server_requests_total[5m])),
      0.001) > 0.05) and (sum by (service, route) (increase(ibkr_http_server_requests_total[5m]))
      > 20)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Inbound HTTP 5xx ratio is high
      description: service={{ $labels.service }} route={{ $labels.route }}.
  - alert: HTTPServerP95LatencyHigh
    expr: (histogram_quantile(0.95, sum by (le, service, route) (rate(ibkr_http_server_request_duration_seconds_bucket{route!~"/health|/status|/ibkr/status|/api/custom/ibkr/statusz|/api/custom/system/summaryz|/api/custom/system/monitorz|/api/custom/system/storagez"}[5m])))
      > 5) and (sum by (service, route) (increase(ibkr_http_server_requests_total{route!~"/health|/status|/ibkr/status|/api/custom/ibkr/statusz|/api/custom/system/summaryz|/api/custom/system/monitorz|/api/custom/system/storagez"}[5m]))
      > 20)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Inbound HTTP p95 latency is high
      description: service={{ $labels.service }} route={{ $labels.route }}.
  - alert: OutboundDependencyFailures
    expr: (sum by (service, target_service, route) (rate(ibkr_http_client_requests_total{outcome!="success",
      route!~"/health|/status|/ibkr/status|/api/custom/ibkr/statusz|/api/custom/system/summaryz|/api/custom/system/monitorz|/api/custom/system/storagez"}[5m]))
      / clamp_min(sum by (service, target_service, route) (rate(ibkr_http_client_requests_total{route!~"/health|/status|/ibkr/status|/api/custom/ibkr/statusz|/api/custom/system/summaryz|/api/custom/system/monitorz|/api/custom/system/storagez"}[5m])),
      0.001) > 0.10) and (sum by (service, target_service, route) (increase(ibkr_http_client_requests_total{route!~"/health|/status|/ibkr/status|/api/custom/ibkr/statusz|/api/custom/system/summaryz|/api/custom/system/monitorz|/api/custom/system/storagez"}[5m]))
      > 50)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Outbound dependency failure ratio is high
      description: service={{ $labels.service }} target={{ $labels.target_service
        }} route={{ $labels.route }}.
  - alert: BrokerIBErrorsHigh
    expr: sum by (service, environment, client_role, ib_error_code, ib_error_cn, ib_error_action_cn, severity) (increase(ibkr_broker_error_total{severity!="benign"}[5m]))
      > 3
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: IB broker errors increased
      description: client_role={{ $labels.client_role }} ib_error_code={{ $labels.ib_error_code
        }} ib_error={{ $labels.ib_error_cn }} action={{ $labels.ib_error_action_cn
        }} severity={{ $labels.severity }}.
  - alert: BrokerPendingRequestsHigh
    expr: sum by (service, environment, client_role, request_kind) (ibkr_broker_pending_requests)
      > 20
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: Broker pending requests are high
      description: client_role={{ $labels.client_role }} request_kind={{ $labels.request_kind
        }}.
  - alert: OrderCommandFailuresHigh
    expr: sum by (service, environment, operation, order_family_type, result, reason_code)
      (increase(ibkr_order_events_total{result!~"ok|synced|seen"}[5m])) > 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Order command failed or was unconfirmed
      description: operation={{ $labels.operation }} family={{ $labels.order_family_type
        }} result={{ $labels.result }} reason={{ $labels.reason_code }}.
  - alert: OrderOperationP95LatencyHigh
    expr: histogram_quantile(0.95, sum by (le, service, environment, operation, result)
      (rate(ibkr_order_operation_duration_seconds_bucket{operation=~"place_bracket|place_entry|place_take_profit|place_stop_loss|place_bracket_order|place_market_close|adjust_stop_loss|adjust_take_profit|cancel_order|cancel_all_orders|cancel_entry|cancel_take_profit|cancel_stop_loss|modify_manual|modify_order|ibapi_place|ibapi_cancel|modify|cancel"}[5m]))) > 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Order operation p95 latency is high
      description: operation={{ $labels.operation }} result={{ $labels.result }}.
  - alert: GatewayOrderSerialQueueWaitHigh
    expr: histogram_quantile(0.95, sum by (le, service, environment, operation, result)
      (rate(ibkr_gateway_order_serial_queue_wait_seconds_bucket[5m]))) > 2
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: Gateway order serial queue wait is high
      description: operation={{ $labels.operation }} result={{ $labels.result }}.
  - alert: GatewayOrderSerialTimeout
    expr: sum by (service, environment, operation) (increase(ibkr_gateway_order_serial_timeouts_total[5m]))
      > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Gateway order serial queue timed out
      description: operation={{ $labels.operation }}.
  - alert: HostMemoryHigh
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
      > 90
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Host memory usage is high
      description: instance={{ $labels.instance }}.
  - alert: HostCPUHigh
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
      * 100) > 85
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Host CPU usage is high
      description: instance={{ $labels.instance }}.
  - alert: AccountBuyingPowerRemainingLow
    expr: (max by (service, environment, source) (ibkr_account_buying_power_remaining_usd{source=~"account_snapshot|account_summary"})
      < max by (service, environment, source) (ibkr_account_buying_power_warn_floor_usd{source=~"account_snapshot|account_summary"}))
      and (max by (service, environment, source) (ibkr_account_buying_power_remaining_usd{source=~"account_snapshot|account_summary"})
      >= max by (service, environment, source) (ibkr_account_buying_power_block_floor_usd{source=~"account_snapshot|account_summary"}))
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Account buying power is near the block floor
      description: 账户剩余购买力低于预警阈值但尚未低于禁止阈值。remaining={{ $value }}.
  - alert: AccountSnapshotUnavailable
    expr: max by (service, environment, source) (ibkr_account_snapshot_available{source=~"account_snapshot|account_summary"})
      == 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Account snapshot is unavailable
      description: 账户快照不可用，购买力、NetLiq 或保证金信息可能不可信。source={{ $labels.source
        }}.
  - alert: AccountDataCircuitActive
    expr: ibkr_account_data_circuit_active == 1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Account data circuit breaker is active
      description: 账户数据熔断已打开，账户快照和购买力读取可能被暂停。service={{ $labels.service }} environment={{
        $labels.environment }}.
