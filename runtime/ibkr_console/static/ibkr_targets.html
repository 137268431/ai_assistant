<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Redirecting to /ibkr_screener.html</title>
  <script src="/common.js?v=20260528-market-session-chip-1"></script>
</head>
<body>
  <script>
    (function redirectToTargetsTab() {
      const current = new URL(window.location.href);
      const consoleBase = window.CONSOLE_BASE_URL || window.location.origin;
      const next = new URL('/ibkr_screener.html', consoleBase);
      next.searchParams.set('tab', 'targets');
      current.searchParams.forEach((value, key) => {
        if (key !== 'tab') {
          next.searchParams.set(key, value);
        }
      });
      window.location.replace(next.toString());
    })();
  </script>
</body>
</html>
