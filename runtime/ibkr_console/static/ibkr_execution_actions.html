<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>执行动作</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="common.js?v=20260603-main-nav-no-backtest-v1"></script>
    <script>document.write(getCommonStyles());</script>
    <link rel="stylesheet" href="/assets/css/ibkr-page-common.css">
    <link rel="stylesheet" href="/assets/css/pages/ibkr_reverse_signals/page.css">
</head>
<body>
    <div id="contextBar"></div>
    <div id="pageBridge"></div>
    <div id="pageTopSection"></div>

    <div class="content">
        <div class="search-row">
            <div class="page-toolbar-row">
                <div id="datePicker" style="flex:1;"></div>
                <div id="reverseRefreshControl"></div>
            </div>
            <input class="search-input" id="searchInput" placeholder="🔍 搜索 symbol / signal_id / trade_group_id / entry_order_unique_id / action_id" oninput="onSearchChange(this.value)">
        </div>
        <div id="filterNote"></div>

        <!-- 状态筛选 Tab -->
        <div class="status-tabs">
            <button class="status-tab active" data-status="all" onclick="selectStatus('all', this)">全部<span class="tab-count" data-status="all">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="pending" onclick="selectStatus('pending', this)">待处理<span class="tab-count" data-status="pending">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="confirmed" onclick="selectStatus('confirmed', this)">已确认<span class="tab-count" data-status="confirmed">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="cancelled" onclick="selectStatus('cancelled', this)">已取消<span class="tab-count" data-status="cancelled">(<span class="count-value">0</span>)</span></button>
        </div>

        <div id="actionTabs"></div>
        <div id="directionTabs"></div>

        <div id="signalsContainer">
            <div class="loading">加载中...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreSignals()" style="display: none;">加载更多</button>
    </div>

    <div id="nav"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const pb = createPocketBaseClient();
        let allSignals = [];
        let currentDate = getCurrentEtDateString();
        let currentDirection = 'all';
        let currentStatus = 'all';
        let currentAction = 'all';
        let currentSearch = '';
        let refreshTimer = null;
        let currentInterval = 30;
        let currentEnvironment = getSharedDataEnvironment();
        let currentBrokerMode = getConsoleBrokerMode();

        let currentPage = 1;
        const itemsPerPage = 10;
        let displayedSignals = [];

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function firstNonEmpty(...values) {
            for (const value of values) {
                if (value !== undefined && value !== null && value !== '') return value;
            }
            return '';
        }

        function toNumber(value, fallback = 0) {
            const num = Number(value);
            return Number.isFinite(num) ? num : fallback;
        }

        function toBoolean(value, fallback = false) {
            if (typeof value === 'boolean') return value;
            if (typeof value === 'number') return value !== 0;
            const text = String(value == null ? '' : value).trim().toLowerCase();
            if (['true', '1', 'yes', 'y', 'on', 'blocked'].includes(text)) return true;
            if (['false', '0', 'no', 'n', 'off', 'allowed'].includes(text)) return false;
            return fallback;
        }

        function hasDisplayValue(value) {
            return value !== undefined && value !== null && value !== '';
        }

        function formatMoney(value) {
            const amount = toNumber(value);
            return amount ? `$${amount.toFixed(2)}` : 'N/A';
        }

        function formatSignedMoney(value, sign) {
            const amount = toNumber(value);
            return amount ? `${sign || ''}$${amount.toFixed(2)}` : 'N/A';
        }

        function formatQty(value) {
            const qty = toNumber(value);
            if (!qty) return '0';
            return Number.isInteger(qty) ? String(qty) : qty.toFixed(2);
        }

        function formatBooleanStatus(value) {
            if (value === '') return '-';
            return toBoolean(value) ? '是' : '否';
        }

        function normalizeMetaToken(value) {
            return String(value || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
        }

        function calculateAmount(entryPrice, targetPrice, quantity) {
            const entry = toNumber(entryPrice);
            const target = toNumber(targetPrice);
            const qty = Math.abs(toNumber(quantity));
            if (!entry || !target || !qty) return 0;
            return Math.abs(target - entry) * qty;
        }

        function buildApiUrl(path, params = {}) {
            const baseUrl = window.API_BASE_URL || location.origin;
            const url = new URL(path, baseUrl);
            if (currentBrokerMode && !Object.prototype.hasOwnProperty.call(params, 'broker_mode')) {
                url.searchParams.set('broker_mode', currentBrokerMode);
            }
            if (currentEnvironment && !Object.prototype.hasOwnProperty.call(params, 'market_data_mode')) {
                url.searchParams.set('market_data_mode', currentEnvironment);
            }
            if (currentEnvironment && !Object.prototype.hasOwnProperty.call(params, 'data_environment')) {
                url.searchParams.set('data_environment', currentEnvironment);
            }
            Object.entries(params).forEach(([key, value]) => {
                if (value !== undefined && value !== null && value !== '') {
                    url.searchParams.set(key, value);
                }
            });
            return url.toString();
        }

        function summarizeHeaderValue(value, maxLength = 28) {
            const text = String(value || '').trim();
            if (!text) return '';
            if (text.length <= maxLength) return text;
            return `${text.slice(0, Math.max(0, maxLength - 3))}...`;
        }

        function getReverseStatusLabel(status = currentStatus) {
            const map = {
                all: '全部状态',
                pending: '待处理',
                confirmed: '已确认',
                cancelled: '已取消',
            };
            return map[status] || status || '全部状态';
        }

        function getReverseDirectionLabel(direction = currentDirection) {
            const map = {
                all: '全部方向',
                long: '做多',
                short: '做空',
            };
            return map[direction] || direction || '全部方向';
        }

        function getReverseActionLabel(action = currentAction) {
            const map = {
                all: '全部动作',
                close: '平仓',
                cancel: '取消',
                adjust: '调整',
                other: '其他',
            };
            return map[action] || action || '全部动作';
        }

        function normalizeActionGroup(actionType) {
            const action = String(actionType || '').trim().toLowerCase();
            if (action === 'close') return 'close';
            if (action === 'cancel') return 'cancel';
            if (action === 'adjust' || action.startsWith('adjust_')) return 'adjust';
            if (!action) return 'other';
            if (action === 'all') return 'all';
            return 'other';
        }

        function normalizeActionFilter(value) {
            const group = normalizeActionGroup(value);
            return ['all', 'close', 'cancel', 'adjust', 'other'].includes(group) ? group : 'all';
        }

        function normalizeStatusFilter(value) {
            const status = String(value || '').trim().toLowerCase();
            return ['all', 'pending', 'confirmed', 'cancelled'].includes(status) ? status : 'all';
        }

        function renderActionTabs() {
            const tabs = [
                ['all', '全部动作'],
                ['close', '平仓'],
                ['cancel', '取消'],
                ['adjust', '调整'],
                ['other', '其他'],
            ];
            return `
                <div class="status-tabs action-tabs">
                    ${tabs.map(([action, label]) => `
                        <button class="status-tab${action === currentAction ? ' active' : ''}" data-action="${action}" onclick="selectAction('${action}', this)">
                            ${label}<span class="tab-count" data-action="${action}">(<span class="count-value">0</span>)</span>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function parseExactSearchFilter(value = currentSearch) {
            const match = String(value || '').trim().match(/^([a-z_]+)\s*=\s*(.+)$/i);
            if (!match) return null;
            return {
                field: match[1].toLowerCase(),
                value: match[2].trim(),
            };
        }

        function formatExecutionActionText(value) {
            const flip = '反' + '转';
            const opposite = '反' + '向';
            const inverse = '逆' + '向';
            const legacyEn = 're' + 'verse';
            return String(value == null ? '' : value)
                .replace(new RegExp(`信号${flip}`, 'g'), '信号冲突动作')
                .replace(new RegExp(`指标${flip}`, 'g'), '指标冲突动作')
                .replace(new RegExp(`${opposite}信号|${flip}信号|${inverse}信号`, 'g'), '执行动作')
                .replace(new RegExp(`${flip}动作`, 'g'), '执行动作')
                .replace(new RegExp(`${opposite}|${flip}|${inverse}`, 'g'), '动作')
                .replace(new RegExp(`${legacyEn} signals`, 'gi'), 'execution actions')
                .replace(new RegExp(`${legacyEn} signal`, 'gi'), 'execution action')
                .replace(new RegExp(`\\b${legacyEn}\\b`, 'gi'), 'execution action');
        }

        function buildReverseExecutionParams() {
            const params = { date: currentDate };
            if (currentStatus !== 'all') params.status = currentStatus;
            if (currentAction !== 'all') params.action = currentAction;
            const exact = parseExactSearchFilter();
            if (!exact) return params;
            if (exact.field === 'action_id' || exact.field === 'reverse_id') params.action_id = exact.value;
            if (exact.field === 'signal_id') params.signal_id = exact.value;
            if (exact.field === 'trade_group_id') params.trade_group_id = exact.value;
            if (exact.field === 'order_id') params.order_id = exact.value;
            return params;
        }

        function renderReverseTopSection() {
            const scopeText = currentSearch
                ? `search=${summarizeHeaderValue(currentSearch, 26)}`
                : '无附加过滤';
            setPageContextMeta([
                { label: 'Broker', value: getEnvironmentLabel(currentBrokerMode), tone: currentBrokerMode },
                { label: 'Data', value: getEnvironmentLabel(currentEnvironment), tone: currentEnvironment },
                { label: '交易日', value: currentDate || '--' },
                { label: '范围', value: scopeText },
            ]);
            const statusHtml = `
                <div class="chip-row">
                    <span class="status-chip"><span class="dot" style="color:#4FD1C5"></span>结果 ${escapeHtml(String(getFilteredSignals().length))}</span>
                    <span class="status-chip"><span class="dot" style="color:#63B3ED"></span>${escapeHtml(getReverseDirectionLabel())}</span>
                    <span class="status-chip"><span class="dot" style="color:#F6AD55"></span>${escapeHtml(getReverseStatusLabel())}</span>
                    <span class="status-chip"><span class="dot" style="color:#FC8181"></span>${escapeHtml(getReverseActionLabel())}</span>
                </div>
            `;
            document.getElementById('pageTopSection').innerHTML = renderPageTopSection({
                kicker: 'Execution Actions',
                title: '执行动作队列',
                copy: '聚焦平仓、取消和调整流转，快速串起主信号、trade group 与订单回查。',
                statusHtml,
            });
        }

        function renderReversePageChrome() {
            document.getElementById('pageBridge').innerHTML = renderExecutionBridge('/ibkr_execution_actions.html', buildReverseExecutionParams());
            renderReverseTopSection();
            renderFilterNote();
        }

        function renderFilterNote() {
            const notes = [
                `broker=${getEnvironmentLabel(currentBrokerMode)}`,
                `data=${getEnvironmentLabel(currentEnvironment)}`,
                `status=${getReverseStatusLabel()}`,
                `action=${getReverseActionLabel()}`,
            ];
            if (currentSearch) notes.push(`search=${currentSearch}`);
            document.getElementById('filterNote').innerHTML = `<div class="filter-note">当前过滤: ${escapeHtml(notes.join(' · '))}</div>`;
        }

        async function reverseRequest(path, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                ...(options.headers || {})
            };
            if (token) {
                headers.Authorization = `Bearer ${token}`;
            }

            const method = String(options.method || 'GET').toUpperCase();
            const requestUrl = buildApiUrl(path, options.params || {});
            if (method === 'GET' && typeof cachedPageJson === 'function') {
                return cachedPageJson(requestUrl, {
                    method,
                    headers,
                    retryAttempts: 3,
                    retryDelayMs: 500,
                }, {
                    profile: 'tradingList',
                    environment: currentEnvironment,
                    force: Boolean(options.force),
                    tags: ['reverse', currentEnvironment]
                });
            }

            const res = await fetch(requestUrl, {
                method,
                headers,
                body: options.body ? JSON.stringify(options.body) : undefined,
            });

            if (res.status === 401 || res.status === 403) {
                handleAuthError();
                throw new Error('Authentication failed');
            }

            const text = await res.text();
            let payload = {};
            try {
                payload = text ? JSON.parse(text) : {};
            } catch (_) {
                payload = { error: text || 'Request failed' };
            }

            if (!res.ok) {
                throw new Error(payload.error || payload.message || 'Request failed');
            }

            if (method !== 'GET' && typeof invalidateIbkrDataCache === 'function') {
                invalidateIbkrDataCache(['reverse', 'ibkr_signals', 'orders', 'tradingList']);
            }
            return payload;
        }

        function normalizeSignal(raw) {
            const extra = raw.extra || {};
            const riskUpdateSequence = extra.risk_update_sequence || raw.risk_update_sequence || {};
            const childOrderResolution = extra.child_order_resolution || raw.child_order_resolution || {};
            const requestedSides = Array.isArray(raw.requested_sides)
                ? raw.requested_sides
                : (Array.isArray(extra.requested_sides) ? extra.requested_sides : []);
            const inferredRiskUpdateType = (() => {
                if (requestedSides.length > 1) return 'bracket';
                if (requestedSides.length === 1) return requestedSides[0];
                if (extra.new_sl || raw.new_sl) return 'stop_loss';
                if (extra.new_tp || raw.new_tp) return 'take_profit';
                return '';
            })();
            const gatewayBlockedRaw = firstNonEmpty(raw.gateway_request_blocked, extra.gateway_request_blocked, '');
            const linkageStatus = firstNonEmpty(
                raw.order_linkage_status,
                extra.order_linkage_status,
                childOrderResolution.order_linkage_status,
                childOrderResolution.linkage_status,
                childOrderResolution.linkage_exists === true
                    ? ((childOrderResolution.unresolved_sides || []).length ? 'unresolved' : 'linked')
                    : (childOrderResolution.linkage_exists === false ? 'missing' : '')
            );
            return {
                ...raw,
                extra,
                id: raw.id || '',
                symbol: raw.symbol || extra.symbol || '',
                direction: raw.direction || extra.direction || '',
                current_direction: raw.current_direction || extra.current_direction || raw.direction || extra.direction || '',
                new_direction: raw.new_direction || extra.new_direction || '',
                reverse_kind: raw.reverse_kind || extra.reverse_kind || (raw.source === 'signal' ? 'signal_conflict' : 'indicator_conflict'),
                target_state: raw.target_state || extra.target_state || '',
                target_order_status: raw.target_order_status || extra.target_order_status || extra.order_status || '',
                action_type: raw.action_type || extra.action_type || '',
                signal_id: raw.signal_id || extra.signal_id || '',
                origin_signal_id: raw.origin_signal_id || extra.origin_signal_id || extra.signal_id_orig || '',
                trade_group_id: raw.trade_group_id || extra.trade_group_id || '',
                entry_order_unique_id: raw.entry_order_unique_id || extra.entry_order_unique_id || '',
                order_unique_id: raw.order_unique_id || extra.order_unique_id || '',
                broker_order_id: raw.broker_order_id || raw.order_id || extra.broker_order_id || extra.order_id || '',
                interval: raw.interval || extra.interval || extra.chart_tf || extra.timeframe || '',
                bar_time_ms: toNumber(raw.bar_time_ms ?? extra.bar_time_ms, 0),
                score: toNumber(raw.score, toNumber(extra.score, 0)),
                priority: toNumber(raw.priority, toNumber(extra.priority, 0)),
                quantity: toNumber(raw.quantity, toNumber(extra.quantity, 0)),
                entry_price: toNumber(raw.entry_price, toNumber(extra.entry_price, 0)),
                take_profit: toNumber(raw.take_profit, toNumber(extra.take_profit || extra.tp_price, 0)),
                stop_loss: toNumber(raw.stop_loss, toNumber(extra.stop_loss || extra.sl_price, 0)),
                old_sl: toNumber(raw.old_sl, toNumber(extra.old_sl, 0)),
                new_sl: toNumber(raw.new_sl, toNumber(extra.new_sl, 0)),
                old_tp: toNumber(raw.old_tp, toNumber(extra.old_tp, 0)),
                new_tp: toNumber(raw.new_tp, toNumber(extra.new_tp, 0)),
                risk_update_type: firstNonEmpty(raw.risk_update_type, extra.risk_update_type, inferredRiskUpdateType),
                risk_update_seq: toNumber(firstNonEmpty(raw.risk_update_seq, extra.risk_update_seq, riskUpdateSequence.incoming_seq, 0), 0),
                execution_readiness: firstNonEmpty(raw.execution_readiness, extra.execution_readiness, ''),
                execution_blocked_message: firstNonEmpty(raw.execution_blocked_message, extra.execution_blocked_message, ''),
                order_linkage_status: linkageStatus,
                gateway_request_blocked: gatewayBlockedRaw === '' ? '' : toBoolean(gatewayBlockedRaw),
                manual_requested: !!(raw.manual_requested || extra.manual_requested),
                manual_requested_at: raw.manual_requested_at || extra.manual_requested_at || '',
                result_status: raw.result_status || extra.result_status || '',
                executed_action: raw.executed_action || extra.executed_action || '',
                triggered_signals: Array.isArray(raw.triggered_signals) ? raw.triggered_signals : (Array.isArray(extra.triggered_signals) ? extra.triggered_signals : []),
            };
        }

        async function initAuth() {
            const token = getToken();
            if (!token) {
                location.href = `/login.html?from=${encodeURIComponent(window.location.pathname + window.location.search)}`;
                return;
            }
            pb.authStore.save(token, null);
        }

        async function loadSignals() {
            try {
                const result = await reverseRequest('/api/custom/ibkr/reverse/list', {
                    params: { date: currentDate, limit: 300, broker_mode: currentBrokerMode, data_environment: currentEnvironment }
                });
                allSignals = (result.ibkr_signals || []).map(normalizeSignal);
                resetPagination();
                updateStats();
                updateDirectionCounts();
                updateActionCounts();
                renderReversePageChrome();
                renderSignals();
                updateLoadMoreButton();
                setPageRefreshTime();
            } catch (error) {
                console.error('加载失败:', error);
                showToast('加载失败: ' + error.message);
            }
        }

        function matchesSearch(signal, keyword) {
            if (!keyword) return true;
            const trimmed = keyword.trim();
            const exactMatch = trimmed.match(/^([a-z_]+)\s*=\s*(.+)$/i);

            if (exactMatch) {
                const field = exactMatch[1].toLowerCase();
                const value = exactMatch[2].trim().toUpperCase();
                const fieldMap = {
                    action_id: signal.id,
                    reverse_id: signal.id,
                    signal_id: signal.signal_id,
                    origin_signal_id: signal.origin_signal_id,
                    trade_group_id: signal.trade_group_id,
                    entry_order_unique_id: signal.entry_order_unique_id,
                    order_id: signal.broker_order_id,
                };
                return String(fieldMap[field] || '').toUpperCase() === value;
            }

            const query = trimmed.toUpperCase();
            return [
                signal.symbol,
                signal.signal_id,
                signal.origin_signal_id,
                signal.trade_group_id,
                signal.entry_order_unique_id,
                signal.order_unique_id,
                signal.broker_order_id,
                signal.id,
                signal.risk_update_type,
                signal.risk_update_seq,
                signal.execution_readiness,
                signal.order_linkage_status,
                signal.execution_blocked_message,
            ].some((value) => String(value || '').toUpperCase().includes(query));
        }

        function filterSignalsAll(options = {}) {
            return allSignals.filter((signal) => {
                if (!options.ignoreStatus && currentStatus !== 'all' && signal.status !== currentStatus) return false;
                if (!options.ignoreAction && currentAction !== 'all' && normalizeActionGroup(signal.action_type) !== currentAction) return false;
                if (!options.ignoreDirection && currentDirection !== 'all' && signal.direction !== currentDirection) return false;
                if (!matchesSearch(signal, currentSearch)) return false;
                return true;
            });
        }

        function updateStats() {
            const statuses = ['pending', 'confirmed', 'cancelled'];
            const base = filterSignalsAll({ ignoreStatus: true });
            const counts = { all: base.length };
            statuses.forEach((status) => {
                counts[status] = base.filter((signal) => signal.status === status).length;
            });
            ['all', ...statuses].forEach((status) => {
                const node = document.querySelector(`.status-tab .tab-count[data-status="${status}"] .count-value`);
                if (node) node.textContent = counts[status] || 0;
            });
        }

        function updateDirectionCounts() {
            const base = filterSignalsAll({ ignoreDirection: true });
            const counts = {
                all: base.length,
                long: base.filter((s) => s.direction === 'long').length,
                short: base.filter((s) => s.direction === 'short').length,
            };
            ['all', 'long', 'short'].forEach((dir) => {
                const node = document.querySelector(`.dir-tab .tab-count[data-dir="${dir}"] .count-value`);
                if (node) node.textContent = counts[dir] || 0;
            });
        }

        function updateActionCounts() {
            const base = filterSignalsAll({ ignoreAction: true });
            const counts = { all: base.length, close: 0, cancel: 0, adjust: 0, other: 0 };
            base.forEach((signal) => {
                const group = normalizeActionGroup(signal.action_type);
                counts[group === 'all' ? 'other' : group] += 1;
            });
            Object.entries(counts).forEach(([action, count]) => {
                const node = document.querySelector(`.status-tab .tab-count[data-action="${action}"] .count-value`);
                if (node) node.textContent = count || 0;
            });
        }

        function syncFilterTabs() {
            const sync = (selector, attr, value) => {
                const buttons = Array.from(document.querySelectorAll(selector));
                if (!buttons.length) return;
                buttons.forEach((node) => node.classList.remove('active'));
                const active = buttons.find((node) => node.getAttribute(attr) === value) || buttons[0];
                active.classList.add('active');
            };
            sync('.status-tab[data-status]', 'data-status', currentStatus);
            sync('.status-tab[data-action]', 'data-action', currentAction);
            sync('.dir-tab[data-dir]', 'data-dir', currentDirection);
        }

        function getFilteredSignals() {
            return filterSignalsAll();
        }

        function getPaginatedSignals() {
            const filtered = getFilteredSignals();
            const start = (currentPage - 1) * itemsPerPage;
            return filtered.slice(0, start + itemsPerPage);
        }

        function resetPagination() {
            currentPage = 1;
            displayedSignals = getPaginatedSignals();
        }

        function updateLoadMoreButton() {
            const btn = document.getElementById('loadMoreBtn');
            const filtered = getFilteredSignals();
            const hasMore = displayedSignals.length < filtered.length;
            btn.style.display = hasMore ? 'block' : 'none';
            btn.textContent = hasMore ? `加载更多 (${displayedSignals.length}/${filtered.length})` : '没有更多了';
            btn.disabled = !hasMore;
        }

        function loadMoreSignals() {
            currentPage += 1;
            displayedSignals = getPaginatedSignals();
            renderSignals();
            updateLoadMoreButton();
        }

        function onSearchChange(value) {
            currentSearch = value.trim();
            resetPagination();
            updateStats();
            updateDirectionCounts();
            updateActionCounts();
            renderReversePageChrome();
            renderSignals();
            updateLoadMoreButton();
        }

        window.selectStatus = function(status, btn) {
            document.querySelectorAll('.status-tab[data-status]').forEach((node) => node.classList.remove('active'));
            btn.classList.add('active');
            currentStatus = status;
            resetPagination();
            updateStats();
            updateDirectionCounts();
            updateActionCounts();
            renderReverseTopSection();
            renderFilterNote();
            renderSignals();
            updateLoadMoreButton();
        };

        window.selectAction = function(action, btn) {
            document.querySelectorAll('.status-tab[data-action]').forEach((node) => node.classList.remove('active'));
            btn.classList.add('active');
            currentAction = action;
            resetPagination();
            updateStats();
            updateDirectionCounts();
            updateActionCounts();
            renderReverseTopSection();
            renderFilterNote();
            renderSignals();
            updateLoadMoreButton();
        };

        function getStatusView(signal) {
            const map = {
                pending: { cls: 'status-pending', text: '待执行' },
                confirmed: { cls: 'status-confirmed', text: '已处理' },
                cancelled: { cls: 'status-cancelled', text: '已取消' },
                expired: { cls: 'status-expired', text: '已过期' },
            };
            return map[signal.status] || { cls: 'status-pending', text: signal.status || '未知' };
        }

        function isNoOldPosition(signal) {
            if (!signal || signal.action_type !== 'close') return false;
            const extra = signal.extra || {};
            const beforeClose = Number(extra.position_qty_before_close);
            const flatByBroker = Number.isFinite(beforeClose) && beforeClose === 0;
            return flatByBroker || extra.close_old_position === 'skipped_flat';
        }

        function getCloseExitReason(signal) {
            const extra = signal?.extra || {};
            const values = [
                signal?.exit_reason,
                extra.exit_reason,
                signal?.reason,
                extra.reason,
                signal?.exit_fill_role,
                extra.exit_fill_role,
                signal?.fill_role,
                extra.fill_role,
            ].map((value) => String(value || '').trim().toLowerCase()).filter(Boolean);
            for (const text of values) {
                if (/(runner|trailing|trail).*stop|runner_stop|trail_stop|trailing_stop/.test(text)) return 'runner_stop';
                if (/safety_take_profit|safety_tp|take_profit|\btp\b|profit|limit/.test(text)) return 'take_profit';
                if (/stop_loss|\bsl\b|loss|stop/.test(text)) return 'stop_loss';
            }
            return '';
        }

        function getActionView(actionType, signal = null) {
            if (isNoOldPosition(signal)) {
                return { text: '无旧仓', cls: 'action-neutral' };
            }
            if (actionType === 'close') {
                const text = {
                    take_profit: '止盈退出',
                    runner_stop: '跟踪止盈',
                    stop_loss: '止损退出',
                }[getCloseExitReason(signal)] || '平旧仓';
                return { text, cls: 'action-close' };
            }
            const text = {
                cancel: '撤旧挂单',
                adjust_sl: '调止损',
                adjust_tp: '调止盈',
                adjust_bracket: '调保护单',
            }[actionType] || formatExecutionActionText(actionType) || 'N/A';
            const cls = actionType === 'close' ? 'action-close'
                : actionType === 'cancel' ? 'action-cancel'
                : 'action-adjust';
            return { text, cls };
        }

        function getReverseKindText(reverseKind) {
            return {
                signal_conflict: '信号冲突动作',
                indicator_conflict: '指标冲突动作',
                tv_exit: 'TV 退出动作',
                tv_risk_update: 'TV 风控更新动作',
            }[reverseKind] || formatExecutionActionText(reverseKind) || 'N/A';
        }

        function getTargetStateText(targetState, signal = null) {
            if (isNoOldPosition(signal)) return '旧仓已空';
            return {
                pending_entry: '待成交挂单',
                filled_position: '已成交持仓',
            }[targetState] || formatExecutionActionText(targetState) || 'N/A';
        }

        function getDirectionLabel(direction) {
            return direction === 'long' ? '做多 📈' : direction === 'short' ? '做空 📉' : (direction || 'N/A');
        }

        function isTvRiskUpdate(signal) {
            const extra = signal?.extra || {};
            const tokens = [
                signal?.reverse_kind,
                signal?.action_type,
                signal?.source,
                signal?.reason,
                extra.reverse_kind,
                extra.event_type,
                extra.tv_event_type,
                extra.risk_update_reason,
            ].map((value) => String(value || '').trim().toLowerCase()).filter(Boolean);
            return tokens.some((token) => token === 'tv_risk_update' || token === 'risk_update' || token.includes('risk_update'));
        }

        function formatRiskUpdateType(value) {
            const text = String(value || '').trim();
            const key = normalizeMetaToken(text);
            return {
                bracket: '保护单组合',
                stop_loss: '止损',
                sl: '止损',
                take_profit: '止盈',
                tp: '止盈',
                runner_activation: 'Runner 激活',
                runner_stop: 'Runner 止盈',
                safety_tp: '安全止盈',
            }[key] || formatExecutionActionText(text) || '-';
        }

        function formatExecutionReadiness(value) {
            const text = String(value || '').trim();
            const key = normalizeMetaToken(text);
            return {
                ready: '可执行',
                blocked: '已阻止',
                gateway_blocked: 'Gateway 已阻止',
                gateway_request_blocked: 'Gateway 已阻止',
                not_ready: '未就绪',
                waiting_linkage: '等待订单关联',
                order_linkage_missing: '缺订单关联',
            }[key] || formatExecutionActionText(text) || '-';
        }

        function formatOrderLinkageStatus(value) {
            const text = String(value || '').trim();
            const key = normalizeMetaToken(text);
            return {
                linked: '已关联',
                resolved: '已解析',
                unresolved: '未解析',
                missing: '缺失',
                linkage_missing: '缺订单关联',
                child_order_id_unresolved: '子订单未解析',
                risk_update_child_order_id_unresolved: '子订单未解析',
                risk_update_linkage_missing: '缺订单关联',
                partial: '部分关联',
            }[key] || formatExecutionActionText(text) || '-';
        }

        function renderRiskUpdateGridItems(signal) {
            const showRiskFields = isTvRiskUpdate(signal)
                || hasDisplayValue(signal.risk_update_type)
                || signal.risk_update_seq > 0
                || hasDisplayValue(signal.execution_readiness)
                || hasDisplayValue(signal.execution_blocked_message)
                || hasDisplayValue(signal.order_linkage_status)
                || hasDisplayValue(signal.gateway_request_blocked);
            if (!showRiskFields) return '';
            return `
                <div class="signal-item">
                    <div class="signal-label">Risk Update 类型 / 序号</div>
                    <div class="signal-value">${escapeHtml(formatRiskUpdateType(signal.risk_update_type))} / ${escapeHtml(signal.risk_update_seq > 0 ? String(signal.risk_update_seq) : '-')}</div>
                </div>
                <div class="signal-item">
                    <div class="signal-label">执行准备 / 订单关联</div>
                    <div class="signal-value">${escapeHtml(formatExecutionReadiness(signal.execution_readiness))} / ${escapeHtml(formatOrderLinkageStatus(signal.order_linkage_status))}</div>
                </div>
                <div class="signal-item">
                    <div class="signal-label">Gateway 请求阻止</div>
                    <div class="signal-value">${escapeHtml(formatBooleanStatus(signal.gateway_request_blocked))}</div>
                </div>
                ${signal.execution_blocked_message ? `
                    <div class="signal-item full-width">
                        <div class="signal-label">执行阻止说明</div>
                        <div class="signal-value" style="font-size: 12px;">${escapeHtml(formatExecutionActionText(signal.execution_blocked_message))}</div>
                    </div>
                ` : ''}
            `;
        }

        function renderInfoNotes(signal) {
            const tpPrice = signal.new_tp || signal.take_profit;
            const slPrice = signal.new_sl || signal.stop_loss;
            const tpAmount = calculateAmount(signal.entry_price, tpPrice, signal.quantity);
            const slAmount = calculateAmount(signal.entry_price, slPrice, signal.quantity);
            const notes = [];
            const tvRiskUpdate = isTvRiskUpdate(signal);
            const gatewayBlocked = hasDisplayValue(signal.gateway_request_blocked) && toBoolean(signal.gateway_request_blocked);
            const readinessBlocked = normalizeMetaToken(signal.execution_readiness).includes('blocked');

            if (tvRiskUpdate) {
                notes.push(`<div class="signal-note signal-note-warning"><strong>TV 风控更新:</strong> 执行只会尝试修改已关联保护单价格，不会创建主订单或新的 TP/SL 保护订单；同一类型 risk_update 会以最新序号/最新记录为准，较旧同类型更新会被替换或跳过。</div>`);
            }
            if (gatewayBlocked || readinessBlocked || signal.execution_blocked_message) {
                const blockedText = signal.execution_blocked_message
                    ? ` ${formatExecutionActionText(signal.execution_blocked_message)}`
                    : ' Gateway 已阻止此请求继续创建或补建订单。';
                notes.push(`<div class="signal-note signal-note-warning"><strong>Gateway 保护:</strong>${escapeHtml(blockedText)}</div>`);
            }

            if (signal.triggered_signals?.length) {
                notes.push(`<div class="signal-note"><strong>触发条件:</strong> ${escapeHtml(signal.triggered_signals.map(formatExecutionActionText).join(', '))}</div>`);
            }
            if (isNoOldPosition(signal)) {
                notes.push(`<div class="signal-note signal-note-warning"><strong>旧仓检查:</strong> IBKR 持仓为 0，已按无旧仓处理；新逻辑会跳过没有订单痕迹的旧状态，避免再次生成执行动作。</div>`);
            }
            if (signal.signal_id) {
                notes.push(`<div class="signal-note"><strong>SignalID:</strong> ${escapeHtml(signal.signal_id)}</div>`);
            }
            if (signal.origin_signal_id && signal.origin_signal_id !== signal.signal_id) {
                notes.push(`<div class="signal-note"><strong>触发信号ID:</strong> ${escapeHtml(signal.origin_signal_id)}</div>`);
            }
            if (signal.trade_group_id || signal.entry_order_unique_id || signal.broker_order_id) {
                notes.push(`
                    <div class="signal-note">
                        <strong>订单关系:</strong>
                        trade_group_id=${escapeHtml(signal.trade_group_id || '-')}
                        / entry=${escapeHtml(signal.entry_order_unique_id || '-')}
                        / broker=${escapeHtml(signal.broker_order_id || '-')}
                    </div>
                `);
            }
            if (signal.manual_requested_at) {
                notes.push(`<div class="signal-note"><strong>人工执行请求:</strong> ${escapeHtml(signal.manual_requested_at)}</div>`);
            }
            if (signal.entry_price || tpPrice || slPrice) {
                notes.push(`
                    <div class="signal-note">
                        <strong>价格信息:</strong>
                        入场 ${escapeHtml(formatMoney(signal.entry_price))}
                        / 止盈 ${escapeHtml(formatMoney(tpPrice))} (${escapeHtml(formatSignedMoney(tpAmount, '+'))})
                        / 止损 ${escapeHtml(formatMoney(slPrice))} (${escapeHtml(formatSignedMoney(slAmount, '-'))})
                    </div>
                `);
            }
            if (signal.old_sl || signal.new_sl || signal.old_tp || signal.new_tp) {
                notes.push(`
                    <div class="signal-note">
                        <strong>调整结果:</strong>
                        SL ${escapeHtml(formatMoney(signal.old_sl))} → ${escapeHtml(formatMoney(signal.new_sl || signal.old_sl))}
                        / TP ${escapeHtml(formatMoney(signal.old_tp))} → ${escapeHtml(formatMoney(signal.new_tp || signal.old_tp))}
                    </div>
                `);
            }

            return notes.join('');
        }

        function renderBadges(signal) {
            const extra = signal.extra || {};
            const badges = [];
            if (extra.crsi !== undefined && extra.crsi !== null) {
                badges.push(`<span class="indicator-badge badge-crsi">CRSI ${toNumber(extra.crsi).toFixed(1)}</span>`);
            }
            if (extra.obv_rsi !== undefined && extra.obv_rsi !== null) {
                badges.push(`<span class="indicator-badge badge-obv">OBV RSI ${toNumber(extra.obv_rsi).toFixed(1)}</span>`);
            }
            if (extra.vwap_dist !== undefined && extra.vwap_dist !== null) {
                const vwapDist = toNumber(extra.vwap_dist);
                badges.push(`<span class="indicator-badge badge-vwap">VWAP ${escapeHtml(vwapDist > 0 ? `+${vwapDist.toFixed(2)}%` : `${vwapDist.toFixed(2)}%`)}</span>`);
            }
            badges.push(`<span class="indicator-badge badge-priority">优先级 ${escapeHtml(signal.priority || '-')}</span>`);
            badges.push(`<span class="indicator-badge badge-source">${escapeHtml(formatExecutionActionText(signal.source || '-'))}</span>`);
            badges.push(`<span class="indicator-badge badge-source">${escapeHtml(getReverseKindText(signal.reverse_kind))}</span>`);
            if (isTvRiskUpdate(signal) || hasDisplayValue(signal.risk_update_type) || signal.risk_update_seq > 0) {
                badges.push(`<span class="indicator-badge badge-vwap">Risk ${escapeHtml(formatRiskUpdateType(signal.risk_update_type))} #${escapeHtml(signal.risk_update_seq > 0 ? String(signal.risk_update_seq) : '-')}</span>`);
            }
            if (hasDisplayValue(signal.gateway_request_blocked)) {
                badges.push(`<span class="indicator-badge badge-source">Gateway blocked=${escapeHtml(formatBooleanStatus(signal.gateway_request_blocked))}</span>`);
            }
            return badges.length ? `<div class="indicator-badges">${badges.join('')}</div>` : '';
        }

        function renderViewButtons(signal) {
            const buttons = [];
            const encodedReverseId = encodeURIComponent(signal.id);
            const hasOrderContext = !!(signal.trade_group_id || signal.entry_order_unique_id || signal.order_unique_id || signal.broker_order_id);
            buttons.push(`<button class="action-btn btn-details btn-primary-detail" onclick="viewReverse('${encodedReverseId}')">🔎 动作详情</button>`);
            if (signal.signal_id || signal.origin_signal_id) {
                buttons.push(`<button class="action-btn btn-details" onclick="viewSignal('${encodeURIComponent(signal.signal_id || signal.origin_signal_id)}')">📡 查看信号</button>`);
            }
            if (signal.trade_group_id) {
                buttons.push(`<button class="action-btn btn-details" onclick="viewTradeGroup('${encodeURIComponent(signal.trade_group_id)}', '${encodeURIComponent(signal.signal_id || signal.origin_signal_id || '')}')">📜 交易组明细</button>`);
            } else if (hasOrderContext && (signal.signal_id || signal.origin_signal_id)) {
                buttons.push(`<button class="action-btn btn-details" onclick="viewOrders('${encodeURIComponent(signal.signal_id || signal.origin_signal_id)}')">📋 查看订单</button>`);
            }
            return buttons.join('');
        }

        function renderSignals() {
            const container = document.getElementById('signalsContainer');
            displayedSignals = getPaginatedSignals();

            if (displayedSignals.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">暂无执行动作</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = displayedSignals.map((signal) => {
                const direction = signal.current_direction || signal.direction;
                const directionIcon = direction === 'long' ? '📈' : '📉';
                const directionClass = direction === 'long' ? 'long' : 'short';
                const strengthClass = signal.strength === 'strong' ? 'strength-strong' : signal.strength === 'medium' ? 'strength-medium' : 'strength-weak';
                const strengthText = signal.strength === 'strong' ? '强' : signal.strength === 'medium' ? '中' : '弱';
                const actionView = getActionView(signal.action_type, signal);
                const statusView = getStatusView(signal);
                const isPending = signal.status === 'pending';

                return `
                    <div class="signal-card" data-signal-id="${escapeHtml(signal.id)}">
                        <div class="signal-header">
                            <div class="signal-title">
                                <span class="signal-icon">${directionIcon}</span>
                                <span class="signal-symbol">${escapeHtml(signal.symbol)}</span>
                                <span class="signal-direction ${directionClass}">${escapeHtml((direction || '').toUpperCase())}</span>
                                <span class="signal-strength ${strengthClass}">${strengthText}</span>
                                <span class="signal-action-type ${actionView.cls}">${escapeHtml(actionView.text)}</span>
                            </div>
                            <div class="signal-status ${statusView.cls}">${escapeHtml(statusView.text)}</div>
                        </div>

                        <div class="signal-grid">
                            <div class="signal-item">
                                <div class="signal-label">动作来源</div>
                                <div class="signal-value">${escapeHtml(getReverseKindText(signal.reverse_kind))}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">目标状态</div>
                                <div class="signal-value">${escapeHtml(getTargetStateText(signal.target_state, signal))}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">当前方向 → 新方向</div>
                                <div class="signal-value">${escapeHtml(getDirectionLabel(signal.current_direction || signal.direction))}${signal.new_direction ? ` → ${escapeHtml(getDirectionLabel(signal.new_direction))}` : ''}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">评分 / 目标订单状态</div>
                                <div class="signal-value">${escapeHtml(signal.score.toFixed(1))} / ${escapeHtml(signal.target_order_status || '-')}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">数量 / 入场价</div>
                                <div class="signal-value">${escapeHtml(formatQty(signal.quantity))} / ${escapeHtml(formatMoney(signal.entry_price))}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">执行结果 / 动作</div>
                                <div class="signal-value">${escapeHtml(formatExecutionActionText(signal.result_status || '-'))} / ${escapeHtml(formatExecutionActionText(signal.executed_action || signal.action_type || '-'))}</div>
                            </div>
                            ${renderRiskUpdateGridItems(signal)}
                            <div class="signal-item">
                                <div class="signal-label">创建时间</div>
                                <div class="signal-value">${escapeHtml(formatMarketTime(signal.created, 'time'))}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">处理时间</div>
                                <div class="signal-value">${escapeHtml(signal.processed_time ? formatMarketTime(signal.processed_time, 'time') : '-')}</div>
                            </div>
                            ${signal.reason ? `
                                <div class="signal-item full-width">
                                    <div class="signal-label">说明</div>
                                    <div class="signal-value" style="font-size: 12px;">${escapeHtml(formatExecutionActionText(signal.reason))}</div>

                        ${renderInfoNotes(signal)}

                        <div class="signal-actions">

                                <button class="action-btn btn-dismiss" onclick="dispatchReverse('${signal.id}', 'cancel')">✕ 取消</button>
                            ` : ''}
                            ${renderViewButtons(signal)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function dispatchReverse(id, action) {
            let reason = '';
            if (action === 'cancel') {
                const input = prompt('请输入取消原因（可选）:');
                if (input === null) return;
                reason = input.trim();
            } else {
                const signal = allSignals.find((item) => item.id === id);
                const warning = isTvRiskUpdate(signal)
                    ? '请求 IBKR 执行该 TV 风控更新？\n注意：该执行只会尝试修改已关联保护单，不会创建主订单或新的 TP/SL 保护订单；同一类型 risk_update 以最新一条为准。'
                    : '请求 IBKR 执行该动作？';
                if (!confirm(warning)) return;
            }

            try {
                await reverseRequest('/api/custom/ibkr/reverse/dispatch', {
                    method: 'POST',
                    body: {
                        reverse_id: id,
                        action,
                        reason,
                        broker_mode: currentBrokerMode,
                        data_environment: currentEnvironment
                    }
                });
                showToast(action === 'cancel' ? '✓ 已取消执行动作' : '✓ 已提交执行请求');
                await loadSignals();
            } catch (error) {
                console.error('执行动作调度失败:', error);
                showToast(`✗ ${error.message}`);
            }
        }

        function normalizeChartInterval(value, fallback = '5m') {
            const text = String(value || '').trim().toLowerCase();
            const map = {
                '5': '5m',
                '5m': '5m',
                '15': '15m',
                '15m': '15m',
                '30': '30m',
                '30m': '30m',
                '60': '1h',
                '60m': '1h',
                '1h': '1h',
                '1hr': '1h',
                '240': '4h',
                '240m': '4h',
                '4h': '4h',
                '1d': '1d',
                'd': '1d',
                'day': '1d'
            };
            return map[text] || fallback;
        }

        function buildReverseChartParams(signal) {
            if (!signal) return null;
            const extra = signal.extra || {};
            const symbol = String(signal.symbol || extra.symbol || '').trim().toUpperCase();
            if (!symbol) return null;
            return {
                symbol,
                interval: normalizeChartInterval(signal.interval || extra.interval || extra.chart_tf || extra.timeframe, '5m'),
                bar_time_ms: Number(signal.bar_time_ms || extra.bar_time_ms || 0) || '',
                indicator_id: String(extra.indicator_id || '').trim()
            };
        }

        function normalizeDateParam(value, fallback = '') {
            const text = String(value || '').trim();
            return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : fallback;
        }

        function viewTradeGroup(tradeGroupId, signalId) {
            const decodedTradeGroup = decodeURIComponent(tradeGroupId);
            const decodedSignal = signalId ? decodeURIComponent(signalId) : '';

        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();

            const urlAction = normalizeActionFilter(urlParams.get('action'));

            const reverseId = urlParams.get('reverse_id');
            const signalId = urlParams.get('signal_id');
            const orderId = urlParams.get('order_id');
            const tradeGroupId = urlParams.get('trade_group_id');

            if (urlDate) {
                currentDate = urlDate;
            }
            currentStatus = urlStatus;
            currentAction = urlAction;
            document.getElementById('actionTabs').innerHTML = renderActionTabs();
            syncFilterTabs();
            document.getElementById('datePicker').innerHTML = renderDatePicker();
            if (urlDate) {
                const dateInput = document.getElementById('customDate');
                if (dateInput) dateInput.value = urlDate;
            }

            if (actionId) currentSearch = `action_id=${actionId}`;
            else if (reverseId) currentSearch = `action_id=${reverseId}`;
            else if (tradeGroupId) currentSearch = `trade_group_id=${tradeGroupId}`;
            else if (signalId) currentSearch = `signal_id=${signalId}`;
            else if (orderId) currentSearch = `order_id=${orderId}`;

            if (currentSearch) {
                document.getElementById('searchInput').value = currentSearch;
            }
            renderReversePageChrome();

            await withPageLoading(
                () => loadSignals(),
                {
                    title: '执行动作页加载中',
                    copy: '正在同步待处理执行动作、状态分组和订单关联信息。',
                }
            );
            changeRefreshInterval(30);
        });

        window.onEnvironmentChange = function(environment) {
            currentEnvironment = environment;
            currentBrokerMode = getConsoleBrokerMode();
            location.href = buildPageUrl('/ibkr_execution_actions.html', { date: currentDate });
        };
    </script>
</body>
</html>
