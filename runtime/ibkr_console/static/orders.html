        function roleClass(role) {
            if (role === 'entry') return 'role-entry';
            if (role === 'take_profit') return 'role-take-profit';
            if (role === 'repair_tp') return 'role-repair-tp';
            if (role === 'stop_loss') return 'role-stop-loss';
            if (role === 'repair_sl') return 'role-repair-sl';
            if (role === 'close') return 'role-stop-loss';
            return 'role-other';
        }

        function relationClass(status) {
            if (status === 'active') return 'relation-active';
            if (status === 'planned') return 'relation-planned';
            if (status === 'orphaned') return 'relation-orphaned';
            return 'relation-closed';
        }

        function statusClass(status) {
            return `status-${String(status || 'Init').toLowerCase()}`;
        }

        function getOrderTypeText(orderType) {
            return {
                Entry: 'Entry',
                TakeProfit: 'TakeProfit',
                StopLoss: 'StopLoss'
            }[orderType] || orderType || '-';
        }

        function getRoleText(role, orderType) {
            return ROLE_TEXT[role] || getOrderTypeText(orderType);
        }

        function normalizeOrder(raw) {
            const extra = parseJsonLike(raw.extra);
            const orderType = firstDefined(raw.order_type, extra.order_type, 'Entry');
            const role = firstDefined(
                raw.role,
                extra.role,
                orderType === 'Entry' ? 'entry' : orderType === 'TakeProfit' ? 'take_profit' : orderType === 'StopLoss' ? 'stop_loss' : ''
            );
            const uniqueId = firstDefined(raw.unique_id, extra.unique_id, raw.order_id, raw.id);
            const entryOrderUniqueId = firstDefined(raw.entry_order_unique_id, extra.entry_order_unique_id, role === 'entry' ? uniqueId : '', uniqueId);
            const tradeGroupId = firstDefined(raw.trade_group_id, extra.trade_group_id, entryOrderUniqueId, uniqueId);
            const brokerOrderId = firstDefined(raw.broker_order_id, extra.broker_order_id, raw.order_id, '');
            const direction = firstDefined(raw.position_side, raw.direction, extra.position_side, extra.direction, '');
            const barTimeMs = toNumber(firstDefined(raw.bar_time_ms, extra.bar_time_ms));
            const timeKey = barTimeMs || Date.parse(firstDefined(raw.us_time, raw.created, '')) || Date.now();

            return {
                ...raw,
                extra,
                order_type: orderType,
                role,
                unique_id: uniqueId,
                entry_order_unique_id: entryOrderUniqueId,
                trade_group_id: tradeGroupId,
                parent_order_unique_id: firstDefined(raw.parent_order_unique_id, extra.parent_order_unique_id, role !== 'entry' ? entryOrderUniqueId : ''),
                sibling_order_unique_id: firstDefined(raw.sibling_order_unique_id, extra.sibling_order_unique_id, ''),
                relation_status: firstDefined(
                    raw.relation_status,
                    extra.relation_status,
                    role !== 'entry' && raw.status === 'Init' ? 'planned' : '',
                    ['Canceled', 'Closed'].includes(raw.status) ? 'closed' : 'active'
                ),
                broker_order_id: brokerOrderId,
                direction,
                position_side: direction,
                quantity: toNumber(firstDefined(raw.quantity, extra.quantity)),
                filled_qty: toNumber(firstDefined(raw.filled_qty, extra.filled_qty)),
                limit_price: toNumber(firstDefined(raw.limit_price, extra.limit_price)),
                fill_price: toNumber(firstDefined(raw.fill_price, extra.fill_price)),
                tp_price: toNumber(firstDefined(raw.tp_price, extra.tp_price)),
                sl_price: toNumber(firstDefined(raw.sl_price, extra.sl_price)),
                pnl: toNumber(firstDefined(raw.pnl, extra.pnl)),
                commission: toNumber(firstDefined(raw.commission, extra.commission)),
                conid: toNumber(firstDefined(raw.conid, extra.conid)),
                signal_id: firstDefined(raw.signal_id, extra.signal_id, ''),
                bar_time_ms: barTimeMs,
                time_key: timeKey,
                order_time: firstDefined(raw.order_time, extra.order_time, raw.us_time, ''),
                us_time: firstDefined(raw.us_time, extra.us_time, ''),
                cn_time: firstDefined(raw.cn_time, extra.cn_time, ''),
                fill_time: firstDefined(raw.fill_time, extra.fill_time, '')
            };
        }

        function orderIdentityAliases(order) {
            return [
                order?.broker_order_id,
                order?.order_id,
                order?.extra?.broker_order_id,
                order?.extra?.order_id,
                order?.extra?.coid,
                order?.extra?.cOID,
            ].map((value) => String(value || '').trim()).filter(Boolean);
        }

        function normalizeExecutionFill(raw) {
            const rawPayload = parseJsonLike(raw?.raw);
            const orderId = firstDefined(raw?.order_id, rawPayload.orderId, rawPayload.order_id, rawPayload.order_id_str);
            const shares = Math.abs(Number(firstDefined(raw?.shares, rawPayload.shares, rawPayload.qty, rawPayload.quantity, 0)) || 0);
            const price = Number(firstDefined(raw?.price, raw?.fill_price, rawPayload.price, rawPayload.avgPrice, rawPayload.avg_fill_price, 0)) || 0;
            const commission = Number(firstDefined(raw?.commission, rawPayload.commission, 0)) || 0;
            const tradeTimeMs = Number(firstDefined(raw?.trade_time_ms, rawPayload.trade_time_ms, rawPayload.time_ms, 0)) || 0;
            if (!orderId || shares <= 0 || price <= 0) return null;
            return {
                ...raw,
                raw: rawPayload,
                order_id: String(orderId).trim(),
                shares,
                price,
                commission,
                trade_time_ms: tradeTimeMs,
            };
        }

        function buildExecutionFillLookup(fills) {
            const lookup = new Map();
            (fills || []).forEach((rawFill) => {
                const fill = normalizeExecutionFill(rawFill);
                if (!fill) return;
                const key = String(fill.order_id || '').trim();
                if (!key) return;
                if (!lookup.has(key)) {
                    lookup.set(key, {
                        quantity: 0,
                        value: 0,
                        commission: 0,
                        fills: []
                    });
                }
                const bucket = lookup.get(key);
                bucket.quantity += fill.shares;
                bucket.value += fill.shares * fill.price;
                bucket.commission += fill.commission;
                bucket.fills.push(fill);
            });

            lookup.forEach((bucket) => {
                bucket.avg_price = bucket.quantity > 0 ? bucket.value / bucket.quantity : null;
            });
            return lookup;
        }

        function resolveOrderActualFill(order) {
            const filledQty = firstPositiveNumber(order?.filled_qty, order?.extra?.filled_qty);
            const status = String(order?.status || '').trim().toLowerCase();
            const hasFilledState = filledQty !== null || ['filled', 'closed'].includes(status);
            if (!hasFilledState) {
                return { price: null, quantity: filledQty || 0, source: 'missing', fillCount: 0, commission: null };
            }

            const role = String(order?.role || '').trim().toLowerCase();
            const extra = order?.extra || {};
            const roleSpecificPrice = role === 'entry'
                ? firstPositiveNumber(extra.entry_fill_price, extra.executed_price)
                : firstPositiveNumber(extra.exit_fill_price, extra.closed_price, extra.close_price);
            const price = firstPositiveNumber(
                order?.fill_price,
                order?.avg_fill_price,
                order?.avgPrice,
                order?.avg_price,
                order?.average_price,
                extra.fill_price,
                extra.avg_fill_price,
                extra.avgPrice,
                extra.avg_price,
                extra.average_price,
                roleSpecificPrice
            );

            return {
                price,
                quantity: filledQty || 0,
                source: price ? 'orders.actual_fill_fields' : 'missing',
                fillCount: 0,
                commission: null
            };
        }

        function applyActualFillToOrder(order, fillLookup) {
            const matchedFill = orderIdentityAliases(order)
                .map((key) => fillLookup.get(key))
                .find((value) => value && value.avg_price > 0);
            if (matchedFill) {
                return {
                    ...order,
                    actual_fill_price: matchedFill.avg_price,
                    actual_filled_qty: matchedFill.quantity,
                    actual_fill_commission: matchedFill.commission,
                    fill_source: 'ibkr_execution_fills',
                    fill_count: matchedFill.fills.length
                };
            }

            const resolved = resolveOrderActualFill(order);
            return {
                ...order,
                actual_fill_price: resolved.price,
                actual_filled_qty: resolved.quantity,
                actual_fill_commission: resolved.commission,
                fill_source: resolved.source,
                fill_count: resolved.fillCount
            };
        }

        async function fetchExecutionFillsForOrders(orders, requestId) {
            const orderIds = [...new Set(
                (orders || [])
                    .flatMap(orderIdentityAliases)
                    .map((value) => String(value || '').trim())
                    .filter(Boolean)
            )];
            if (!orderIds.length) return [];

            const fills = [];
            try {
                for (const idChunk of chunkArray(orderIds, 12)) {
                    const idFilter = idChunk.map((id) => `order_id = "${escapeFilterValue(id)}"`).join(' || ');
                    const records = await fetchCollectionFullList('ibkr_execution_fills', {
                        filter: `environment = "${currentEnvironment}" && (${idFilter})`,
                        sort: 'trade_time_ms,created',
                        perPage: ORDERS_FETCH_PAGE_SIZE,
                        maxPages: EXECUTION_FILL_FETCH_MAX_PAGES,
                        requestId
                    });
                    if (!records || requestId !== currentOrdersRequestId) return [];
                    fills.push(...records);
                }
            } catch (error) {
                console.warn('[Orders] 加载 ibkr_execution_fills 失败，回退到订单同步成交字段:', error);
                return [];
            }
            return fills;
        }

        async function enrichOrdersWithActualFills(orders, requestId) {
            const normalizedOrders = (orders || []).map((order) => (
                order && order.time_key !== undefined && order.extra !== undefined ? order : normalizeOrder(order)
            ));
            const fills = await fetchExecutionFillsForOrders(normalizedOrders, requestId);
            if (requestId && requestId !== currentOrdersRequestId) return null;
            const fillLookup = buildExecutionFillLookup(fills);
            return normalizedOrders.map((order) => applyActualFillToOrder(order, fillLookup));
        }

        function buildLatestOrdersFromDetails(records) {
            const latestByOrder = new Map();
            (Array.isArray(records) ? records : []).forEach((record) => {
                const normalized = normalizeOrder(record);
                const key = normalized.order_id || normalized.broker_order_id || normalized.unique_id || normalized.id;
                if (!key) return;
                const previous = latestByOrder.get(key);
                if (!previous || Number(normalized.time_key || 0) >= Number(previous.time_key || 0)) {
                    latestByOrder.set(key, normalized);
                }
            });
            return Array.from(latestByOrder.values());
        }

        function roleRank(role) {
            return {
                entry: 0,
                take_profit: 1,
                repair_tp: 1,
                stop_loss: 2,
                repair_sl: 2,
                close: 3
            }[role] ?? 9;
        }

        function sortOrdersInGroup(left, right) {
            const roleDiff = roleRank(left.role) - roleRank(right.role);
            if (roleDiff !== 0) return roleDiff;
            const timeDiff = (right.time_key || 0) - (left.time_key || 0);
            if (timeDiff !== 0) return timeDiff;
            return String(left.unique_id || '').localeCompare(String(right.unique_id || ''));
        }

        function isProtectiveOrder(order) {
            const role = String(order?.role || '').trim().toLowerCase();
            const orderType = String(order?.order_type || '').trim().toLowerCase();
            return ['take_profit', 'stop_loss', 'repair_tp', 'repair_sl', 'tp', 'sl'].includes(role)
                || ['close', 'manual_close', 'market_close', 'close_order'].includes(role)
                || ['takeprofit', 'stoploss'].includes(orderType);
        }

        function isMainOrder(order) {
            if (!order || isProtectiveOrder(order)) return false;
            const role = String(order.role || '').trim().toLowerCase();
            const orderType = String(order.order_type || '').trim().toLowerCase();
            return role === 'entry' || ['entry', 'entryorder'].includes(orderType);
        }

        function pickPrimaryOrder(orders) {
            return orders.find(isMainOrder)
                || orders.find((order) => order.role === 'entry')
                || orders.find((order) => order.unique_id === order.entry_order_unique_id);
        }

        function mainGroupKey(order) {
            return order.trade_group_id || order.entry_order_unique_id || order.signal_id || order.unique_id || order.id;
        }

        function addMainOrderAliases(aliasMap, order, groupKey) {
            [
                order.signal_id,
                order.trade_group_id,
                order.entry_order_unique_id,
                order.unique_id,
                order.id,
                order.broker_order_id,
                order.order_id
            ].forEach((value) => {
                const alias = String(value || '').trim();
                if (alias && !aliasMap.has(alias)) aliasMap.set(alias, groupKey);
            });
        }

        function resolveMainGroupKey(order, aliasMap) {
            const candidates = [
                order.trade_group_id,
                order.entry_order_unique_id,
                order.parent_order_unique_id,
                order.sibling_order_unique_id,
                order.unique_id,
                order.id,
                order.signal_id
            ];
            for (const value of candidates) {
                const key = aliasMap.get(String(value || '').trim());
                if (key) return key;
            }
            return '';
        }

        function buildTradeGroups(orders) {
            const grouped = new Map();
            const aliasMap = new Map();
            const mainOrders = orders.filter(isMainOrder);

            mainOrders.forEach((order) => {
                const key = mainGroupKey(order);
                if (!key) return;
                if (!grouped.has(key)) grouped.set(key, []);
                grouped.get(key).push(order);
                addMainOrderAliases(aliasMap, order, key);
            });

            orders.filter((order) => !isMainOrder(order)).forEach((order) => {
                const key = resolveMainGroupKey(order, aliasMap);
                if (!key || !grouped.has(key)) return;
                grouped.get(key).push(order);
            });

            return Array.from(grouped.entries()).map(([groupId, ordersInGroup]) => {
                const ordersSorted = [...ordersInGroup].sort(sortOrdersInGroup);
                const primaryOrder = pickPrimaryOrder(ordersSorted);
                if (!primaryOrder) return null;
                const latestEvent = [...ordersInGroup].sort((a, b) => b.time_key - a.time_key)[0];
                const exitOrder = ordersSorted.find((order) => order.role !== 'entry' && order.status === 'Filled') || null;
                const relationAlert = ordersSorted.find((order) => order.relation_status === 'orphaned') || null;
                return {
                    group_id: groupId,
                    trade_group_id: groupId,
                    orders: ordersSorted,
                    primaryOrder,
                    latestEvent,
                    exitOrder,
                    relationAlert,
                    symbol: primaryOrder?.symbol || latestEvent?.symbol || '-',
                    direction: primaryOrder?.position_side || primaryOrder?.direction || latestEvent?.direction || '',
                    signal_id: primaryOrder?.signal_id || latestEvent?.signal_id || '',
                    status: primaryOrder?.status || latestEvent?.status || 'Init',
                    latest_time: Math.max(...ordersInGroup.map((order) => order.time_key || 0)),
                    activeChildCount: ordersInGroup.filter((order) => !['entry', 'close'].includes(order.role) && order.relation_status === 'active').length,
                    plannedChildCount: ordersInGroup.filter((order) => !['entry', 'close'].includes(order.role) && order.relation_status === 'planned').length
                };
            }).filter(Boolean).sort((left, right) => right.latest_time - left.latest_time);
        }

        function uniqueNonEmpty(values) {
            const seen = new Set();
            const result = [];
            (values || []).forEach((value) => {
                const text = String(value || '').trim();
                if (!text || seen.has(text)) return;
                seen.add(text);
                result.push(text);
            });
            return result;
        }

        function aggregateSignalStatus(entryOrders, orders) {
            const statuses = (entryOrders && entryOrders.length ? entryOrders : orders)
                .map((order) => String(order?.status || '').trim())
                .filter(Boolean);
            if (statuses.includes('Submitted')) return 'Submitted';
            if (statuses.includes('Init')) return 'Init';
            if (statuses.includes('Filled')) return 'Filled';
            if (statuses.includes('Closed')) return 'Closed';
            if (statuses.length && statuses.every((status) => status === 'Canceled')) return 'Canceled';
            return statuses[0] || 'Init';
        }

        function buildSignalGroupKey(tradeGroup) {
            return firstDefined(
                tradeGroup?.signal_id,
                tradeGroup?.primaryOrder?.signal_id,
                tradeGroup?.latestEvent?.signal_id,
                tradeGroup?.trade_group_id,
                tradeGroup?.group_id
            );
        }

        function buildSignalGroups(tradeGroups) {
            const grouped = new Map();
            (tradeGroups || []).forEach((tradeGroup) => {
                const key = buildSignalGroupKey(tradeGroup);
                if (!key) return;
                if (!grouped.has(key)) {
                    grouped.set(key, {
                        group_id: key,
                        signal_id: tradeGroup.signal_id || '',
                        tradeGroups: [],
                        orders: []
                    });
                }
                const bucket = grouped.get(key);
                if (!bucket.signal_id && tradeGroup.signal_id) bucket.signal_id = tradeGroup.signal_id;
                bucket.tradeGroups.push(tradeGroup);
                bucket.orders.push(...(tradeGroup.orders || []));
            });

            return Array.from(grouped.values()).map((bucket) => {
                const ordersSorted = [...bucket.orders].sort(sortOrdersInGroup);
                const entryOrders = ordersSorted.filter(isMainOrder);
                const protectionOrders = ordersSorted.filter((order) => isProtectiveOrder(order) && order.role !== 'close');
                const closeOrders = ordersSorted.filter((order) => String(order.role || '').trim().toLowerCase() === 'close');
                const primaryOrder = entryOrders[0] || pickPrimaryOrder(ordersSorted);
                const latestEvent = [...ordersSorted].sort((a, b) => (b.time_key || 0) - (a.time_key || 0))[0] || primaryOrder;
                const exitOrder = ordersSorted.find((order) => order.role !== 'entry' && order.status === 'Filled') || null;
                const relationAlert = ordersSorted.find((order) => order.relation_status === 'orphaned') || null;
                const tradeGroupIds = uniqueNonEmpty(bucket.tradeGroups.map((group) => group.trade_group_id || group.group_id));
                const signalId = bucket.signal_id || primaryOrder?.signal_id || latestEvent?.signal_id || '';
                return {
                    group_id: bucket.group_id,
                    signal_id: signalId,
                    trade_group_id: tradeGroupIds[0] || bucket.group_id,
                    tradeGroupIds,
                    tradeGroups: bucket.tradeGroups,
                    orders: ordersSorted,
                    entryOrders,
                    protectionOrders,
                    closeOrders,
                    primaryOrder,
                    latestEvent,
                    exitOrder,
                    relationAlert,
                    symbol: primaryOrder?.symbol || latestEvent?.symbol || '-',
                    direction: primaryOrder?.position_side || primaryOrder?.direction || latestEvent?.direction || '',
                    status: aggregateSignalStatus(entryOrders, ordersSorted),
                    latest_time: Math.max(...ordersSorted.map((order) => order.time_key || 0)),
                    activeChildCount: protectionOrders.filter((order) => order.relation_status === 'active').length,
                    plannedChildCount: protectionOrders.filter((order) => order.relation_status === 'planned').length,
                    entryOrderCount: entryOrders.length,
                    protectionLegCount: protectionOrders.length,
                    closeOrderCount: closeOrders.length
                };
            }).filter((group) => group.primaryOrder).sort((left, right) => right.latest_time - left.latest_time);
        }

        function matchesSearch(group, keyword) {
            if (!keyword) return true;
            const search = keyword.toUpperCase();
            const fields = [
                group.symbol,
                group.signal_id,
                group.trade_group_id,
                ...(group.tradeGroupIds || []),
                group.primaryOrder?.entry_order_unique_id,
                group.primaryOrder?.broker_order_id,
                ...group.orders.flatMap((order) => [
                    order.unique_id,
                    order.broker_order_id,
                    order.trade_group_id,
                    order.parent_order_unique_id,
                    order.sibling_order_unique_id,
                    order.role,
                    order.order_type,
                    order.signal_id
                ])
            ];
            return fields.some((field) => String(field || '').toUpperCase().includes(search));
        }

        function groupMatchesFilterScope(group, overrides = {}) {
            const statusFilter = overrides.status !== undefined ? overrides.status : currentStatus;
            const directionFilter = overrides.direction !== undefined ? overrides.direction : currentDirection;
            const signalIdFilter = overrides.signalId !== undefined ? overrides.signalId : filterSignalId;
            const tradeGroupIdFilter = overrides.tradeGroupId !== undefined ? overrides.tradeGroupId : filterTradeGroupId;
            const searchFilter = overrides.search !== undefined ? overrides.search : currentSearch;

            if (statusFilter !== 'all' && group.status !== statusFilter) return false;
            if (directionFilter !== 'all' && group.direction !== directionFilter) return false;
            if (signalIdFilter && !group.orders.some((order) => order.signal_id === signalIdFilter)) return false;
            if (tradeGroupIdFilter && !(group.tradeGroupIds || [group.trade_group_id]).includes(tradeGroupIdFilter)) return false;
            if (!matchesSearch(group, searchFilter)) return false;
            return true;
        }

        function filterGroups(groups, overrides = {}) {
            return groups.filter((group) => {
                return groupMatchesFilterScope(group, overrides);
            });
        }

        function resetPagination() {
            currentPage = 1;
            displayedGroups = filterGroups(allGroups).slice(0, itemsPerPage);
        }

        function loadMoreGroups() {
            if (isOrdersDatasetPartial) return;
            currentPage += 1;
            displayedGroups = filterGroups(allGroups).slice(0, currentPage * itemsPerPage);
            renderGroups();
            updateLoadMoreButton();
        }

        function updateLoadMoreButton() {
            const btn = document.getElementById('loadMoreBtn');
            if (isOrdersDatasetPartial) {
                btn.style.display = displayedGroups.length > 0 ? 'block' : 'none';
                btn.textContent = '后台补齐中...';
                btn.disabled = true;
                return;
            }
            const filtered = filterGroups(allGroups);
            const hasMore = displayedGroups.length < filtered.length;
            btn.style.display = hasMore ? 'block' : 'none';
            btn.textContent = hasMore ? `加载更多 (${displayedGroups.length}/${filtered.length})` : `已加载全部 (${filtered.length})`;
            btn.disabled = !hasMore;
        }

        function updateSummaryBar() {
            const filtered = filterGroups(allGroups);
            const summary = document.getElementById('summaryBar');
            const openGroups = filtered.filter((group) => !group.exitOrder && group.status !== 'Canceled' && group.status !== 'Closed').length;
            const entryOrderCount = filtered.reduce((sum, group) => sum + (group.entryOrders || []).length, 0);
            const protectionLegCount = filtered.reduce((sum, group) => sum + (group.protectionOrders || []).length, 0);
            const tradeGroupCount = uniqueNonEmpty(filtered.flatMap((group) => group.tradeGroupIds || [])).length;
            summary.innerHTML = `
                <div class="summary-card"><div class="summary-label">SIGNALS</div><div class="summary-value">${formatCountValue(filtered.length)}</div></div>
                <div class="summary-card"><div class="summary-label">ENTRY ORDERS</div><div class="summary-value">${formatCountValue(entryOrderCount)}</div></div>
                <div class="summary-card"><div class="summary-label">PROTECTION LEGS</div><div class="summary-value">${formatCountValue(protectionLegCount)}</div></div>
                <div class="summary-card"><div class="summary-label">TRADE GROUPS</div><div class="summary-value">${formatCountValue(tradeGroupCount)}</div></div>
                <div class="summary-card"><div class="summary-label">BROKER LIVE</div><div class="summary-value">${escapeHtml(String(getBrokerLiveCount()))}</div></div>
                <div class="summary-card"><div class="summary-label">OPEN SIGNALS</div><div class="summary-value">${formatCountValue(openGroups)}</div></div>
                ${currentOrdersSource === 'ibkr_order_details' ? '<div class="summary-hint">当前使用 ibkr_order_details 最新快照回退展示，可查看图表与交易组明细，但不提供撤单/平仓操作。</div>' : ''}
                ${isOrdersDatasetPartial ? '<div class="summary-hint">首屏已加载，剩余订单后台补齐中</div>' : ''}
            `;
        }

        function updateStatusTabCounts() {
            const statuses = ['Init', 'Submitted', 'Filled', 'Canceled', 'Closed'];
            const counts = { all: filterGroups(allGroups, { status: 'all' }).length };
            statuses.forEach((status) => {
                counts[status] = filterGroups(allGroups, { status }).length;
            });
            document.querySelectorAll('.status-tab').forEach((button) => {
                const status = button.dataset.status;
                const valueNode = button.querySelector('.count-value');
                if (valueNode) valueNode.textContent = formatCountValue(counts[status] || 0);
            });
        }

        function updateDirectionTabCounts() {
            const directions = ['long', 'short'];
            const counts = { all: filterGroups(allGroups, { direction: 'all' }).length };
            directions.forEach((direction) => {
                counts[direction] = filterGroups(allGroups, { direction }).length;
            });
            document.querySelectorAll('.dir-tab').forEach((button) => {
                const direction = button.dataset.dir;
                const valueNode = button.querySelector('.count-value');
                if (valueNode) valueNode.textContent = formatCountValue(counts[direction] || 0);
            });
        }

        function renderFilterNote() {
            const notes = [`env=${getEnvironmentLabel(currentEnvironment)}`];
            if (filterSignalId) notes.push(`signal_id=${filterSignalId}`);
            if (filterTradeGroupId) notes.push(`trade_group_id=${filterTradeGroupId}`);
            if (currentSearch) notes.push(`search=${currentSearch}`);
            if (resolvedLegacySearch) notes.push(`resolved_from=${resolvedLegacySearch}`);
            if (currentOrdersSource === 'ibkr_order_details') notes.push('dataset=detail_snapshot');
            if (isOrdersDatasetPartial) notes.push('dataset=首屏快照');
            if (brokerLiveSnapshot) notes.push(`broker_live=${getBrokerLiveCount()}/${getBrokerCoverageState()}`);
            if (brokerLiveError) notes.push(`broker_live_error=${brokerLiveError}`);
            const lifecycleFilterUrl = buildFilterLifecycleFlowUrl();
            document.getElementById('filterNote').innerHTML = notes.length
                ? `<div class="filter-note"><span>当前过滤: ${escapeHtml(notes.join(' · '))}</span>${lifecycleFilterUrl ? `<a class="filter-note-link" href="${lifecycleFilterUrl}">🧭 生命周期</a>` : ''}</div>`
                : '';
        }

        function renderRelationshipStrip(group) {
            const nodes = group.orders.map((order) => `
                <span class="relationship-node">
                    <span>${escapeHtml(getRoleText(order.role, order.order_type))}</span>
                    <span class="${statusClass(order.status)} status-badge">${escapeHtml(order.status)}</span>
                </span>
            `);
            return `
                <div class="relationship-strip">
                    ${nodes.map((node, index) => `${index > 0 ? '<span class="relationship-arrow">→</span>' : ''}${node}`).join('')}
                </div>
            `;
        }

        function renderMetric(label, value) {
            return `<div class="metric-card"><div class="metric-label">${escapeHtml(label)}</div><div class="metric-value">${value}</div></div>`;
        }

        function renderDetail(label, value) {
            return `
                <div class="detail-item">
                    <div class="detail-label">${escapeHtml(label)}</div>
                    <div class="detail-value">${value}</div>
                </div>
            `;
        }

        function actualFilledQty(order) {
            return firstPositiveNumber(order?.actual_filled_qty, order?.filled_qty, order?.extra?.filled_qty) || 0;
        }

        function actualFillSourceLabel(order) {
            if (order?.fill_source === 'ibkr_execution_fills') {
                return `IBKR fills${order.fill_count ? ` x${order.fill_count}` : ''}`;
            }
            if (order?.fill_source === 'orders.actual_fill_fields') return 'order fill';
            return 'missing';
        }

        function renderActualFillValue(order) {
            const price = firstPositiveNumber(order?.actual_fill_price);
            const filledQty = actualFilledQty(order);
            const status = String(order?.status || '').trim().toLowerCase();
            if (price) {
                return `${escapeHtml(formatMoney(price))}<br><span class="metric-subvalue">${escapeHtml(actualFillSourceLabel(order))}</span>`;
            }
            if (filledQty > 0 || ['filled', 'closed'].includes(status)) {
                return '<span class="missing-fill">成交价缺失</span><br><span class="metric-subvalue">未找到真实成交字段</span>';
            }
            return '<span class="pnl-flat">未成交</span>';
        }

        function buildActualEntryFillMetric(group) {
            const filledEntries = (group.entryOrders || []).filter((order) => actualFilledQty(order) > 0);
            const pricedEntries = filledEntries.filter((order) => firstPositiveNumber(order.actual_fill_price));
            if (!filledEntries.length) return '<span class="pnl-flat">未成交</span>';
            if (!pricedEntries.length) return '<span class="missing-fill">成交价缺失</span>';

            const totalQty = pricedEntries.reduce((sum, order) => sum + actualFilledQty(order), 0);
            const totalValue = pricedEntries.reduce((sum, order) => sum + actualFilledQty(order) * firstPositiveNumber(order.actual_fill_price), 0);
            const avgPrice = totalQty > 0 ? totalValue / totalQty : null;
            const prices = pricedEntries.map((order) => firstPositiveNumber(order.actual_fill_price)).filter(Boolean);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);
            const missingCount = filledEntries.length - pricedEntries.length;
            const rangeText = minPrice !== maxPrice ? ` · range ${formatMoney(minPrice)}-${formatMoney(maxPrice)}` : '';
            const missingText = missingCount > 0 ? ` · ${missingCount} 单缺价` : '';
            return `${escapeHtml(formatMoney(avgPrice))}<br><span class="metric-subvalue">qty ${escapeHtml(formatQty(totalQty))}${escapeHtml(rangeText)}${escapeHtml(missingText)}</span>`;
        }

        function resolveTakeProfitPrice(primary, tpOrder) {
            return firstPositiveNumber(
                tpOrder?.limit_price,
                tpOrder?.tp_price,
                tpOrder?.extra?.take_profit,
                tpOrder?.extra?.tp_price,
                tpOrder?.extra?.initial_take_profit,
                primary?.tp_price,
                primary?.extra?.take_profit,
                primary?.extra?.tp_price,
                primary?.extra?.initial_take_profit
            );
        }

        function resolveStopLossPrice(primary, slOrder) {
            return firstPositiveNumber(
                slOrder?.limit_price,
                slOrder?.sl_price,
                slOrder?.extra?.stop_loss,
                slOrder?.extra?.sl_price,
                slOrder?.extra?.stop_price,
                slOrder?.extra?.initial_stop_loss,
                primary?.sl_price,
                primary?.extra?.stop_loss,
                primary?.extra?.sl_price,
                primary?.extra?.stop_price,
                primary?.extra?.initial_stop_loss
            );
        }

        function resolveDisplayPrice(order) {
            const role = String(order?.role || '').trim();
            if (role === 'stop_loss' || role === 'repair_sl') return resolveStopLossPrice(order, order);
            if (role === 'take_profit' || role === 'repair_tp') return resolveTakeProfitPrice(order, order);
            return firstPositiveNumber(order?.limit_price, order?.extra?.limit_price, order?.fill_price);
        }

        function resolveEntryFillPrice(primary) {
            return firstPositiveNumber(
                primary?.actual_fill_price,
                primary?.fill_price,
                primary?.extra?.fill_price,
                primary?.extra?.avg_fill_price,
                primary?.extra?.avgPrice,
                primary?.extra?.entry_fill_price,
                primary?.limit_price,
                primary?.extra?.limit_price,
                primary?.extra?.entry_price
            );
        }

        function resolveExitFillPrice(exitOrder, fallbackPrice) {
            return firstPositiveNumber(
                exitOrder?.actual_fill_price,
                exitOrder?.fill_price,
                exitOrder?.extra?.fill_price,
                exitOrder?.extra?.avg_fill_price,
                exitOrder?.extra?.avgPrice,
                exitOrder?.extra?.exit_fill_price,
                exitOrder?.limit_price,
                exitOrder?.extra?.limit_price,
                fallbackPrice
            );
        }

        function computeDirectionalPnl(direction, entryPrice, exitPrice, quantity) {
            const entry = toNumber(entryPrice);
            const exit = toNumber(exitPrice);
            const qty = toNumber(quantity);
            if (entry === null || exit === null || qty === null || qty <= 0) return null;
            const side = String(direction || '').toLowerCase();
            const perShare = side === 'short' ? entry - exit : exit - entry;
            return perShare * qty;
        }

        function sumCommissions(orders) {
            return (orders || []).reduce((sum, order) => {
                const commission = firstPositiveNumber(Math.abs(Number(order?.actual_fill_commission || 0)), Math.abs(Number(order?.commission || 0)));
                return sum + (commission === null ? 0 : commission);
            }, 0);
        }

        function absCommission(order) {
            const actual = toNumber(order?.actual_fill_commission);
            if (actual !== null && Math.abs(actual) > 0) return Math.abs(actual);
            const direct = toNumber(order?.commission);
            if (direct !== null) return Math.abs(direct);
            const extra = order?.extra || {};
            const nested = toNumber(firstDefined(extra.commission, extra.ibkr_commission));
            return nested === null ? 0 : Math.abs(nested);
        }

        function commissionBreakdownText(entryOrder, exitOrder, orders) {
            const entryCommission = absCommission(entryOrder);
            const exitCommission = absCommission(exitOrder);
            const known = entryCommission + exitCommission;
            const total = sumCommissions(orders);
            const parts = [];
            if (entryCommission > 0) parts.push(`买/开 ${formatMoney(entryCommission)}`);
            if (exitCommission > 0) parts.push(`卖/平 ${formatMoney(exitCommission)}`);
            if (!parts.length && total > 0) parts.push(`总手续费 ${formatMoney(total)}`);
            if (parts.length && total > known + 0.0001) parts.push(`其他 ${formatMoney(total - known)}`);
            return parts.join(' / ');
        }

        function buildPnlMetric(group, tpPrice, slPrice) {
            const primary = group.primaryOrder || {};
            const entryPrice = resolveEntryFillPrice(primary);
            const quantity = firstPositiveNumber(group.exitOrder?.filled_qty, primary?.filled_qty, primary?.quantity);
            const direction = group.direction || primary.position_side || primary.direction;
            const exitFallback = group.exitOrder?.role === 'stop_loss' || group.exitOrder?.role === 'repair_sl' ? slPrice : tpPrice;
            const exitPrice = group.exitOrder ? resolveExitFillPrice(group.exitOrder, exitFallback) : null;
            const storedPnl = firstDefined(group.exitOrder?.pnl, primary?.pnl, '');
            const realizedGross = group.exitOrder
                ? (toNumber(storedPnl) !== null && Math.abs(toNumber(storedPnl)) > 0
                    ? toNumber(storedPnl)
                    : computeDirectionalPnl(direction, entryPrice, exitPrice, quantity))
                : null;
            const commission = sumCommissions(group.orders);
            const realizedNet = realizedGross === null ? null : realizedGross - commission;
            const tpPotential = computeDirectionalPnl(direction, entryPrice, tpPrice, quantity);
            const slPotential = computeDirectionalPnl(direction, entryPrice, slPrice, quantity);
            const realizedText = realizedNet === null
                ? '<span class="pnl-flat">未退出</span>'
                : `<span class="${pnlClass(realizedNet)}">${escapeHtml(formatSignedMoney(realizedNet))}</span>`;
            const exitText = group.exitOrder && exitPrice
                ? `${getRoleText(group.exitOrder.role, group.exitOrder.order_type)} @ ${formatMoney(exitPrice)}`
                : '等待成交退出';
            const planParts = [];
            if (tpPotential !== null) planParts.push(`TP ${formatSignedMoney(tpPotential)}`);
            if (slPotential !== null) planParts.push(`SL ${formatSignedMoney(slPotential)}`);
            const commissionText = commissionBreakdownText(primary, group.exitOrder, group.orders);
            if (commissionText && realizedGross !== null) planParts.push(commissionText);
            const planText = planParts.length ? planParts.join(' / ') : '缺少价格或数量';
            return `${realizedText}<br><span class="metric-subvalue">${escapeHtml(exitText)} · ${escapeHtml(planText)}</span>`;
        }

        function renderOrderCard(order, isPrimary) {
            const displayPrice = resolveDisplayPrice(order);
            const priceLabel = order.role === 'stop_loss' || order.role === 'repair_sl' ? '触发价 / 真实成交价' : 'Limit / Actual Fill';
            return `
                <div class="order-item-card ${isPrimary ? 'primary' : ''}">
                    <div class="order-item-head">
                        <div>
                            <div class="order-item-id">${escapeHtml(order.unique_id || '-')}</div>
                            <div class="order-item-sub">broker=${escapeHtml(order.broker_order_id || '-')}</div>
                        </div>
                        <div class="mini-chip-row">
                            <span class="role-badge ${roleClass(order.role)}">${escapeHtml(getRoleText(order.role, order.order_type))}</span>
                            <span class="status-badge ${statusClass(order.status)}">${escapeHtml(ORDER_STATUS_TEXT[order.status] || order.status || '-')}</span>
                            <span class="relation-badge ${relationClass(order.relation_status)}">${escapeHtml(order.relation_status || '-')}</span>
                        </div>
                    </div>
                    ${isPrimary ? renderCountdown(order, true) : ''}
                    <div class="detail-grid">
                        ${renderDetail('order_type', escapeHtml(getOrderTypeText(order.order_type)))}
                        ${renderDetail('signal_id', escapeHtml(order.signal_id || '-'))}
                        ${renderDetail('数量 / 实际成交', `${escapeHtml(formatQty(order.quantity))} / ${escapeHtml(formatQty(actualFilledQty(order)))}`)}
                        ${renderDetail(priceLabel, `${escapeHtml(formatMoney(displayPrice))}<br>${renderActualFillValue(order)}`)}
                        ${renderDetail('手续费', escapeHtml(formatMoney(absCommission(order))))}
                        ${renderDetail('trade_group', escapeHtml(order.trade_group_id || '-'))}
                        ${renderDetail('parent_order', escapeHtml(order.parent_order_unique_id || '-'))}
                        ${renderDetail('sibling_order', escapeHtml(order.sibling_order_unique_id || '-'))}
                        ${renderDetail('entry_order', escapeHtml(order.entry_order_unique_id || '-'))}
                        ${renderDetail('time', escapeHtml(formatTimePair(order)))}
                    </div>
                </div>
            `;
        }

        function sameTradeGroupOrder(order, entryOrder) {
            const tradeGroupId = String(entryOrder?.trade_group_id || '').trim();
            const entryUniqueId = String(entryOrder?.entry_order_unique_id || entryOrder?.unique_id || '').trim();
            return Boolean(
                (tradeGroupId && String(order?.trade_group_id || '').trim() === tradeGroupId)
                || (entryUniqueId && String(order?.entry_order_unique_id || order?.parent_order_unique_id || '').trim() === entryUniqueId)
            );
        }

        function hasFilledExitForEntry(group, entryOrder) {
            return (group.orders || []).some((order) => {
                if (order === entryOrder || order.role === 'entry') return false;
                if (String(order.status || '') !== 'Filled') return false;
                return sameTradeGroupOrder(order, entryOrder);
            });
        }

        function countEntryProtectionOrders(group, entryOrder, relationStatus = '') {
            return (group.protectionOrders || []).filter((order) => {
                if (!sameTradeGroupOrder(order, entryOrder)) return false;
                return !relationStatus || order.relation_status === relationStatus;
            }).length;
        }

        function buildSignalPnlMetric(group) {
            let realizedNet = 0;
            let realizedCount = 0;
            let missingCount = 0;
            (group.tradeGroups || []).forEach((tradeGroup) => {
                const entry = tradeGroup.primaryOrder || null;
                const exit = tradeGroup.exitOrder || null;
                if (!entry || !exit) return;
                const entryPrice = firstPositiveNumber(entry.actual_fill_price);
                const exitPrice = firstPositiveNumber(exit.actual_fill_price);
                const quantity = firstPositiveNumber(exit.actual_filled_qty, exit.filled_qty, entry.actual_filled_qty, entry.filled_qty, entry.quantity);
                const pnl = computeDirectionalPnl(tradeGroup.direction || group.direction, entryPrice, exitPrice, quantity);
                if (pnl === null) {
                    missingCount += 1;
                    return;
                }
                realizedNet += pnl - sumCommissions(tradeGroup.orders);
                realizedCount += 1;
            });
            if (realizedCount > 0) {
                const missingText = missingCount ? ` · ${missingCount} 组缺价` : '';
                return `<span class="${pnlClass(realizedNet)}">${escapeHtml(formatSignedMoney(realizedNet))}</span><br><span class="metric-subvalue">${realizedCount} 个交易组已退出${escapeHtml(missingText)}</span>`;
            }
            if (missingCount > 0) {
                return `<span class="missing-fill">P/L 缺成交价</span><br><span class="metric-subvalue">${missingCount} 个交易组缺真实成交价</span>`;
            }
            return '<span class="pnl-flat">未退出</span><br><span class="metric-subvalue">等待真实退出成交</span>';
        }

        async function loadOrderDetailsFallback(requestId) {
            const detailRecords = await fetchCollectionFullList('ibkr_order_details', {
                filter: buildOrderDetailsFallbackFilter(),

                perPage: ORDERS_FETCH_PAGE_SIZE,

            if (!detailRecords || requestId !== currentOrdersRequestId) return null;
            return buildLatestOrdersFromDetails(detailRecords);

        async function hydrateRemainingOrders(baseFilter, initialItems, requestId) {
            try {
                const remainingItems = await fetchCollectionFullList('orders', {
                    filter: baseFilter,
                    sort: '-bar_time_ms,-created',
                    perPage: ORDERS_FETCH_PAGE_SIZE,
                    startPage: 2,
                    maxPages: ORDERS_FETCH_MAX_PAGES,
                    requestId
                });
                if (!remainingItems || requestId !== currentOrdersRequestId) return;
                const enrichedItems = await enrichOrdersWithActualFills([...(initialItems || []), ...remainingItems].map(normalizeOrder), requestId);
                if (!enrichedItems || requestId !== currentOrdersRequestId) return;
                applyOrdersDataset(enrichedItems, { partial: false, requestId, source: 'orders' });
            } catch (error) {
                console.error('后台补齐订单失败:', error);
            }
        }

        async function loadOrders({ showLoadingState = true } = {}) {
            if (isLoadingOrders) return;
            isLoadingOrders = true;
            const requestId = ++currentOrdersRequestId;
            loadBrokerLiveSnapshot(requestId);

            try {
                const baseFilter = buildOrdersFilter();
                const shouldUseStagedLoad = !currentSearch && !filterSignalId && !filterTradeGroupId;

                if (showLoadingState) {
                    showLoading('加载中...');
                }

                if (shouldUseStagedLoad) {
                    const firstPageParams = {
                        filter: baseFilter,
                        sort: '-bar_time_ms,-created',
                        perPage: ORDERS_FETCH_PAGE_SIZE,
                        page: 1
                    };
                    const firstPage = typeof cachedApiFetch === 'function'
                        ? await cachedApiFetch('orders', firstPageParams, { ttlMs: 15000, ttl: 15000, force: Boolean(showLoadingState) })
                        : await apiFetch('orders', firstPageParams);
                    if (requestId !== currentOrdersRequestId) return;

                    const firstPageItems = Array.isArray(firstPage?.items) ? firstPage.items : [];
                    if (!firstPageItems.length) {
                        const fallbackRecords = await loadOrderDetailsFallback(requestId);
                        if (!fallbackRecords || requestId !== currentOrdersRequestId) return;
                        const enrichedFallbackRecords = await enrichOrdersWithActualFills(fallbackRecords, requestId);
                        if (!enrichedFallbackRecords || requestId !== currentOrdersRequestId) return;
                        applyOrdersDataset(enrichedFallbackRecords, { partial: false, requestId, source: fallbackRecords.length ? 'ibkr_order_details' : 'orders' });
                        return;
                    }
                    const hasMorePages = Number(firstPage?.totalItems || 0) > firstPageItems.length;
                    const enrichedFirstPageItems = await enrichOrdersWithActualFills(firstPageItems.map(normalizeOrder), requestId);
                    if (!enrichedFirstPageItems || requestId !== currentOrdersRequestId) return;
                    applyOrdersDataset(enrichedFirstPageItems, { partial: hasMorePages, requestId, source: 'orders' });

                    if (hasMorePages) {
                        hydrateRemainingOrders(baseFilter, firstPageItems, requestId);
                    }
                    return;
                }

                const records = await fetchCollectionFullList('orders', {
                    filter: baseFilter,
                    sort: '-bar_time_ms,-created',
                    perPage: ORDERS_FETCH_PAGE_SIZE,
                    maxPages: ORDERS_FETCH_MAX_PAGES,
                    requestId
                });
                if (!records || requestId !== currentOrdersRequestId) return;
                if (!records.length) {
                    const fallbackRecords = await loadOrderDetailsFallback(requestId);
                    if (!fallbackRecords || requestId !== currentOrdersRequestId) return;
                    const enrichedFallbackRecords = await enrichOrdersWithActualFills(fallbackRecords, requestId);
                    if (!enrichedFallbackRecords || requestId !== currentOrdersRequestId) return;
                    applyOrdersDataset(enrichedFallbackRecords, { partial: false, requestId, source: fallbackRecords.length ? 'ibkr_order_details' : 'orders' });
                    return;
                }
                const enrichedRecords = await enrichOrdersWithActualFills(records.map(normalizeOrder), requestId);
                if (!enrichedRecords || requestId !== currentOrdersRequestId) return;
                applyOrdersDataset(enrichedRecords, { partial: false, requestId, source: 'orders' });
            } catch (error) {
                console.error('加载订单失败:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-text">加载失败: ${escapeHtml(error.message || 'unknown error')}</div>
                    </div>
                `;
            } finally {
                isLoadingOrders = false;
                if (showLoadingState) {
                    hideLoading();
                }
            }
        }

        function findCloseActionGroup(uniqueId) {
            const decoded = decodeURIComponent(uniqueId || '');
            const tradeGroupMatch = allTradeGroups.find((group) => {
                const primary = group.primaryOrder || {};
                return [
                    group.trade_group_id,
                    group.group_id,
                    primary.entry_order_unique_id,
                    primary.unique_id,
                    primary.broker_order_id,
                ].some((value) => String(value || '') === decoded);
            });
            if (tradeGroupMatch) return tradeGroupMatch;
            return allGroups.find((group) => {
                return (group.entryOrders || []).some((entry) => [
                    entry.trade_group_id,
                    entry.entry_order_unique_id,
                    entry.unique_id,
                    entry.broker_order_id,
                ].some((value) => String(value || '') === decoded));
            }) || null;
        }

        function getLiveOrderClientId(order) {
            const raw = order?.raw || {};
            return String(firstDefined(order?.client_order_id, order?.cOID, order?.coid, order?.order_ref, order?.orderRef, raw.cOID, raw.coid, raw.orderRef, raw.order_ref, '')).trim();
        }

        function getLiveOrderParentId(order) {
            const raw = order?.raw || {};
            return String(firstDefined(order?.parent_id, order?.parentId, order?.parent_order_id, raw.parentId, raw.parent_id, '')).trim();
        }

        function getLiveOrderId(order) {
            const raw = order?.raw || {};
            return String(firstDefined(order?.order_id, order?.orderId, order?.id, raw.orderId, raw.order_id, raw.id, '')).trim();
        }

        function getLiveOrderRole(order) {
            const role = String(firstDefined(order?.role, order?.leg_role, '')).trim().toLowerCase();
            if (role) return role;
            const orderType = String(firstDefined(order?.order_type, order?.orderType, '')).trim().toUpperCase();
            if (getLiveOrderParentId(order) && (orderType.includes('STP') || orderType.includes('STOP'))) return 'stop_loss';
            if (getLiveOrderParentId(order) && (orderType.includes('LMT') || orderType.includes('LIMIT'))) return 'take_profit';
            return getLiveOrderParentId(order) ? 'child' : 'entry';
        }

        function buildGroupCloseAliases(group) {
            const primary = group?.primaryOrder || {};
            const seeds = [
                group?.trade_group_id,
                group?.group_id,
                primary.entry_order_unique_id,
                primary.unique_id,
            ].map((value) => String(value || '').trim()).filter(Boolean);
            const aliases = [];
            seeds.forEach((value) => {
                if (!aliases.includes(value)) aliases.push(value);
                if (value.startsWith('entry_')) {
                    const stripped = value.slice('entry_'.length);
                    if (stripped && !aliases.includes(stripped)) aliases.push(stripped);
                } else {
                    const prefixed = `entry_${value}`;
                    if (value && !aliases.includes(prefixed)) aliases.push(prefixed);
                }
            });
            return aliases;
        }

        function brokerOrderMatchesGroup(order, group) {
            const pbContext = order?.pb_context || {};
            const aliases = buildGroupCloseAliases(group);
            const values = [
                getLiveOrderClientId(order),
                order?.oca_group,
                order?.ocaGroup,
                order?.trade_group_id,
                order?.entry_order_unique_id,
                order?.parent_order_unique_id,
                order?.sibling_order_unique_id,
                pbContext.trade_group_id,
                pbContext.entry_order_unique_id,
                pbContext.parent_order_unique_id,
                pbContext.sibling_order_unique_id,
            ].map((value) => String(value || '').trim()).filter(Boolean);
            return aliases.length && values.some((value) => aliases.some((alias) => value === alias || value.endsWith(alias) || value.includes(alias)));
        }

        function isProtectionBrokerOrder(order) {
            const role = getLiveOrderRole(order);
            const clientId = getLiveOrderClientId(order).toLowerCase();
            return Boolean(
                getLiveOrderParentId(order)
                || ['take_profit', 'stop_loss', 'repair_tp', 'repair_sl', 'tp', 'sl'].includes(role)
                || clientId.startsWith('tp_')
                || clientId.startsWith('sl_')
            );
        }

        function brokerOrderCloseSideMatches(order, group) {
            const direction = String(group?.direction || group?.primaryOrder?.direction || group?.primaryOrder?.position_side || '').trim().toLowerCase();
            const expected = direction === 'long' ? 'SELL' : direction === 'short' ? 'BUY' : '';
            const side = String(firstDefined(order?.side, order?.action, order?.raw?.side, '')).trim().toUpperCase();
            return !expected || !side || side === expected;
        }

        function collectGroupProtectionOrderIds(group) {
            const ids = [];
            const symbol = String(group?.symbol || '').trim().toUpperCase();
            (group?.orders || []).forEach((order) => {
                if (order.role === 'entry') return;
                if (['Canceled', 'Closed'].includes(order.status)) return;
                const brokerId = String(order.broker_order_id || order.order_id || '').trim();
                if (brokerId && !ids.includes(brokerId)) ids.push(brokerId);
            });
            getBrokerLiveOrders().forEach((order) => {
                const orderId = getLiveOrderId(order);
                if (!orderId || ids.includes(orderId)) return;
                const orderSymbol = String(firstDefined(order?.symbol, order?.ticker, order?.raw?.ticker, '')).trim().toUpperCase();
                if (symbol && orderSymbol && orderSymbol !== symbol) return;
                if (!isProtectionBrokerOrder(order)) return;
                if (!brokerOrderCloseSideMatches(order, group)) return;
                if (brokerOrderMatchesGroup(order, group) || getLiveOrderParentId(order)) ids.push(orderId);
            });
            return ids;
        }

        async function confirmOrdersAction(options, fallbackMessage) {
            if (typeof showConfirmDialog === 'function') {
                return showConfirmDialog(options);

            return window.confirm(fallbackMessage || options.message || options.title || '确认操作？');

        async function requestPositionClose(payload) {
            const result = await readOrderActionResponse(
                await fetchWithRetry(
                    buildPageUrl('/api/custom/ibkr/positions/close', {}, { environment: currentEnvironment }),
                    {
                        method: 'POST',
                        headers: getOrderActionHeaders({ 'Content-Type': 'application/json' }),
	                        body: JSON.stringify({
	                            ...payload,
	                            ...buildModePayload({}, { brokerMode: currentEnvironment, dataEnvironment: getSharedDataEnvironment() })
	                        })
                    },
                    { attempts: 2, retryDelayMs: 400 }
                )
            );
            if (typeof invalidateIbkrDataCache === 'function') {
                invalidateIbkrDataCache(['orders', 'account', 'runtimeStatus', 'tradingList']);
            }
            return result;
        }

        function describeProtectionCancel(payload) {
            const protection = payload?.result?.protection_cancel || payload?.protection_cancel || {};
            const cancelled = Array.isArray(protection.cancelled_order_ids) ? protection.cancelled_order_ids.length : 0;
            const errors = Array.isArray(protection.errors) ? protection.errors.length : 0;
            if (errors > 0) return `保护单撤销失败 ${errors} 个`;
            if (cancelled > 0) return `已撤保护单 ${cancelled} 个`;
            return '未发现需撤保护单';
        }

        async function closePosition(uniqueId, symbol) {
            const group = findCloseActionGroup(uniqueId);
            const primary = group?.primaryOrder || {};
            const closeSymbol = String(symbol || group?.symbol || primary.symbol || '').trim().toUpperCase();
            const quantity = Math.abs(Number(primary.filled_qty || primary.quantity || 0) || 0);
            const direction = String(group?.direction || primary.position_side || primary.direction || '').trim().toLowerCase();
            const protectionOrderIds = group ? collectGroupProtectionOrderIds(group) : [];
            const confirmed = await confirmOrdersAction({
                kicker: 'Close Group',
                title: `确认对 ${closeSymbol || symbol} 发起真实市价平仓？`,
                message: '这会提交真实 IBKR 市价平仓；提交成功后撤掉匹配到的 TP / SL 括号保护单，并同步关闭本地交易组。',
                details: [
                    { label: '数量', value: quantity ? formatQty(quantity) : '-' },
                    { label: '方向', value: direction ? direction.toUpperCase() : '-' },
                    { label: '保护单', value: protectionOrderIds.length ? `${protectionOrderIds.length} 个待撤` : '未匹配到' },
                    { label: '交易组', value: group?.trade_group_id || decodeURIComponent(uniqueId || '') || '-' },
                ],
                confirmText: '市价平仓',
                tone: 'danger',
            }, `确认平仓 ${closeSymbol || symbol} 的整组订单？`);
            if (!confirmed) return;
            try {
                const result = await requestPositionClose({
                    id: decodeURIComponent(uniqueId || ''),
                    symbol: closeSymbol,
                    conid: Number(primary.conid || 0) || 0,
                    quantity,
                    position: direction === 'short' ? -quantity : quantity,
                    direction,
                    trade_group_id: group?.trade_group_id || '',
                    entry_order_unique_id: primary.entry_order_unique_id || '',
                    cancel_order_ids: protectionOrderIds,
                    cancel_bracket_after_close: true,
                    source: 'orders_page_close_group',
                });
                try {
                    await requestOrderAction('/api/custom/ibkr/orders/close_group', uniqueId, {
                        source: 'orders_page_close_group',
                        reason: '页面真实市价平仓后关闭交易组',
                    });
                } catch (syncError) {
                    console.warn('[Orders] 本地交易组状态同步失败:', syncError);
                }
                showToast(`已发送真实平仓请求，${describeProtectionCancel(result)}`);
                loadOrders({ showLoadingState: false });
            } catch (error) {
                showToast(`平仓失败: ${error.message}`);
            }
        }

        async function cancelOrder(targetId, brokerOrderId, symbol) {
            const confirmed = await confirmOrdersAction({
                kicker: 'Cancel Entry',
                title: `确认取消 ${symbol} 的主入场单？`,
                message: '该操作会同步撤销 IBKR 真实挂单与系统订单状态。',
                details: [
                    { label: 'Broker Order', value: decodeURIComponent(brokerOrderId || '') || '-' },
                    { label: '环境', value: currentEnvironment.toUpperCase() },
                ],
                confirmText: '取消主单',
                tone: 'warn',
            }, `确认取消 ${symbol} 的主入场单？`);
            if (!confirmed) return;
            try {
                await requestCancelSync(targetId, brokerOrderId);
                showToast('已同步撤销 IBKR 与系统订单');
                setTimeout(() => loadOrders({ showLoadingState: false }), 1200);
            } catch (error) {
                showToast(`取消失败: ${error.message}`);
            }
        }

        function getOrderActionHeaders(extra = {}) {
            const headers = { ...extra };
            const token = getToken();
            if (token) headers.Authorization = `Bearer ${token}`;
            return headers;
        }

        async function requestOrderAction(path, uniqueId, extraPayload = {}) {
            const result = await readOrderActionResponse(
                await fetchWithRetry(
                    buildPageUrl(path, {}, { environment: currentEnvironment }),
                    {
                        method: 'POST',
                        headers: getOrderActionHeaders({ 'Content-Type': 'application/json' }),
	                        body: JSON.stringify({
	                            ...extraPayload,
	                            id: decodeURIComponent(uniqueId),
	                            ...buildModePayload({}, { brokerMode: currentEnvironment, dataEnvironment: getSharedDataEnvironment() })
	                        })
                    },
                    { attempts: 2, retryDelayMs: 400 }
                )
            );
            if (typeof invalidateIbkrDataCache === 'function') {
                invalidateIbkrDataCache(['orders', 'account', 'signals', 'reverse', 'runtimeStatus', 'tradingList']);
            }
            return result;
        }

        async function requestCancelSync(targetId, brokerOrderId) {
            const response = await fetchWithRetry(
                buildPageUrl('/api/custom/ibkr/orders/cancel_sync', {}, { environment: currentEnvironment }),
                {
                    method: 'POST',
                    headers: getOrderActionHeaders({ 'Content-Type': 'application/json' }),
	                    body: JSON.stringify({
	                        id: decodeURIComponent(targetId || ''),
	                        order_id: decodeURIComponent(brokerOrderId || ''),
	                        broker_order_id: decodeURIComponent(brokerOrderId || ''),
	                        ...buildModePayload({}, { brokerMode: currentEnvironment, dataEnvironment: getSharedDataEnvironment() })
	                    })
                },
                { attempts: 2, retryDelayMs: 400 }
            );
            const payload = await response.json().catch(() => ({}));
            if (response.status === 401 || response.status === 403) {
                handleAuthError();
                throw new Error('Authentication failed');
            }
            if (!response.ok || payload?.ok === false) {
                throw new Error(payload?.error || payload?.message || `请求失败 (${response.status})`);
            }
            if (typeof invalidateIbkrDataCache === 'function') {
                invalidateIbkrDataCache(['orders', 'account', 'signals', 'reverse', 'runtimeStatus', 'tradingList']);
            }
            return payload;
        }

        async function readOrderActionResponse(response) {
            if (response.status === 401 || response.status === 403) {
                handleAuthError();
                throw new Error('Authentication failed');
            }
            const contentType = String(response?.headers?.get('content-type') || '').toLowerCase();
            const isJson = contentType.includes('application/json');
            const payload = isJson
                ? await response.json().catch(() => null)
                : await response.text().catch(() => '');

            if (response.ok) return payload;

            let message = '';
            if (payload && typeof payload === 'object') {
                message = payload.message || payload.error || payload.data?.message || '';
            } else if (typeof payload === 'string' && payload.trim()) {
                const text = payload.trim();
                if (text.startsWith('<')) {
                    const parsed = new DOMParser().parseFromString(text, 'text/html');
                    message = parsed.body?.textContent?.replace(/\s+/g, ' ').trim() || '';
                } else {
                    message = text;
                }
            }

            throw new Error(message || `请求失败 (${response.status})`);
        }

        function viewSignal(signalId) {
            const decoded = decodeURIComponent(signalId);
            location.href = buildPageUrl('/ibkr_signals.html', { signal_id: decoded, date: currentDate });
        }

        function normalizeChartInterval(value, fallback = '5m') {
            const text = String(value || '').trim().toLowerCase();
            const map = {
                '5': '5m',
                '5m': '5m',
                '15': '15m',
                '15m': '15m',
                '30': '30m',
                '30m': '30m',
                '60': '1h',
                '60m': '1h',
                '1h': '1h',
                '1hr': '1h',
                '240': '4h',
                '240m': '4h',
                '4h': '4h',
                '1d': '1d',
                'd': '1d',
                'day': '1d'
            };
            return map[text] || fallback;
        }

        function normalizeDateParam(value, fallback = '') {
            const text = String(value || '').trim();
            return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : fallback;
        }

        function buildGroupChartParams(group) {
            if (!group) return null;
            const anchorOrder = group.primaryOrder || group.latestEvent || group.orders?.[0] || null;
            const anchorExtra = anchorOrder?.extra || {};
            const latestExtra = group.latestEvent?.extra || {};
            const symbol = String(group.symbol || anchorOrder?.symbol || '').trim().toUpperCase();
            if (!symbol) return null;
            return {
                symbol,
                interval: normalizeChartInterval(
                    anchorOrder?.interval
                    || anchorExtra.interval
                    || anchorExtra.chart_tf
                    || latestExtra.interval
                    || latestExtra.chart_tf,
                    '5m'
                ),
                bar_time_ms: Number(anchorOrder?.bar_time_ms || group.latestEvent?.bar_time_ms || anchorExtra.bar_time_ms || latestExtra.bar_time_ms || 0) || ''
            };
        }

        function deriveLifecycleDateFromOrder(order, fallback = '') {
            const candidates = [order?.date, order?.us_time, order?.order_time, order?.fill_time, order?.created, order?.updated];
            for (const value of candidates) {
                const match = String(value || '').trim().match(/^(\d{4}-\d{2}-\d{2})/);
                if (match) return match[1];
            }
            const barTimeMs = Number(order?.bar_time_ms || order?.extra?.bar_time_ms || 0);
            if (Number.isFinite(barTimeMs) && barTimeMs > 0) return getEtDateStringFromMs(barTimeMs);
            return fallback || currentDate;
        }

        function buildOrderLifecycleFlowUrl(order = null, group = null) {
            const hasOrderContext = Boolean(order);
            const anchorOrder = order || group?.primaryOrder || group?.latestEvent || group?.orders?.[0] || null;
            const anchorExtra = anchorOrder?.extra || {};
            const latestExtra = group?.latestEvent?.extra || {};
            const params = {
                date: deriveLifecycleDateFromOrder(anchorOrder || group?.latestEvent, currentDate),
                trace: 1
            };
            const symbol = String(group?.symbol || anchorOrder?.symbol || anchorExtra.symbol || '').trim().toUpperCase();
            const interval = normalizeChartInterval(
                anchorOrder?.interval
                || anchorExtra.interval
                || anchorExtra.chart_tf
                || group?.latestEvent?.interval
                || latestExtra.interval
                || latestExtra.chart_tf,
                ''
            );
            const barTimeMs = Number(anchorOrder?.bar_time_ms || group?.latestEvent?.bar_time_ms || anchorExtra.bar_time_ms || latestExtra.bar_time_ms || 0) || 0;
            const signalId = String(anchorOrder?.signal_id || group?.signal_id || anchorExtra.signal_id || '').trim();
            const tradeGroupIds = Array.isArray(group?.tradeGroupIds) ? group.tradeGroupIds.filter(Boolean) : [];
            const tradeGroupId = String(
                hasOrderContext || !signalId || tradeGroupIds.length <= 1
                    ? (anchorOrder?.trade_group_id || group?.trade_group_id || group?.group_id || anchorExtra.trade_group_id || '')
                    : ''
            ).trim();
            const orderId = hasOrderContext
                ? String(anchorOrder?.order_id || anchorOrder?.broker_order_id || anchorExtra.order_id || anchorExtra.broker_order_id || '').trim()
                : '';

            if (symbol) params.symbol = symbol;
            if (interval) params.interval = interval;
            if (barTimeMs > 0) params.bar_time_ms = barTimeMs;
            if (signalId) params.signal_id = signalId;
            if (tradeGroupId) params.trade_group_id = tradeGroupId;
            if (orderId) params.order_id = orderId;
            if (!symbol && !signalId && !tradeGroupId && !orderId) return '';
            return buildPageUrl('/ibkr_lifecycle_flow.html', params, { environment: currentEnvironment });
        }

        function buildFilterLifecycleFlowUrl() {
            if (!filterSignalId && !filterTradeGroupId) return '';
            const params = { date: currentDate, trace: 1 };
            if (filterSignalId) params.signal_id = filterSignalId;
            if (filterTradeGroupId) params.trade_group_id = filterTradeGroupId;
            return buildPageUrl('/ibkr_lifecycle_flow.html', params, { environment: currentEnvironment });
        }

        function openTradeGroupChart(groupId) {
            const decoded = decodeURIComponent(groupId);
            const group = allGroups.find((item) => item.trade_group_id === decoded || item.group_id === decoded || (item.tradeGroupIds || []).includes(decoded))
                || allTradeGroups.find((item) => item.trade_group_id === decoded || item.group_id === decoded);
            const params = buildGroupChartParams(group);
            if (!params) {
                showToast('暂无图表上下文');
                return;
            }
            location.href = buildPageUrl('/ibkr_chart.html', params, { environment: currentEnvironment });
        }

        function viewSignalOrderDetails(signalId) {
            const decoded = decodeURIComponent(signalId);
            location.href = buildPageUrl('/ibkr_order_details.html', {
                signal_id: decoded,
                date: currentDate
            });
        }

        function viewTradeGroup(groupId, signalId = '') {
            const decoded = decodeURIComponent(groupId);
            const decodedSignalId = signalId ? decodeURIComponent(signalId) : '';
            location.href = buildPageUrl('/ibkr_order_details.html', {
                trade_group_id: decoded,
                signal_id: decodedSignalId,
                date: currentDate
            });
        }

        function manualRefresh() {
            spinPageRefreshButton('refreshBtn');
            loadOrders({ showLoadingState: false });
        }

        function changeRefreshInterval(seconds) {
            currentInterval = Number(seconds) || 0;
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            if (currentInterval > 0) {
                refreshTimer = setInterval(() => {
                    if (document.hidden) return;
                    loadOrders({ showLoadingState: false });
                }, currentInterval * 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!initAuth()) return;

            document.getElementById('ordersRefreshControl').innerHTML = renderPageRefreshControl({
                mode: 'polling',
                buttonId: 'refreshBtn',
                intervalId: 'refreshInterval',
                defaultSeconds: 30,
            });
            document.getElementById('contextBar').innerHTML = renderPageContextBar('📋 IBKR 订单', {
                subtitle: '信号聚合 / entry 订单 / 真实成交价 / bracket',
            });
            document.getElementById('nav').innerHTML = renderNav('/orders.html');
            document.getElementById('directionTabs').innerHTML = renderDirectionTabs();
            document.getElementById('datePicker').innerHTML = renderDatePicker();

            const params = new URLSearchParams(window.location.search);
            filterSignalId = params.get('signal_id') || '';
            filterTradeGroupId = params.get('trade_group_id') || '';
            currentSearch = params.get('search') || '';
            currentDate = normalizeDateParam(params.get('date'), currentDate);
            if ((filterSignalId || filterTradeGroupId) && currentSearch) {
                currentSearch = '';
            }
            reconcileSearchAndFilters();
            pendingLegacySearchResolution = Boolean(currentSearch) && !filterSignalId && !filterTradeGroupId;

            document.getElementById('searchInput').value = currentSearch;
            const dateInput = document.getElementById('customDate');
            if (dateInput) dateInput.value = currentDate;
            syncOrdersPageUrl();
            renderOrdersPageChrome();

            await loadSignalValidityConfig();
            await withPageLoading(
                () => loadOrders(),
                {
                    title: '订单页加载中',
                    copy: '正在同步订单分组、执行状态、方向统计和关联查询结果。',
                }
            );
            changeRefreshInterval(30);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && currentInterval > 0) {
                    loadOrders({ showLoadingState: false });
                }
            });
            setInterval(updateCountdowns, 1000);
        });

        window.onEnvironmentChange = function(environment) {
            currentEnvironment = environment;
            location.href = buildOrdersPageUrl();
        };
    </script>
</body>
