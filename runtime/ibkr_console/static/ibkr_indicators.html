<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>技术指标</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <script>document.write('<style>' + getIndicatorModalStyles() + '</style>');</script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="/assets/css/ibkr-page-common.css">
    <link rel="stylesheet" href="/assets/css/pages/ibkr_indicators/page.css">
</head>
<body>
    <div id="contextBar"></div>
    <div id="pageBridge"></div>

    <div class="content">
        <div class="search-row">
            <div class="search-toolbar">
                <div id="datePicker"></div>
                <select class="interval-filter" id="intervalFilter" onchange="onIntervalChange()">
                    <option value="">全部</option>
                    <option value="5">5m</option>
                    <option value="15">15m</option>
                    <option value="30">30m</option>
                    <option value="60">1H</option>
                    <option value="240">4H</option>
                    <option value="D">D</option>
                </select>
                <div id="indicatorsRefreshControl"></div>
            </div>
            <input type="text" class="search-input" id="searchBox" placeholder="🔍 搜索标的 / 交易所 / 脚本 / PB记录ID..." oninput="onSearchChange(this.value)">
        </div>
        <div id="filterNote"></div>
        <div class="indicator-view-toolbar">
            <div class="view-toggle-group" id="indicatorViewToggle"></div>
            <div class="sort-group">
                <label class="sort-label" for="sortSelector">排序</label>
                <select id="sortSelector" class="sort-select" onchange="onIndicatorSortChange(this.value)">
                    <option value="latest">最新时间</option>
                    <option value="signal_first">有信号优先</option>
                    <option value="crsi_extreme">CRSI 极值</option>
                    <option value="vwap_dist">VWAP 偏离最大</option>
                    <option value="atr_pct">ATR% 最大</option>
                </select>
            </div>
        </div>

        <div id="indicatorsContainer"><div class="loading">加载中...</div></div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreIndicators()" style="display: none;">加载更多</button>
    </div>

    <!-- 技术指标详情浮层（由 common.js 动态注入） -->
    <div id="indicatorModalContainer"></div>
    <div id="indicatorChartModalContainer"></div>

    <!-- Bottom Nav -->
    <div id="navContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const INDICATOR_PAGE_PREFS_KEY = 'ibkr_indicator_page_prefs_v1';
        const PB_URL = BASE_URL;
        let allIndicators = [];
        let currentDate = getCurrentEtDateString();
        let rangeStartDate = null;
        let rangeEndDate = null;
        let currentSearch = '';
        let refreshTimer = null;
        let currentInterval = 30;
        let currentPage = 1;
        const itemsPerPage = 10;
        let hasMore = false;
        let totalItems = 0;
        let currentEnvironment = getCurrentRuntimeEnvironment();
        let currentIndicatorViewMode = 'cards';
        let currentIndicatorSortKey = 'latest';
        let indicatorEvolutionCache = new Map();
        let indicatorChartInstance = null;
        let indicatorChartLastPayload = null;
        let currentIndicatorChartContext = null;
        let currentIndicatorChartRangeKey = '1d';
        let indicatorChartLoadToken = 0;
        let indicatorChartCategories = [];
        let indicatorChartDomCleanup = null;
        let indicatorChartSelectedBarIndex = -1;
        let indicatorChartSelectedSignalId = '';
        let indicatorChartHoverBarIndex = -1;
        let indicatorChartLayerState = {
            ema: true,
            vwap: true,
            signals: true,
            volume: true,
        };
        let indicatorChartStoredOverlayEnabled = false;
        const INDICATOR_CHART_RANGE_PRESETS = [
            { key: '1d', shortLabel: '1D', longLabel: '最近1天', durationMs: 24 * 60 * 60 * 1000 },
            { key: '3d', shortLabel: '3D', longLabel: '最近3天', durationMs: 3 * 24 * 60 * 60 * 1000 },
            { key: '1w', shortLabel: '1W', longLabel: '最近1周', durationMs: 7 * 24 * 60 * 60 * 1000 },
            { key: '1m', shortLabel: '1M', longLabel: '最近1月', durationMs: 31 * 24 * 60 * 60 * 1000 },
            { key: 'all', shortLabel: 'ALL', longLabel: '全部历史', durationMs: 0 },
        ];

        function renderFilterNote() {
            const notes = [`env=${getEnvironmentLabel(currentEnvironment)}`];
            if (currentSearch) notes.push(`search=${currentSearch}`);
            const intervalFilter = document.getElementById('intervalFilter')?.value || '';
            if (intervalFilter) notes.push(`interval=${intervalFilter}`);
            document.getElementById('filterNote').innerHTML = `<div class="filter-note">当前过滤: ${escapeHtml(notes.join(' · '))}</div>`;
        }

        function getCurrentEtDateString() {
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/New_York',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(new Date());
        }

        function getIndicatorDefaultViewMode() {
            return Number(window.innerWidth || 0) > 960 ? 'table' : 'cards';
        }

        function loadIndicatorPagePrefs() {
            try {
                const raw = localStorage.getItem(INDICATOR_PAGE_PREFS_KEY);
                if (!raw) {
                    currentIndicatorViewMode = getIndicatorDefaultViewMode();
                    return;
                }
                const prefs = JSON.parse(raw);
                currentIndicatorViewMode = ['cards', 'table'].includes(String(prefs?.viewMode || ''))
                    ? String(prefs.viewMode)
                    : getIndicatorDefaultViewMode();
                currentIndicatorSortKey = ['latest', 'signal_first', 'crsi_extreme', 'vwap_dist', 'atr_pct'].includes(String(prefs?.sortKey || ''))
                    ? String(prefs.sortKey)
                    : 'latest';
            } catch (_) {
                currentIndicatorViewMode = getIndicatorDefaultViewMode();
                currentIndicatorSortKey = 'latest';
            }
        }

        function saveIndicatorPagePrefs() {
            try {
                localStorage.setItem(INDICATOR_PAGE_PREFS_KEY, JSON.stringify({
                    viewMode: currentIndicatorViewMode,
                    sortKey: currentIndicatorSortKey,
                }));
            } catch (_) {}
        }

        function normalizeDateParam(value, fallback = '') {
            const text = String(value || '').trim();
            return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : fallback;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeFilterValue(value) {
            return String(value ?? '').replace(/\\/g, '\\\\').replace(/"/g, '\\"');
        }

        function quoteFilterValue(value) {
            return `'${String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'")}'`;
        }

        function getIndicatorAuthHeaders(extra = {}) {
            const headers = { ...extra };
            const token = getToken();
            if (token) headers.Authorization = `Bearer ${token}`;
            return headers;
        }

        async function requestIndicatorJson(path, { method = 'GET', body = null } = {}, maxRetries = 1) {
            let lastError = null;
            for (let attempt = 0; attempt <= maxRetries; attempt += 1) {
                try {
                    const options = {
                        method,
                        headers: getIndicatorAuthHeaders(body ? { 'Content-Type': 'application/json' } : {})
                    };
                    if (body) options.body = JSON.stringify(body);
                    const response = await fetch(buildPageUrl(path, {}, { environment: currentEnvironment }), options);
                    if (response.status === 401 || response.status === 403) {
                        clearToken();
                        location.href = `/login.html?from=${encodeURIComponent(`${location.pathname}${location.search}`)}`;
                        throw new Error('Authentication failed');
                    }
                    const text = await response.text();
                    let data = {};
                    try {
                        data = text ? JSON.parse(text) : {};
                    } catch (_) {
                        data = { ok: false, raw: text };
                    }
                    if (!response.ok || data.ok === false) {
                        throw new Error(data.error || data.message || `Request failed (${response.status})`);
                    }
                    return data;
                } catch (error) {
                    lastError = error;
                    const message = String(error?.message || error || '');
                    const retryable = message.includes('502') || message.includes('Failed to fetch');
                    if (!retryable || attempt === maxRetries) break;
                    await new Promise((resolve) => setTimeout(resolve, 250 * (attempt + 1)));
                }
            }
            throw lastError || new Error(`Failed to request ${path}`);
        }

        function formatNumber(value, digits = 2) {
            const num = Number(value);
            return Number.isFinite(num) ? num.toFixed(digits) : '-';
        }

        function formatPrice(value) {
            const num = Number(value);
            return Number.isFinite(num) ? `$${num.toFixed(2)}` : '-';
        }

        function formatPercent(value) {
            const num = Number(value);
            return Number.isFinite(num) ? `${num.toFixed(2)}%` : '-';
        }

        function formatVolume(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num.toLocaleString() : '-';
        }

        function formatCreatedText(value) {
            const text = String(value || '').trim();
            if (!text) return '-';
            const parsed = new Date(text);
            if (!Number.isNaN(parsed.getTime())) {
                return parsed.toLocaleString('zh-CN', {
                    timeZone: 'Asia/Shanghai',
                    hour12: false,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                }).replace(/\//g, '-');
            }
            return text.replace('T', ' ').replace('Z', '');
        }

        function formatSignedPercent(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '-';
            return `${num > 0 ? '+' : ''}${num.toFixed(2)}%`;
        }

        function getSignedColor(value) {
            const num = Number(value);
            if (!Number.isFinite(num) || num === 0) return 'var(--text)';
            return num > 0 ? 'var(--long)' : 'var(--short)';
        }

        function getIntervalLabel(interval) {
            const intervalMap = { '5': '5m', '15': '15m', '30': '30m', '60': '1H', '240': '4H', 'D': '日' };
            return intervalMap[interval] || interval || '';
        }

        function getTrendText(value) {
            const num = Number(value);
            if (num === 1) return '📈 多头';
            if (num === -1) return '📉 空头';
            return '➡️ 中性';
        }

        function getAtrSummary(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '-';
            if (num >= 3) return `${num.toFixed(2)}% ⚡高`;
            if (num >= 1.5) return `${num.toFixed(2)}% 〜中`;
            return `${num.toFixed(2)}% ·低`;
        }

        function getDateRange() {
            if (rangeStartDate && rangeEndDate) {
                return { startDate: rangeStartDate, endDate: rangeEndDate };
            }
            return { startDate: currentDate, endDate: currentDate };
        }

        function shiftIsoDate(dateText, days = 0) {
            const baseDate = new Date(`${dateText}T00:00:00Z`);
            if (Number.isNaN(baseDate.getTime())) return dateText;
            baseDate.setUTCDate(baseDate.getUTCDate() + Number(days || 0));
            return baseDate.toISOString().slice(0, 10);
        }

        function getTimeZoneOffsetMinutes(timeZone, date) {
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone,
                hour12: false,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
            });
            const parts = formatter.formatToParts(date).reduce((acc, part) => {
                if (part.type !== 'literal') acc[part.type] = part.value;
                return acc;
            }, {});
            const asUtcMs = Date.UTC(
                Number(parts.year || 0),
                Math.max(0, Number(parts.month || 1) - 1),
                Number(parts.day || 1),
                Number(parts.hour || 0),
                Number(parts.minute || 0),
                Number(parts.second || 0)
            );
            return Math.round((asUtcMs - date.getTime()) / 60000);
        }

        function getEtDayStartMs(dateText) {
            const safeDateText = normalizeDateParam(dateText, '');
            if (!safeDateText) return 0;
            const [year, month, day] = safeDateText.split('-').map((part) => Number(part || 0));
            if (!year || !month || !day) return 0;
            const probeDate = new Date(Date.UTC(year, month - 1, day, 12, 0, 0));
            const offsetMinutes = getTimeZoneOffsetMinutes('America/New_York', probeDate);
            return Date.UTC(year, month - 1, day, 0, 0, 0) - (offsetMinutes * 60000);
        }

        function getIndicatorTimeRange() {
            const { startDate, endDate } = getDateRange();
            const safeStartDate = normalizeDateParam(startDate, currentDate) || currentDate;
            const safeEndDate = normalizeDateParam(endDate, safeStartDate) || safeStartDate;
            return {
                startDate: safeStartDate,
                endDate: safeEndDate,
                startMs: getEtDayStartMs(safeStartDate),
                endMs: getEtDayStartMs(shiftIsoDate(safeEndDate, 1)),
            };
        }

        function syncDatePickerUI(selectedDate) {
            const input = document.getElementById('customDate');
            if (input) input.value = selectedDate;
            document.querySelectorAll('.date-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.date === selectedDate && !rangeStartDate && !rangeEndDate);
            });
        }

        function buildIndicatorFilter() {
            const { startMs, endMs } = getIndicatorTimeRange();
            const conditions = [`environment = ${quoteFilterValue(currentEnvironment)}`];
            if (startMs > 0) conditions.push(`bar_time_ms >= ${startMs}`);
            if (endMs > 0) conditions.push(`bar_time_ms < ${endMs}`);

            const intervalFilter = document.getElementById('intervalFilter')?.value || '';
            if (intervalFilter) {
                conditions.push(`interval = ${quoteFilterValue(intervalFilter)}`);
            }

            if (currentSearch) {
                const rawTerm = String(currentSearch || '').trim();
                const upperTerm = escapeFilterValue(rawTerm.toUpperCase());
                const exactTerm = escapeFilterValue(rawTerm);
                const idTerm = escapeFilterValue(rawTerm.toLowerCase());
                const searchConditions = [];
                if (upperTerm) {
                    searchConditions.push(`symbol ~ ${quoteFilterValue(upperTerm)}`);
                    searchConditions.push(`exchange ~ ${quoteFilterValue(upperTerm)}`);
                    searchConditions.push(`script_tag ~ ${quoteFilterValue(upperTerm)}`);
                }
                if (exactTerm && exactTerm !== upperTerm) {
                    searchConditions.push(`script_tag ~ ${quoteFilterValue(exactTerm)}`);
                }
                if (idTerm) {
                    searchConditions.push(`id ~ ${quoteFilterValue(idTerm)}`);
                }
                if (searchConditions.length) {
                    conditions.push(`(${searchConditions.join(' || ')})`);
                }
            }

            return conditions.join(' && ');
        }

        async function fetchIndicatorsPage(page) {
            return apiFetch('ibkr_indicators', {
                filter: buildIndicatorFilter(),
                sort: '-bar_time_ms,-created',
                perPage: itemsPerPage,
                page,
            });
        }

        function refreshRealtimeQuotesForIndicators() {
            if (!allIndicators.length) return;
            void fetchRealtimeQuotes(allIndicators.map((item) => item.symbol), { reset: true })
                .then(() => {
                    renderIndicators();
                })
                .catch((error) => {
                    console.warn('加载实时行情失败:', error);
                });
        }

        window.onDateChange = function(startDate) {
            currentDate = startDate;
            rangeStartDate = null;
            rangeEndDate = null;
            const rangeStartEl = document.getElementById('rangeStartDate');
            const rangeEndEl = document.getElementById('rangeEndDate');
            if (rangeStartEl) rangeStartEl.value = '';
            if (rangeEndEl) rangeEndEl.value = '';
            syncDatePickerUI(startDate);
            loadIndicators();
        };

        function applyDateRange() {
            const startInput = document.getElementById('rangeStartDate').value;
            const endInput = document.getElementById('rangeEndDate').value;

            if (!startInput || !endInput) {
                showToast('请选择开始日期和结束日期');
                return;
            }

            if (new Date(startInput) > new Date(endInput)) {
                showToast('开始日期不能晚于结束日期');
                return;
            }

            document.querySelectorAll('.date-btn').forEach((b) => b.classList.remove('active'));
            rangeStartDate = startInput;
            rangeEndDate = endInput;
            loadIndicators();
        }

        async function loadIndicators() {
            try {
                document.getElementById('indicatorsContainer').innerHTML = '<div class="loading">加载中...</div>';
                currentPage = 1;

                const data = await fetchIndicatorsPage(1);
                if (!data) return;

                allIndicators = (data.items || []).map((item) => normalizeIndicatorRecord(item)).filter(Boolean);
                sortIndicatorsInPlace(allIndicators);
                totalItems = data.totalItems || allIndicators.length;
                hasMore = allIndicators.length < totalItems;

                renderFilterNote();
                renderIndicatorViewToolbar();
                renderIndicators();
                updateLoadMoreButton();
                refreshRealtimeQuotesForIndicators();
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('indicatorsContainer').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">加载失败: ${escapeHtml(error.message)}</div></div>`;
            }
        }

        function onIntervalChange() {
            renderFilterNote();
            loadIndicators();
        }

        function updateLoadMoreButton() {
            const btn = document.getElementById('loadMoreBtn');
            const loaded = allIndicators.length;
            btn.style.display = loaded > 0 && hasMore ? 'block' : 'none';
            btn.textContent = hasMore ? `加载更多 (${loaded}/${totalItems})` : `已加载全部 (${loaded}/${totalItems || loaded})`;
            btn.disabled = !hasMore;
        }

        async function loadMoreIndicators() {
            if (!hasMore) return;
            try {
                const nextPage = currentPage + 1;
                const data = await fetchIndicatorsPage(nextPage);
                if (!data) return;

                currentPage = nextPage;
                const appended = (data.items || []).map((item) => normalizeIndicatorRecord(item)).filter(Boolean);
                allIndicators = [...allIndicators, ...appended];
                sortIndicatorsInPlace(allIndicators);
                totalItems = data.totalItems || totalItems;
                hasMore = allIndicators.length < totalItems;

                renderIndicatorViewToolbar();
                renderIndicators();
                updateLoadMoreButton();
                refreshRealtimeQuotesForIndicators();
            } catch (error) {
                console.error('加载更多失败:', error);
            }
        }

        let searchDebounceTimer = null;

        function onSearchChange(val) {
            currentSearch = val.trim();
            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                document.getElementById('indicatorsContainer').innerHTML = '<div class="loading">搜索中...</div>';
                renderFilterNote();
                loadIndicators();
            }, 300);
        }

        function deriveIndicatorFocusTokens(indicator) {
            const tokens = [];
            const vwapDist = Math.abs(Number(indicator?.vwap_dist || 0));
            const atrPct = Number(indicator?.atr_pct || 0);
            if (indicator?.ema_bullish) tokens.push({ text: '顺势结构', className: 'long' });
            else if (indicator?.ema_bearish) tokens.push({ text: '逆势结构', className: 'short' });
            if (Number(indicator?.sd_zone || 0) !== 0 || vwapDist >= 1) tokens.push({ text: '回归边缘', className: 'warn' });
            if (atrPct >= 3) tokens.push({ text: '高波动', className: 'warn' });
            if (indicator?.crsi_bull_div || indicator?.crsi_bear_div || indicator?.obv_bull_div || indicator?.obv_bear_div) {
                tokens.push({ text: '背离观察', className: 'accent' });
            }
            if (indicator?.ema_bull_touch || indicator?.ema_bear_touch) tokens.push({ text: 'EMA 触及', className: 'accent' });
            if (indicator?.fractal_bull || indicator?.fractal_bear) tokens.push({ text: '分形触发', className: 'accent' });
            return tokens;
        }

        function sortIndicatorsInPlace(items) {
            const list = Array.isArray(items) ? items : [];
            const sorter = {
                latest: (a, b) => Number(b.bar_time_ms || 0) - Number(a.bar_time_ms || 0),
                signal_first: (a, b) => {
                    const aSignal = Number(Boolean(a.signal || a.signal_type || a.signal_label));
                    const bSignal = Number(Boolean(b.signal || b.signal_type || b.signal_label));
                    if (bSignal !== aSignal) return bSignal - aSignal;
                    return Number(b.bar_time_ms || 0) - Number(a.bar_time_ms || 0);
                },
                crsi_extreme: (a, b) => Math.abs(50 - Number(b.crsi || 50)) - Math.abs(50 - Number(a.crsi || 50)),
                vwap_dist: (a, b) => Math.abs(Number(b.vwap_dist || 0)) - Math.abs(Number(a.vwap_dist || 0)),
                atr_pct: (a, b) => Number(b.atr_pct || 0) - Number(a.atr_pct || 0),
            }[currentIndicatorSortKey] || ((a, b) => Number(b.bar_time_ms || 0) - Number(a.bar_time_ms || 0));
            list.sort(sorter);
            return list;
        }

        function renderIndicatorViewToolbar() {
            const viewToggle = document.getElementById('indicatorViewToggle');
            const sortSelector = document.getElementById('sortSelector');
            if (viewToggle) {
                viewToggle.innerHTML = ['cards', 'table'].map((mode) => `
                    <button class="view-toggle-btn ${currentIndicatorViewMode === mode ? 'active' : ''}" type="button" onclick="setIndicatorViewMode('${mode}')">${mode === 'cards' ? '卡片' : '密集表'}</button>
                `).join('');
            }
            if (sortSelector) sortSelector.value = currentIndicatorSortKey;
        }

        window.setIndicatorViewMode = function(mode) {
            const safeMode = mode === 'table' ? 'table' : 'cards';
            currentIndicatorViewMode = safeMode;
            saveIndicatorPagePrefs();
            renderIndicatorViewToolbar();
            renderIndicators();
        };

        window.onIndicatorSortChange = function(value) {
            currentIndicatorSortKey = ['latest', 'signal_first', 'crsi_extreme', 'vwap_dist', 'atr_pct'].includes(String(value || ''))
                ? String(value)
                : 'latest';
            saveIndicatorPagePrefs();
            sortIndicatorsInPlace(allIndicators);
            renderIndicatorViewToolbar();
            renderIndicators();
        };

        function getIndicatorEvolutionCacheKey(indicator) {
            return `${String(indicator?.symbol || '').trim().toUpperCase()}::${normalizeChartInterval(indicator?.interval || '5m')}::${Number(indicator?.bar_time_ms || 0)}`;
        }

        function buildIndicatorEvolutionHtml(payload) {
            const bars = Array.isArray(payload?.bars) ? payload.bars.slice(-8) : [];
            const indicators = Array.isArray(payload?.indicators) ? payload.indicators : [];
            const traceTimeline = Array.isArray(payload?.traceTimeline) ? payload.traceTimeline : [];
            const indicatorMap = new Map(indicators.map((item) => [Number(item?.bar_time_ms || 0), item]));
            const traceMap = new Map(traceTimeline.map((item) => [Number(item?.bar_time_ms || 0), item]));
            if (!bars.length) {
                return '<div class="indicator-evolution-empty">暂无最近序列</div>';
            }
            return bars.map((bar) => {
                const indicator = indicatorMap.get(Number(bar.bar_time_ms || 0)) || {};
                const trace = traceMap.get(Number(bar.bar_time_ms || 0)) || {};
                const stage = String(trace?.signal_state?.stage || '').trim().toLowerCase();
                const stageClass = stage === 'confirmed' ? 'long' : stage === 'blocked' ? 'short' : stage === 'candidate' ? 'warn' : '';
                return `
                    <div class="evolution-pill ${stageClass}">
                        <div class="evolution-time">${escapeHtml(String(bar.us_time || '--').slice(11, 16))}</div>
                        <div class="evolution-close">${escapeHtml(formatPrice(bar.close))}</div>
                        <div class="evolution-meta">VWAP ${escapeHtml(formatPercent(indicator?.vwap_dist))}</div>
                        <div class="evolution-meta">CRSI ${escapeHtml(formatNumber(indicator?.crsi))}</div>
                        <div class="evolution-meta">${escapeHtml(String(trace?.signal_state?.label || '无信号'))}</div>
                    </div>

            const container = document.getElementById(`indicatorEvolution-${indicatorId}`);

            const expanded = container.dataset.open === '1';

            container.dataset.open = '1';
            container.innerHTML = '<div class="indicator-evolution-empty">正在加载最近 8 根演化...</div>';
            const cacheKey = getIndicatorEvolutionCacheKey(indicator);
            let payload = indicatorEvolutionCache.get(cacheKey);
            if (!payload) {
                try {
                    payload = await requestIndicatorTimeline({
                        symbol: indicator.symbol,
                        interval: indicator.interval,
                        startMs: buildTimelineRangeStart(indicator.bar_time_ms, indicator.interval, 16),
                        endMs: Number(indicator.bar_time_ms || 0),

        function formatChartLabel(item) {
            if (item?.us_time) return String(item.us_time).slice(5, 16);
            const ms = Number(item?.bar_time_ms || 0);
            if (!ms) return '--';
            const date = new Date(ms);
            if (Number.isNaN(date.getTime())) return '--';
            return `${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')} ${String(date.getUTCHours()).padStart(2, '0')}:${String(date.getUTCMinutes()).padStart(2, '0')}`;
        }

        function normalizeChartInterval(interval) {
            const text = String(interval || '').trim().toLowerCase();
            const map = {
                '5': '5m',
                '5m': '5m',
                '15': '15m',
                '15m': '15m',
                '30': '30m',
                '30m': '30m',
                '60': '1h',
                '60m': '1h',
                '1h': '1h',
                '1hr': '1h',
                '240': '4h',
                '240m': '4h',
                '4h': '4h',
                'd': '1d',
                'day': '1d',
                '1d': '1d',
            };
            return map[text] || text;
        }

        function intervalToMs(interval) {
            const normalized = normalizeChartInterval(interval || '5m');
            const map = {
                '5m': 5 * 60 * 1000,
                '15m': 15 * 60 * 1000,
                '30m': 30 * 60 * 1000,
                '1h': 60 * 60 * 1000,
                '4h': 4 * 60 * 60 * 1000,
                '1d': 24 * 60 * 60 * 1000,
            };
            return map[normalized] || 5 * 60 * 1000;
        }

        function buildTimelineRangeStart(barTimeMs, interval, bars = 16) {
            const duration = intervalToMs(interval) * Math.max(2, Number(bars || 16));
            return Math.max(0, Number(barTimeMs || 0) - duration);
        }

        function getDefaultIndicatorChartRangeKey(interval) {
            const normalized = normalizeChartInterval(interval || '5m');
            const defaults = {
                '5m': '1d',
                '15m': '3d',
                '30m': '1w',
                '1h': '1m',
                '4h': '1m',
                '1d': '1m',
            };
            return defaults[normalized] || '1d';
        }

        function normalizeIndicatorChartRangeKey(value, interval) {
            const key = String(value || '').trim().toLowerCase();
            const exists = INDICATOR_CHART_RANGE_PRESETS.some((item) => item.key === key);
            return exists ? key : getDefaultIndicatorChartRangeKey(interval);
        }

        function getIndicatorChartRangePreset(rangeKey, interval) {
            const normalizedKey = normalizeIndicatorChartRangeKey(rangeKey, interval);
            return INDICATOR_CHART_RANGE_PRESETS.find((item) => item.key === normalizedKey) || INDICATOR_CHART_RANGE_PRESETS[0];
        }

        function getIndicatorChartRangeLabel(rangeKey, interval) {
            return getIndicatorChartRangePreset(rangeKey, interval)?.longLabel || '最近1天';
        }

        function getIndicatorChartRangeStartMs(endMs, rangeKey, interval) {
            const durationMs = Number(getIndicatorChartRangePreset(rangeKey, interval)?.durationMs || 0);
            return durationMs > 0 && endMs > 0 ? Math.max(0, endMs - durationMs) : 0;
        }

        function isIndicatorDesktopFinePointer() {
            return typeof window.matchMedia === 'function'
                && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        }

        function getIndicatorChartRangePerPage(interval, rangeKey) {
            if (normalizeIndicatorChartRangeKey(rangeKey, interval) === 'all') return 3000;
            const barsPerDay = {
                '5m': 78,
                '15m': 26,
                '30m': 13,
                '1h': 7,
                '4h': 2,
                '1d': 1,
            };
            const tradingDays = {
                '1d': 1,
                '3d': 3,
                '1w': 5,
                '1m': 22,
            };
            const normalizedInterval = normalizeChartInterval(interval || '5m');
            const normalizedRange = normalizeIndicatorChartRangeKey(rangeKey, normalizedInterval);
            const estimate = (barsPerDay[normalizedInterval] || 80) * (tradingDays[normalizedRange] || 1);
            return Math.max(80, Math.min(estimate + 24, 2500));
        }

        function buildChartIntervalAliases(interval) {
            const normalized = normalizeChartInterval(interval || '5m');
            const map = {
                '5m': ['5m', '5'],
                '15m': ['15m', '15'],
                '30m': ['30m', '30'],
                '1h': ['1h', '60', '60m', '1hr'],
                '4h': ['4h', '240', '240m'],
                '1d': ['1d', 'd', 'day'],
            };
            return map[normalized] || [normalized];
        }

        function buildChartIntervalFilterExpression(interval, fields = ['interval']) {
            const conditions = [];
            buildChartIntervalAliases(interval).forEach((alias) => {
                fields.forEach((field) => {
                    conditions.push(`${field} = ${quoteFilterValue(alias)}`);
                });
            });
            return `(${conditions.join(' || ')})`;
        }

        function buildIndicatorHistoryFilter({ environment, symbol = '', interval, endMs = 0, startMs = 0 }) {
            const parts = [
                `environment = ${quoteFilterValue(environment)}`,
                `symbol = ${quoteFilterValue(symbol)}`,
                buildChartIntervalFilterExpression(interval, ['interval'])
            ];
            if (startMs > 0) parts.push(`bar_time_ms >= ${startMs}`);
            if (endMs > 0) parts.push(`bar_time_ms <= ${endMs}`);
            return parts.join(' && ');
        }

        async function requestIndicatorTimeline({ symbol, interval, startMs, endMs }) {
            const response = await requestIndicatorJson('/api/custom/ibkr/proxy', {
                method: 'POST',
                body: {
                    action: 'chart/timeline',
                    environment: currentEnvironment,
                    symbol,
                    interval: normalizeChartInterval(interval || '5m'),
                    start_ms: Math.max(0, Number(startMs || 0)),
                    end_ms: Math.max(0, Number(endMs || 0)),
                    include_signals: normalizeChartInterval(interval || '5m') === '5m',
                    include_trace: true,
                }
            }, 2);
            const bars = Array.isArray(response?.bars) ? response.bars.slice().sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0)) : [];
            const indicators = Array.isArray(response?.indicator_timeline)
                ? response.indicator_timeline.map((item) => normalizeIndicatorHistoryRecord(item)).sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0))
                : [];
            const signals = Array.isArray(response?.signals) ? response.signals.slice().sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0)) : [];
            const traceTimeline = Array.isArray(response?.trace_timeline) ? response.trace_timeline.slice().sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0)) : [];
            return {
                bars,
                indicators,
                signals,
                traceTimeline,
                latestIndicator: normalizeIndicatorHistoryRecord(response?.latest_indicator || null) || indicators[indicators.length - 1] || null,
            };
        }

        function toChartValue(value) {
            if (value === null || value === undefined || value === '') return null;
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

        function parseIndicatorExtra(extra) {
            if (!extra) return {};
            if (typeof extra === 'object') return extra;
            if (typeof extra === 'string') {
                try {
                    const parsed = JSON.parse(extra);
                    return parsed && typeof parsed === 'object' ? parsed : {};
                } catch (_) {
                    return {};
                }
            }
            return {};
        }

        function normalizeIndicatorHistoryRecord(record) {
            if (!record || typeof record !== 'object') return record;
            const extra = parseIndicatorExtra(record.extra);
            const normalized = { ...record };
            Object.entries(extra).forEach(([key, value]) => {
                if (normalized[key] === undefined || normalized[key] === null || normalized[key] === '') {
                    normalized[key] = value;
                }
            });
            normalized._extra = extra;
            return normalized;
        }

        function buildSignalScatter(signals, bars, priceResolver, color) {
            const indexByMs = new Map(bars.map((bar, index) => [Number(bar.bar_time_ms || 0), index]));
            return signals.map((signal) => {
                const barMs = Number(signal.bar_time_ms || 0);
                const xIndex = indexByMs.get(barMs);
                if (xIndex === undefined) return null;
                const yValue = Number(priceResolver(signal) || 0);
                if (!Number.isFinite(yValue) || yValue <= 0) return null;
                return {
                    value: [xIndex, yValue],
                    itemStyle: { color },
                    name: signal.signal || signal.direction || '',
                    signal_id: signal.signal_id || '',
                };
            }).filter(Boolean);
        }

        function renderIndicatorChartRangeGroup(interval) {
            const container = document.getElementById('indicatorChartRangeGroup');
            if (!container) return;
            container.innerHTML = INDICATOR_CHART_RANGE_PRESETS.map((preset) => `
                <button
                    class="chart-range-btn ${preset.key === currentIndicatorChartRangeKey ? 'active' : ''}"
                    type="button"
                    onclick="selectIndicatorChartRange('${preset.key}')"
                >${escapeHtml(preset.shortLabel)}</button>
            `).join('');
        }

        function renderIndicatorChartLayerGroup(interval) {
            const container = document.getElementById('indicatorChartLayerGroup');
            if (!container) return;
            const normalizedInterval = normalizeChartInterval(interval || '5m');
            const defs = [
                { key: 'ema', label: 'EMA 组' },
                { key: 'vwap', label: 'VWAP' },
                { key: 'signals', label: normalizedInterval === '5m' ? 'Signals' : 'Signals · 5m' },
                { key: 'volume', label: 'Volume' },
            ];
            container.innerHTML = defs.map((item) => `
                <button
                    class="chart-layer-btn ${indicatorChartLayerState[item.key] ? 'active' : ''}"
                    type="button"
                    onclick="toggleIndicatorChartLayer('${item.key}')"
                >${escapeHtml(item.label)}</button>
            `).join('');
        }

        function renderIndicatorChartCompareGroup() {
            const container = document.getElementById('indicatorChartCompareGroup');
            if (!container) return;
            container.innerHTML = `
                <button
                    class="chart-compare-btn ${indicatorChartStoredOverlayEnabled ? 'active' : ''}"
                    type="button"
                    onclick="toggleIndicatorChartStoredOverlay()"
                >${indicatorChartStoredOverlayEnabled ? '存档对照 On' : '存档对照 Off'}</button>
            `;
        }

        function buildIndicatorArchiveMaps(archive = {}) {
            const bars = Array.isArray(archive?.bars) ? archive.bars : [];
            const indicators = Array.isArray(archive?.indicators) ? archive.indicators : [];
            const signals = Array.isArray(archive?.signals) ? archive.signals : [];
            return {
                barByMs: new Map(bars.map((item) => [Number(item?.bar_time_ms || 0), item])),
                indicatorByMs: new Map(indicators.map((item) => [Number(item?.bar_time_ms || 0), item])),
                signalByMs: new Map(signals.map((item) => [Number(item?.bar_time_ms || 0), item])),
            };
        }

        function compareIndicatorArchiveStatus(payload, barTimeMs) {
            const maps = payload?.archiveMaps || buildIndicatorArchiveMaps(payload?.archive || {});
            const computedIndicator = Array.isArray(payload?.indicators)
                ? payload.indicators.find((item) => Number(item?.bar_time_ms || 0) === Number(barTimeMs || 0))
                : null;
            const storedIndicator = maps.indicatorByMs.get(Number(barTimeMs || 0)) || null;
            if (!computedIndicator && !storedIndicator) {
                return { status: 'no_data', label: '无数据' };
            }
            if (!storedIndicator) {
                return { status: 'stored_only', label: '无存档' };
            }
            if (!computedIndicator) {
                return { status: 'computed_only', label: '仅存档' };
            }
            const compareFields = ['trend_dir', 'ema_bullish', 'ema_bearish', 'ema_bull_touch', 'ema_bear_touch', 'sd_zone', 'dtp_phase', 'fractal_bull', 'fractal_bear'];
            const mismatch = compareFields.some((field) => String(computedIndicator?.[field] ?? '') !== String(storedIndicator?.[field] ?? ''));
            return mismatch
                ? { status: 'drift', label: '漂移' }
                : { status: 'match', label: '一致' };
        }

        function buildIndicatorChartContext(payload, index, signalId = '') {
            const bars = Array.isArray(payload?.bars) ? payload.bars : [];
            if (!bars.length) return null;
            const indicators = Array.isArray(payload?.indicators) ? payload.indicators : [];
            const indicatorMap = new Map(indicators.map((item) => [Number(item?.bar_time_ms || 0), item]));
            const signals = Array.isArray(payload?.signals) ? payload.signals : [];
            const safeIndex = Math.min(Math.max(Number(index) || 0, 0), bars.length - 1);
            const bar = bars[safeIndex] || null;
            const signalMatches = signals.filter((item) => Number(item?.bar_time_ms || 0) === Number(bar?.bar_time_ms || 0));
            const activeSignal = signalMatches.find((item) => String(item?.signal_id || item?.id || '') === String(signalId || ''))
                || signalMatches[0]
                || null;
            return {
                index: safeIndex,
                bar,
                indicator: indicatorMap.get(Number(bar?.bar_time_ms || 0)) || payload?.latestIndicator || null,
                signalMatches,
                activeSignal,
            };
        }

        function getIndicatorChartSelectedIndex(payload) {
            const bars = Array.isArray(payload?.bars) ? payload.bars : [];
            if (!bars.length) return -1;
            const fallbackIndex = bars.length - 1;
            const index = indicatorChartSelectedBarIndex >= 0 ? indicatorChartSelectedBarIndex : fallbackIndex;
            return Math.min(Math.max(index, 0), bars.length - 1);
        }

        function resolveIndicatorChartDataIndex(candidate) {
            if (Number.isInteger(candidate) && candidate >= 0) return candidate;
            const numeric = Number(candidate);
            if (Number.isInteger(numeric) && numeric >= 0) return numeric;
            const text = String(candidate ?? '').trim();
            if (!text || !indicatorChartCategories.length) return -1;
            return indicatorChartCategories.indexOf(text);
        }

        function resolveIndicatorChartDataIndexFromParams(params) {
            const list = Array.isArray(params) ? params : [params];
            for (const item of list) {
                const directIndex = resolveIndicatorChartDataIndex(item?.dataIndex);
                if (directIndex >= 0) return directIndex;
                const nameIndex = resolveIndicatorChartDataIndex(item?.name);
                if (nameIndex >= 0) return nameIndex;
                const axisValueIndex = resolveIndicatorChartDataIndex(item?.axisValue ?? item?.valueLabel ?? item?.value);
                if (axisValueIndex >= 0) return axisValueIndex;
                const rawValue = Array.isArray(item?.value) ? item.value[0] : item?.value;
                const valueIndex = resolveIndicatorChartDataIndex(rawValue);
                if (valueIndex >= 0) return valueIndex;
            }
            return -1;
        }

        function resolveIndicatorChartBarIndexFromPixel(point) {
            if (!indicatorChartInstance || !Array.isArray(point)) return -1;
            for (const xAxisIndex of [0, 1, 2]) {
                try {
                    const raw = indicatorChartInstance.convertFromPixel({ xAxisIndex }, point);
                    const candidate = Array.isArray(raw) ? raw[0] : raw;
                    const index = resolveIndicatorChartDataIndex(candidate);
                    if (index >= 0) return index;
                } catch (_) {
                    continue;
                }
            }
            return -1;
        }

        function getIndicatorChartEventPoint(event) {
            const x = Number(event?.offsetX ?? event?.zrX);
            const y = Number(event?.offsetY ?? event?.zrY);
            if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
            return [x, y];
        }

        function getIndicatorChartPointFromClientPosition(clientX, clientY) {
            const container = document.getElementById('indicatorChartCanvas');
            if (!container) return null;
            const rect = container.getBoundingClientRect();
            const x = Number(clientX) - rect.left;
            const y = Number(clientY) - rect.top;
            if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
            if (x < 0 || y < 0 || x > rect.width || y > rect.height) return null;
            return [x, y];
        }

        function cleanupIndicatorChartDomInteractions() {
            if (typeof indicatorChartDomCleanup === 'function') {
                indicatorChartDomCleanup();
            }
            indicatorChartDomCleanup = null;
        }

        function attachIndicatorChartDomInteractions() {
            cleanupIndicatorChartDomInteractions();
            const container = document.getElementById('indicatorChartCanvas');
            if (!container) return;
            const scrollOwner = container.closest('.chart-modal-content');

            const handleHoverPoint = (point) => {
                const index = point ? resolveIndicatorChartBarIndexFromPixel(point) : -1;
                if (index < 0) return;
                syncIndicatorChartCursorIndex(index);
                syncIndicatorChartTooltip(index);
            };

            const onMouseMove = (event) => {
                handleHoverPoint(getIndicatorChartPointFromClientPosition(event.clientX, event.clientY));
            };
            const onMouseLeave = () => {
                indicatorChartHoverBarIndex = -1;
                renderIndicatorChartCursorStrip(indicatorChartLastPayload);
                if (indicatorChartInstance) {
                    indicatorChartInstance.dispatchAction({ type: 'hideTip' });
                }
            };
            const onClick = (event) => {
                const point = getIndicatorChartPointFromClientPosition(event.clientX, event.clientY);
                const index = point ? resolveIndicatorChartBarIndexFromPixel(point) : -1;
                if (index < 0) return;
                focusIndicatorChartBarIndex(index);
            };
            const onTouchStart = (event) => {
                const touch = event.touches?.[0] || event.changedTouches?.[0];
                if (!touch) return;
                const point = getIndicatorChartPointFromClientPosition(touch.clientX, touch.clientY);
                const index = point ? resolveIndicatorChartBarIndexFromPixel(point) : -1;
                if (index < 0) return;
                focusIndicatorChartBarIndex(index);
            };
            const onWheel = (event) => {
                if (!isIndicatorDesktopFinePointer() || !scrollOwner) return;
                const deltaY = Number(event.deltaY || 0);
                const deltaX = Number(event.deltaX || 0);
                if (!Number.isFinite(deltaY) || Math.abs(deltaY) <= Math.abs(deltaX)) return;
                const maxScrollTop = Math.max(0, scrollOwner.scrollHeight - scrollOwner.clientHeight);
                if (maxScrollTop <= 0) return;
                const nextScrollTop = Math.min(maxScrollTop, Math.max(0, scrollOwner.scrollTop + deltaY));
                if (Math.abs(nextScrollTop - scrollOwner.scrollTop) < 0.5) return;
                scrollOwner.scrollTop = nextScrollTop;
                event.preventDefault();
                event.stopImmediatePropagation?.();
                event.stopPropagation();
            };

            container.addEventListener('mousemove', onMouseMove);
            container.addEventListener('mouseleave', onMouseLeave);
            container.addEventListener('click', onClick);
            container.addEventListener('touchstart', onTouchStart, { passive: true });
            container.addEventListener('wheel', onWheel, { passive: false, capture: true });

            indicatorChartDomCleanup = () => {
                container.removeEventListener('mousemove', onMouseMove);
                container.removeEventListener('mouseleave', onMouseLeave);
                container.removeEventListener('click', onClick);
                container.removeEventListener('touchstart', onTouchStart);
                container.removeEventListener('wheel', onWheel, true);
            };
        }

        function renderIndicatorChartCursorStrip(payload) {
            const container = document.getElementById('indicatorChartCursorStrip');
            if (!container) return;
            const bars = Array.isArray(payload?.bars) ? payload.bars : [];
            if (!bars.length) {
                container.innerHTML = '';
                return;
            }
            const fallbackIndex = indicatorChartSelectedBarIndex >= 0 ? indicatorChartSelectedBarIndex : bars.length - 1;
            const activeIndex = indicatorChartHoverBarIndex >= 0 ? indicatorChartHoverBarIndex : fallbackIndex;
            const context = buildIndicatorChartContext(payload, activeIndex, indicatorChartSelectedSignalId);
            const bar = context?.bar || null;
            const indicator = context?.indicator || null;
            const signal = context?.activeSignal || null;
            const archiveStatus = compareIndicatorArchiveStatus(payload, bar?.bar_time_ms);
            container.innerHTML = `
                <div class="cursor-card">
                    <div class="cursor-label">Cursor Time</div>
                    <div class="cursor-value">${escapeHtml(bar?.us_time || '--')}</div>
                </div>
                <div class="cursor-card">
                    <div class="cursor-label">OHLC</div>
                    <div class="cursor-value">${bar ? `${escapeHtml(formatPrice(bar.open))} / ${escapeHtml(formatPrice(bar.high))} / ${escapeHtml(formatPrice(bar.low))} / ${escapeHtml(formatPrice(bar.close))}` : '--'}</div>
                </div>
                <div class="cursor-card">
                    <div class="cursor-label">EMA / VWAP</div>
                    <div class="cursor-value">${indicator ? `20 ${escapeHtml(formatPrice(indicator.ema_fast))} · 50 ${escapeHtml(formatPrice(indicator.ema_slow))}<br>100 ${escapeHtml(formatPrice(indicator.ema_trend))} · VWAP ${escapeHtml(formatPrice(indicator.vwap))}` : '--'}</div>
                </div>
                <div class="cursor-card">
                    <div class="cursor-label">Signal / Osc</div>
                    <div class="cursor-value">${signal ? `${escapeHtml(String(signal.signal || signal.direction || '--'))}<br>${escapeHtml(String(signal.direction || '--').toUpperCase())}` : '暂无信号'}${indicator ? `<br>CRSI ${escapeHtml(formatNumber(indicator.crsi))} · OBV ${escapeHtml(formatNumber(indicator.obv_rsi))}` : ''}<br>Archive ${escapeHtml(archiveStatus.label)}</div>
                </div>
            `;
        }

        function renderIndicatorChartFocusGroup(payload) {
            const container = document.getElementById('indicatorChartFocusGroup');
            if (!container) return;
            const bars = Array.isArray(payload?.bars) ? payload.bars : [];
            if (!bars.length) {
                container.innerHTML = '';
                return;
            }
            const activeIndex = getIndicatorChartSelectedIndex(payload);
            const activeBar = bars[activeIndex] || null;
            const archiveStatus = compareIndicatorArchiveStatus(payload, activeBar?.bar_time_ms);
            container.innerHTML = `
                <button class="chart-focus-btn" type="button" onclick="focusPreviousIndicatorChartBar()" ${activeIndex <= 0 ? 'disabled' : ''}>◀ Prev</button>
                <button class="chart-focus-btn" type="button" onclick="focusNextIndicatorChartBar()" ${activeIndex >= bars.length - 1 ? 'disabled' : ''}>Next ▶</button>
                <button class="chart-focus-btn" type="button" onclick="focusLatestIndicatorChartBar()" ${activeIndex >= bars.length - 1 ? 'disabled' : ''}>Latest</button>
                <div class="chart-focus-status">Focus ${activeIndex + 1}/${bars.length} · ${escapeHtml(activeBar?.us_time || '--')} · Archive ${escapeHtml(archiveStatus.label)}</div>
            `;
        }

        function buildIndicatorChartTooltipHtml(payload, index) {
            const context = buildIndicatorChartContext(payload, index, '');
            const bar = context?.bar || null;
            if (!bar) return '';
            const indicator = context?.indicator || null;
            const signal = context?.activeSignal || null;
            const archiveStatus = compareIndicatorArchiveStatus(payload, bar?.bar_time_ms);
            const direction = String(signal?.direction || '').toLowerCase();
            const signalColor = direction === 'short' ? '#FC8181' : '#48BB78';
            return `
                <div style="font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.75;min-width:240px;">
                    <div style="font-size:12px;font-weight:700;color:#E2EAF4;margin-bottom:6px;">${escapeHtml(bar.us_time || '--')}</div>
                    <div>O ${escapeHtml(formatPrice(bar.open))} · H ${escapeHtml(formatPrice(bar.high))}</div>
                    <div>L ${escapeHtml(formatPrice(bar.low))} · C ${escapeHtml(formatPrice(bar.close))}</div>
                    <div>Vol ${escapeHtml(formatNumber(bar.volume || 0, 0))}</div>
                    <div style="margin-top:6px;color:#8BA4C4;">EMA20 ${indicator ? escapeHtml(formatPrice(indicator.ema_fast)) : '--'} · EMA50 ${indicator ? escapeHtml(formatPrice(indicator.ema_slow)) : '--'}</div>
                    <div style="color:#8BA4C4;">EMA100 ${indicator ? escapeHtml(formatPrice(indicator.ema_trend)) : '--'} · VWAP ${indicator ? escapeHtml(formatPrice(indicator.vwap)) : '--'}</div>
                    <div style="color:#8BA4C4;">CRSI ${indicator ? escapeHtml(formatNumber(indicator.crsi)) : '--'} · OBV ${indicator ? escapeHtml(formatNumber(indicator.obv_rsi)) : '--'} · ATR ${indicator ? escapeHtml(formatPercent(indicator.atr_pct)) : '--'}</div>
                    <div style="color:#8BA4C4;">Archive ${escapeHtml(archiveStatus.label)}</div>
                    <div style="margin-top:6px;color:${signal ? signalColor : '#8BA4C4'};">${signal ? `${escapeHtml(String(signal.signal || signal.direction || '--'))} · ${escapeHtml(String(signal.direction || '--').toUpperCase())}` : 'No signal on this bar'}</div>
                </div>
            `;
        }

        function syncIndicatorChartTooltip(index) {
            if (!indicatorChartInstance || !Number.isInteger(index) || index < 0) return;
            indicatorChartInstance.dispatchAction({ type: 'showTip', seriesIndex: 0, dataIndex: index });
        }

        function syncIndicatorChartCursorIndex(index) {
            if (!indicatorChartLastPayload || !Array.isArray(indicatorChartLastPayload.bars) || !indicatorChartLastPayload.bars.length) return;
            const safeIndex = Math.min(Math.max(Number(index) || 0, 0), indicatorChartLastPayload.bars.length - 1);
            indicatorChartHoverBarIndex = safeIndex;
            renderIndicatorChartCursorStrip(indicatorChartLastPayload);
        }

        function focusIndicatorChartBarIndex(index, signalId = '') {
            if (!indicatorChartLastPayload || !Array.isArray(indicatorChartLastPayload.bars) || !indicatorChartLastPayload.bars.length) return;
            const safeIndex = Math.min(Math.max(Number(index) || 0, 0), indicatorChartLastPayload.bars.length - 1);
            indicatorChartSelectedBarIndex = safeIndex;
            indicatorChartSelectedSignalId = signalId ? decodeURIComponent(signalId) : '';
            indicatorChartHoverBarIndex = safeIndex;
            renderIndicatorChartCursorStrip(indicatorChartLastPayload);
            renderIndicatorChartFocusGroup(indicatorChartLastPayload);
            syncIndicatorChartTooltip(safeIndex);
        }

        function focusPreviousIndicatorChartBar() {
            if (!indicatorChartLastPayload) return;
            const currentIndex = getIndicatorChartSelectedIndex(indicatorChartLastPayload);
            if (currentIndex <= 0) return;
            focusIndicatorChartBarIndex(currentIndex - 1, indicatorChartSelectedSignalId);
        }

        function focusNextIndicatorChartBar() {
            if (!indicatorChartLastPayload || !Array.isArray(indicatorChartLastPayload.bars)) return;
            const currentIndex = getIndicatorChartSelectedIndex(indicatorChartLastPayload);
            const maxIndex = indicatorChartLastPayload.bars.length - 1;
            if (currentIndex < 0 || currentIndex >= maxIndex) return;
            focusIndicatorChartBarIndex(currentIndex + 1, indicatorChartSelectedSignalId);
        }

        function focusLatestIndicatorChartBar() {
            if (!indicatorChartLastPayload || !Array.isArray(indicatorChartLastPayload.bars) || !indicatorChartLastPayload.bars.length) return;
            focusIndicatorChartBarIndex(indicatorChartLastPayload.bars.length - 1);
        }

        function setIndicatorChartLoadingState(indicator, message = '正在拉取 bars / indicators / signals ...') {
            const intervalLabel = getIntervalLabel(indicator.interval) || indicator.interval || '--';
            const title = document.getElementById('indicatorChartTitle');
            const summary = document.getElementById('indicatorChartSummary');
            const canvas = document.getElementById('indicatorChartCanvas');
            const focus = document.getElementById('indicatorChartFocusGroup');
            const cursor = document.getElementById('indicatorChartCursorStrip');
            const note = document.getElementById('indicatorChartNote');
            indicatorChartLastPayload = null;
            indicatorChartCategories = [];
            cleanupIndicatorChartDomInteractions();
            indicatorChartSelectedBarIndex = -1;
            indicatorChartSelectedSignalId = '';
            indicatorChartHoverBarIndex = -1;
            if (title) title.textContent = `${indicator.symbol || '--'} · ${intervalLabel} 指标图`;
            if (summary) {
                summary.innerHTML = `
                    <span class="chart-summary-chip">${escapeHtml(indicator.symbol || '--')} · ${escapeHtml(intervalLabel)}</span>
                    <span class="chart-summary-chip">range ${escapeHtml(getIndicatorChartRangeLabel(currentIndicatorChartRangeKey, indicator.interval))}</span>
                `;
            }
            renderIndicatorChartRangeGroup(indicator.interval);
            renderIndicatorChartCompareGroup();
            renderIndicatorChartLayerGroup(indicator.interval);
            if (indicatorChartInstance) {
                indicatorChartInstance.dispose();
                indicatorChartInstance = null;
            }
            if (canvas) canvas.innerHTML = '<div class="chart-empty">图表加载中...</div>';
            if (focus) focus.innerHTML = '';
            if (cursor) cursor.innerHTML = '';
            if (note) note.textContent = message;
        }

        function renderIndicatorChart(indicator, bars, indicators, signals, archive = {}) {
            const title = document.getElementById('indicatorChartTitle');
            const summary = document.getElementById('indicatorChartSummary');
            const canvas = document.getElementById('indicatorChartCanvas');
            const note = document.getElementById('indicatorChartNote');
            const symbol = indicator.symbol || '--';
            const interval = indicator.interval || '--';
            const intervalLabel = getIntervalLabel(interval) || interval;
            const normalizedInterval = normalizeChartInterval(interval);
            const normalizedIndicators = (indicators || []).map((item) => normalizeIndicatorHistoryRecord(item)).filter(Boolean);
            indicatorChartLastPayload = {
                indicator,
                bars,
                indicators: normalizedIndicators,
                signals,
                archive,
                archiveMaps: buildIndicatorArchiveMaps(archive),
                latestIndicator: normalizedIndicators[normalizedIndicators.length - 1] || null,
            };

            title.textContent = `${symbol} · ${intervalLabel} 指标图`;

            if (!Array.isArray(bars) || !bars.length) {
                if (indicatorChartInstance) {
                    indicatorChartInstance.dispose();
                    indicatorChartInstance = null;
                }
                cleanupIndicatorChartDomInteractions();
                canvas.innerHTML = '<div class="chart-empty">暂无可绘制的 bars / indicators 历史数据</div>';
                summary.innerHTML = '';
                renderIndicatorChartRangeGroup(interval);
                renderIndicatorChartCompareGroup();
                renderIndicatorChartLayerGroup(interval);
                indicatorChartCategories = [];
                renderIndicatorChartFocusGroup({ bars: [] });
                renderIndicatorChartCursorStrip({ bars: [] });
                note.textContent = '图表优先读取 chart/timeline 计算结果；如果 bars 为空，将无法展示 computed 指标。';
                return;
            }

            const sortedBars = bars.slice().sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0));
            const indicatorMap = new Map(normalizedIndicators.map((item) => [Number(item.bar_time_ms || 0), item]));
            const barMap = new Map(sortedBars.map((item) => [Number(item.bar_time_ms || 0), item]));
            const categories = sortedBars.map((bar) => formatChartLabel(bar));
            indicatorChartCategories = categories.slice();
            const candle = sortedBars.map((bar) => [
                Number(bar.open || 0),
                Number(bar.close || 0),
                Number(bar.low || 0),
                Number(bar.high || 0),
            ]);
            const emaFast = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.ema_fast));
            const emaSlow = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.ema_slow));
            const emaTrend = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.ema_trend));
            const vwap = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.vwap));
            const crsi = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.crsi));
            const crsiUpperBand = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.crsi_ub));
            const crsiLowerBand = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.crsi_db));
            const obvRsi = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.obv_rsi));
            const atrPct = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.atr_pct));
            const volume = sortedBars.map((bar) => Number(bar.volume || 0));
            const longSignals = buildSignalScatter(
                (signals || []).filter((item) => String(item.direction || '').toLowerCase() === 'long'),
                sortedBars,
                (signal) => signal.entry || signal.limit_price || barMap.get(Number(signal.bar_time_ms || 0))?.close,
                '#48BB78'
            );
            const shortSignals = buildSignalScatter(
                (signals || []).filter((item) => String(item.direction || '').toLowerCase() === 'short'),
                sortedBars,
                (signal) => signal.entry || signal.limit_price || barMap.get(Number(signal.bar_time_ms || 0))?.close,
                '#FC8181'
            );

            summary.innerHTML = [
                `<span class="chart-summary-chip">${escapeHtml(symbol)} · ${escapeHtml(intervalLabel)}</span>`,
                `<span class="chart-summary-chip">computed</span>`,
                `<span class="chart-summary-chip">range ${escapeHtml(getIndicatorChartRangeLabel(currentIndicatorChartRangeKey, interval))}</span>`,
                `<span class="chart-summary-chip">${sortedBars.length} bars</span>`,
                `<span class="chart-summary-chip">${normalizedIndicators.length} ind</span>`,
                `<span class="chart-summary-chip">${(signals || []).length} signals</span>`,
                `<span class="chart-summary-chip">${indicatorChartStoredOverlayEnabled ? '存档对照开启' : '存档对照关闭'}</span>`,
                `<span class="chart-summary-chip">${escapeHtml(sortedBars[0]?.us_time || '--')} → ${escapeHtml(sortedBars[sortedBars.length - 1]?.us_time || '--')}</span>`
            ].join('');
            renderIndicatorChartRangeGroup(interval);
            renderIndicatorChartCompareGroup();
            renderIndicatorChartLayerGroup(interval);
            note.textContent = !normalizedIndicators.length

                indicatorChartInstance.dispose();

            indicatorChartInstance.setOption({

                    type: 'scroll',
                    top: 0,
                    textStyle: { color: '#8BA4C4', fontSize: 10 }

                    axisPointer: { type: 'cross' },
                    backgroundColor: 'rgba(8,12,20,0.96)',

                    textStyle: { color: '#E2EAF4' },
                    enterable: true,
                    formatter(params) {
                        const list = Array.isArray(params) ? params : [params];
                        const index = resolveIndicatorChartDataIndexFromParams(list);
                        if (index >= 0) syncIndicatorChartCursorIndex(index);
                        if (!Number.isInteger(index) || index < 0) return '';
                        return buildIndicatorChartTooltipHtml(indicatorChartLastPayload, index);
                    }

                },
                grid: [

                ],
                dataZoom: [
                    {
                        type: 'inside',
                        xAxisIndex: [0, 1, 2],
                        start: 55,
                        end: 100,
                        // Keep desktop trackpad scrolling available inside the modal instead of hijacking it for zoom.
                        zoomOnMouseWheel: !isIndicatorDesktopFinePointer(),

                    { type: 'category', data: categories, scale: true, boundaryGap: true, axisLine: { lineStyle: { color: '#30435E' } }, axisLabel: { color: '#8BA4C4', fontSize: 10 }, splitLine: { show: false } },
