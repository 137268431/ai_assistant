<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>信号</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <script>document.write('<style>' + getIndicatorModalStyles() + '</style>');</script>
    <link rel="stylesheet" href="/assets/css/ibkr-page-common.css">
    <link rel="stylesheet" href="/assets/css/pages/ibkr_signals/page.css">
</head>
<body>
    <div id="contextBar"></div>
    <div id="pageBridge"></div>
    <div id="pageTopSection"></div>

    <div class="content">
        <section class="signals-command-bar" id="signalsCommandBar">
            <div class="signals-command-main">
                <div>
                    <div class="signals-command-kicker">Execution Signals</div>
                    <div class="signals-command-title">主信号池</div>
                    <div class="signals-command-copy">当天主信号 / 执行状态 / 订单联动</div>
                </div>
                <div class="signals-command-summary" id="signalsCommandSummary"></div>
            </div>
            <div class="signals-command-tools">
                <div class="signals-command-date" id="datePicker"></div>
                <input class="search-input signals-command-search" id="searchInput" placeholder="🔍 搜索股票/信号ID..." oninput="onSearchChange(this.value)">
                <div class="signals-command-refresh" id="signalsRefreshControl"></div>
            </div>
        </section>
        <div id="filterNote"></div>
        <div id="latencySummary" class="pipeline-strip"></div>
        <!-- 状态筛选 Tab -->
        <div class="status-tabs">
            <button class="status-tab active" data-status="all" onclick="selectStatus('all', this)">全部<span class="tab-count" data-status="all">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="awaiting_confirm" onclick="selectStatus('awaiting_confirm', this)">待确认<span class="tab-count" data-status="awaiting_confirm">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="pending" onclick="selectStatus('pending', this)">等待执行<span class="tab-count" data-status="pending">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="submitted" onclick="selectStatus('submitted', this)">已提交<span class="tab-count" data-status="submitted">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="protected_active" onclick="selectStatus('protected_active', this)">保护中<span class="tab-count" data-status="protected_active">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="protection_incomplete" onclick="selectStatus('protection_incomplete', this)">保护异常<span class="tab-count" data-status="protection_incomplete">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="executed" onclick="selectStatus('executed', this)">已执行<span class="tab-count" data-status="executed">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="closed" onclick="selectStatus('closed', this)">已平仓<span class="tab-count" data-status="closed">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="expired" onclick="selectStatus('expired', this)">已过期<span class="tab-count" data-status="expired">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="rejected" onclick="selectStatus('rejected', this)">已拒绝<span class="tab-count" data-status="rejected">(<span class="count-value">0</span>)</span></button>
        </div>

        <div id="directionTabs"></div>

        <div id="signalsContainer">
            <div class="loading">加载中...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreSignals()" style="display: none;">加载更多</button>
    </div>

    <div id="nav"></div>

    <!-- 技术指标详情浮层（由 common.js 动态注入） -->
    <div id="indicatorModalContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const pb = createPocketBaseClient();
        let allSignals = [];
        let signalTabCountRecords = [];
        let signalIndicatorsMap = {}; // { signalId: normalizedIndicator }
        let reverseSignalsMap = {};   // { symbol: [reverseSignals] }
        let currentDate = new Date().toISOString().split('T')[0];
        let rangeStartDate = null;
        let rangeEndDate = null;
        let currentDirection = 'all';
        let currentStatus = 'all';
        let currentSearch = '';
        let filterSignalId = '';
        let refreshTimer = null;
        let currentInterval = 30;
        let currentEnvironment = getCurrentRuntimeEnvironment();
        let currentSignalsRequestId = 0;

        // Pagination
        let currentPage = 1;
        const itemsPerPage = 10;
        let displayedSignals = [];
        let hasMore = false;
        let totalItems = 0;

        // Signal validity configuration (from config table, default 30 minutes)
        let signalValidityMinutes = 30;
        let realtimeLatencySnapshot = null;
        const CONFIG_CACHE_TTL_MS = 5 * 60 * 1000;
        const configValueCache = {};

        function pickConfigValue(records, fallbackValue) {
            const priority = { '': 0, global: 1, [currentEnvironment]: 2 };
            let bestRecord = null;
            let bestPriority = -1;

            records.forEach((record) => {
                const recordEnvironment = String(record.environment || '').trim().toLowerCase();
                const recordPriority = priority[recordEnvironment] ?? -1;
                if (recordPriority > bestPriority) {
                    bestPriority = recordPriority;
                    bestRecord = record;
                }
            });

            return bestRecord?.value ?? fallbackValue;
        }

        async function loadConfigValue(key, fallbackValue) {
            const cacheKey = `${currentEnvironment}:${key}`;
            const cached = configValueCache[cacheKey];
            if (cached && cached.expiresAt > Date.now()) {
                return cached.value;
            }
            const result = await fetchCollectionFullList('config', {
                filter: `key = "${escapeFilterValue(key)}" && (environment = "${currentEnvironment}" || environment = "global" || environment = "")`,
                sort: '-updated',
                maxPages: 2
            });
            const value = pickConfigValue(result, fallbackValue);
            configValueCache[cacheKey] = {
                value,
                expiresAt: Date.now() + CONFIG_CACHE_TTL_MS,
            };
            return value;
        }

        async function fetchCollectionFullList(collection, options = {}) {
            const perPage = Math.max(1, Math.min(Number(options.perPage || 200), 200));
            const maxPages = Math.max(1, Number(options.maxPages || 20));
            const items = [];

            for (let page = 1; page <= maxPages; page += 1) {
                const result = await apiFetch(collection, {
                    filter: options.filter || '',
                    sort: options.sort || '',
                    perPage,
                    page
                });
                const pageItems = Array.isArray(result?.items) ? result.items : [];
                items.push(...pageItems);
                if (pageItems.length < perPage) break;
            }

            return items;
        }

        function chunkArray(items, size) {
            const chunkSize = Math.max(1, Number(size || 1));
            const chunks = [];
            for (let index = 0; index < items.length; index += chunkSize) {
                chunks.push(items.slice(index, index + chunkSize));
            }
            return chunks;
        }

        function buildSignalsPageUrl(overrides = {}) {
            const params = {
                date: currentDate,
                signal_id: filterSignalId || '',
                search: currentSearch || '',
                ...overrides
            };
            return buildPageUrl('/ibkr_signals.html', params);
        }

        async function initAuth() {
            const token = getToken();
            if (!token) {
                location.href = `/login.html?from=${encodeURIComponent(window.location.pathname + window.location.search)}`;
                return false;
            }
            pb.authStore.save(token, null);
            return true;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeFilterValue(value) {
            return String(value || '')
                .replace(/\\/g, '\\\\')
                .replace(/"/g, '\\"');
        }

        function formatNumber(value, digits = 0) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '--';
            return num.toLocaleString('en-US', {
                minimumFractionDigits: digits,
                maximumFractionDigits: digits,
            });
        }

        function formatPrice(value) {
            const num = Number(value);
            if (!Number.isFinite(num) || num <= 0) return '--';
            return `$${formatNumber(num, 2)}`;
        }

        function formatSignedPercentHtml(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '<span style="color: var(--muted)">--</span>';
            const color = num > 0 ? 'var(--long)' : num < 0 ? 'var(--short)' : 'var(--muted)';
            const sign = num > 0 ? '+' : '';
            return `<span style="color:${color}">${sign}${num.toFixed(2)}%</span>`;
        }

        function formatChangeTripletHtml(dayPct, prevClosePct, change7d) {
            return [
                formatSignedPercentHtml(dayPct),
                formatSignedPercentHtml(prevClosePct),
                formatSignedPercentHtml(change7d),
            ].join(' / ');
        }

        function normalizeChartInterval(value, fallback = '5m') {
            const text = String(value || '').trim().toLowerCase();
            const map = {
                '5': '5m',
                '5m': '5m',
                '15': '15m',
                '15m': '15m',
                '30': '30m',
                '30m': '30m',
                '60': '1h',
                '60m': '1h',
                '1h': '1h',
                '1hr': '1h',
                '240': '4h',
                '240m': '4h',
                '4h': '4h',
                '1d': '1d',
                'd': '1d',
                'day': '1d'
            };
            return map[text] || fallback;
        }

        function buildSignalChartParams(signal) {
            if (!signal) return null;
            const latestIndicator = signalIndicatorsMap[signal.id] || null;
            const symbol = String(latestIndicator?.symbol || signal.symbol || '').trim().toUpperCase();
            if (!symbol) return null;
            return {
                symbol,
                interval: normalizeChartInterval(latestIndicator?.interval || signal.interval, '5m'),
                bar_time_ms: Number(latestIndicator?.bar_time_ms || signal.bar_time_ms || 0) || '',
                indicator_id: latestIndicator?.id || ''
            };
        }

        function getSignalTimeRange() {
            if (rangeStartDate && rangeEndDate) {
                return {
                    startTime: `${rangeStartDate} 00:00:00`,
                    endTime: `${rangeEndDate} 23:59:59`,
                    startTimeMs: new Date(`${rangeStartDate}T00:00:00Z`).getTime(),
                    endTimeMs: new Date(`${rangeEndDate}T23:59:59Z`).getTime(),
                };
            }

            const date = new Date(`${currentDate}T00:00:00Z`);
            return {
                startTime: `${currentDate} 00:00:00`,
                endTime: `${currentDate} 23:59:59`,
                startTimeMs: date.getTime(),
                endTimeMs: date.getTime() + 86400000,
            };
        }

        function normalizeIndicatorIntervalValue(value) {
            const normalized = normalizeChartInterval(value, '5m');
            const map = {
                '5m': '5',
                '15m': '15',
                '30m': '30',
                '1h': '60',
                '4h': '240',
                '1d': 'D'
            };
            return map[normalized] || '5';
        }

        function buildSignalIndicatorKey(signal) {
            const symbol = String(signal?.symbol || '').trim().toUpperCase();
            const interval = normalizeIndicatorIntervalValue(signal?.interval);
            return symbol ? `${symbol}|${interval}` : '';
        }

        function formatSignalInterval(interval) {
            const raw = String(interval || '').trim();
            if (!raw) return '';
            const normalized = normalizeChartInterval(raw, raw.toLowerCase());
            const map = {
                '5m': '5m',
                '15m': '15m',
                '30m': '30m',
                '1h': '1h',
                '4h': '4h',
                '1d': '1d'
            };
            return map[normalized] || raw;
        }

        function normalizeDateParam(value, fallback = '') {
            const text = String(value || '').trim();
            return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : fallback;
        }

        function summarizeHeaderValue(value, maxLength = 28) {
            const text = String(value || '').trim();
            if (!text) return '';
            if (text.length <= maxLength) return text;
            return `${text.slice(0, Math.max(0, maxLength - 3))}...`;
        }

        function getSignalsStatusLabel(status = currentStatus) {
            const map = {
                all: '全部状态',
                awaiting_confirm: '待确认',
                pending: '等待执行',
                submitted: '已提交',
                protected_active: '保护中',
                protection_incomplete: '保护异常',
                executed: '已执行',
                closed: '已平仓',
                expired: '已过期',
                rejected: '已拒绝',
            };
            return map[status] || status || '全部状态';
        }

        function getSignalsDirectionLabel(direction = currentDirection) {
            const map = {
                all: '全部方向',
                long: '做多',
                short: '做空',
            };
            return map[direction] || direction || '全部方向';
        }

        function getSignalsResultCount() {
            if (Number.isFinite(totalItems) && totalItems > 0) return totalItems;
            if (Array.isArray(allSignals) && allSignals.length) return allSignals.length;
            return 0;
        }

        function renderSignalsTopSection() {
            const scopeParts = [];
            if (filterSignalId) scopeParts.push(`signal_id=${summarizeHeaderValue(filterSignalId, 18)}`);
            if (currentSearch) scopeParts.push(`search=${summarizeHeaderValue(currentSearch, 24)}`);
            const scopeText = scopeParts.length ? scopeParts.join(' · ') : '无附加过滤';
            setPageContextMeta([
                { label: '环境', value: getEnvironmentLabel(currentEnvironment), tone: currentEnvironment },
                { label: '交易日', value: currentDate || '--' },
                { label: '范围', value: scopeText },
            ]);
            const summaryNode = document.getElementById('signalsCommandSummary');
            if (summaryNode) {
                summaryNode.innerHTML = `
                <div class="chip-row">
                    <span class="status-chip"><span class="dot" style="color:#4FD1C5"></span>结果 ${escapeHtml(String(getSignalsResultCount()))}</span>
                    <span class="status-chip"><span class="dot" style="color:#63B3ED"></span>${escapeHtml(getSignalsDirectionLabel())}</span>
                    <span class="status-chip"><span class="dot" style="color:#F6AD55"></span>${escapeHtml(getSignalsStatusLabel())}</span>
                </div>
            `;
            }
            const legacyTopSection = document.getElementById('pageTopSection');
            if (legacyTopSection) legacyTopSection.innerHTML = '';
        }

        function renderSignalsPageChrome() {
            const executionParams = { date: currentDate };
            if (filterSignalId) executionParams.signal_id = filterSignalId;
            document.getElementById('pageBridge').innerHTML = renderExecutionBridge('/ibkr_signals.html', executionParams);
            renderSignalsTopSection();
            renderFilterNote();
        }

        function renderFilterNote() {
            const notes = [];
            if (filterSignalId) notes.push(`signal_id=${filterSignalId}`);
            if (currentSearch) notes.push(`search=${currentSearch}`);
            if (currentStatus !== 'all') notes.push(`status=${currentStatus}`);
            if (currentDirection !== 'all') notes.push(`direction=${currentDirection}`);
            document.getElementById('filterNote').innerHTML = notes.length
                ? `<div class="filter-note">当前过滤: ${escapeHtml(notes.join(' · '))}</div>`
                : '';
        }

        function intervalToMs(interval) {
            const text = String(interval || '').trim().toLowerCase();
            const map = {
                '5': 5 * 60 * 1000,
                '5m': 5 * 60 * 1000,
                '15': 15 * 60 * 1000,
                '15m': 15 * 60 * 1000,
                '30': 30 * 60 * 1000,
                '30m': 30 * 60 * 1000,
                '60': 60 * 60 * 1000,
                '60m': 60 * 60 * 1000,
                '1h': 60 * 60 * 1000,
                '240': 4 * 60 * 60 * 1000,
                '240m': 4 * 60 * 60 * 1000,
                '4h': 4 * 60 * 60 * 1000,
                '1d': 24 * 60 * 60 * 1000,
                'd': 24 * 60 * 60 * 1000
            };
            return map[text] || 5 * 60 * 1000;
        }

        function parseTimestampMs(value) {
            if (value === null || value === undefined || value === '') return 0;
            if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
            const numeric = Number(value);
            if (Number.isFinite(numeric) && numeric > 1_000_000_000_000) return numeric;
            const parsed = Date.parse(String(value));
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function getSignalCloseTimeMs(signal) {
            const barTimeMs = Number(signal?.bar_time_ms || signal?.extra?.bar_time_ms || 0) || 0;
            if (!barTimeMs) return 0;
            return barTimeMs + intervalToMs(signal?.interval || signal?.chart_tf || signal?.extra?.chart_tf || '5m');
        }

        function getSignalCreatedMs(signal) {
            return parseTimestampMs(signal?.created);
        }

        function getSignalComputedAtMs(signal) {
            const extra = signal?.extra || {};
            return Number(extra.computed_at_ms || 0) || 0;
        }

        function getSignalFirstSentAtMs(signal) {
            const extra = signal?.extra || {};
            return Number(extra.feishu_signal_first_sent_at_ms || 0) || 0;
        }

        function getLatencyMs(fromMs, toMs) {
            const start = Number(fromMs || 0);
            const end = Number(toMs || 0);
            if (!start || !end || end < start) return 0;
            return end - start;
        }

        function formatLatency(ms) {
            const value = Number(ms || 0);
            if (!Number.isFinite(value) || value <= 0) return '--';
            if (value < 1000) return `${Math.round(value)}ms`;
            const totalSeconds = Math.round(value / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            if (hours > 0) return `${hours}h ${minutes}m ${seconds}s`;
            if (minutes > 0) return `${minutes}m ${seconds}s`;
            return `${seconds}s`;
        }

        function formatEventTime(ms) {
            return ms > 0 ? formatBarTimeMsToET(ms) : '--';
        }

        function averageLatency(signals, getter) {
            const values = (Array.isArray(signals) ? signals : [])
                .map((signal) => Number(getter(signal) || 0))
                .filter((value) => Number.isFinite(value) && value > 0);
            if (!values.length) return { avgMs: 0, count: 0 };
            const total = values.reduce((sum, value) => sum + value, 0);
            return {
                avgMs: total / values.length,
                count: values.length,
            };
        }

        function resolveLatencyTone(kind, ms) {
            const value = Number(ms || 0);
            if (!Number.isFinite(value) || value <= 0) return 'muted';

            const seconds = value / 1000;
            const thresholds = {
                freshness: { ok: 120, warn: 300 },
                ingest: { ok: 5, warn: 15 },
                compute: { ok: 15, warn: 45 },
                write: { ok: 30, warn: 90 }
            };
            const limit = thresholds[kind] || thresholds.compute;
            if (seconds <= limit.ok) return 'ok';
            if (seconds <= limit.warn) return 'warn';
            return 'alert';
        }

        function resolveLatencyFocusSymbol() {
            const symbols = [...new Set((Array.isArray(allSignals) ? allSignals : []).map((signal) => String(signal?.symbol || '').trim().toUpperCase()).filter(Boolean))];
            return symbols.length === 1 ? symbols[0] : '';
        }

        function resolveSignalsWorkspaceFocusSymbol() {
            const text = String(currentSearch || '').trim().toUpperCase();
            if (text && /^[A-Z][A-Z0-9._-]{0,14}$/.test(text)) return text;
            return resolveLatencyFocusSymbol();
        }

        function buildSignalsWorkbenchUrl({ focusSymbol = '' } = {}) {
            const params = {
                tab: 'screener',
                view: 'current',
                market_date: currentDate,
            };
            if (focusSymbol) params.focus = focusSymbol;
            return buildPageUrl('/ibkr_screener.html', params, { environment: currentEnvironment });
        }

        function renderLatencySummary() {
            const el = document.getElementById('latencySummary');
            if (!el) return;

            const latest = realtimeLatencySnapshot || {};
            const focusSymbol = resolveSignalsWorkspaceFocusSymbol();
            const refreshText = currentInterval > 0 ? `${currentInterval}s 自动刷新` : '手动刷新';
            const scopeLabel = latest.symbol ? `${latest.symbol} 5m pipeline` : '5m pipeline';
            const scopeSubtitle = latest.barCloseMs
                ? `基于 ${formatEventTime(latest.barCloseMs)} ET 收盘 bar · 当前结果 ${getSignalsResultCount()} 条`
                : `等待最新 5m 快照 · 当前结果 ${getSignalsResultCount()} 条`;
            const cards = [
                {
                    label: '实时 freshness',
                    value: formatLatency(latest.dataFreshnessMs || 0),
                    copy: '现在距离最新 5m bar 收盘的时间差',
                    tone: resolveLatencyTone('freshness', latest.dataFreshnessMs || 0),
                },
                {
                    label: 'bar 入库',
                    value: formatLatency(latest.barIngestDelayMs || 0),
                    copy: 'bar 收盘到写入 ibkr_bars',
                    tone: resolveLatencyTone('ingest', latest.barIngestDelayMs || 0),
                },
                {
                    label: '指标计算',
                    value: formatLatency(latest.indicatorComputeDelayMs || 0),
                    copy: 'bar 收盘到最新指标计算完成',
                    tone: resolveLatencyTone('compute', latest.indicatorComputeDelayMs || 0),
                },
            ];
            const workspaceUrl = buildSignalsWorkbenchUrl();
            const focusUrl = `${buildSignalsWorkbenchUrl({ focusSymbol })}#currentTargetsTable`;
            const focusLabel = focusSymbol ? `查看 ${focusSymbol} 榜单` : '打开当前标的榜';

            el.innerHTML = `
                <section class="pipeline-strip-shell">
                    <div class="pipeline-strip-head">
                        <div class="pipeline-strip-scope">
                            <div class="pipeline-strip-kicker">Pipeline Status</div>
                            <div class="pipeline-strip-title">${escapeHtml(scopeLabel)}</div>
                            <div class="pipeline-strip-subtitle">${escapeHtml(scopeSubtitle)}</div>
                        </div>
                        <div class="pipeline-strip-meta">
                            <span class="pipeline-meta-chip">${escapeHtml(refreshText)}</span>
                            <span class="pipeline-meta-chip">${escapeHtml(`env=${getEnvironmentLabel(currentEnvironment)}`)}</span>
                        </div>
                    </div>
                    <div class="pipeline-strip-body">
                        <div class="pipeline-metric-grid">
                            ${cards.map((card) => `
                                <article class="pipeline-metric-card ${escapeHtml(card.tone)}">
                                    <div class="pipeline-metric-label">${escapeHtml(card.label)}</div>
                                    <div class="pipeline-metric-value">${escapeHtml(card.value)}</div>
                                    <div class="pipeline-metric-copy">${escapeHtml(card.copy)}</div>
                                </article>
                            `).join('')}
                        </div>
                        <div class="pipeline-strip-actions">
                            <a class="pipeline-link primary" href="${workspaceUrl}">当前标的工作台</a>
                            <a class="pipeline-link secondary" href="${focusUrl}">${escapeHtml(focusLabel)}</a>
                        </div>
                    </div>
                </section>
            `;
        }

        async function loadRealtimeLatencySnapshot(requestId = 0) {
            const focusSymbol = resolveLatencyFocusSymbol();
            const barConditions = [
                `environment = "${currentEnvironment}"`,
                `interval = "5m"`,
            ];
            if (focusSymbol) {
                barConditions.push(`symbol = "${escapeFilterValue(focusSymbol)}"`);
            }

            const barResp = await apiFetch('ibkr_bars', {
                filter: barConditions.join(' && '),
                sort: '-bar_time_ms,-created',
                perPage: 1,
                page: 1
            });
            if (requestId && requestId !== currentSignalsRequestId) return;

            const latestBar = Array.isArray(barResp?.items) ? barResp.items[0] : null;
            if (!latestBar) {
                realtimeLatencySnapshot = null;
                renderLatencySummary();
                return;
            }

            const barCloseMs = (Number(latestBar.bar_time_ms || 0) || 0) + intervalToMs(latestBar.interval || '5m');
            const barCreatedMs = parseTimestampMs(latestBar.created);
            const snapshot = {
                symbol: String(latestBar.symbol || '').trim().toUpperCase(),
                barTimeMs: Number(latestBar.bar_time_ms || 0) || 0,
                barCloseMs,
                dataFreshnessMs: barCloseMs > 0 ? Math.max(0, Date.now() - barCloseMs) : 0,
                barIngestDelayMs: getLatencyMs(barCloseMs, barCreatedMs),
                indicatorComputeDelayMs: 0,
            };

            if (snapshot.symbol && snapshot.barTimeMs) {
                const indicatorResp = await apiFetch('ibkr_indicators', {
                    filter: `environment = "${currentEnvironment}" && symbol = "${escapeFilterValue(snapshot.symbol)}" && bar_time_ms = ${snapshot.barTimeMs} && (interval = "5" || interval = "5m")`,
                    sort: '-created',
                    perPage: 1,
                    page: 1
                });
                if (requestId && requestId !== currentSignalsRequestId) return;
                const latestIndicator = Array.isArray(indicatorResp?.items) ? indicatorResp.items[0] : null;
                if (latestIndicator) {
                    snapshot.indicatorComputeDelayMs = getLatencyMs(barCloseMs, parseTimestampMs(latestIndicator.created));
                }
            }

            realtimeLatencySnapshot = snapshot;
            renderLatencySummary();
        }

        function getSignalOrderStatusBadge(orders) {
            if (!orders || orders.length === 0) return '';

            const getRole = (order) => order.role || order.extra?.role || '';
            const hasExitFill = orders.some(order => getRole(order) !== 'entry' && order.status === 'Filled');
            const hasEntryFill = orders.some(order => getRole(order) === 'entry' && order.status === 'Filled');
            const hasWorkingOrder = orders.some(order => order.status === 'Init' || order.status === 'Submitted');
            const allEnded = orders.every(order => order.status === 'Canceled' || order.status === 'Closed');

            if (hasExitFill) {
                return '<span class="indicator-badge badge-long">✅ 已退出</span>';
            }
            if (hasEntryFill) {
                return '<span class="indicator-badge" style="background:rgba(72,187,120,0.18);color:var(--long);">📦 持仓中</span>';
            }
            if (hasWorkingOrder) {
                return '<span class="indicator-badge" style="background:rgba(246,173,85,0.2);color:var(--pending);">⏳ 挂单中</span>';
            }
            if (allEnded) {
                return '<span class="indicator-badge" style="background:rgba(113,128,150,0.2);color:var(--rejected);">🔒 已结束</span>';
            }
            return '<span class="indicator-badge" style="background:rgba(246,173,85,0.2);color:var(--pending);">📋 有订单</span>';
        }

        // 防止重复加载的标志
        let isLoadingSignals = false;

        async function loadSignals({ refreshCounts = true, showLoadingState = true } = {}) {
            // 防止重复调用
            if (isLoadingSignals) return;
            isLoadingSignals = true;
            const requestId = ++currentSignalsRequestId;

            // 重置为第一页
            currentPage = 1;

            try {
                // Load signal validity configuration from config table
                try {
                    const configValue = await loadConfigValue('signal_validity_minutes', '30');
                    signalValidityMinutes = parseInt(configValue, 10) || 30;
                    console.log('[Signals] signal_validity_minutes 配置值:', signalValidityMinutes, 'environment=', currentEnvironment);
                } catch (e) {
                    console.warn('[Signals] 无法读取 signal_validity_minutes 配置，使用默认值 30 分钟:', e);
                    signalValidityMinutes = 30;
                }
                const { startTime, endTime } = getSignalTimeRange();

                // 构建 filter 条件（使用 us_time 而非 created，因为 created 是服务器时间）
                const conditions = [`environment = "${currentEnvironment}"`, `us_time >= "${startTime}"`, `us_time <= "${endTime}"`];

                if (filterSignalId) {
                    conditions.push(`signal_id = "${escapeFilterValue(filterSignalId)}"`);
                }

                // 状态筛选
                if (currentStatus !== 'all') {
                    conditions.push(`status = "${currentStatus}"`);
                }

                // 方向筛选
                if (currentDirection !== 'all') {
                    conditions.push(`direction = "${currentDirection}"`);
                }

                // 搜索筛选（symbol 或 signal_id）
                if (currentSearch) {
                    const s = escapeFilterValue(currentSearch);
                    conditions.push(`(symbol ~ "${s}" || signal_id ~ "${s}")`);
                }

                const filter = conditions.join(' && ');

                // 使用分页 API，每次请求 100 条用于统计
                const page = currentPage;
                const perPage = 10;

                if (showLoadingState) {
                    showLoading('加载中...');
                }
                const result = await apiFetch('ibkr_signals', {
                    filter,
                    sort: '-created',
                    perPage,
                    page
                });
                if (requestId !== currentSignalsRequestId) return;

                allSignals = result.items;
                signalIndicatorsMap = {};
                reverseSignalsMap = {};
                ordersMap = {};
                await fetchRealtimeQuotes(allSignals.map((signal) => signal.symbol), { reset: true }).catch((error) => {
                    console.warn('加载实时行情失败:', error);
                });

                // 更新分页状态
                hasMore = result.items.length === perPage;
                totalItems = result.totalItems;
                displayedSignals = allSignals;

                renderSignalsPageChrome();
                renderLatencySummary();
                renderSignals();
                updateLoadMoreButton();
                setPageRefreshTime();

                loadRealtimeLatencySnapshot(requestId)
                    .catch((error) => {
                        console.error('加载延迟摘要失败:', error);
                    });

                // 技术指标改为后台补齐，不阻塞首屏。
                loadSignalIndicatorsForSignals(allSignals, { replace: true, requestId })
                    .then(() => {
                        if (requestId !== currentSignalsRequestId) return;
                        renderSignals();
                        updateCountdowns();
                    })
                    .catch((error) => {
                        console.error('后台加载指标失败:', error);
                    });

                // Tab 数量仍保留，但不再跟随每次自动刷新全量重查。
                if (refreshCounts) {
                    loadSignalsForTabCounts()
                        .then((records) => {
                            if (requestId !== currentSignalsRequestId) return;
                            signalTabCountRecords = records;
                            updateStatusTabCounts();
                            updateDirectionTabCounts();
                        })
                        .catch((error) => {
                            console.error('加载 tab 统计失败:', error);
                        });
                }
            } catch (error) {
                console.error('加载失败:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                showToast('加载失败: ' + error.message);
            } finally {
                isLoadingSignals = false;
                if (showLoadingState) {
                    hideLoading();
                }
            }
        }

        // 日期范围筛选函数
        function applyDateRange() {
            const startInput = document.getElementById('rangeStartDate').value;
            const endInput = document.getElementById('rangeEndDate').value;

            if (!startInput || !endInput) {
                showToast('请选择开始日期和结束日期');
                return;
            }

            if (new Date(startInput) > new Date(endInput)) {
                showToast('开始日期不能晚于结束日期');
                return;
            }

            // 清除单日期选中状态
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));

            rangeStartDate = startInput;

        async function loadSignalIndicatorsForSignals(signals, { replace = false, requestId = 0 } = {}) {
            const records = Array.isArray(signals) ? signals : [];
            if (replace) {
                signalIndicatorsMap = {};
            }
            if (!records.length) return;

            const { startTimeMs, endTimeMs } = getSignalTimeRange();
            const uniquePairs = [];
            const pairSet = new Set();

            records.forEach((signal) => {
                const symbol = String(signal?.symbol || '').trim().toUpperCase();
                if (!symbol) return;
                const interval = normalizeIndicatorIntervalValue(signal?.interval);
                const key = `${symbol}|${interval}`;
                if (pairSet.has(key)) return;
                pairSet.add(key);
                uniquePairs.push({ symbol, interval, key });
            });

            if (!uniquePairs.length) return;

            const latestByPair = {};
            for (const pairChunk of chunkArray(uniquePairs, 8)) {
                const pairFilter = pairChunk
                    .map((item) => `(symbol = "${escapeFilterValue(item.symbol)}" && interval = "${escapeFilterValue(item.interval)}")`)
                    .join(' || ');
                const expectedKeys = new Set(pairChunk.map((item) => item.key));
                const perPage = Math.min(200, pairChunk.length * 12);
                const chunkLatestByPair = {};

                for (let page = 1; page <= 2; page += 1) {
                    const result = await apiFetch('ibkr_indicators', {
                        filter: `environment = "${currentEnvironment}" && (${pairFilter}) && bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}`,
                        sort: '-bar_time_ms,-created',
                        perPage,
                        page
                    });
                    if (requestId && requestId !== currentSignalsRequestId) return;

                    const rows = Array.isArray(result?.items) ? result.items : [];
                    rows.forEach((item) => {
                        const key = `${String(item.symbol || '').trim().toUpperCase()}|${normalizeIndicatorIntervalValue(item.interval)}`;
                        if (!chunkLatestByPair[key]) {
                            chunkLatestByPair[key] = normalizeIndicatorRecord(item);
                        }
                    });

                    if (Object.keys(chunkLatestByPair).length >= expectedKeys.size) {
                        break;
                    }
                    if (rows.length < perPage) {
                        break;
                    }
                }

                Object.assign(latestByPair, chunkLatestByPair);
            }

            if (requestId && requestId !== currentSignalsRequestId) return;

            const nextMap = replace ? {} : { ...signalIndicatorsMap };
            records.forEach((signal) => {
                const key = buildSignalIndicatorKey(signal);
                if (!key || !latestByPair[key]) return;
                nextMap[signal.id] = latestByPair[key];
            });
            signalIndicatorsMap = nextMap;
        }

        // 加载反向信号映射（按 symbol 分组）
        async function loadReverseSignalsMap() {
            reverseSignalsMap = {};

            // 获取当前信号列表每个 symbol 的最新创建时间
            const latestSignalTimeBySymbol = {};
            allSignals.forEach(s => {
                if (s.symbol && s.created) {
                    if (!latestSignalTimeBySymbol[s.symbol] || new Date(s.created) > new Date(latestSignalTimeBySymbol[s.symbol])) {
                        latestSignalTimeBySymbol[s.symbol] = s.created;
                    }
                }
            });

            const symbols = Object.keys(latestSignalTimeBySymbol);
            if (symbols.length === 0) return;

            // 找到所有 symbol 中信号的最早时间（确保不漏掉任何反向信号）
            const earliestTime = Object.values(latestSignalTimeBySymbol).reduce((min, time) => {
                return new Date(time) < new Date(min) ? time : min;
            }, '');

            // 确定时间范围（美国时区）
            let startTimeMs, endTimeMs;
            if (rangeStartDate && rangeEndDate) {
                // 日期范围模式
                const startDate = new Date(rangeStartDate + 'T00:00:00Z');
                const endDate = new Date(rangeEndDate + 'T23:59:59Z');
                startTimeMs = startDate.getTime();
                endTimeMs = endDate.getTime();
            } else {
                // 单日期模式
                const date = new Date(currentDate + 'T00:00:00Z');
                startTimeMs = date.getTime();
                endTimeMs = date.getTime() + 86400000; // 加一天
            }

            try {
                const latestBySymbol = {};
                for (const symbolChunk of chunkArray(symbols, 12)) {
                    const symbolFilter = symbolChunk.map(s => `symbol = "${escapeFilterValue(s)}"`).join(' || ');
                    const rows = await fetchCollectionFullList('ibkr_reverse_signals', {
                        filter: `environment = "${currentEnvironment}" && (${symbolFilter}) && status = "confirmed" && bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}`,
                        sort: '-created',
                        maxPages: 4
                    });

                    rows.forEach((item) => {
                        const signalTime = latestSignalTimeBySymbol[item.symbol];
                        if (signalTime && new Date(item.created) > new Date(signalTime) && !latestBySymbol[item.symbol]) {
                            latestBySymbol[item.symbol] = item;
                        }
                    });
                }

                // 按 symbol 建立映射
                Object.keys(latestBySymbol).forEach(symbol => {
                    reverseSignalsMap[symbol] = [latestBySymbol[symbol]];
                });

                console.log('[ReverseSignals] 加载完成:', reverseSignalsMap);
            } catch (error) {
                console.error('加载反向信号失败:', error);
            }
        }

        // 更新状态标签的数量显示（通过API查询真实count）
        async function updateStatusTabCounts() {
            const statuses = ['awaiting_confirm', 'pending', 'submitted', 'protected_active', 'protection_incomplete', 'executed', 'closed', 'expired', 'rejected'];
            const counts = {};

            try {
                const records = Array.isArray(signalTabCountRecords) ? signalTabCountRecords : [];
                counts['all'] = 0;
                statuses.forEach(status => {
                    counts[status] = 0;
                });
                records.forEach(signal => {
                    if (currentDirection !== 'all' && signal.direction !== currentDirection) {
                        return;
                    }
                    counts['all']++;
                    const status = String(signal.status || 'pending');
                    if (counts[status] !== undefined) counts[status]++;
                });
            } catch (e) {
                console.error('updateStatusTabCounts failed:', e);
                // 降级：显示当前已加载的
                counts['all'] = allSignals.length;
                statuses.forEach(s => counts[s] = 0);
                allSignals.forEach(signal => {
                    const st = signal.status || 'pending';
                    if (counts[st] !== undefined) counts[st]++;
                });
            }

            // 更新每个标签的数量
            ['all', ...statuses].forEach(status => {
                const tab = document.querySelector(`.status-tab .tab-count[data-status="${status}"] .count-value`);
                if (tab) {
                    tab.textContent = counts[status] || 0;
                }
            });
        }

        // 构建技术指标徽章
        function buildIndicatorBadges(signal, latestIndicator) {
            if (!latestIndicator && !signal.extra) return '';

            const badges = [];

            // 趋势方向
            if (latestIndicator?.trend_dir === 1) {
                badges.push('<span class="indicator-badge bullish">📈 多头</span>');
            } else if (latestIndicator?.trend_dir === -1) {
                badges.push('<span class="indicator-badge bearish">📉 空头</span>');
            }

            // EMA 多头/空头状态
            if (latestIndicator?.ema_bullish) {
                badges.push('<span class="indicator-badge badge-ema">EMA 多头</span>');
            }
            if (latestIndicator?.ema_bearish) {
                badges.push('<span class="indicator-badge badge-ema">EMA 空头</span>');
            }

            // 日内涨幅（已在信号卡片标题行显示，此处不再重复）
            // if (latestIndicator?.day_change_pct) {
            //     const color = latestIndicator.day_change_pct > 0 ? 'var(--long)' : 'var(--short)';
            //     badges.push(`<span class="indicator-badge" style="color:${color}">${latestIndicator.day_change_pct > 0 ? '+' : ''}${latestIndicator.day_change_pct.toFixed(2)}%</span>`);
            // }

            // 分形信号
            if (latestIndicator?.fractal_bull) {
                badges.push('<span class="indicator-badge badge-fractal">🔺 分形多</span>');
            }
            if (latestIndicator?.fractal_bear) {
                badges.push('<span class="indicator-badge badge-fractal">🔻 分形空</span>');
            }

            // EMA 触及
            if (latestIndicator?.ema_bull_touch) {
                badges.push('<span class="indicator-badge badge-ema">EMA 支撑</span>');
            }
            if (latestIndicator?.ema_bear_touch) {
                badges.push('<span class="indicator-badge badge-ema">EMA 压力</span>');
            }

            // 波动率 (从 latestIndicator 获取)
            const signalExtra = signal.extra || {};
            const atrPct = latestIndicator?.atr_pct || signalExtra.atr_pct || 0;
            if (atrPct > 0) {
                const atrVolLevel = atrPct >= 3 ? 'high' : atrPct >= 1.5 ? 'medium' : 'low';
                const atrVolLabel = atrVolLevel === 'high' ? '高波动' : atrVolLevel === 'medium' ? '中波动' : '低波动';
                const slAtrRatio = latestIndicator?.sl_atr_ratio || signalExtra.sl_atr_ratio || 0;
                const slAdequate = slAtrRatio >= 0.8;
                badges.push(`<span class="indicator-badge badge-div">${atrVolLabel} ATR ${atrPct.toFixed(2)}%</span>`);
                badges.push(`<span class="indicator-badge ${slAdequate ? 'badge-change-up' : 'badge-change-down'}">SL ${slAtrRatio.toFixed(2)}x ATR</span>`);
            }

            return badges.join('');
        }

        // 构建大盘关联徽章
        function buildMarketIndexBadges(signal) {
            const signalExtra = signal.extra || {};

            // 解析 market_indexes 和 market_relation
            let marketIndexes = signalExtra.market_indexes;
            if (typeof marketIndexes === 'string') {
                try {
                    marketIndexes = JSON.parse(marketIndexes);
                } catch(e) {
                    marketIndexes = [];
                }
            }

            const marketRelation = signalExtra.market_relation || 'neutral';
            const marketRelationText = signalExtra.market_relation_text || '';
            const marketSentiment = signalExtra.market_sentiment || '';
            const marketSentimentText = signalExtra.market_sentiment_text || '';

            if ((!marketIndexes || marketIndexes.length === 0) && !marketSentimentText) {
                return '';
            }

            const badges = [];

            // 顺势/逆势标签
            if (marketRelation === 'with_trend') {
                badges.push(`<span class="indicator-badge badge-change-up" title="${escapeHtml(marketRelationText)}">✅ 顺势</span>`);
            } else if (marketRelation === 'against_trend') {
                badges.push(`<span class="indicator-badge badge-change-down" title="${escapeHtml(marketRelationText)}">⚠️ 逆势</span>`);
            }

            if (marketSentiment) {
                const sentimentLabels = {
                    risk_on: 'Risk-On',
                    risk_off: 'Risk-Off',
                    panic: '恐慌',
                    panic_reversal_watch: '恐慌退潮',
                    cautious: '谨慎',
                    neutral: '中性',
                    unknown: '未知'
                };
                const sentimentClass = ['risk_on', 'panic_reversal_watch'].includes(marketSentiment)
                    ? 'badge-change-up'
                    : (['risk_off', 'panic'].includes(marketSentiment) ? 'badge-change-down' : 'badge-div');
                badges.push(`<span class="indicator-badge ${sentimentClass}" title="${escapeHtml(marketSentimentText)}">${sentimentLabels[marketSentiment] || marketSentiment}</span>`);
            }

            // 显示大盘涨跌幅
            (marketIndexes || []).forEach(mi => {
                if (mi && mi.symbol) {
                    const pct = Number(mi.change_pct);
                    const hasPct = Number.isFinite(pct);
                    const colorClass = hasPct && pct > 0 ? 'badge-change-up' : (hasPct && pct < 0 ? 'badge-change-down' : 'badge-div');
                    const pctText = hasPct ? `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%` : (mi.stale ? '延迟' : '--');
                    badges.push(`<span class="indicator-badge ${colorClass}" title="${escapeHtml(mi.source || '')}">${mi.symbol} ${pctText}</span>`);
                }
            });

            return badges.join('');
        }

        function updateLoadMoreButton() {
            const btn = document.getElementById('loadMoreBtn');
            btn.style.display = hasMore ? 'block' : 'none';
            btn.textContent = hasMore ? `加载更多 (${allSignals.length}/${totalItems})` : '没有更多了';
            btn.disabled = !hasMore;
        }

        async function loadMoreSignals() {
            if (!hasMore) return;
            showLoading('加载更多...');
            try {
                // 先增加页码再请求
                currentPage++;
                const requestId = currentSignalsRequestId;
                const { startTime, endTime } = getSignalTimeRange();

                // 构建 filter 条件（使用 us_time 而非 created，因为 created 是服务器时间）
                const conditions = [`environment = "${currentEnvironment}"`, `us_time >= "${startTime}"`, `us_time <= "${endTime}"`];

                if (filterSignalId) {
                    conditions.push(`signal_id = "${escapeFilterValue(filterSignalId)}"`);
                }

                // 状态筛选
                if (currentStatus !== 'all') {
                    conditions.push(`status = "${currentStatus}"`);
                }

                // 方向筛选
                if (currentDirection !== 'all') {
                    conditions.push(`direction = "${currentDirection}"`);
                }

                // 搜索筛选
                if (currentSearch) {
                    const s = escapeFilterValue(currentSearch);
                    conditions.push(`(symbol ~ "${s}" || signal_id ~ "${s}")`);
                }

                const filter = conditions.join(' && ');

                const result = await apiFetch('ibkr_signals', {
                    filter,
                    sort: '-created',
                    perPage: itemsPerPage,
                    page: currentPage
                });
                const newSignals = Array.isArray(result?.items) ? result.items : [];

                allSignals = [...allSignals, ...newSignals];
                await fetchRealtimeQuotes(allSignals.map((signal) => signal.symbol), { reset: true }).catch((error) => {
                    console.warn('加载实时行情失败:', error);
                });
                hasMore = newSignals.length === itemsPerPage;
                totalItems = result.totalItems;

                displayedSignals = allSignals;
                renderSignalsPageChrome();
                renderLatencySummary();
                renderSignals();
                updateLoadMoreButton();
                loadSignalIndicatorsForSignals(newSignals, { replace: false, requestId })
                    .then(() => {
                        if (requestId !== currentSignalsRequestId) return;
                        renderSignals();
                    })
                    .catch((error) => {
                        console.error('加载更多指标失败:', error);
                    });
            } catch (error) {
                console.error('加载更多失败:', error);
                showToast('加载失败: ' + error.message);
                currentPage--;
            } finally {
                hideLoading();
            }
        }

        function resetPagination() {
            currentPage = 1;
            displayedSignals = getPaginatedSignals();

        function filterSignals() {
            return displayedSignals;
        }

        // 计算信号倒计时（从 bar_time_ms 开始，有效期从 config 读取）
        function calculateCountdown(barTimeMs, intervalValue) {
            if (!barTimeMs) return '';
            const validityMinutes = signalValidityMinutes;
            const closeTimeMs = Number(barTimeMs || 0) + intervalToMs(intervalValue || '5m');

            // bar_time_ms 是 bar 开始时间，倒计时从 bar 收盘后开始计算有效期
            const expiryTime = new Date(closeTimeMs + validityMinutes * 60 * 1000);

            // 获取 ET 当前时间：用 toISOString 提取 UTC 字符串，附加 ' UTC' 后缀确保 new Date 正确解析为 UTC
            const now = new Date();
            const usEasternTime = new Date(now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC');

            const remainingMs = expiryTime - usEasternTime;

            if (remainingMs <= 0) {
                return ''; // 已过期不显示倒计时
            }

            const hours = Math.floor(remainingMs / (60 * 60 * 1000));
            const minutes = Math.floor((remainingMs % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((remainingMs % (60 * 1000)) / 1000);

            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 防抖搜索定时器
        let searchDebounceTimer = null;

                                    📋 订单
                                </button>
                            </div>
                            ${isAwaitingConfirm ? `
                                <div style="display:flex;gap:6px;justify-content:flex-end;">

        // 更新所有倒计时显示
        function updateCountdowns() {
            const countdownElements = document.querySelectorAll('.countdown-display');
            countdownElements.forEach(el => {
                const barTime = el.getAttribute('data-bar-time');
                const intervalValue = el.getAttribute('data-interval') || '5m';
                const valueEl = el.querySelector('.countdown-value');
                if (valueEl && barTime) {
                    const remainingMs = calculateRemainingMs(parseInt(barTime, 10), intervalValue);
                    valueEl.textContent = formatCountdown(remainingMs) || '-';

                    // 少于5分钟时显示警告样式
                    if (remainingMs > 0 && remainingMs < 5 * 60 * 1000) {
                        valueEl.style.color = 'var(--short)';
                        el.style.color = 'var(--short)';
                    } else {
                        valueEl.style.color = '';
                        el.style.color = '';
                    }
                }
            });
        }

        // 计算剩余毫秒数
        function calculateRemainingMs(barTimeMs, intervalValue) {
            if (!barTimeMs) return 0;
            const validityMinutes = signalValidityMinutes;
            const closeTimeMs = Number(barTimeMs || 0) + intervalToMs(intervalValue || '5m');
            const expiryTime = new Date(closeTimeMs + validityMinutes * 60 * 1000);
            const now = new Date();
            const usEasternTime = new Date(now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC');
            return expiryTime - usEasternTime;
        }

        // 格式化倒计时显示
        function formatCountdown(remainingMs) {
            if (remainingMs <= 0) return '';
            const hours = Math.floor(remainingMs / (60 * 60 * 1000));
            const minutes = Math.floor((remainingMs % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((remainingMs % (60 * 1000)) / 1000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function getSignalActionHeaders(extra = {}) {
            const headers = { ...extra };
            const token = getToken();
            if (token) headers.Authorization = `Bearer ${token}`;
            return headers;
        }

        function findSignalRecord(id) {
            return allSignals.find((signal) => String(signal.id || '') === String(id || '')) || null;
        }

        async function patchSignalRecord(id, payload) {
            const response = await fetch(`${PB_AUTH_BASE_URL}/api/collections/ibkr_signals/records/${encodeURIComponent(id)}`, {
                method: 'PATCH',
                headers: getSignalActionHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(payload)
            });

            if (response.status === 401 || response.status === 403) {
                handleAuthError();
                throw new Error('Authentication failed');
            }

            let data = {};
            try {
                data = await response.json();
            } catch (_) {
                data = {};
            }

            if (!response.ok) {
                throw new Error(data.message || data.error || `Request failed (${response.status})`);
            }

            return data;
        }

        async function confirmSignal(id) {
            if (!confirm('确认执行此信号？')) return;
            try {
                const signal = findSignalRecord(id);
                if (!signal) throw new Error('找不到信号记录');
                if (signal.status !== 'awaiting_confirm') {
                    throw new Error(`当前状态不可确认: ${signal.status || 'unknown'}`);
                }

                const nextExtra = {
                    ...(signal.extra || {}),
                    confirmed_by: 'manual',
                    confirmed_at: new Date().toISOString(),
                    status_reason: 'confirmed_by_user'
                };

                await patchSignalRecord(id, {
                    status: 'pending',
                    note: '',
                    extra: nextExtra,
                    environment: currentEnvironment
                });
                showToast('✓ 信号已确认，等待执行');
                await loadSignals();
            } catch (error) {
                console.error('确认失败:', error);
                showToast('✗ 确认失败: ' + error.message);
            }
        }

        async function cancelSignal(id) {
            if (!confirm('确认拒绝此信号？')) return;
            try {
                const signal = findSignalRecord(id);
                if (!signal) throw new Error('找不到信号记录');
                if (signal.status !== 'awaiting_confirm') {
                    throw new Error(`当前状态不可拒绝: ${signal.status || 'unknown'}`);
                }

                const nextExtra = {
                    ...(signal.extra || {}),
                    rejected_by: 'manual',
                    rejected_at: new Date().toISOString(),
                    status_reason: 'manual_rejected',
                    cancel_order_failures: [],
                    cancelled_order_ids: []
                };

                await patchSignalRecord(id, {
                    status: 'rejected',
                    note: 'manual_rejected',
                    extra: nextExtra,
                    environment: currentEnvironment
                });
                showToast('✓ 信号已拒绝');
                await loadSignals();
            } catch (error) {
                console.error('拒绝失败:', error);
                showToast('✗ 拒绝失败: ' + error.message);
            }
        }

        function changeRefreshInterval(seconds) {
            currentInterval = parseInt(seconds);

            // 清除旧的定时器
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }

            // 设置新的定时器（不弹提示）

        document.addEventListener('DOMContentLoaded', async () => {
            if (!await initAuth()) return;
            document.getElementById('signalsRefreshControl').innerHTML = renderPageRefreshControl({
                mode: 'polling',

            document.getElementById('contextBar').innerHTML = renderPageContextBar('📡 IBKR 主信号', {

            document.getElementById('nav').innerHTML = renderNav('/ibkr_signals.html');

            document.getElementById('directionTabs').innerHTML = renderDirectionTabs();

            // 解析 URL 参数（date / signal_id / search）
            const urlParams = new URLSearchParams(window.location.search);
            const urlDate = normalizeDateParam(urlParams.get('date'));
            const urlSignalId = urlParams.get('signal_id');
            const urlSearch = urlParams.get('search') || '';
            if (urlDate) {
                currentDate = urlDate;
                // 同步日期选择器的显示
                document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                const dateInput = document.getElementById('customDate');
                if (dateInput) dateInput.value = urlDate;
            }
            filterSignalId = urlSignalId || '';
            currentSearch = urlSearch;
            document.getElementById('searchInput').value = currentSearch;
            renderSignalsPageChrome();
            renderLatencySummary();

            await withPageLoading(
                () => loadSignals({ refreshCounts: true, showLoadingState: true }),
                {
                    title: '信号页加载中',
                    copy: '正在同步当天主信号与紧凑 pipeline 状态。',
                }
            );

            // 初始化定时刷新（默认30秒）
            changeRefreshInterval(30);

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && currentInterval > 0) {
                    loadSignals({ refreshCounts: false, showLoadingState: false });
                }
            });

            // 设置倒计时更新定时器（每秒更新一次）
            setInterval(updateCountdowns, 1000);

            // 滚动到底部自动加载更多
            let isLoadingMore = false;
            window.addEventListener('scroll', () => {
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const scrollHeight = document.documentElement.scrollHeight;
                const clientHeight = document.documentElement.clientHeight;

                // 距离底部 200px 时触发加载
                if (scrollTop + clientHeight >= scrollHeight - 200) {
                    if (!isLoadingMore && hasMore && !isLoadingSignals) {
                        isLoadingMore = true;
                        loadMoreSignals().finally(() => {
                            isLoadingMore = false;
                        });
                    }
                }
            });

            if (filterSignalId && allSignals.length > 0) {
                const signalCard = document.querySelector(`[data-signal-id="${filterSignalId}"]`);
                if (signalCard) {
                    signalCard.style.boxShadow = '0 0 20px rgba(59, 130, 246, 0.35)';
                    setTimeout(() => {
                        signalCard.style.boxShadow = '';
                    }, 1500);
                }
            }
        });

        window.onEnvironmentChange = function(environment) {
            currentEnvironment = environment;
            location.href = buildSignalsPageUrl();
        };
    </script>
</body>
</html>
