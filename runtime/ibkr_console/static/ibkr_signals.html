        // 构建大盘关联徽章
        function buildMarketIndexBadges(signal) {
            const signalExtra = getSignalExtra(signal);

            // 解析 market_indexes 和 market_relation
            let marketIndexes = signalExtra.market_indexes;
            if (typeof marketIndexes === 'string') {
                try {
                    marketIndexes = JSON.parse(marketIndexes);
                } catch(e) {
                    marketIndexes = [];
                }
            }

            const marketRelation = signalExtra.market_relation || 'neutral';
            const marketRelationText = signalExtra.market_relation_text || '';
            const marketSentiment = signalExtra.market_sentiment || '';
            const marketSentimentText = signalExtra.market_sentiment_text || '';

            if ((!marketIndexes || marketIndexes.length === 0) && !marketSentimentText) {
                return '';
            }

            const badges = [];

            // 顺势/逆势标签
            if (marketRelation === 'with_trend') {
                badges.push(`<span class="indicator-badge badge-change-up" title="${escapeHtml(marketRelationText)}">✅ 顺势</span>`);
            } else if (marketRelation === 'against_trend') {
                badges.push(`<span class="indicator-badge badge-change-down" title="${escapeHtml(marketRelationText)}">⚠️ 逆势</span>`);
            }

            if (marketSentiment && marketSentiment !== 'unknown') {
                const sentimentLabels = {
                    risk_on: 'Risk-On',
                    risk_off: 'Risk-Off',
                    panic: '恐慌',
                    panic_reversal_watch: '恐慌退潮',
                    cautious: '谨慎',
                    neutral: '中性',
                    unknown: '未知'
                };
                const sentimentClass = ['risk_on', 'panic_reversal_watch'].includes(marketSentiment)
                    ? 'badge-change-up'
                    : (['risk_off', 'panic'].includes(marketSentiment) ? 'badge-change-down' : 'badge-div');
                badges.push(`<span class="indicator-badge ${sentimentClass}" title="${escapeHtml(marketSentimentText)}">${sentimentLabels[marketSentiment] || marketSentiment}</span>`);
            }

            // 显示大盘涨跌幅
            (marketIndexes || []).forEach(mi => {
                if (mi && mi.symbol) {
                    const symbol = String(mi.symbol || '').trim().toUpperCase();
                    if (!['VIX', 'SPY', 'QQQ'].includes(symbol)) return;
                    const pct = Number(mi.change_pct);
                    const hasPct = Number.isFinite(pct);
                    const colorClass = symbol === 'VIX'
                        ? (hasPct && pct < 0 ? 'badge-change-up' : (hasPct && pct > 0 ? 'badge-change-down' : 'badge-div'))
                        : (hasPct && pct > 0 ? 'badge-change-up' : (hasPct && pct < 0 ? 'badge-change-down' : 'badge-div'));
                    const pctText = hasPct ? `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%` : (mi.stale ? '已过期' : '数据缺失');
                    const titleParts = ['信号时快照'];
                    if (mi.source) titleParts.push(`source=${mi.source}`);
                    const timeText = mi.time || mi.ts || mi.timestamp || mi.updated || mi.updated_at || mi.bar_time || '';
                    if (timeText) titleParts.push(`time=${timeText}`);
                    if (mi.stale) titleParts.push('stale=true');
                    badges.push(`<span class="indicator-badge ${colorClass}" title="${escapeHtml(titleParts.join(' · '))}">${escapeHtml(symbol)}快照 ${pctText}</span>`);
                }
            });

            return badges.join('');
        }

        async function loadMoreSignals() {
            if (!hasMore) return;
            showLoading('加载更多...');
            try {
                // 先增加页码再请求
                currentPage++;
                const requestId = currentSignalsRequestId;
                const { startTime, endTime } = getSignalTimeRange();

                // 构建 filter 条件（使用 us_time 而非 created，因为 created 是服务器时间）
                const conditions = [`environment = "${currentEnvironment}"`, `us_time >= "${startTime}"`, `us_time <= "${endTime}"`];

                if (filterSignalId) {
                    conditions.push(`signal_id = "${escapeFilterValue(filterSignalId)}"`);
                }

                // 状态筛选需要使用 broker/environment-specific effective status，保留给客户端过滤。

                // 方向筛选
                if (currentDirection !== 'all') {
                    conditions.push(`direction = "${currentDirection}"`);
                }

                // 搜索筛选
                if (hasDistinctSignalSearch()) {
                    const s = escapeFilterValue(currentSearch);
                    conditions.push(`(symbol ~ "${s}" || signal_id ~ "${s}")`);
                }

                const filter = conditions.join(' && ');

                const signalParams = {
                    filter,
                    sort: '-created',
                    perPage: itemsPerPage,
                    page: currentPage
                };
                const result = typeof cachedApiFetch === 'function'
                    ? await cachedApiFetch('ibkr_signals', signalParams, {
                        ttlMs: SIGNALS_FAST_CACHE_TTL_MS,
                        swrMs: SIGNALS_FAST_CACHE_TTL_MS,
                        tags: ['signals-page', currentBrokerMode, currentEnvironment]
                    })
                    : await apiFetch('ibkr_signals', signalParams);
                const newSignals = Array.isArray(result?.items) ? result.items : [];

                allSignals = [...allSignals, ...newSignals];
                await loadSignalRealtimeQuotes(allSignals.map((signal) => signal.symbol)).catch((error) => {
                    console.warn('加载实时行情失败:', error);
                });
                await loadOrdersMap().catch((error) => {
                    console.warn('加载订单映射失败:', error);
                });
                hasMore = newSignals.length === itemsPerPage;
                totalItems = result.totalItems;

                displayedSignals = allSignals;
                renderSignalsPageChrome();
                renderLatencySummary();
                renderSignals();
                updateLoadMoreButton();
                loadSignalIndicatorsForSignals(newSignals, { replace: false, requestId })
                    .then(() => {
                        if (requestId !== currentSignalsRequestId) return;
                        renderSignals();
                    })
                    .catch((error) => {
                        console.error('加载更多 TV 上下文失败:', error);
                    });
            } catch (error) {
                console.error('加载更多失败:', error);
                showToast('加载失败: ' + error.message);
                currentPage--;
            } finally {
                hideLoading();
            }
        }

        // 计算信号倒计时（从 bar_time_ms 开始，有效期从 config 读取）
        function calculateCountdown(barTimeMs, intervalValue) {
            if (!barTimeMs) return '等待数据';
            const validityMinutes = signalValidityMinutes;
            const closeTimeMs = Number(barTimeMs || 0) + intervalToMs(intervalValue || '5m');

            // bar_time_ms 是 bar 开始时间，倒计时从 bar 收盘后开始计算有效期
            const expiryTime = new Date(closeTimeMs + validityMinutes * 60 * 1000);

            // 获取 ET 当前时间：用 toISOString 提取 UTC 字符串，附加 ' UTC' 后缀确保 new Date 正确解析为 UTC
            const now = new Date();
            const usEasternTime = new Date(now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC');

            const remainingMs = expiryTime - usEasternTime;

            if (remainingMs <= 0) return '已过期';

            const hours = Math.floor(remainingMs / (60 * 60 * 1000));
            const minutes = Math.floor((remainingMs % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((remainingMs % (60 * 1000)) / 1000);

            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        const PROTECTION_ROLE_META = {
            take_profit: { shortLabel: 'TP', label: '止盈', orderLabel: '止盈卖出单' },
            stop_loss: { shortLabel: 'SL', label: '止损', orderLabel: '止损保护单' },
        };
        const PROTECTION_WORKING_STATUSES = new Set([
            'apisent',
            'apipending',
            'pending',
            'pendingsubmit',
            'presubmitted',
            'submitted',
            'working',
        ]);

        function safeObject(value) {
            return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
        }

        function safeList(value) {
            if (Array.isArray(value)) return value;
            if (value === undefined || value === null || value === '') return [];
            return String(value).split(',').map((item) => item.trim()).filter(Boolean);
        }

        const MERGE_EXECUTION_FIELD_LABELS = {
            entry: 'Entry',
            limit_price: 'Limit',
            take_profit: 'TP',
            stop_loss: 'SL',
            shares: '股数',
        };

        function uniqueStrings(...values) {
            const seen = new Set();
            const result = [];
            values.flatMap(safeList).forEach((item) => {
                const text = String(item || '').trim();
                if (!text || seen.has(text)) return;
                seen.add(text);
                result.push(text);
            });
            return result;
        }

        function formatMergeFieldValue(field, value) {
            if (['entry', 'limit_price', 'take_profit', 'stop_loss'].includes(field)) {
                return formatSignalPrice(value, '--');
            }
            if (field === 'shares') {
                return formatQuantityLabel(value).replace('数据缺失', '--');
            }
            return String(value ?? '--');
        }

        function buildSignalMergePanel(signal) {
            const extra = getSignalExtra(signal);
            const mergedIds = uniqueStrings(extra.merged_signal_ids, extra.followup_signal_ids);
            const latestId = String(extra.latest_followup_signal_id || extra.latest_merged_signal_id || '').trim();
            if (latestId && !mergedIds.includes(latestId)) mergedIds.push(latestId);
            if (!mergedIds.length && !latestId) return '';

            const status = getEffectiveSignalStatus(signal);
            const requiresReconfirm = status === 'awaiting_confirm' && Boolean(extra.followup_requires_reconfirm || extra.confirmation_stale);
            const brokerLocked = ['submitted', 'protected_active', 'executed', 'protection_incomplete'].includes(status);
            const changedFields = uniqueStrings(extra.reconfirm_changed_fields);
            const previous = safeObject(extra.previous_confirmed_snapshot);
            const shownIds = mergedIds.slice(0, 3).join(', ');
            const moreText = mergedIds.length > 3 ? ` +${mergedIds.length - 3}` : '';
            const title = requiresReconfirm
                ? '同向后续已合并，需重新确认'
                : (brokerLocked ? `已记录同向后续 ${mergedIds.length || 1} 个` : '同向后续已合并');
            const summary = requiresReconfirm
                ? '原信号已确认过，但后续信号改变了执行参数；系统已暂停执行，等待重新确认。'
                : (brokerLocked ? '已有订单/保护链路时不加仓、不改订单；后续信号仅作为趋势确认记录。' : '后续信号未改变执行参数或仍在确认前，已合并到当前信号。');
            const changedHtml = changedFields.length ? `
                <div class="merge-change-row">
                    ${changedFields.map((field) => {
                        const label = MERGE_EXECUTION_FIELD_LABELS[field] || field;
                        const oldValue = formatMergeFieldValue(field, previous[field]);
                        const newValue = formatMergeFieldValue(field, signal?.[field]);
                        return `<span>${escapeHtml(label)} ${escapeHtml(oldValue)} → ${escapeHtml(newValue)}</span>`;
                    }).join('')}
                </div>
            ` : '';
            const reason = String(extra.suppressed_reason || extra.reconfirm_reason || extra.merge_policy || '').trim();
            return `
                <div class="signal-merge-panel${requiresReconfirm ? ' reconfirm' : ''}${brokerLocked ? ' broker-locked' : ''}">
                    <div class="merge-panel-head">
                        <strong>${requiresReconfirm ? '🔁' : '🧩'} ${escapeHtml(title)}</strong>
                        <span>${escapeHtml(shownIds || latestId)}${escapeHtml(moreText)}</span>
                    </div>
                    <div class="merge-panel-summary">${escapeHtml(summary)}</div>
                    ${changedHtml}
                    ${reason ? `<div class="merge-panel-reason">policy=${escapeHtml(reason)}</div>` : ''}
                </div>
            `;
        }

        function normalizeProtectionRole(role) {
            const key = String(role || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
            if (['tp', 'takeprofit', 'take_profit'].includes(key)) return 'take_profit';
            if (['sl', 'stoploss', 'stop_loss'].includes(key)) return 'stop_loss';
            return key;
        }

        function uniqueProtectionRoles(...roleLists) {
            const seen = new Set();
            const roles = [];
            roleLists.flatMap(safeList).forEach((role) => {
                const normalized = normalizeProtectionRole(role);
                if (!normalized || seen.has(normalized)) return;
                seen.add(normalized);
                roles.push(normalized);
            });
            return roles;
        }

        function normalizeProtectionStatusMap(value) {
            const source = safeObject(value);
            const result = {};
            Object.entries(source).forEach(([role, statuses]) => {
                const normalized = normalizeProtectionRole(role);
                if (!normalized) return;
                result[normalized] = safeList(statuses).map((status) => String(status || '').trim()).filter(Boolean);
            });
            return result;
        }

        function hasStatusMapData(statusMap) {
            return Object.keys(statusMap || {}).length > 0;
        }

        function isWorkingProtectionStatus(status) {
            return PROTECTION_WORKING_STATUSES.has(String(status || '').trim().toLowerCase());
        }

        function hasWorkingProtectionStatus(statuses) {
            return safeList(statuses).some(isWorkingProtectionStatus);
        }

        function inferMissingProtectionRoles(pbStatuses, liveStatuses, liveCheckPerformed) {
            const roles = Object.keys(PROTECTION_ROLE_META);
            const inferred = [];
            const hasPbData = hasStatusMapData(pbStatuses);
            const hasLiveData = hasStatusMapData(liveStatuses);
            roles.forEach((role) => {
                const pbMissing = hasPbData && !hasWorkingProtectionStatus(pbStatuses[role]);
                const liveMissing = liveCheckPerformed && hasLiveData && !hasWorkingProtectionStatus(liveStatuses[role]);
                if (pbMissing || liveMissing) inferred.push(role);
            });
            return inferred;
        }

        function protectionRoleStatusText(statuses, fallback = '未确认') {
            const values = [...new Set(safeList(statuses).map((status) => String(status || '').trim()).filter(Boolean))];
            return values.length ? values.join(' / ') : fallback;
        }

        function protectionRoleChipHtml(role, missingRoles, pbStatuses, liveStatuses, liveCheckPerformed) {
            const meta = PROTECTION_ROLE_META[role] || { shortLabel: role.toUpperCase(), label: role, orderLabel: role };
            const missing = missingRoles.includes(role);
            const liveText = liveCheckPerformed ? protectionRoleStatusText(liveStatuses[role]) : '';
            const pbText = protectionRoleStatusText(pbStatuses[role]);
            const stateText = missing
                ? '缺失/未工作'
                : (hasWorkingProtectionStatus(liveStatuses[role]) || hasWorkingProtectionStatus(pbStatuses[role]) ? '已确认' : '未确认');
            const statusText = liveText ? `IBKR ${liveText}` : `PB ${pbText}`;
            const cls = missing ? 'missing' : (stateText === '已确认' ? 'ok' : 'unknown');
            return `
                <span class="protection-role-chip ${cls}">
                    <strong>${escapeHtml(meta.shortLabel)} ${escapeHtml(meta.label)}</strong>
                    <span>${escapeHtml(stateText)}</span>
                    <em>${escapeHtml(statusText)}</em>
                </span>
            `;
        }

        function describeProtectionIssue(missingRoles) {
            const missingSet = new Set(missingRoles);
            const missingStop = missingSet.has('stop_loss');
            const missingTakeProfit = missingSet.has('take_profit');
            if (missingStop && missingTakeProfit) {
                return {
                    title: '止盈/止损都未确认',
                    severity: 'critical',

            const missingRoles = uniqueProtectionRoles(
                extra.missing_protection_roles,
                diagnostic.missing_protection_roles,
                inferredMissingRoles,
            );
            const issue = describeProtectionIssue(missingRoles);
            const liveCheckError = String(extra.protection_live_check_error || diagnostic.protection_live_check_error || '').trim();

        // 更新所有倒计时显示
        function updateCountdowns() {
            const countdownElements = document.querySelectorAll('.countdown-display');
            countdownElements.forEach(el => {
                const barTime = el.getAttribute('data-bar-time');
                const intervalValue = el.getAttribute('data-interval') || '5m';
                const valueEl = el.querySelector('.countdown-value');
                if (valueEl && barTime) {
                    const remainingMs = calculateRemainingMs(parseInt(barTime, 10), intervalValue);
                    valueEl.textContent = formatCountdown(remainingMs);

                    // 少于5分钟时显示警告样式
                    if (remainingMs > 0 && remainingMs < 5 * 60 * 1000) {
                        valueEl.style.color = 'var(--short)';
                        el.style.color = 'var(--short)';
                    } else {
                        valueEl.style.color = '';
                        el.style.color = '';
                    }
                } else if (valueEl) {
                    valueEl.textContent = '等待数据';
                }
            });
        }

        // 计算剩余毫秒数
        function calculateRemainingMs(barTimeMs, intervalValue) {
            if (!barTimeMs) return 0;
            const validityMinutes = signalValidityMinutes;
            const closeTimeMs = Number(barTimeMs || 0) + intervalToMs(intervalValue || '5m');
            const expiryTime = new Date(closeTimeMs + validityMinutes * 60 * 1000);
            const now = new Date();
            const usEasternTime = new Date(now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC');
            return expiryTime - usEasternTime;
        }

        // 格式化倒计时显示
        function formatCountdown(remainingMs) {
            if (remainingMs <= 0) return '已过期';
            const hours = Math.floor(remainingMs / (60 * 60 * 1000));
            const minutes = Math.floor((remainingMs % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((remainingMs % (60 * 1000)) / 1000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function getSignalActionHeaders(extra = {}) {
            const headers = { ...extra };
            const token = getToken();
            if (token) headers.Authorization = `Bearer ${token}`;
            return headers;
        }

        function findSignalRecord(id) {
            return allSignals.find((signal) => String(signal.id || '') === String(id || '')) || null;
        }

	        async function patchSignalRecord(id, payload) {
            const response = await fetch(`${PB_AUTH_BASE_URL}/api/collections/ibkr_signals/records/${encodeURIComponent(id)}`, {
                method: 'PATCH',
                headers: getSignalActionHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(payload)
            });

            if (response.status === 401 || response.status === 403) {
                handleAuthError();
                throw new Error('Authentication failed');
            }

            let data = {};
            try {
                data = await response.json();
            } catch (_) {
                data = {};
            }

	            if (!response.ok) {
	                throw new Error(data.message || data.error || `Request failed (${response.status})`);
	            }

            if (typeof invalidateIbkrDataCache === 'function') {
                invalidateIbkrDataCache(['ibkr_signals', 'signals', 'orders', 'reverse', 'tradingList']);
            }
	            return data;
	        }

	        async function requestSignalAction(path, id) {
	            const response = await fetchWithRetry(
	                buildPageUrl(path, { id }, {
	                    brokerMode: currentBrokerMode,
	                    dataEnvironment: currentEnvironment,
	                }),
	                {
	                    method: 'GET',
	                    headers: getSignalActionHeaders(),
	                },
	                { attempts: 2, retryDelayMs: 400 }
	            );
	            if (response.status === 401 || response.status === 403) {
	                handleAuthError();
	                throw new Error('Authentication failed');
	            }
	            const text = await response.text().catch(() => '');
	            if (!response.ok) {
	                throw new Error(text || `Request failed (${response.status})`);
	            }
            if (typeof invalidateIbkrDataCache === 'function') {
                invalidateIbkrDataCache(['ibkr_signals', 'signals', 'orders', 'reverse', 'tradingList']);
            }
	            return text;
	        }

        async function confirmSignal(id) {
            if (!confirm('确认执行此信号？')) return;
            try {
                const signal = findSignalRecord(id);
                if (!signal) throw new Error('找不到信号记录');
                const effectiveStatus = getEffectiveSignalStatus(signal);
                if (effectiveStatus !== 'awaiting_confirm') {
                    throw new Error(`当前状态不可确认: ${formatSignalStatusLabel(effectiveStatus)}`);
                }

	                await requestSignalAction('/webhook/signal/confirm', id);
	                showToast('✓ 信号已确认，等待执行');
                await loadSignals();
            } catch (error) {
                console.error('确认失败:', error);
                showToast('✗ 确认失败: ' + error.message);
            }
        }

        async function cancelSignal(id) {
            if (!confirm('确认拒绝此信号？')) return;
            try {
                const signal = findSignalRecord(id);
                if (!signal) throw new Error('找不到信号记录');
                const effectiveStatus = getEffectiveSignalStatus(signal);
                if (effectiveStatus !== 'awaiting_confirm') {
                    throw new Error(`当前状态不可拒绝: ${formatSignalStatusLabel(effectiveStatus)}`);
                }

	                await requestSignalAction('/webhook/signal/cancel', id);
	                showToast('✓ 信号已拒绝');
                await loadSignals();
            } catch (error) {
                console.error('拒绝失败:', error);
                showToast('✗ 拒绝失败: ' + error.message);
            }
        }

        function viewSignalOrders(signalId) {
            if (!signalId) {
                showToast('无法找到关联订单');
                return;
            }
            location.href = buildPageUrl('/orders.html', { signal_id: signalId, date: currentDate });
        }

        function viewReverseSignal(signalId) {
            if (!signalId) {
                showToast('无法找到反向信号');
                return;
            }
            // 跳转到反向信号页面并按 signal_id 筛选
            location.href = buildPageUrl('/ibkr_reverse_signals.html', { signal_id: signalId, date: currentDate });
        }

        function showIndicatorDetails(signalId) {
            const signal = allSignals.find(s => s.id === signalId);
            if (!signal) return;

            const latestIndicator = signalIndicatorsMap[signalId] || null;
            if (signal.signal_id) {
                setSelectedSignal(signal.signal_id, { detail: true, reload: false });
            }

            if (!latestIndicator) {
                showToast(`TV Payload${getIndicatorEmptyState(signal, latestIndicator)}`);
                return;
            }

            // 调用 common.js 公用弹窗
            showIndicatorModal(latestIndicator);
        }

        function openSignalChartPage(signalId) {
            const signal = allSignals.find((item) => item.id === signalId);
            const params = buildSignalChartParams(signal);
            if (!params?.tv_chart_url) {
                showToast('TV 未随 webhook 提供 chart url');
                return;
            }
            location.href = params.tv_chart_url;
        }

        window.onDateChange = function(startDate, endDate) {
            currentDate = startDate;
            syncSignalsPageUrl();
            renderSignalsPageChrome();
            loadSignals();
        };

        window.onDirectionChange = function(direction) {
            currentDirection = direction;
            renderSignalsTopSection();
            loadSignals();
        };

        function manualRefresh() {
            spinPageRefreshButton('refreshBtn');
            loadSignals({ refreshCounts: true, showLoadingState: false, force: true });
        }

        function changeRefreshInterval(seconds) {
            currentInterval = parseInt(seconds);

            // 清除旧的定时器
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }

            // 设置新的定时器（不弹提示）
            if (currentInterval > 0) {
                refreshTimer = setInterval(() => {
                    if (document.hidden) return;
                    loadSignals({ refreshCounts: false, showLoadingState: false });
                }, currentInterval * 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!await initAuth()) return;
            document.getElementById('signalsRefreshControl').innerHTML = renderPageRefreshControl({
                mode: 'polling',
                buttonId: 'refreshBtn',
                intervalId: 'refreshInterval',
                defaultSeconds: 30,
            });
            document.getElementById('contextBar').innerHTML = renderPageContextBar('📡 IBKR 主信号', {
                subtitle: '待确认 / 执行 / 订单 / 账户联动',
            });
            document.getElementById('nav').innerHTML = renderNav('/ibkr_signals.html');
            document.getElementById('datePicker').innerHTML = renderDatePicker();
            document.getElementById('directionTabs').innerHTML = renderDirectionTabs();

            // 解析 URL 参数（date / signal_id / search）
            const urlParams = new URLSearchParams(window.location.search);
            const urlDate = normalizeDateParam(urlParams.get('date'));
            const urlSignalId = urlParams.get('signal_id');
            const urlSearch = urlParams.get('search') || '';
            if (urlDate) {
                currentDate = urlDate;
                // 同步日期选择器的显示
                document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                const dateInput = document.getElementById('customDate');
                if (dateInput) dateInput.value = urlDate;
            }
            filterSignalId = normalizeSignalId(urlSignalId);
            selectedSignalId = filterSignalId;
            detailSignalId = filterSignalId;
            currentSearch = normalizeSignalId(urlSearch) || filterSignalId;
            setSearchInputValue(currentSearch);
            normalizeSignalFocusFromState();
            syncSignalsPageUrl();
            renderSignalsPageChrome();
            renderLatencySummary();

            await withPageLoading(
                () => loadSignals({ refreshCounts: true, showLoadingState: true }),
                {
                    title: '信号页加载中',
                    copy: '正在同步当天主信号与紧凑 pipeline 状态。',
                }
            );

            // 初始化定时刷新（默认30秒）
            changeRefreshInterval(30);

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && currentInterval > 0) {
                    loadSignals({ refreshCounts: false, showLoadingState: false });
                }
            });

            // 设置倒计时更新定时器（每秒更新一次）
            setInterval(updateCountdowns, 1000);

            // 滚动到底部自动加载更多
            let isLoadingMore = false;
            window.addEventListener('scroll', () => {
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const scrollHeight = document.documentElement.scrollHeight;
                const clientHeight = document.documentElement.clientHeight;

                // 距离底部 200px 时触发加载
                if (scrollTop + clientHeight >= scrollHeight - 200) {
                    if (!isLoadingMore && hasMore && !isLoadingSignals) {
                        isLoadingMore = true;
                        loadMoreSignals().finally(() => {
                            isLoadingMore = false;
                        });
                    }
                }
            });

            scrollSelectedSignalIntoView();
        });

        window.onEnvironmentChange = function(environment) {
            currentEnvironment = environment;
            currentBrokerMode = getConsoleBrokerMode();
            location.href = buildSignalsPageUrl();
        };
    </script>
</body>
</html>
