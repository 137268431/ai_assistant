<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>信号</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="common.js?v=20260528-night-session-review-entry-1"></script>
    <script>document.write(getCommonStyles());</script>
    <script>document.write('<style>' + getIndicatorModalStyles() + '</style>');</script>
    <link rel="stylesheet" href="/assets/css/ibkr-page-common.css">
    <link rel="stylesheet" href="/assets/css/pages/ibkr_signals/page.css">
</head>
<body>
    <div id="contextBar"></div>
    <div id="pageBridge"></div>
    <div id="pageTopSection"></div>

    <div class="content">
        <section class="signals-command-bar" id="signalsCommandBar">
            <div class="signals-command-main">
                <div>
                    <div class="signals-command-kicker">Signals</div>
                    <div class="signals-command-title">主信号池</div>
                    <div class="signals-command-copy">当天主信号 / 执行状态 / 订单联动</div>
                </div>
                <div class="signals-command-summary" id="signalsCommandSummary"></div>
            </div>
            <div class="signals-command-tools">
                <div class="signals-command-date" id="datePicker"></div>
                <input class="search-input signals-command-search" id="searchInput" placeholder="搜索股票/信号ID..." oninput="onSearchChange(this.value)">
                <a class="mini-link signals-analysis-link" id="signalsAnalysisLink" href="/ibkr_stats.html#signal-rule-analysis">今日分析</a>
                <div class="signals-command-refresh" id="signalsRefreshControl"></div>
            </div>
        </section>
        <div id="filterNote"></div>
        <div id="latencySummary" class="pipeline-strip"></div>
        <!-- 状态筛选 Tab -->
        <div class="status-tabs">
            <button class="status-tab active" data-status="all" onclick="selectStatus('all', this)">全部<span class="tab-count" data-status="all">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="awaiting_confirm" onclick="selectStatus('awaiting_confirm', this)">待确认<span class="tab-count" data-status="awaiting_confirm">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="pending" onclick="selectStatus('pending', this)">等待执行<span class="tab-count" data-status="pending">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="submitted" onclick="selectStatus('submitted', this)">已提交/挂单中<span class="tab-count" data-status="submitted">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="protected_active" onclick="selectStatus('protected_active', this)">持仓保护中<span class="tab-count" data-status="protected_active">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="protection_incomplete" onclick="selectStatus('protection_incomplete', this)">保护异常<span class="tab-count" data-status="protection_incomplete">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="executed" onclick="selectStatus('executed', this)">已执行<span class="tab-count" data-status="executed">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="closed" onclick="selectStatus('closed', this)">已平仓<span class="tab-count" data-status="closed">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="expired" onclick="selectStatus('expired', this)">已过期<span class="tab-count" data-status="expired">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="rejected" onclick="selectStatus('rejected', this)">已拒绝<span class="tab-count" data-status="rejected">(<span class="count-value">0</span>)</span></button>
        </div>

        <div id="directionTabs"></div>

        <div id="signalsContainer">
            <div class="loading">加载中...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreSignals()" style="display: none;">加载更多</button>
    </div>

    <div id="nav"></div>

    <!-- TV webhook 上下文浮层（复用 common.js 明细弹窗） -->
    <div id="indicatorModalContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const pb = createPocketBaseClient();
        let allSignals = [];
        let signalTabCountRecords = [];
        let signalIndicatorsMap = {}; // { signalRecordId: tv webhook context }
        let reverseSignalsMap = {};   // { symbol: [reverseSignals] }
        let currentDate = getCurrentEtDateString();
        let rangeStartDate = null;
        let rangeEndDate = null;
        let currentDirection = 'all';
        let currentStatus = 'all';
        let currentSearch = '';
        let filterSignalId = '';
        let selectedSignalId = '';
        let detailSignalId = '';
        let refreshTimer = null;
        let currentInterval = 30;
        let currentEnvironment = getSharedDataEnvironment();
        let currentBrokerMode = getConsoleBrokerMode();
        let currentSignalsRequestId = 0;

        // Pagination
        let currentPage = 1;
        const itemsPerPage = 10;
        let displayedSignals = [];
        let hasMore = false;
        let totalItems = 0;

        // Signal validity configuration (from config table, default 30 minutes)
        let signalValidityMinutes = 30;
        let realtimeLatencySnapshot = null;
        const CONFIG_CACHE_TTL_MS = 5 * 60 * 1000;
        const SIGNALS_FAST_CACHE_TTL_MS = 15000;
        const SIGNALS_DETAIL_CACHE_TTL_MS = 30000;
        const configValueCache = {};

        function pickConfigValue(records, fallbackValue) {
            const priority = { '': 0, global: 1, [currentBrokerMode]: 2, [currentEnvironment]: 1 };
            let bestRecord = null;
            let bestPriority = -1;

            records.forEach((record) => {
                const recordEnvironment = String(record.environment || '').trim().toLowerCase();
                const recordPriority = priority[recordEnvironment] ?? -1;
                if (recordPriority > bestPriority) {
                    bestPriority = recordPriority;
                    bestRecord = record;
                }
            });

            return bestRecord?.value ?? fallbackValue;
        }

        async function resolveConfigValue(key, fallbackValue) {
            const result = await fetchCollectionFullList('config', {
                filter: `key = "${escapeFilterValue(key)}" && (environment = "${currentBrokerMode}" || environment = "${currentEnvironment}" || environment = "global" || environment = "")`,
                sort: '-updated',
                maxPages: 2,
                cacheTtlMs: CONFIG_CACHE_TTL_MS
            });
            return pickConfigValue(result, fallbackValue);
        }

        async function loadConfigValue(key, fallbackValue, { force = false } = {}) {
            const dataCenter = window.IbkrDataCenter;
            const sharedCacheKey = typeof buildDataCacheKey === 'function'
                ? buildDataCacheKey('signalsConfigValue', { broker_mode: currentBrokerMode, data_environment: currentEnvironment, key, fallbackValue })
                : `signalsConfigValue:${currentBrokerMode}:${currentEnvironment}:${key}:${fallbackValue}`;
            if (dataCenter && typeof dataCenter.get === 'function') {
                return dataCenter.get(sharedCacheKey, () => resolveConfigValue(key, fallbackValue), {
                    ttlMs: CONFIG_CACHE_TTL_MS,
                    swrMs: CONFIG_CACHE_TTL_MS,
                    force,
                    tags: ['config', 'signals-page', currentBrokerMode, currentEnvironment]
                });
            }

            const cacheKey = `${currentBrokerMode}:${currentEnvironment}:${key}`;
            const cached = configValueCache[cacheKey];
            if (!force && cached && cached.expiresAt > Date.now()) {
                return cached.value;
            }
            const value = await resolveConfigValue(key, fallbackValue);
            configValueCache[cacheKey] = {
                value,
                expiresAt: Date.now() + CONFIG_CACHE_TTL_MS,
            };
            return value;
        }

        function getSignalsCollectionCacheTtl(collection) {
            if (collection === 'config') return CONFIG_CACHE_TTL_MS;
            if (collection === 'ibkr_reverse_signals') return SIGNALS_DETAIL_CACHE_TTL_MS;
            return SIGNALS_FAST_CACHE_TTL_MS;
        }

        function getSignalsCacheOptions(collection, options = {}) {
            const ttlMs = Number(options.cacheTtlMs || options.ttlMs || getSignalsCollectionCacheTtl(collection));
            return {
                ttlMs,
                swrMs: ttlMs,
                force: Boolean(options.force),
                tags: ['signals-page', collection, currentBrokerMode, currentEnvironment]
            };
        }

        async function fetchCollectionFullList(collection, options = {}) {
            const perPage = Math.max(1, Math.min(Number(options.perPage || 200), 200));
            const maxPages = Math.max(1, Number(options.maxPages || 20));
            const startPage = Math.max(1, Number(options.startPage || 1));
            const listOptions = {
                filter: options.filter || '',
                sort: options.sort || '',
                fields: options.fields || '',
                skipTotal: options.skipTotal,
                perPage,
                maxPages,
                startPage
            };
            const cacheOptions = getSignalsCacheOptions(collection, options);
            if (!options.noCache && startPage === 1 && typeof fetchCollectionFullListCached === 'function') {
                return fetchCollectionFullListCached(collection, listOptions, cacheOptions);
            }

            const items = [];

            for (let page = startPage; page <= maxPages; page += 1) {
                const params = {
                    filter: listOptions.filter,
                    sort: listOptions.sort,
                    fields: listOptions.fields,
                    skipTotal: listOptions.skipTotal,
                    perPage,
                    page
                };
                const result = !options.noCache && typeof cachedApiFetch === 'function'
                    ? await cachedApiFetch(collection, params, cacheOptions)
                    : await apiFetch(collection, params);
                const pageItems = Array.isArray(result?.items) ? result.items : [];
                items.push(...pageItems);
                if (pageItems.length < perPage) break;
            }

            return items;
        }

        function chunkArray(items, size) {
            const chunkSize = Math.max(1, Number(size || 1));
            const chunks = [];
            for (let index = 0; index < items.length; index += chunkSize) {
                chunks.push(items.slice(index, index + chunkSize));
            }
            return chunks;
        }

        async function loadSignalRealtimeQuotes(symbols, { force = false } = {}) {
            const loader = typeof fetchRealtimeQuotesIfNeeded === 'function'
                ? fetchRealtimeQuotesIfNeeded
                : fetchRealtimeQuotes;
            return loader(symbols, {
                reset: false,
                force,
                maxAgeMs: SIGNALS_FAST_CACHE_TTL_MS,
                swrMs: SIGNALS_FAST_CACHE_TTL_MS
            });
        }

        function buildSignalsPageUrl(overrides = {}) {
            const params = {
                date: currentDate,
                signal_id: filterSignalId || '',
                search: isSameSignalId(currentSearch, filterSignalId) ? '' : currentSearch || '',
                ...overrides
            };
            return buildPageUrl('/ibkr_signals.html', params);
        }

        function toJsStringLiteral(value) {
            return JSON.stringify(String(value ?? ''));
        }

        function cssEscapeValue(value) {
            if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(String(value ?? ''));
            return String(value ?? '').replace(/["\\]/g, '\\$&');
        }

        function normalizeSignalId(value) {
            return String(value || '').trim();
        }

        function isSameSignalId(a, b) {
            const left = normalizeSignalId(a).toUpperCase();
            const right = normalizeSignalId(b).toUpperCase();
            return Boolean(left && right && left === right);
        }

        function looksLikeSignalId(value) {
            return /^[A-Z0-9._-]+_\d{8}_\d{4}/i.test(normalizeSignalId(value));
        }

        function parseSignalIdSearch(value) {
            const text = normalizeSignalId(value);
            if (!text) return '';
            const exactMatch = text.match(/^signal_id\s*=\s*(.+)$/i);
            if (exactMatch) return normalizeSignalId(exactMatch[1]);
            return looksLikeSignalId(text) ? text : '';
        }

        function setSearchInputValue(value) {
            const input = document.getElementById('searchInput');
            if (input && input.value !== value) input.value = value;
        }

        function normalizeSignalFocusFromState() {
            const parsedSignalId = parseSignalIdSearch(currentSearch);
            if (parsedSignalId) {
                filterSignalId = parsedSignalId;
                selectedSignalId = parsedSignalId;
                currentSearch = parsedSignalId;
                setSearchInputValue(currentSearch);
                return;
            }
            if (filterSignalId) {
                selectedSignalId = filterSignalId;
                currentSearch = filterSignalId;
                setSearchInputValue(currentSearch);
                return;
            }
            selectedSignalId = '';
            detailSignalId = '';
        }

        function syncSignalsPageUrl() {
            const nextUrl = buildSignalsPageUrl();
            const currentUrl = `${window.location.pathname}${window.location.search}`;
            if (currentUrl !== nextUrl) {
                history.replaceState(null, '', nextUrl);
            }
        }

        async function initAuth() {
            const token = getToken();
            if (!token) {
                location.href = `/login.html?from=${encodeURIComponent(window.location.pathname + window.location.search)}`;
                return false;
            }
            pb.authStore.save(token, null);
            return true;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeFilterValue(value) {
            return String(value || '')
                .replace(/\\/g, '\\\\')
                .replace(/"/g, '\\"');
        }

        function formatNumber(value, digits = 0, fallback = '数据缺失') {
            const num = Number(value);
            if (!Number.isFinite(num)) return fallback;
            return num.toLocaleString('en-US', {
                minimumFractionDigits: digits,
                maximumFractionDigits: digits,
            });
        }

        function formatPrice(value, fallback = '数据缺失') {
            const num = Number(value);
            if (!Number.isFinite(num) || num <= 0) return fallback;
            return `$${formatNumber(num, 2)}`;
        }

        function toFiniteNumber(value) {
            if (value === null || value === undefined || value === '') return null;
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

        function firstFiniteNumber(...values) {
            for (const value of values) {
                const num = toFiniteNumber(value);
                if (num !== null) return num;
            }
            return null;
        }

        function firstPositiveNumber(...values) {
            for (const value of values) {
                const num = toFiniteNumber(value);
                if (num !== null && num > 0) return num;
            }
            return null;
        }

        function formatSignedMoney(value, fallback = '数据缺失') {
            const num = toFiniteNumber(value);
            if (num === null) return fallback;
            const sign = num > 0 ? '+' : (num < 0 ? '-' : '');
            return `${sign}$${formatNumber(Math.abs(num), 2)}`;
        }

        function pnlToneClass(value) {
            const num = toFiniteNumber(value);
            if (num === null || Math.abs(num) < 0.005) return 'flat';
            return num > 0 ? 'positive' : 'negative';
        }

        function formatTargetPriceWithPnlHtml(priceText, pnlText, tone) {
            if (!pnlText) return escapeHtml(priceText);
            return `${escapeHtml(priceText)} <span class="target-pnl-inline ${escapeHtml(tone || '')}">${escapeHtml(pnlText)}</span>`;
        }

        function formatSignedPercentHtml(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '<span style="color: var(--muted)">数据缺失</span>';
            const color = num > 0 ? 'var(--long)' : num < 0 ? 'var(--short)' : 'var(--muted)';
            const sign = num > 0 ? '+' : '';
            return `<span style="color:${color}">${sign}${num.toFixed(2)}%</span>`;
        }

        function formatChangeTripletHtml(dayPct, prevClosePct, change7d) {
            return [
                formatSignedPercentHtml(dayPct),
                formatSignedPercentHtml(prevClosePct),
                formatSignedPercentHtml(change7d),
            ].join(' / ');
        }

        function normalizeChartInterval(value, fallback = '5m') {
            const text = String(value || '').trim().toLowerCase();
            const map = {
                '5': '5m',
                '5m': '5m',
                '15': '15m',
                '15m': '15m',
                '30': '30m',
                '30m': '30m',
                '60': '1h',
                '60m': '1h',
                '1h': '1h',
                '1hr': '1h',
                '240': '4h',
                '240m': '4h',
                '4h': '4h',
                '1d': '1d',
                'd': '1d',
                'day': '1d'
            };
            return map[text] || fallback;
        }

        function buildSignalChartParams(signal) {
            if (!signal) return null;
            const extra = getSignalExtra(signal);
            const context = signalIndicatorsMap[signal.id] || buildTvSignalContext(signal);
            const symbol = String(context?.symbol || signal.symbol || '').trim().toUpperCase();
            if (!symbol) return null;
            const tvChartUrl = String(extra.tv_chart_url || context?.tv_chart_url || '').trim();
            return {
                symbol,
                interval: normalizeChartInterval(context?.interval || signal.interval, '5m'),
                bar_time_ms: Number(context?.bar_time_ms || signal.bar_time_ms || 0) || '',
                tv_chart_url: tvChartUrl
            };
        }

        function deriveLifecycleDateFromItem(item, fallback = '') {
            const candidates = [item?.date, item?.us_time, item?.created, item?.updated];
            for (const value of candidates) {
                const match = String(value || '').trim().match(/^(\d{4}-\d{2}-\d{2})/);
                if (match) return match[1];
            }
            const barTimeMs = Number(item?.bar_time_ms || 0);
            if (Number.isFinite(barTimeMs) && barTimeMs > 0) return getEtDateStringFromMs(barTimeMs);
            return fallback;
        }

        function buildSignalLifecycleFlowUrl(signal) {
            const params = buildSignalChartParams(signal);
            if (!params) return '';
            const extra = getSignalExtra(signal);
            const signalId = String(signal?.signal_id || extra.signal_id || '').trim();
            const tradeGroupId = getSignalTradeGroupId(signal);
            params.date = deriveLifecycleDateFromItem(signal, currentDate);
            params.trace = 1;
            if (signalId) params.signal_id = signalId;
            if (tradeGroupId) params.trade_group_id = tradeGroupId;
            return buildPageUrl('/ibkr_lifecycle_flow.html', params, { environment: currentEnvironment });
        }

        function getSignalTimeRange() {
            if (rangeStartDate && rangeEndDate) {
                const bounds = getEtDateRangeBoundsMs(rangeStartDate, rangeEndDate);
                return {
                    startTime: `${rangeStartDate} 00:00:00`,
                    endTime: `${rangeEndDate} 23:59:59`,
                    startTimeMs: bounds.startMs,
                    endTimeMs: bounds.endMs,
                };
            }

            const bounds = getEtDayBoundsMs(currentDate);
            return {
                startTime: `${currentDate} 00:00:00`,
                endTime: `${currentDate} 23:59:59`,
                startTimeMs: bounds.startMs,
                endTimeMs: bounds.endMs,
            };
        }

        function normalizeIndicatorIntervalValue(value) {
            const normalized = normalizeChartInterval(value, '5m');
            const map = {
                '5m': '5',
                '15m': '15',
                '30m': '30',
                '1h': '60',
                '4h': '240',
                '1d': 'D'
            };
            return map[normalized] || '5';
        }

        function buildSignalIndicatorKey(signal) {
            const symbol = String(signal?.symbol || '').trim().toUpperCase();
            const interval = normalizeIndicatorIntervalValue(signal?.interval);
            return symbol ? `${symbol}|${interval}` : '';
        }

        function buildTvSignalContext(signal) {
            const extra = getSignalExtra(signal);
            const snapshot = safeObject(extra.tv_snapshot);
            const symbol = String(signal?.symbol || snapshot.symbol || '').trim().toUpperCase();
            if (!symbol) return null;
            const interval = normalizeChartInterval(signal?.chart_tf || signal?.interval || extra.entry_tf || extra.chart_tf || snapshot.interval, '5m');
            const close = firstPositiveNumber(extra.close, snapshot.close, signal?.entry);
            return {
                id: signal?.id || signal?.signal_id || '',
                symbol,
                interval,
                bar_time_ms: Number(signal?.bar_time_ms || extra.bar_time_ms || snapshot.bar_time_ms || 0) || 0,
                close,
                trend_dir: extra.direction_bias === 'long' || signal?.direction === 'long' ? 1 : (extra.direction_bias === 'short' || signal?.direction === 'short' ? -1 : 0),
                atr_pct: firstPositiveNumber(extra.atr_pct, snapshot.atr_pct),
                sl_atr_ratio: firstPositiveNumber(extra.sl_atr_ratio, snapshot.sl_atr_ratio),
                day_change_pct: firstFiniteNumber(extra.day_change_pct, snapshot.day_change_pct),
                display_day_change_pct: firstFiniteNumber(extra.day_change_pct, snapshot.day_change_pct),
                display_prev_close_change_pct: firstFiniteNumber(extra.prev_close_change_pct, snapshot.prev_close_change_pct),
                display_change_7d: firstFiniteNumber(extra.change_7d, snapshot.change_7d),
                tv_chart_url: extra.tv_chart_url || snapshot.tv_chart_url || '',
                source: 'tradingview_webhook',
                raw_payload: snapshot,
            };
        }

        function formatSignalInterval(interval) {
            const raw = String(interval || '').trim();
            if (!raw) return '';
            const normalized = normalizeChartInterval(raw, raw.toLowerCase());
            const map = {
                '5m': '5m',
                '15m': '15m',
                '30m': '30m',
                '1h': '1h',
                '4h': '4h',
                '1d': '1d'
            };
            return map[normalized] || raw;
        }

        function normalizeDateParam(value, fallback = '') {
            const text = String(value || '').trim();
            return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : fallback;
        }

        function summarizeHeaderValue(value, maxLength = 28) {
            const text = String(value || '').trim();
            if (!text) return '';
            if (text.length <= maxLength) return text;
            return `${text.slice(0, Math.max(0, maxLength - 3))}...`;
        }

        function formatSignalStatusLabel(status = currentStatus) {
            const key = String(status || '').trim().toLowerCase();
            const map = {
                all: '全部状态',
                awaiting_confirm: '待确认',
                pending: '等待执行',
                submitted: '已提交/挂单中',
                protected_active: '持仓保护中',
                protection_incomplete: '保护异常',
                executed: '已执行',
                closed: '已平仓',
                expired: '已过期',
                rejected: '已拒绝',
            };
            return map[key] || status || '全部状态';
        }

        function getSignalsStatusLabel(status = currentStatus) {
            return formatSignalStatusLabel(status);
        }

        function hasDistinctSignalSearch() {
            return Boolean(currentSearch && !isSameSignalId(currentSearch, filterSignalId));
        }

        function getSignalsDirectionLabel(direction = currentDirection) {
            const map = {
                all: '全部方向',
                long: '做多',
                short: '做空',
            };
            return map[direction] || direction || '全部方向';
        }

        function getSignalsResultCount() {
            if (Number.isFinite(totalItems) && totalItems > 0) return totalItems;
            if (Array.isArray(allSignals) && allSignals.length) return allSignals.length;
            return 0;
        }

        function renderSignalsTopSection() {
            const scopeParts = [];
            if (filterSignalId) scopeParts.push(`signal_id=${summarizeHeaderValue(filterSignalId, 18)}`);
            if (hasDistinctSignalSearch()) scopeParts.push(`search=${summarizeHeaderValue(currentSearch, 24)}`);
            const scopeText = scopeParts.length ? scopeParts.join(' · ') : '无附加过滤';
            setPageContextMeta([
                { label: 'Broker', value: getEnvironmentLabel(currentBrokerMode), tone: currentBrokerMode },
                { label: 'Data', value: getEnvironmentLabel(currentEnvironment), tone: currentEnvironment },
                { label: '交易日', value: currentDate || '等待数据' },
                { label: '范围', value: scopeText },
            ]);
            const summaryNode = document.getElementById('signalsCommandSummary');
            if (summaryNode) {
                summaryNode.innerHTML = `
                <div class="chip-row">
                    <span class="status-chip"><span class="dot" style="color:#4FD1C5"></span>结果 ${escapeHtml(String(getSignalsResultCount()))}</span>
                    <span class="status-chip"><span class="dot" style="color:#63B3ED"></span>${escapeHtml(getSignalsDirectionLabel())}</span>
                    <span class="status-chip"><span class="dot" style="color:#F6AD55"></span>${escapeHtml(getSignalsStatusLabel())}</span>
                </div>
            `;
            }
            const analysisLink = document.getElementById('signalsAnalysisLink');
            if (analysisLink) {
                analysisLink.href = `${buildPageUrl('/ibkr_stats.html', {
                    date: currentDate,
                    broker_mode: currentBrokerMode,
                    data_environment: currentEnvironment,
                }, {
                    environment: currentEnvironment,

        function renderSignalsPageChrome() {

        function renderFilterNote() {
            const notes = [];
            if (filterSignalId) notes.push(`signal_id=${filterSignalId}`);

        function intervalToMs(interval) {
            const text = String(interval || '').trim().toLowerCase();
            const map = {
                '5': 5 * 60 * 1000,
                '5m': 5 * 60 * 1000,
                '15': 15 * 60 * 1000,
                '15m': 15 * 60 * 1000,
                '30': 30 * 60 * 1000,
                '30m': 30 * 60 * 1000,
                '60': 60 * 60 * 1000,
                '60m': 60 * 60 * 1000,
                '1h': 60 * 60 * 1000,
                '240': 4 * 60 * 60 * 1000,
                '240m': 4 * 60 * 60 * 1000,
                '4h': 4 * 60 * 60 * 1000,
                '1d': 24 * 60 * 60 * 1000,
                'd': 24 * 60 * 60 * 1000
            };
            return map[text] || 5 * 60 * 1000;
        }

        function parseTimestampMs(value) {
            if (value === null || value === undefined || value === '') return 0;
            if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
            const numeric = Number(value);
            if (Number.isFinite(numeric) && numeric > 1_000_000_000_000) return numeric;
            const parsed = Date.parse(String(value));
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function getSignalCloseTimeMs(signal) {
            const barTimeMs = Number(signal?.bar_time_ms || signal?.extra?.bar_time_ms || 0) || 0;
            if (!barTimeMs) return 0;
            return barTimeMs + intervalToMs(signal?.interval || signal?.chart_tf || signal?.extra?.chart_tf || '5m');
        }

        function getSignalCreatedMs(signal) {
            return parseTimestampMs(signal?.created);
        }

        function getSignalComputedAtMs(signal) {
            const extra = signal?.extra || {};
            return Number(extra.computed_at_ms || 0) || 0;
        }

        function getSignalFirstSentAtMs(signal) {
            const extra = signal?.extra || {};
            return Number(extra.feishu_signal_first_sent_at_ms || 0) || 0;
        }

        function getLatencyMs(fromMs, toMs) {
            const start = Number(fromMs || 0);
            const end = Number(toMs || 0);
            if (!start || !end || end < start) return 0;
            return end - start;
        }

        function formatLatency(ms, fallback = '计算中') {
            const value = Number(ms || 0);
            if (!Number.isFinite(value) || value <= 0) return fallback;
            if (value < 1000) return `${Math.round(value)}ms`;
            const totalSeconds = Math.round(value / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            if (hours > 0) return `${hours}h ${minutes}m ${seconds}s`;
            if (minutes > 0) return `${minutes}m ${seconds}s`;
            return `${seconds}s`;
        }

        function formatEventTime(ms, fallback = '等待数据') {
            return ms > 0 ? formatBarTimeMsToET(ms) : fallback;
        }

        function hasPositiveNumber(value) {
            const num = Number(value);
            return Number.isFinite(num) && num > 0;
        }

        function getIndicatorEmptyState(signal, latestIndicator) {
            if (latestIndicator) return '已接收';
            const status = getEffectiveSignalStatus(signal);
            if (status === 'expired') return '已过期';
            if (['awaiting_confirm', 'pending', 'submitted'].includes(status)) return '等待 TV';
            return '无 TV 上下文';
        }

        function formatSignalPrice(value, preferred = '数据缺失') {
            return hasPositiveNumber(value) ? formatPrice(value) : preferred;
        }

        function formatCurrentPrice(latestIndicator, signal) {
            return hasPositiveNumber(latestIndicator?.close)
                ? formatPrice(latestIndicator.close)
                : getIndicatorEmptyState(signal, latestIndicator);
        }

        function formatQuantityLabel(value) {
            const num = Number(value);
            return Number.isFinite(num) && num > 0 ? `${formatNumber(num, 0)} 股` : '数据缺失';
        }

        function formatPositionSizeLabel(entryPrice, shares) {
            return hasPositiveNumber(entryPrice) && hasPositiveNumber(shares)
                ? formatPrice(Number(entryPrice) * Number(shares))
                : '数据缺失';
        }

        function getSignalExtra(signal) {
            if (!signal?.extra) return {};
            if (typeof signal.extra === 'object') return signal.extra;
            if (typeof signal.extra === 'string') {
                try {
                    const parsed = JSON.parse(signal.extra);
                    return parsed && typeof parsed === 'object' ? parsed : {};
                } catch (_) {
                    return {};
                }
            }
            return {};
        }

        function getEffectiveSignalStatus(signal) {
            const extra = getSignalExtra(signal);
            const recordStatus = String(signal?.status || '').trim().toLowerCase();
            const note = String(signal?.note || extra.note || extra.status_reason || '').trim().toLowerCase();
            if (['closed', 'expired', 'rejected', 'protection_incomplete'].includes(recordStatus)) {
                return recordStatus;
            }
            if (note.startsWith('closed_by_') || note.includes('closed_by_manual_close')) {
                return 'closed';
            }
            const byMode = extra.execution_by_mode && typeof extra.execution_by_mode === 'object'
                ? extra.execution_by_mode
                : {};
            const envKeys = [
                currentBrokerMode,
                String(currentBrokerMode || '').toLowerCase(),
                String(currentBrokerMode || '').toUpperCase(),
            ].filter(Boolean);
            for (const key of envKeys) {
                const modeStatus = String(byMode[key]?.status || '').trim().toLowerCase();
                if (modeStatus) return modeStatus;
            }
            return recordStatus || 'pending';
        }

        function getEffectiveSignalExecution(signal) {
            const extra = getSignalExtra(signal);
            const byMode = extra.execution_by_mode && typeof extra.execution_by_mode === 'object'
                ? extra.execution_by_mode
                : {};
            const envKeys = [
                currentBrokerMode,
                String(currentBrokerMode || '').toLowerCase(),
                String(currentBrokerMode || '').toUpperCase(),
            ].filter(Boolean);
            for (const key of envKeys) {
                if (byMode[key] && typeof byMode[key] === 'object') {
                    return { key, payload: byMode[key] };
                }
            }
            return { key: '', payload: {} };
        }

        function humanizeSignalStatusReason(reason) {
            const code = String(reason || '').trim();
            const map = {
                target_direction_mismatch: '方向不匹配：信号方向与当日 active target 方向不一致',
                target_direction_missing: '缺少目标方向：当日 active target 未提供 long/short direction_bias',
                target_direction_provider_error: '目标方向读取失败：无法确认当日 active target 方向',
                trading_disabled: '交易开关关闭，自动开仓被禁用',
                outside_trade_window: '当前不在交易窗口内',
                outside_order_window: '当前不在下单窗口内',
                signal_expired: '信号已过有效期',
                sl_circuit_breaker: '止损熔断已触发',
                position_limit_reached: '持仓数量已达到上限',
                fixed_position_symbol_blocked: '固定持仓标的禁止自动开仓',
                strategy_capacity_full: '策略容量已满',
                direction_conflict: '已有同标的持仓或挂单，方向冲突',
                invalid_prices: '信号价格结构无效',
                entry_guard_no_fresh_quote: '下单前没有可用的新鲜报价',
                entry_guard_stop_already_crossed: '下单前价格已经穿过止损位',
                entry_guard_price_drift: '下单前价格相对信号入场价漂移过大',
                buying_power_blocked: '购买力阈值拦截',
                submit_failed: '订单提交失败',
            };
            if (!code) return '';
            return map[code] || code.replace(/_/g, ' ');
        }

        function getSignalExecutionReason(signal) {
            const extra = getSignalExtra(signal);
            const modeExecution = getEffectiveSignalExecution(signal);
            const payload = modeExecution.payload || {};
            const code = String(
                payload.status_reason
                || extra.rejection_reason_code
                || extra.status_reason
                || signal?.note
                || ''
            ).trim();
            const human = String(
                payload.status_reason_human
                || extra.rejection_reason_human
                || humanizeSignalStatusReason(code)
                || ''
            ).trim();
            return {
                brokerMode: modeExecution.key || String(currentBrokerMode || '').trim(),
                code,
                human,
                rejectedBy: String(extra.rejected_by || '').trim(),
                targetDirection: String(extra.target_direction_at_validation || '').trim(),
                signalDirection: String(extra.signal_direction_at_validation || signal?.direction || '').trim(),
            };
        }

        function buildSignalRejectionPanel(signal) {
            const status = getEffectiveSignalStatus(signal);
            const terminalStatuses = new Set(['rejected', 'expired', 'blocked', 'validation_rejected', 'submit_failed']);
            if (!terminalStatuses.has(status)) return '';
            const reason = getSignalExecutionReason(signal);
            const title = status === 'expired' ? '执行终止原因' : '拒绝原因';
            const summary = reason.human || formatSignalStatusLabel(status);
            const detailItems = [
                reason.code ? `code=${reason.code}` : '',
                reason.brokerMode ? `broker=${reason.brokerMode}` : '',
                reason.rejectedBy ? `by=${reason.rejectedBy}` : '',
                reason.signalDirection ? `signal=${reason.signalDirection}` : '',
                reason.targetDirection ? `target=${reason.targetDirection}` : '',
            ].filter(Boolean);
            return `
                <div class="signal-rejection-panel">
                    <div class="signal-rejection-head">
                        <strong>🚫 ${escapeHtml(title)}</strong>
                        <span>${escapeHtml(formatSignalStatusLabel(status))}</span>
                    </div>
                    <div class="signal-rejection-summary">${escapeHtml(summary)}</div>
                    ${detailItems.length ? `<div class="signal-rejection-detail">${escapeHtml(detailItems.join(' · '))}</div>` : ''}
                </div>
            `;
        }

        function getStatusClassName(status) {
            return String(status || 'pending').trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '_') || 'pending';
        }

        function shouldShowSignalNote(note) {
            const normalized = String(note || '').trim().toLowerCase();
            if (!normalized) return false;
	            const internalNotes = new Set([
	                'history_repair_pending',
	                'signal_expired',
                'confirm_too_late',
                'order_expired',
                'manual_rejected',
            ]);
            if (internalNotes.has(normalized)) return false;
            if (/^(paper|live):history_repair_pending$/.test(normalized)) return false;
            if (normalized.includes('history_repair_pending')) return false;
            if (normalized.includes('signal_expired')) return false;
            if (normalized.includes('confirm_too_late') || normalized.includes('order_expired')) return false;
            return true;
        }

        function getSignalTradeGroupId(signal) {
            const extra = getSignalExtra(signal);
            return String(
                signal?.trade_group_id
                || extra.trade_group_id
                || extra.bracket_group
                || extra.submit_failed_bracket_group
                || extra.old_trade_group_id
                || ''
            ).trim();
        }

        function getOrderExtra(order) {
            return order && order.extra && typeof order.extra === 'object' ? order.extra : {};
        }

        function getOrderNumber(order, ...keys) {
            const extra = getOrderExtra(order);
            for (const key of keys) {
                const direct = toFiniteNumber(order?.[key]);
                if (direct !== null) return direct;
                const nested = toFiniteNumber(extra?.[key]);
                if (nested !== null) return nested;
            }
            return null;
        }

        function getOrderText(order, ...keys) {
            const extra = getOrderExtra(order);
            for (const key of keys) {
                const direct = String(order?.[key] ?? '').trim();
                if (direct) return direct;
                const nested = String(extra?.[key] ?? '').trim();
                if (nested) return nested;
            }
            return '';
        }

        function normalizePnlOrderRole(order) {
            const role = getOrderText(order, 'role', 'order_type').toLowerCase();
            const uniqueId = getOrderText(order, 'unique_id', 'cOID', 'coid', 'orderRef', 'order_ref').toLowerCase();
            if (['tp', 'takeprofit', 'take_profit', 'profit_target', 'target'].includes(role) || uniqueId.startsWith('tp_')) return 'take_profit';
            if (['sl', 'stop', 'stoploss', 'stop_loss', 'repair_sl'].includes(role) || uniqueId.startsWith('sl_')) return 'stop_loss';
            if (['entry', 'main', 'parent'].includes(role) || uniqueId.startsWith('entry_')) return 'entry';
            if (role.includes('close') || uniqueId.startsWith('close_')) return 'close';
            return role;
        }

        function isFilledOrderStatus(order) {
            const status = getOrderText(order, 'status', 'order_status').toLowerCase();
            const filledQty = firstPositiveNumber(
                getOrderNumber(order, 'actual_filled_qty', 'filled_qty', 'filledQuantity')
            );
            return ['filled', 'executed', 'closed'].includes(status) || filledQty !== null;
        }

        function orderSortTime(order) {
            const extra = getOrderExtra(order);
            const ms = firstPositiveNumber(
                order?.fill_bar_time_ms,
                extra.fill_bar_time_ms,
                order?.bar_time_ms,
                extra.bar_time_ms
            );
            if (ms !== null) return ms;
            const parsed = Date.parse(
                order?.fill_time
                || extra.fill_time
                || extra.filled_us_time
                || order?.updated
                || order?.created
                || ''
            );
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function findEntryOrderForPnl(orders) {
            return (orders || [])
                .filter((order) => normalizePnlOrderRole(order) === 'entry')
                .sort((a, b) => orderSortTime(b) - orderSortTime(a))[0] || null;
        }

        function findExitOrderForPnl(orders) {
            return (orders || [])
                .filter((order) => {
                    const role = normalizePnlOrderRole(order);
                    return role && role !== 'entry' && isFilledOrderStatus(order);
                })
                .sort((a, b) => orderSortTime(b) - orderSortTime(a))[0] || null;
        }

        function sumOrderCommissions(orders) {
            return (orders || []).reduce((sum, order) => {
                const commission = getOrderNumber(order, 'commission');
                return sum + (commission === null ? 0 : Math.abs(commission));
            }, 0);
        }

        function absOrderCommission(order) {
            const value = firstFiniteNumber(
                getOrderNumber(order, 'commission'),
                getOrderNumber(order, 'ibkr_commission')
            );
            return value === null ? 0 : Math.abs(value);
        }

        function nonZeroPnlValue() {
            for (const value of arguments) {
                const num = toFiniteNumber(value);
                if (num !== null && Math.abs(num) > 0.000001) return num;
            }
            return null;
        }

        function computeDirectionalPnl(direction, entryPrice, exitPrice, quantity) {
            const entry = toFiniteNumber(entryPrice);
            const exit = toFiniteNumber(exitPrice);
            const qty = toFiniteNumber(quantity);
            if (entry === null || exit === null || qty === null || entry <= 0 || exit <= 0 || qty <= 0) return null;
            const side = String(direction || '').trim().toLowerCase();
            const perShare = side === 'short' ? entry - exit : exit - entry;
            return perShare * Math.abs(qty);
        }

        function getRelatedOrdersForSignal(signal) {
            const tradeGroupId = getSignalTradeGroupId(signal);
            const keys = [
                String(signal?.signal_id || '').trim(),
                tradeGroupId ? `tg:${tradeGroupId}` : '',
            ].filter(Boolean);
            const seen = new Set();
            const rows = [];
            keys.forEach((key) => {
                (ordersMap[key] || []).forEach((order) => {
                    const id = String(order?.id || order?.unique_id || order?.order_id || order?.broker_order_id || JSON.stringify(order));
                    if (seen.has(id)) return;
                    seen.add(id);
                    rows.push(order);
                });
            });
            return rows;
        }

        function latestRelatedOrderByRole(orders, roles) {
            const roleSet = new Set((roles || []).map((role) => String(role || '').trim().toLowerCase()));
            return (orders || [])
                .filter((order) => roleSet.has(normalizePnlOrderRole(order)))
                .sort((a, b) => orderSortTime(b) - orderSortTime(a))[0] || null;
        }

        function resolveSignalDisplayEntryPrice(signal, relatedOrders = []) {
            const extra = getSignalExtra(signal);
            const entryOrder = latestRelatedOrderByRole(relatedOrders, ['entry']);
            return firstPositiveNumber(
                getOrderNumber(entryOrder, 'limit_price', 'price', 'lmtPrice'),
                getOrderNumber(entryOrder, 'fill_price', 'filled_price', 'avgPrice', 'avg_fill_price'),
                extra.submitted_entry,
                extra.submitted_entry_limit_price,
                extra.entry_limit_price,
                signal?.entry,
                extra.entry
            );
        }

        function resolveSignalDisplayTakeProfitPrice(signal, relatedOrders = []) {
            const extra = getSignalExtra(signal);
            const tpOrder = latestRelatedOrderByRole(relatedOrders, ['take_profit']);
            return firstPositiveNumber(
                getOrderNumber(tpOrder, 'limit_price', 'tp_price', 'price', 'lmtPrice'),
                extra.take_profit_order_price,
                extra.order_flow_take_profit,
                extra.submitted_take_profit,
                extra.initial_take_profit,
                signal?.take_profit,
                extra.take_profit
            );
        }

        function resolveSignalDisplayStopLossPrice(signal, relatedOrders = []) {
            const extra = getSignalExtra(signal);
            const slOrder = latestRelatedOrderByRole(relatedOrders, ['stop_loss']);
            return firstPositiveNumber(
                getOrderNumber(slOrder, 'sl_price', 'limit_price', 'stop_price', 'auxPrice', 'price'),
                extra.stop_loss_order_price,
                extra.order_flow_stop_loss,
                extra.submitted_stop_loss,
                extra.initial_stop_loss,
                signal?.stop_loss,
                extra.stop_loss
            );
        }

        function roleLabelForPnl(role) {
            const normalized = String(role || '').trim().toLowerCase();
            if (normalized === 'take_profit') return 'TP成交';
            if (normalized === 'stop_loss') return 'SL成交';
            if (normalized === 'close') return '平仓成交';
            return normalized ? normalized : '退出成交';
        }

        function buildClosedSignalPnl(signal, latestIndicator, relatedOrders = []) {
            const extra = getSignalExtra(signal);
            const direction = signal?.direction || extra.direction || '';
            const signalEntryPrice = firstPositiveNumber(
                signal?.executed_price,
                extra.executed_price,
                extra.entry_fill_price,
                signal?.entry,
                extra.entry
            );
            const signalQuantity = firstPositiveNumber(
                extra.exit_fill_quantity,
                extra.filled_qty,
                signal?.shares,
                extra.shares,
                extra.quantity
            );
            const signalExitPrice = firstPositiveNumber(
                signal?.exit_price,
                extra.exit_fill_price,
                extra.exit_price,
                extra.closed_price,
                extra.close_price
            );
            const explicitPnl = firstFiniteNumber(
                extra.realized_pnl_net,
                extra.realized_net_pnl,
                signal?.realized_pnl,
                extra.realized_pnl,
                extra.actual_pnl,
                extra.exit_pnl,
                signal?.pnl,
                extra.pnl
            );
            if (explicitPnl !== null) {
                return {
                    value: explicitPnl,
                    label: '实际盈亏',
                    estimated: false,
                    source: extra.realized_pnl_source || extra.actual_pnl_source || '已记录',
                    exitPrice: signalExitPrice,
                    quantity: signalQuantity,
                    role: extra.exit_fill_role || extra.closed_by || '',
                    commission: firstFiniteNumber(extra.total_commission, extra.commission),
                    entryCommission: firstFiniteNumber(extra.entry_commission),
                    exitCommission: firstFiniteNumber(extra.exit_commission),
                };
            }

            const exitOrder = findExitOrderForPnl(relatedOrders);
            const entryOrder = findEntryOrderForPnl(relatedOrders);
            if (exitOrder) {
                const role = normalizePnlOrderRole(exitOrder);
                const storedGrossPnl = nonZeroPnlValue(
                    getOrderNumber(exitOrder, 'realized_pnl_net', 'realized_net_pnl'),
                    getOrderNumber(exitOrder, 'realized_pnl', 'actual_pnl', 'pnl')
                );
                const entryCommission = absOrderCommission(entryOrder);
                const exitCommission = absOrderCommission(exitOrder);
                const commission = sumOrderCommissions(relatedOrders);
                const exitPrice = firstPositiveNumber(
                    getOrderNumber(exitOrder, 'fill_price', 'filled_price', 'avgPrice', 'avgFillPrice'),
                    getOrderNumber(exitOrder, 'limit_price', 'price'),
                    signalExitPrice
                );
                const entryPrice = firstPositiveNumber(
                    getOrderNumber(entryOrder, 'fill_price', 'filled_price', 'avgPrice', 'avgFillPrice'),
                    getOrderNumber(entryOrder, 'limit_price', 'price'),
                    signalEntryPrice
                );
                const quantity = firstPositiveNumber(
                    getOrderNumber(exitOrder, 'filled_qty', 'filledQuantity', 'quantity'),
                    signalQuantity
                );
                const computed = computeDirectionalPnl(direction, entryPrice, exitPrice, quantity);
                const gross = storedGrossPnl !== null ? storedGrossPnl : computed;
                if (gross !== null) {
                    return {
                        value: gross - commission,
                        label: '实际盈亏',
                        estimated: false,
                        source: roleLabelForPnl(role),
                        exitPrice,
                        quantity,
                        role,
                        commission,
                        entryCommission,
                        exitCommission,
                    };
                }
            }

            if (signalExitPrice !== null && signalEntryPrice !== null && signalQuantity !== null) {
                const value = computeDirectionalPnl(direction, signalEntryPrice, signalExitPrice, signalQuantity);
                if (value !== null) {
                    return {
                        value,
                        label: '实际盈亏',
                        estimated: false,
                        source: extra.exit_fill_role ? roleLabelForPnl(extra.exit_fill_role) : '信号成交价',
                        exitPrice: signalExitPrice,
                        quantity: signalQuantity,
                        role: extra.exit_fill_role || '',
                    };
                }
            }

            const currentPrice = firstPositiveNumber(latestIndicator?.close, extra.close);
            const estimatedValue = computeDirectionalPnl(direction, signalEntryPrice, currentPrice, signalQuantity);
            if (estimatedValue !== null) {
                return {
                    value: estimatedValue,
                    label: '估算盈亏',
                    estimated: true,
                    source: '按当前价估算',
                    exitPrice: currentPrice,
                    quantity: signalQuantity,
                    role: '',
                };
            }
            return null;
        }

        function buildPnlDetailText(model) {
            if (!model) return '等待成交价回填';
            const parts = [];
            if (model.source) parts.push(model.source);
            if (model.exitPrice) parts.push(`退出 ${formatPrice(model.exitPrice)}`);
            if (model.quantity) parts.push(`${formatNumber(model.quantity, 0)}股`);
            if (model.entryCommission) parts.push(`买/开手续费 ${formatPrice(model.entryCommission)}`);
            if (model.exitCommission) parts.push(`卖/平手续费 ${formatPrice(model.exitCommission)}`);
            if (model.commission && !model.entryCommission && !model.exitCommission) parts.push(`手续费 ${formatPrice(model.commission)}`);
            if (model.estimated) parts.push('待成交价回填');
            return parts.join(' · ') || '等待成交价回填';
        }

        function buildSignalPnlPanelHtml(signal, closedPnl, expectedProfitText, expectedLossText) {
            const isClosed = getEffectiveSignalStatus(signal) === 'closed';
            if (isClosed) {
                const valueText = closedPnl ? formatSignedMoney(closedPnl.value) : '数据缺失';
                const tone = closedPnl ? pnlToneClass(closedPnl.value) : 'flat';
                const detailText = closedPnl ? buildPnlDetailText(closedPnl) : '未找到退出成交价 / 数量';
                const rightLabel = closedPnl?.estimated ? '估算依据' : '退出价 / 数量';
                return `

                        </div>

                `;
            }
            return '';
        }

        function averageLatency(signals, getter) {
            const values = (Array.isArray(signals) ? signals : [])
                .map((signal) => Number(getter(signal) || 0))
                .filter((value) => Number.isFinite(value) && value > 0);
            if (!values.length) return { avgMs: 0, count: 0 };
            const total = values.reduce((sum, value) => sum + value, 0);
            return {
                avgMs: total / values.length,
                count: values.length,
            };
        }

        function resolveLatencyTone(kind, ms) {
            const value = Number(ms || 0);
            if (!Number.isFinite(value) || value <= 0) return 'muted';

            const seconds = value / 1000;
            const thresholds = {
                freshness: { ok: 120, warn: 300 },
                ingest: { ok: 5, warn: 15 },
                compute: { ok: 15, warn: 45 },
                write: { ok: 30, warn: 90 }
            };
            const limit = thresholds[kind] || thresholds.compute;
            if (seconds <= limit.ok) return 'ok';
            if (seconds <= limit.warn) return 'warn';
            return 'alert';
        }

        function resolveLatencyFocusSymbol() {
            const symbols = [...new Set((Array.isArray(allSignals) ? allSignals : []).map((signal) => String(signal?.symbol || '').trim().toUpperCase()).filter(Boolean))];
            return symbols.length === 1 ? symbols[0] : '';
        }

        function resolveExplicitLatencySymbol() {
            const text = String(currentSearch || '').trim().toUpperCase();
            return text && /^[A-Z][A-Z0-9._-]{0,14}$/.test(text) ? text : '';
        }

        function resolveLatencyCandidateSymbols(limit = 24) {
            const explicitSymbol = resolveExplicitLatencySymbol();
            if (explicitSymbol) return [explicitSymbol];
            const focusedSymbol = resolveLatencyFocusSymbol();
            if (focusedSymbol) return [focusedSymbol];

            const records = Array.isArray(allSignals) ? [...allSignals] : [];
            records.sort((a, b) => {
                const bMs = Math.max(getSignalCloseTimeMs(b), getSignalCreatedMs(b));
                const aMs = Math.max(getSignalCloseTimeMs(a), getSignalCreatedMs(a));
                return bMs - aMs;
            });

            const symbols = [];
            const seen = new Set();
            records.forEach((signal) => {
                const symbol = String(signal?.symbol || '').trim().toUpperCase();
                if (!symbol || seen.has(symbol) || symbols.length >= limit) return;
                seen.add(symbol);
                symbols.push(symbol);
            });
            return symbols;
        }

        function buildLatencySymbolFilter(symbols) {
            const cleanSymbols = [...new Set((Array.isArray(symbols) ? symbols : [])
                .map((symbol) => String(symbol || '').trim().toUpperCase())
                .filter(Boolean))];
            if (!cleanSymbols.length) return '';
            if (cleanSymbols.length === 1) {
                return `symbol = "${escapeFilterValue(cleanSymbols[0])}"`;
            }
            return `(${cleanSymbols.map((symbol) => `symbol = "${escapeFilterValue(symbol)}"`).join(' || ')})`;
        }

        function parseRecordExtra(record) {
            const extra = record?.extra;
            if (!extra) return {};
            if (typeof extra === 'object') return extra;
            try {
                return JSON.parse(String(extra));
            } catch (error) {
                return {};
            }
        }

        function getBarSource(record) {
            const extra = parseRecordExtra(record);
            const raw = extra.source || extra.sources || extra.ingest_source || '';
            return Array.isArray(raw) ? raw.join(',').toLowerCase() : String(raw || '').toLowerCase();
        }

        function getIndicatorLatencyFallback(latestBar) {
            const source = getBarSource(latestBar);
            return source.includes('backfill') && !source.includes('close') ? '未纳入本轮' : '计算中';
        }

        function resolveSignalsWorkspaceFocusSymbol() {

        async function loadRealtimeLatencySnapshot(requestId = 0) {
            const conditions = [
                `environment = "${currentEnvironment}"`,
                `date = "${currentDate}"`,
            ];
            const focusSymbol = resolveSignalsWorkspaceFocusSymbol();
            if (focusSymbol) {
                conditions.push(`symbol = "${escapeFilterValue(focusSymbol)}"`);
            }

            const params = {
                filter: conditions.join(' && '),
                sort: '-created',
                perPage: 1,
                page: 1
            };
            const response = typeof cachedApiFetch === 'function'
                ? await cachedApiFetch('tv_webhook_events', params, {
                    ttlMs: SIGNALS_FAST_CACHE_TTL_MS,
                    swrMs: SIGNALS_FAST_CACHE_TTL_MS,
                    tags: ['signals-page', 'tv-webhook-events', currentEnvironment]
                })
                : await apiFetch('tv_webhook_events', params);
            if (requestId && requestId !== currentSignalsRequestId) return;

            const latestEvent = Array.isArray(response?.items) ? response.items[0] : null;
            if (!latestEvent) {
                realtimeLatencySnapshot = null;
                renderLatencySummary();
                return;
            }

            const eventMs = Number(latestEvent.bar_time_ms || latestEvent.extra?.bar_time_ms || 0) || parseTimestampMs(latestEvent.created);
            const createdMs = parseTimestampMs(latestEvent.created);
            realtimeLatencySnapshot = {
                symbol: String(latestEvent.symbol || '').trim().toUpperCase(),
                eventType: String(latestEvent.event_type || '').trim(),
                routeStatus: String(latestEvent.status || '').trim(),
                barTimeMs: eventMs,
                barCloseMs: eventMs,
                dataFreshnessMs: eventMs > 0 ? Math.max(0, Date.now() - eventMs) : 0,
                barIngestDelayMs: getLatencyMs(eventMs, createdMs),
                indicatorComputeDelayMs: 0,
                indicatorComputeFallback: latestEvent.event_type || '等待 TV webhook',
            };
            renderLatencySummary();
        }

        function getSignalOrderStatusBadge(orders) {
            if (!orders || orders.length === 0) return '';

            const getRole = (order) => order.role || order.extra?.role || '';
            const getStatus = (order) => String(order.status || '').trim().toLowerCase();
            const hasExitFill = orders.some(order => getRole(order) !== 'entry' && getStatus(order) === 'filled');
            const hasEntryFill = orders.some(order => getRole(order) === 'entry' && getStatus(order) === 'filled');
            const hasWorkingOrder = orders.some(order => ['init', 'submitted', 'presubmitted'].includes(getStatus(order)));
            const allEnded = orders.every(order => ['canceled', 'cancelled', 'closed'].includes(getStatus(order)));

            if (hasExitFill) {
                return '<span class="indicator-badge badge-long">✅ 已退出</span>';
            }
            if (hasEntryFill) {
                return '<span class="indicator-badge" style="background:rgba(72,187,120,0.18);color:var(--long);">📦 持仓中</span>';
            }
            if (hasWorkingOrder) {
                return '<span class="indicator-badge" style="background:rgba(246,173,85,0.2);color:var(--pending);">⏳ 已提交/挂单中</span>';
            }
            if (allEnded) {
                return '<span class="indicator-badge" style="background:rgba(113,128,150,0.2);color:var(--rejected);">🔒 已结束</span>';
            }
            return '<span class="indicator-badge" style="background:rgba(246,173,85,0.2);color:var(--pending);">📋 有订单</span>';
        }

        async function loadSignals({ refreshCounts = true, showLoadingState = true, force = false } = {}) {
            // 防止重复调用
            if (isLoadingSignals) return;
            normalizeSignalFocusFromState();
            syncSignalsPageUrl();
            isLoadingSignals = true;
            const requestId = ++currentSignalsRequestId;

            // 重置为第一页
            currentPage = 1;

            try {
                // Load signal validity configuration from config table
                try {
                    const configValue = await loadConfigValue('signal_validity_minutes', '30', { force });
                    signalValidityMinutes = parseInt(configValue, 10) || 30;
                    console.log('[Signals] signal_validity_minutes 配置值:', signalValidityMinutes, 'broker=', currentBrokerMode, 'data=', currentEnvironment);
                } catch (e) {
                    console.warn('[Signals] 无法读取 signal_validity_minutes 配置，使用默认值 30 分钟:', e);
                    signalValidityMinutes = 30;
                }
                const { startTime, endTime } = getSignalTimeRange();

                // 构建 filter 条件（使用 us_time 而非 created，因为 created 是服务器时间）
                const conditions = [`environment = "${currentEnvironment}"`, `us_time >= "${startTime}"`, `us_time <= "${endTime}"`];

                if (filterSignalId) {
                    conditions.push(`signal_id = "${escapeFilterValue(filterSignalId)}"`);
                }

                // 状态筛选需要使用 broker/environment-specific effective status，保留给客户端过滤。

                // 方向筛选
                if (currentDirection !== 'all') {
                    conditions.push(`direction = "${currentDirection}"`);
                }

                // 搜索筛选（symbol 或 signal_id）
                if (hasDistinctSignalSearch()) {
                    const s = escapeFilterValue(currentSearch);
                    conditions.push(`(symbol ~ "${s}" || signal_id ~ "${s}")`);
                }

                const filter = conditions.join(' && ');

                // 使用分页 API，每次请求 100 条用于统计
                const page = currentPage;
                const perPage = 10;

                if (showLoadingState) {
                    showLoading('加载中...');
                }
                let loadedViaEffectiveStatus = false;
                let result = null;
                if (currentStatus !== 'all') {
                    loadedViaEffectiveStatus = true;
                    signalTabCountRecords = await loadSignalsForTabCounts();
                    if (requestId !== currentSignalsRequestId) return;
                    allSignals = signalTabCountRecords;
                } else {
                    const signalParams = {
                        filter,
                        sort: '-created',
                        perPage,
                        page
                    };
                    result = typeof cachedApiFetch === 'function'
                        ? await cachedApiFetch('ibkr_signals', signalParams, {
                            ttlMs: SIGNALS_FAST_CACHE_TTL_MS,
                            swrMs: SIGNALS_FAST_CACHE_TTL_MS,
                            force,
                            tags: ['signals-page', currentBrokerMode, currentEnvironment]
                        })
                        : await apiFetch('ibkr_signals', signalParams);
                    if (requestId !== currentSignalsRequestId) return;
                    allSignals = Array.isArray(result?.items) ? result.items : [];
                }
                signalIndicatorsMap = {};
                reverseSignalsMap = {};
                ordersMap = {};
                await loadSignalRealtimeQuotes(allSignals.map((signal) => signal.symbol), { force }).catch((error) => {
                    console.warn('加载实时行情失败:', error);
                });
                await loadOrdersMap({ force }).catch((error) => {
                    console.warn('加载订单映射失败:', error);
                });

                // 更新分页状态
                hasMore = loadedViaEffectiveStatus ? false : allSignals.length === perPage;
                totalItems = loadedViaEffectiveStatus ? getFilteredSignals().length : result.totalItems;
                displayedSignals = allSignals;

                renderSignalsPageChrome();
                renderLatencySummary();
                renderSignals();
                updateLoadMoreButton();
                setPageRefreshTime();
                if (loadedViaEffectiveStatus) {
                    updateStatusTabCounts();
                    updateDirectionTabCounts();
                }

                loadRealtimeLatencySnapshot(requestId)
                    .catch((error) => {
                        console.error('加载延迟摘要失败:', error);
                    });

                // TV webhook 上下文从信号 extra 后台补齐，不阻塞首屏。
                loadSignalIndicatorsForSignals(allSignals, { replace: true, requestId })
                    .then(() => {
                        if (requestId !== currentSignalsRequestId) return;
                        renderSignals();
                        updateCountdowns();
                    })
                    .catch((error) => {
                        console.error('后台加载 TV 上下文失败:', error);
                    });

                // Tab 数量仍保留，但不再跟随每次自动刷新全量重查。
                if (refreshCounts && !loadedViaEffectiveStatus) {
                    loadSignalsForTabCounts()
                        .then((records) => {
                            if (requestId !== currentSignalsRequestId) return;
                            signalTabCountRecords = records;
                            updateStatusTabCounts();
                            updateDirectionTabCounts();
                        })
                        .catch((error) => {
                            console.error('加载 tab 统计失败:', error);
                        });
                }
            } catch (error) {
                console.error('加载失败:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                showToast('加载失败: ' + error.message);
            } finally {
                isLoadingSignals = false;
                if (showLoadingState) {
                    hideLoading();
                }
            }
        }

        // 日期范围筛选函数
        function applyDateRange() {
            const startInput = document.getElementById('rangeStartDate').value;
            const endInput = document.getElementById('rangeEndDate').value;

            if (!startInput || !endInput) {
                showToast('请选择开始日期和结束日期');
                return;
            }

            if (new Date(startInput) > new Date(endInput)) {
                showToast('开始日期不能晚于结束日期');
                return;
            }

            // 清除单日期选中状态
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));

            rangeStartDate = startInput;
            rangeEndDate = endInput;

            loadSignals();

        async function loadSignalIndicatorsForSignals(signals, { replace = false, requestId = 0 } = {}) {
            const records = Array.isArray(signals) ? signals : [];
            if (replace) {
                signalIndicatorsMap = {};
            }
            if (!records.length) return;
            if (requestId && requestId !== currentSignalsRequestId) return;

            const nextMap = replace ? {} : { ...signalIndicatorsMap };
            records.forEach((signal) => {
                const context = buildTvSignalContext(signal);
                if (context) {
                    nextMap[signal.id] = context;
                }
            });
            signalIndicatorsMap = nextMap;
        }

        // 加载反向信号映射（按 symbol 分组）
        async function loadReverseSignalsMap() {
            reverseSignalsMap = {};

            // 获取当前信号列表每个 symbol 的最新创建时间
            const latestSignalTimeBySymbol = {};
            allSignals.forEach(s => {
                if (s.symbol && s.created) {
                    if (!latestSignalTimeBySymbol[s.symbol] || new Date(s.created) > new Date(latestSignalTimeBySymbol[s.symbol])) {
                        latestSignalTimeBySymbol[s.symbol] = s.created;
                    }
                }
            });

            const symbols = Object.keys(latestSignalTimeBySymbol);
            if (symbols.length === 0) return;

            // 找到所有 symbol 中信号的最早时间（确保不漏掉任何反向信号）
            const earliestTime = Object.values(latestSignalTimeBySymbol).reduce((min, time) => {
                return new Date(time) < new Date(min) ? time : min;
            }, '');

            const { startTimeMs, endTimeMs } = getSignalTimeRange();

            try {
                const latestBySymbol = {};
                for (const symbolChunk of chunkArray(symbols, 12)) {
                    const symbolFilter = symbolChunk.map(s => `symbol = "${escapeFilterValue(s)}"`).join(' || ');
                    const rows = await fetchCollectionFullList('ibkr_reverse_signals', {
                        filter: `environment = "${currentBrokerMode}" && (${symbolFilter}) && status = "confirmed" && bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}`,
                        sort: '-created',
                        maxPages: 4
                    });

                    rows.forEach((item) => {
                        const signalTime = latestSignalTimeBySymbol[item.symbol];
                        if (signalTime && new Date(item.created) > new Date(signalTime) && !latestBySymbol[item.symbol]) {
                            latestBySymbol[item.symbol] = item;
                        }
                    });
                }

                // 按 symbol 建立映射
                Object.keys(latestBySymbol).forEach(symbol => {
                    reverseSignalsMap[symbol] = [latestBySymbol[symbol]];
                });

                console.log('[ReverseSignals] 加载完成:', reverseSignalsMap);
            } catch (error) {
                console.error('加载反向信号失败:', error);
            }
        }

        // 加载订单映射（按 signal_id / trade_group_id 分组）
        let ordersMap = {};
        async function loadOrdersMap({ force = false } = {}) {
            ordersMap = {};

            // 获取当前信号的 signal_id 和 trade_group_id，便于已平仓卡片回查退出成交。
            const signalIds = [...new Set(allSignals.map(s => s.signal_id).filter(id => id))];
            const tradeGroupIds = [...new Set(allSignals.map(getSignalTradeGroupId).filter(id => id))];
            if (signalIds.length === 0 && tradeGroupIds.length === 0) return;

            const { startTimeMs, endTimeMs } = getSignalTimeRange();

            try {
                const addOrderToMap = (order) => {
                    if (order.signal_id) {
                        if (!ordersMap[order.signal_id]) {
                            ordersMap[order.signal_id] = [];
                        }
                        ordersMap[order.signal_id].push(order);
                    }
                    if (order.trade_group_id) {
                        const tradeGroupKey = `tg:${order.trade_group_id}`;
                        if (!ordersMap[tradeGroupKey]) {
                            ordersMap[tradeGroupKey] = [];
                        }
                        ordersMap[tradeGroupKey].push(order);
                    }
                };

                for (const idChunk of chunkArray(signalIds, 8)) {
                    const idFilter = idChunk.map(id => `signal_id = "${escapeFilterValue(id)}"`).join(' || ');
                    const rows = await fetchCollectionFullList('orders', {
                        filter: `environment = "${currentBrokerMode}" && (${idFilter}) && bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}`,
                        sort: '-bar_time_ms,-created',
                        maxPages: 6,
                        force
                    });
                    rows.forEach(addOrderToMap);
                }

                for (const groupChunk of chunkArray(tradeGroupIds, 8)) {
                    const groupFilter = groupChunk.map(id => `trade_group_id = "${escapeFilterValue(id)}"`).join(' || ');
                    const rows = await fetchCollectionFullList('orders', {
                        filter: `environment = "${currentBrokerMode}" && (${groupFilter}) && bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}`,
                        sort: '-bar_time_ms,-created',
                        maxPages: 6,
                        force
                    });
                    rows.forEach(addOrderToMap);
                }

                console.log('[Orders] 加载完成:', ordersMap);
            } catch (error) {
                console.error('加载订单失败:', error);
            }
        }

        // 更新状态标签的数量显示（通过API查询真实count）
        async function updateStatusTabCounts() {
            const statuses = ['awaiting_confirm', 'pending', 'submitted', 'protected_active', 'protection_incomplete', 'executed', 'closed', 'expired', 'rejected'];
            const counts = {};

            try {
                const records = Array.isArray(signalTabCountRecords) ? signalTabCountRecords : [];
                counts['all'] = 0;
                statuses.forEach(status => {
                    counts[status] = 0;
                });
                records.forEach(signal => {
                    if (currentDirection !== 'all' && signal.direction !== currentDirection) {
                        return;
                    }
                    counts['all']++;
                    const status = getEffectiveSignalStatus(signal);
                    if (counts[status] !== undefined) counts[status]++;
                });
            } catch (e) {
