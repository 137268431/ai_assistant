<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to /orders.html</title>
    <script>
        (function() {
            var target = '/orders.html' + (window.location.search || '') + (window.location.hash || '');
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Page moved to <a href="/orders.html">/orders.html</a>.</p>
</body>
</html>
