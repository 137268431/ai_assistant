<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>技术指标</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <script>document.write('<style>' + getIndicatorModalStyles() + '</style>');</script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        .search-row {
            margin-bottom: 6px;
        }

        .search-row > div:first-child {
            margin-bottom: 4px;
        }

        .search-row .date-picker {
            margin-bottom: 0;
            gap: 6px;
        }

        .search-row .date-btn {
            padding: 6px 10px;
            font-size: 11px;
        }

        .search-row .refresh-control {
            gap: 4px;
        }

        .search-row .refresh-btn {
            padding: 4px 6px;
            font-size: 12px;
        }

        .search-row .refresh-select {
            padding: 4px 6px;
            font-size: 11px;
        }

        .search-input {
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .status-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 8px 0;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .indicator-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .indicator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .indicator-symbol {
            font-size: 18px;
            font-weight: 700;
        }

        .indicator-time {
            font-size: 12px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .indicator-time-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .indicator-subtime {
            font-size: 11px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .indicator-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .indicator-meta-chip {
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--surface2);
            color: var(--muted);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .indicator-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .indicator-section {
            background: var(--surface2);
            padding: 12px;
            border-radius: 8px;
        }

        .section-title {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
        }

        .indicator-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .indicator-label {
            color: var(--muted);
        }

        .indicator-value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .indicator-badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0 0 12px;
        }

        .indicator-interval {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--surface2);
            color: var(--accent);
        }

        .indicator-footer {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
        }

        .load-more-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more-btn:active {
            background: var(--surface);
        }

        .load-more-btn:disabled {
            color: var(--muted);
            cursor: not-allowed;
        }

        .date-range-picker {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
        }

        .date-range-picker input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .date-range-picker input::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
        }

        .date-range-picker span {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .apply-range-btn {
            padding: 10px 14px;
            background: var(--accent);
            border: none;
            color: var(--bg);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            white-space: nowrap;
        }

        .apply-range-btn:hover {
            opacity: 0.9;
        }

        .refresh-control {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:active {
            color: var(--accent);
            border-color: var(--accent);
        }

        .refresh-select {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            cursor: pointer;
        }

        .refresh-select:focus {
            border-color: var(--accent);
        }

        .interval-filter {
            width: 70px;
            padding: 10px 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            cursor: pointer;
        }

        .interval-filter:focus {
            border-color: var(--accent);
        }

        .indicator-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .btn-view {
            background: var(--accent);
            color: var(--bg);
        }

        .btn-view:active {
            background: #4299e1;
        }

        .btn-chart {
            background: rgba(72,187,120,0.18);
            color: var(--long);
            border: 1px solid rgba(72,187,120,0.24);
        }

        .chart-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .chart-modal-overlay.show {
            display: flex;
        }

        .chart-modal-content {
            width: min(1080px, 100%);
            max-height: 90vh;
            overflow: auto;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(8,12,20,0.98), rgba(14,20,32,0.98));
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.42);
            padding: 16px;
        }

        .chart-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .chart-modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .chart-modal-copy {
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .chart-modal-close {
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            border-radius: 10px;
            width: 36px;
            height: 36px;
            font-size: 20px;
            cursor: pointer;
        }

        .chart-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .chart-summary-chip {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(99,179,237,0.1);
            border: 1px solid rgba(99,179,237,0.12);
            color: var(--muted);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
        }

        .chart-canvas {
            width: 100%;
            height: 680px;
            border-radius: 14px;
            background: rgba(8,12,20,0.9);
        }

        .chart-empty {
            display: grid;
            place-items: center;
            height: 320px;
            color: var(--muted);
            font-size: 13px;
        }

        .chart-note {
            margin-top: 10px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.6;
            font-family: 'JetBrains Mono', monospace;
        }

        @media (max-width: 760px) {
            .chart-canvas {
                height: 560px;
            }
            .indicator-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-label">INDICATORS</div>
                <div class="logo-title">📈 技术指标</div>
            </div>
            <div id="environmentHeader"></div>
        </div>
    </div>

    <div class="content">
        <div class="search-row">
            <div style="display:flex;gap:8px;align-items:center;">
                <div id="datePicker" style="flex:1;"></div>
                <select class="interval-filter" id="intervalFilter" onchange="onIntervalChange()">
                    <option value="">全部</option>
                    <option value="5">5m</option>
                    <option value="15">15m</option>
                    <option value="30">30m</option>
                    <option value="60">1H</option>
                    <option value="240">4H</option>
                    <option value="D">D</option>
                </select>
                <div class="refresh-control">
                    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄</button>
                    <select class="refresh-select" id="refreshInterval" onchange="changeRefreshInterval(this.value)">
                        <option value="0">关闭</option>
                        <option value="5">5秒</option>
                        <option value="30" selected>30秒</option>
                        <option value="60">1分钟</option>
                    </select>
                </div>
            </div>
            <input type="text" class="search-input" id="searchBox" placeholder="🔍 搜索标的 / 交易所 / 脚本 / PB记录ID..." oninput="onSearchChange(this.value)">
        </div>
        <div id="filterNote"></div>

        <div id="indicatorsContainer"><div class="loading">加载中...</div></div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreIndicators()" style="display: none;">加载更多</button>
    </div>

    <!-- 技术指标详情浮层（由 common.js 动态注入） -->
    <div id="indicatorModalContainer"></div>
    <div id="indicatorChartModalContainer"></div>

    <!-- Bottom Nav -->
    <div id="navContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const PB_URL = BASE_URL;
        let allIndicators = [];
        let currentDate = getCurrentEtDateString();
        let rangeStartDate = null;
        let rangeEndDate = null;
        let currentSearch = '';
        let refreshTimer = null;
        let currentInterval = 30;
        let currentPage = 1;
        const itemsPerPage = 10;
        let hasMore = false;
        let totalItems = 0;
        let currentEnvironment = getCurrentRuntimeEnvironment();
        let indicatorChartInstance = null;

        function renderFilterNote() {
            const notes = [`env=${getEnvironmentLabel(currentEnvironment)}`];
            if (currentSearch) notes.push(`search=${currentSearch}`);
            const intervalFilter = document.getElementById('intervalFilter')?.value || '';
            if (intervalFilter) notes.push(`interval=${intervalFilter}`);
            document.getElementById('filterNote').innerHTML = `<div class="filter-note">当前过滤: ${escapeHtml(notes.join(' · '))}</div>`;
        }

        function getCurrentEtDateString() {
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/New_York',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(new Date());
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeFilterValue(value) {
            return String(value ?? '').replace(/\\/g, '\\\\').replace(/"/g, '\\"');
        }

        function formatNumber(value, digits = 2) {
            const num = Number(value);
            return Number.isFinite(num) ? num.toFixed(digits) : '-';
        }

        function formatPrice(value) {
            const num = Number(value);
            return Number.isFinite(num) ? `$${num.toFixed(2)}` : '-';
        }

        function formatVolume(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num.toLocaleString() : '-';
        }

        function formatSignedPercent(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '-';
            return `${num > 0 ? '+' : ''}${num.toFixed(2)}%`;
        }

        function getSignedColor(value) {
            const num = Number(value);
            if (!Number.isFinite(num) || num === 0) return 'var(--text)';
            return num > 0 ? 'var(--long)' : 'var(--short)';
        }

        function getIntervalLabel(interval) {
            const intervalMap = { '5': '5m', '15': '15m', '30': '30m', '60': '1H', '240': '4H', 'D': '日' };
            return intervalMap[interval] || interval || '';
        }

        function getTrendText(value) {
            const num = Number(value);
            if (num === 1) return '📈 多头';
            if (num === -1) return '📉 空头';
            return '➡️ 中性';
        }

        function getAtrSummary(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '-';
            if (num >= 3) return `${num.toFixed(2)}% ⚡高`;
            if (num >= 1.5) return `${num.toFixed(2)}% 〜中`;
            return `${num.toFixed(2)}% ·低`;
        }

        function getDateRange() {
            if (rangeStartDate && rangeEndDate) {
                return { startDate: rangeStartDate, endDate: rangeEndDate };
            }
            return { startDate: currentDate, endDate: currentDate };
        }

        function syncDatePickerUI(selectedDate) {
            const input = document.getElementById('customDate');
            if (input) input.value = selectedDate;
            document.querySelectorAll('.date-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.date === selectedDate && !rangeStartDate && !rangeEndDate);
            });
        }

        function buildIndicatorFilter() {
            const { startDate, endDate } = getDateRange();
            const conditions = [
                `environment = "${escapeFilterValue(currentEnvironment)}"`,
                `us_time >= "${escapeFilterValue(startDate)} 00:00"`,
                `us_time <= "${escapeFilterValue(endDate)} 23:59:59"`,
            ];

            const intervalFilter = document.getElementById('intervalFilter')?.value || '';
            if (intervalFilter) {
                conditions.push(`interval = "${escapeFilterValue(intervalFilter)}"`);
            }

            if (currentSearch) {
                const term = escapeFilterValue(currentSearch.toUpperCase());
                conditions.push(`(symbol ~ "${term}" || exchange ~ "${term}" || script_tag ~ "${term}" || id ~ "${term}")`);
            }

            return conditions.join(' && ');
        }

        async function fetchIndicatorsPage(page) {
            const token = getToken();
            if (!token) {
                window.location.href = `/login.html?from=${encodeURIComponent(window.location.pathname + window.location.search)}`;
                return null;
            }

            const filter = buildIndicatorFilter();
            const response = await fetch(
                `${PB_URL}/api/collections/ibkr_indicators/records?perPage=${itemsPerPage}&page=${page}&sort=-bar_time_ms,-created&filter=${encodeURIComponent(filter)}`,
                { headers: { 'Authorization': token } }
            );

            if (response.status === 401 || response.status === 403) {
                handleAuthError();
                return null;
            }
            if (!response.ok) {
                throw new Error(`加载失败 (${response.status})`);
            }

            return response.json();
        }

        window.onDateChange = function(startDate) {
            currentDate = startDate;
            rangeStartDate = null;
            rangeEndDate = null;
            const rangeStartEl = document.getElementById('rangeStartDate');
            const rangeEndEl = document.getElementById('rangeEndDate');
            if (rangeStartEl) rangeStartEl.value = '';
            if (rangeEndEl) rangeEndEl.value = '';
            syncDatePickerUI(startDate);
            loadIndicators();
        };

        function applyDateRange() {
            const startInput = document.getElementById('rangeStartDate').value;
            const endInput = document.getElementById('rangeEndDate').value;

            if (!startInput || !endInput) {
                showToast('请选择开始日期和结束日期');
                return;
            }

            if (new Date(startInput) > new Date(endInput)) {
                showToast('开始日期不能晚于结束日期');
                return;
            }

            document.querySelectorAll('.date-btn').forEach((b) => b.classList.remove('active'));
            rangeStartDate = startInput;
            rangeEndDate = endInput;
            loadIndicators();
        }

        async function loadIndicators() {
            try {
                document.getElementById('indicatorsContainer').innerHTML = '<div class="loading">加载中...</div>';
                currentPage = 1;

                const data = await fetchIndicatorsPage(1);
                if (!data) return;

                allIndicators = (data.items || []).map((item) => normalizeIndicatorRecord(item)).filter(Boolean);
                totalItems = data.totalItems || allIndicators.length;
                hasMore = allIndicators.length < totalItems;

                renderFilterNote();
                renderIndicators();
                updateLoadMoreButton();
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('indicatorsContainer').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">加载失败: ${escapeHtml(error.message)}</div></div>`;
            }
        }

        function onIntervalChange() {
            renderFilterNote();
            loadIndicators();
        }

        function updateLoadMoreButton() {
            const btn = document.getElementById('loadMoreBtn');
            const loaded = allIndicators.length;
            btn.style.display = loaded > 0 && hasMore ? 'block' : 'none';
            btn.textContent = hasMore ? `加载更多 (${loaded}/${totalItems})` : `已加载全部 (${loaded}/${totalItems || loaded})`;
            btn.disabled = !hasMore;
        }

        async function loadMoreIndicators() {
            if (!hasMore) return;
            try {
                const nextPage = currentPage + 1;
                const data = await fetchIndicatorsPage(nextPage);
                if (!data) return;

                currentPage = nextPage;
                const appended = (data.items || []).map((item) => normalizeIndicatorRecord(item)).filter(Boolean);
                allIndicators = [...allIndicators, ...appended];
                totalItems = data.totalItems || totalItems;
                hasMore = allIndicators.length < totalItems;

                renderIndicators();
                updateLoadMoreButton();
            } catch (error) {
                console.error('加载更多失败:', error);
            }
        }

        let searchDebounceTimer = null;

        function onSearchChange(val) {
            currentSearch = val.trim();
            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                document.getElementById('indicatorsContainer').innerHTML = '<div class="loading">搜索中...</div>';
                renderFilterNote();
                loadIndicators();
            }, 300);
        }

        function renderIndicators() {
            const container = document.getElementById('indicatorsContainer');

            if (!allIndicators.length) {
                container.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">${currentSearch ? '未找到匹配指标' : '暂无指标数据'}</div></div>`;
                return;
            }

            container.innerHTML = allIndicators.map((indicator) => {
                const badgesHtml = buildIndicatorBadges(null, indicator);
                const dayChange = Number(indicator.day_change_pct);
                const prevCloseChange = Number(indicator.prev_close_change_pct);
                const vwapDist = Number(indicator.vwap_dist);
                const createdText = indicator.created ? formatBeijingTime(indicator.created, 'short') : '-';

                return `
                    <div class="indicator-card" onclick="showIndicatorDetails('${escapeHtml(indicator.id)}')" style="cursor:pointer;">
                        <div class="indicator-header">
                            <div>
                                <div class="indicator-symbol">${escapeHtml(indicator.symbol)} ${getIntervalLabel(indicator.interval) ? `<span class="indicator-interval">${escapeHtml(getIntervalLabel(indicator.interval))}</span>` : ''}</div>
                                <div class="indicator-meta">
                                    ${indicator.exchange ? `<span class="indicator-meta-chip">${escapeHtml(indicator.exchange)}</span>` : ''}
                                    ${indicator.script_tag ? `<span class="indicator-meta-chip">${escapeHtml(indicator.script_tag)}</span>` : ''}
                                    <span class="indicator-meta-chip">PB ${escapeHtml(indicator.id)}</span>
                                </div>
                            </div>
                            <div class="indicator-time-stack">
                                <div class="indicator-time">${escapeHtml(indicator.us_time || '-')}</div>
                                <div class="indicator-subtime">${escapeHtml(indicator.cn_time || '-')}</div>
                            </div>
                        </div>
                        ${badgesHtml ? `<div class="indicator-badge-row">${badgesHtml}</div>` : ''}
                        <div class="indicator-grid">
                            <div class="indicator-section">
                                <div class="section-title">价格波动</div>
                                <div class="indicator-row"><span class="indicator-label">收盘 / 开盘</span><span class="indicator-value">${formatPrice(indicator.close)} / ${formatPrice(indicator.open)}</span></div>
                                <div class="indicator-row"><span class="indicator-label">最高 / 最低</span><span class="indicator-value">${formatPrice(indicator.high)} / ${formatPrice(indicator.low)}</span></div>
                                <div class="indicator-row"><span class="indicator-label">日内 / 较昨</span><span class="indicator-value" style="color:${getSignedColor(dayChange)}">${formatSignedPercent(dayChange)} / <span style="color:${getSignedColor(prevCloseChange)}">${formatSignedPercent(prevCloseChange)}</span></span></div>
                                <div class="indicator-row"><span class="indicator-label">ATR / 波动率</span><span class="indicator-value">${formatPrice(indicator.atr)} / ${getAtrSummary(indicator.atr_pct)}</span></div>
                            </div>
                            <div class="indicator-section">
                                <div class="section-title">趋势结构</div>
                                <div class="indicator-row"><span class="indicator-label">趋势 / EMA</span><span class="indicator-value">${getTrendText(indicator.trend_dir)} / ${indicator.ema_bullish ? '📈 多头' : indicator.ema_bearish ? '📉 空头' : '➡️ 中性'}</span></div>
                                <div class="indicator-row"><span class="indicator-label">VWAP / 偏离</span><span class="indicator-value">${formatPrice(indicator.vwap)} / <span style="color:${getSignedColor(vwapDist)}">${formatSignedPercent(vwapDist)}</span></span></div>
                                <div class="indicator-row"><span class="indicator-label">DTP / SD</span><span class="indicator-value">${escapeHtml(indicator.dtp_phase || 'N/A')} / ${Number(indicator.sd_zone) === 1 ? '超买' : Number(indicator.sd_zone) === -1 ? '超卖' : '正常'}</span></div>
                                <div class="indicator-row"><span class="indicator-label">触及 / 分形</span><span class="indicator-value">${indicator.ema_bull_touch ? 'EMA↑' : indicator.ema_bear_touch ? 'EMA↓' : '无'} / ${indicator.fractal_bull ? '分形↑' : indicator.fractal_bear ? '分形↓' : '无'}</span></div>
                            </div>
                            <div class="indicator-section">
                                <div class="section-title">动量背离</div>
                                <div class="indicator-row"><span class="indicator-label">CRSI / OBV RSI</span><span class="indicator-value">${formatNumber(indicator.crsi)} / ${formatNumber(indicator.obv_rsi)}</span></div>
                                <div class="indicator-row"><span class="indicator-label">CRSI 背离</span><span class="indicator-value">${indicator.crsi_bull_div ? '✅ 多' : indicator.crsi_bear_div ? '✅ 空' : '❌ 无'}</span></div>
                                <div class="indicator-row"><span class="indicator-label">OBV 背离</span><span class="indicator-value">${indicator.obv_bull_div ? '✅ 多' : indicator.obv_bear_div ? '✅ 空' : '❌ 无'}</span></div>
                                <div class="indicator-row"><span class="indicator-label">7日涨跌</span><span class="indicator-value" style="color:${getSignedColor(indicator.change_7d)}">${formatSignedPercent(indicator.change_7d)}</span></div>
                            </div>
                            <div class="indicator-section">
                                <div class="section-title">补充信息</div>
                                <div class="indicator-row"><span class="indicator-label">成交量</span><span class="indicator-value">${formatVolume(indicator.volume)}</span></div>
                                <div class="indicator-row"><span class="indicator-label">bar_index</span><span class="indicator-value">${escapeHtml(indicator.bar_index ?? '-')}</span></div>
                                <div class="indicator-row"><span class="indicator-label">bar_time_ms</span><span class="indicator-value">${escapeHtml(indicator.bar_time_ms ?? '-')}</span></div>
                                <div class="indicator-row"><span class="indicator-label">创建时间</span><span class="indicator-value">${escapeHtml(createdText)}</span></div>
                            </div>
                        </div>
                        <div class="indicator-footer">
                            <span>Interval ${escapeHtml(getIntervalLabel(indicator.interval) || '-')}</span>
                            <span>${escapeHtml(indicator.script_tag || '无脚本标记')}</span>
                        </div>
                        <div class="indicator-actions">
                            <button class="action-btn btn-view" type="button" onclick="showIndicatorDetailsFromButton(event, '${escapeHtml(indicator.id)}')">详情</button>
                            <button class="action-btn btn-chart" type="button" onclick="openIndicatorChart(event, '${escapeHtml(indicator.id)}')">图表</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showIndicatorDetails(indicatorId) {
            const indicator = allIndicators.find((item) => item.id === indicatorId);
            if (!indicator) return;
            showIndicatorModal(indicator);
        }

        function showIndicatorDetailsFromButton(event, indicatorId) {
            if (event) event.stopPropagation();
            showIndicatorDetails(indicatorId);
        }

        function ensureIndicatorChartModal() {
            if (document.getElementById('indicatorChartModal')) return;
            document.getElementById('indicatorChartModalContainer').innerHTML = `
                <div class="chart-modal-overlay" id="indicatorChartModal" onclick="if(event.target===this)window.closeIndicatorChart()">
                    <div class="chart-modal-content">
                        <div class="chart-modal-header">
                            <div>
                                <div class="chart-modal-title" id="indicatorChartTitle">指标图</div>
                                <div class="chart-modal-copy">主图展示价格 / EMA / VWAP / 买卖点，副图展示 CRSI / OBV RSI / ATR / Volume。</div>
                            </div>
                            <button class="chart-modal-close" type="button" onclick="window.closeIndicatorChart()">×</button>
                        </div>
                        <div class="chart-summary" id="indicatorChartSummary"></div>
                        <div class="chart-canvas" id="indicatorChartCanvas"><div class="chart-empty">图表加载中...</div></div>
                        <div class="chart-note" id="indicatorChartNote"></div>
                    </div>
                </div>
            `;
        }

        function formatChartLabel(item) {
            if (item?.us_time) return String(item.us_time).slice(5, 16);
            const ms = Number(item?.bar_time_ms || 0);
            if (!ms) return '--';
            const date = new Date(ms);
            if (Number.isNaN(date.getTime())) return '--';
            return `${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')} ${String(date.getUTCHours()).padStart(2, '0')}:${String(date.getUTCMinutes()).padStart(2, '0')}`;
        }

        function buildSignalScatter(signals, bars, priceResolver, color) {
            const indexByMs = new Map(bars.map((bar, index) => [Number(bar.bar_time_ms || 0), index]));
            return signals.map((signal) => {
                const barMs = Number(signal.bar_time_ms || 0);
                const xIndex = indexByMs.get(barMs);
                if (xIndex === undefined) return null;
                const yValue = Number(priceResolver(signal) || 0);
                if (!Number.isFinite(yValue) || yValue <= 0) return null;
                return {
                    value: [xIndex, yValue],
                    itemStyle: { color },
                    name: signal.signal || signal.direction || '',
                    signal_id: signal.signal_id || '',
                };
            }).filter(Boolean);
        }

        function renderIndicatorChart(indicator, bars, indicators, signals) {
            const title = document.getElementById('indicatorChartTitle');
            const summary = document.getElementById('indicatorChartSummary');
            const canvas = document.getElementById('indicatorChartCanvas');
            const note = document.getElementById('indicatorChartNote');
            const symbol = indicator.symbol || '--';
            const interval = indicator.interval || '--';

            title.textContent = `${symbol} · ${interval} 指标图`;

            if (!Array.isArray(bars) || !bars.length) {
                if (indicatorChartInstance) {
                    indicatorChartInstance.dispose();
                    indicatorChartInstance = null;
                }
                canvas.innerHTML = '<div class="chart-empty">暂无可绘制的 bars / indicators 历史数据</div>';
                summary.innerHTML = '';
                note.textContent = '图表需要先有 ibkr_bars 与 ibkr_indicators 的历史记录。';
                return;
            }

            const sortedBars = bars.slice().sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0));
            const indicatorMap = new Map((indicators || []).map((item) => [Number(item.bar_time_ms || 0), item]));
            const barMap = new Map(sortedBars.map((item) => [Number(item.bar_time_ms || 0), item]));
            const categories = sortedBars.map((bar) => formatChartLabel(bar));
            const candle = sortedBars.map((bar) => [
                Number(bar.open || 0),
                Number(bar.close || 0),
                Number(bar.low || 0),
                Number(bar.high || 0),
            ]);
            const emaFast = sortedBars.map((bar) => Number(indicatorMap.get(Number(bar.bar_time_ms || 0))?.ema_fast ?? null));
            const emaSlow = sortedBars.map((bar) => Number(indicatorMap.get(Number(bar.bar_time_ms || 0))?.ema_slow ?? null));
            const emaTrend = sortedBars.map((bar) => Number(indicatorMap.get(Number(bar.bar_time_ms || 0))?.ema_trend ?? null));
            const vwap = sortedBars.map((bar) => Number(indicatorMap.get(Number(bar.bar_time_ms || 0))?.vwap ?? null));
            const crsi = sortedBars.map((bar) => Number(indicatorMap.get(Number(bar.bar_time_ms || 0))?.crsi ?? null));
            const obvRsi = sortedBars.map((bar) => Number(indicatorMap.get(Number(bar.bar_time_ms || 0))?.obv_rsi ?? null));
            const atrPct = sortedBars.map((bar) => Number(indicatorMap.get(Number(bar.bar_time_ms || 0))?.atr_pct ?? null));
            const volume = sortedBars.map((bar) => Number(bar.volume || 0));
            const longSignals = buildSignalScatter(
                (signals || []).filter((item) => String(item.direction || '').toLowerCase() === 'long'),
                sortedBars,
                (signal) => signal.entry || signal.limit_price || barMap.get(Number(signal.bar_time_ms || 0))?.close,
                '#48BB78'
            );
            const shortSignals = buildSignalScatter(
                (signals || []).filter((item) => String(item.direction || '').toLowerCase() === 'short'),
                sortedBars,
                (signal) => signal.entry || signal.limit_price || barMap.get(Number(signal.bar_time_ms || 0))?.close,
                '#FC8181'
            );

            summary.innerHTML = [
                `<span class="chart-summary-chip">${escapeHtml(symbol)} · ${escapeHtml(getIntervalLabel(interval) || interval)}</span>`,
                `<span class="chart-summary-chip">${sortedBars.length} bars</span>`,
                `<span class="chart-summary-chip">${(signals || []).length} signals</span>`,
                `<span class="chart-summary-chip">${escapeHtml(sortedBars[0]?.us_time || '--')} → ${escapeHtml(sortedBars[sortedBars.length - 1]?.us_time || '--')}</span>`
            ].join('');
            note.textContent = '主图覆盖买卖点散点；5m 以外周期通常没有信号点，这时只展示价格与指标轨迹。';

            if (indicatorChartInstance) {
                indicatorChartInstance.dispose();
            }
            canvas.innerHTML = '';
            indicatorChartInstance = echarts.init(canvas);
            indicatorChartInstance.setOption({
                animation: false,
                backgroundColor: 'transparent',
                legend: {
                    type: 'scroll',
                    top: 0,
                    textStyle: { color: '#8BA4C4', fontSize: 10 }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    backgroundColor: 'rgba(8,12,20,0.96)',
                    borderColor: 'rgba(99,179,237,0.16)',
                    textStyle: { color: '#E2EAF4' }
                },
                axisPointer: {
                    link: [{ xAxisIndex: 'all' }]
                },
                grid: [
                    { left: 48, right: 56, top: 44, height: '48%' },
                    { left: 48, right: 56, top: '58%', height: '14%' },
                    { left: 48, right: 56, top: '78%', height: '14%' }
                ],
                dataZoom: [
                    { type: 'inside', xAxisIndex: [0, 1, 2], start: 55, end: 100 },
                    { type: 'slider', xAxisIndex: [0, 1, 2], bottom: 8, height: 18, borderColor: 'rgba(99,179,237,0.12)', textStyle: { color: '#8BA4C4' } }
                ],
                xAxis: [
                    { type: 'category', data: categories, scale: true, boundaryGap: true, axisLine: { lineStyle: { color: '#30435E' } }, axisLabel: { color: '#8BA4C4', fontSize: 10 }, splitLine: { show: false } },
                    { type: 'category', gridIndex: 1, data: categories, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#30435E' } }, splitLine: { show: false } },
                    { type: 'category', gridIndex: 2, data: categories, axisLabel: { color: '#8BA4C4', fontSize: 10 }, axisLine: { lineStyle: { color: '#30435E' } }, splitLine: { show: false } }
                ],
                yAxis: [
                    { scale: true, splitLine: { lineStyle: { color: 'rgba(99,179,237,0.06)' } }, axisLabel: { color: '#8BA4C4', fontSize: 10 } },
                    { gridIndex: 1, min: 0, max: 100, splitLine: { lineStyle: { color: 'rgba(99,179,237,0.06)' } }, axisLabel: { color: '#8BA4C4', fontSize: 10 } },
                    { gridIndex: 2, splitLine: { show: false }, axisLabel: { color: '#8BA4C4', fontSize: 10 } },
                    { gridIndex: 2, position: 'right', splitLine: { show: false }, axisLabel: { color: '#8BA4C4', fontSize: 10, formatter: '{value}%' } }
                ],
                series: [
                    { name: 'Price', type: 'candlestick', data: candle, itemStyle: { color: '#48BB78', color0: '#FC8181', borderColor: '#48BB78', borderColor0: '#FC8181' } },
                    { name: 'EMA 20', type: 'line', data: emaFast, symbol: 'none', smooth: true, lineStyle: { width: 1.3, color: '#63B3ED' } },
                    { name: 'EMA 50', type: 'line', data: emaSlow, symbol: 'none', smooth: true, lineStyle: { width: 1.2, color: '#F6AD55' } },
                    { name: 'EMA 100', type: 'line', data: emaTrend, symbol: 'none', smooth: true, lineStyle: { width: 1.1, color: '#A78BFA' } },
                    { name: 'VWAP', type: 'line', data: vwap, symbol: 'none', smooth: true, lineStyle: { width: 1.1, color: '#68D391' } },
                    { name: 'LONG Signal', type: 'scatter', data: longSignals, symbolSize: 10 },
                    { name: 'SHORT Signal', type: 'scatter', data: shortSignals, symbolSize: 10 },
                    { name: 'CRSI', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: crsi, symbol: 'none', lineStyle: { width: 1.2, color: '#48BB78' }, markLine: { symbol: 'none', lineStyle: { color: 'rgba(246,173,85,0.4)' }, data: [{ yAxis: 80 }, { yAxis: 20 }] } },
                    { name: 'OBV RSI', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: obvRsi, symbol: 'none', lineStyle: { width: 1.2, color: '#F6AD55' } },
                    { name: 'Volume', type: 'bar', xAxisIndex: 2, yAxisIndex: 2, data: volume, itemStyle: { color: 'rgba(99,179,237,0.42)' } },
                    { name: 'ATR %', type: 'line', xAxisIndex: 2, yAxisIndex: 3, data: atrPct, symbol: 'none', lineStyle: { width: 1.2, color: '#FC8181' } }
                ]
            });
        }

        async function openIndicatorChart(event, indicatorId) {
            if (event) event.stopPropagation();
            const indicator = allIndicators.find((item) => item.id === indicatorId);
            if (!indicator) return;

            ensureIndicatorChartModal();
            document.getElementById('indicatorChartModal').classList.add('show');
            document.getElementById('indicatorChartTitle').textContent = `${indicator.symbol} · ${indicator.interval} 指标图`;
            document.getElementById('indicatorChartSummary').innerHTML = '';
            document.getElementById('indicatorChartCanvas').innerHTML = '<div class="chart-empty">图表加载中...</div>';
            document.getElementById('indicatorChartNote').textContent = '正在拉取 bars / indicators / signals ...';

            try {
                const cappedMs = Number(indicator.bar_time_ms || Date.now()) || Date.now();
                const baseFilter = `environment = "${escapeQueryValue(currentEnvironment)}" && symbol = "${escapeQueryValue(indicator.symbol)}" && interval = "${escapeQueryValue(indicator.interval)}" && bar_time_ms <= ${cappedMs}`;
                const [barsResp, indicatorsResp] = await Promise.all([
                    apiFetch('ibkr_bars', { filter: baseFilter, sort: '-bar_time_ms', perPage: 180 }),
                    apiFetch('ibkr_indicators', { filter: baseFilter, sort: '-bar_time_ms', perPage: 180 }),
                ]);
                const bars = Array.isArray(barsResp?.items) ? barsResp.items : [];
                const indicatorsData = Array.isArray(indicatorsResp?.items) ? indicatorsResp.items : [];
                const sortedBars = bars.slice().sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0));
                const minMs = Number(sortedBars[0]?.bar_time_ms || 0) || 0;
                const maxMs = Number(sortedBars[sortedBars.length - 1]?.bar_time_ms || cappedMs) || cappedMs;
                let signals = [];
                if (indicator.interval === '5m' && minMs > 0) {
                    const signalsResp = await apiFetch('ibkr_signals', {
                        filter: `environment = "${escapeQueryValue(currentEnvironment)}" && symbol = "${escapeQueryValue(indicator.symbol)}" && interval = "5m" && bar_time_ms >= ${minMs} && bar_time_ms <= ${maxMs}`,
                        sort: 'bar_time_ms',
                        perPage: 200
                    }).catch(() => ({ items: [] }));
                    signals = Array.isArray(signalsResp?.items) ? signalsResp.items : [];
                }
                renderIndicatorChart(indicator, sortedBars, indicatorsData, signals);
            } catch (error) {
                if (indicatorChartInstance) {
                    indicatorChartInstance.dispose();
                    indicatorChartInstance = null;
                }
                document.getElementById('indicatorChartCanvas').innerHTML = `<div class="chart-empty">加载失败: ${escapeHtml(error.message || 'unknown error')}</div>`;
                document.getElementById('indicatorChartNote').textContent = '请检查 ibkr_bars / ibkr_indicators / ibkr_signals 是否已有该标的历史数据。';
            }
        }

        window.closeIndicatorChart = function() {
            const modal = document.getElementById('indicatorChartModal');
            if (modal) modal.classList.remove('show');
            if (indicatorChartInstance) {
                indicatorChartInstance.dispose();
                indicatorChartInstance = null;
            }
        };

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 600);
            loadIndicators();
        }

        function changeRefreshInterval(seconds) {
            currentInterval = parseInt(seconds, 10);

            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }

            if (currentInterval > 0) {
                refreshTimer = setInterval(loadIndicators, currentInterval * 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('environmentHeader').innerHTML = renderEnvironmentSwitcher();
            document.getElementById('navContainer').innerHTML = renderNav('/ibkr_indicators.html');
            document.getElementById('datePicker').innerHTML = renderDatePicker();
            syncDatePickerUI(currentDate);
            renderFilterNote();
            loadIndicators();
            changeRefreshInterval(30);

            let isLoadingMore = false;
            window.addEventListener('scroll', () => {
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const scrollHeight = document.documentElement.scrollHeight;
                const clientHeight = document.documentElement.clientHeight;

                if (scrollTop + clientHeight >= scrollHeight - 200) {
                    if (!isLoadingMore && hasMore) {
                        isLoadingMore = true;
                        loadMoreIndicators().finally(() => {
                            isLoadingMore = false;
                        });
                    }
                }
            });

            window.addEventListener('resize', () => {
                if (indicatorChartInstance) indicatorChartInstance.resize();
            });
        });

        window.onEnvironmentChange = function(environment) {
            currentEnvironment = environment;
            location.href = buildPageUrl('/ibkr_indicators.html', { date: currentDate });
        };
    </script>
</body>
</html>
