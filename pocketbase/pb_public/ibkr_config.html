<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>配置管理</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="common.js"></script>
<style>
  /* ── Config Section ── */
  .config-section {
    margin-bottom: 24px;
  }

  .config-toolbar {
    position: sticky;
    top: 72px;
    z-index: 20;
    margin-bottom: 18px;
    padding-bottom: 8px;
    background: linear-gradient(180deg, rgba(11,15,18,0.98) 0%, rgba(11,15,18,0.92) 70%, rgba(11,15,18,0) 100%);
  }

  .config-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 8px;
    scrollbar-width: none;
  }

  .config-tabs::-webkit-scrollbar {
    display: none;
  }

  .config-tab {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .config-tab:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .config-tab.active {
    background: rgba(99,179,237,0.14);
    border-color: var(--accent);
    color: var(--accent);
  }

  .config-tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--surface2);
    color: inherit;
    font-size: 10px;
  }

  .config-tab-summary {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .section-count {
    font-size: 10px;
    letter-spacing: 0;
    color: var(--muted);
  }

  /* ── Config Item ── */
  .config-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }

  .config-item:hover {
    border-color: rgba(99,179,237,0.3);
  }

  .config-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
    gap: 12px;
  }

  .config-title-wrap {
    min-width: 0;
    flex: 1;
  }

  .config-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
  }

  .config-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }

  .config-default {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: var(--surface2);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .config-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  /* ── Input Controls ── */
  .config-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 16px; /* 防止移动端输入时页面放大 */
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: border-color 0.2s;
  }

  .config-input:focus {
    border-color: var(--accent);
  }

  /* Number Stepper */
  .stepper-container {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .stepper-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .stepper-container .stepper-btn:first-of-type {
    border-radius: 8px 0 0 8px;
  }

  .stepper-container .stepper-btn:last-of-type {
    border-radius: 0 8px 8px 0;
  }

  .stepper-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .stepper-btn:active {
    transform: scale(0.95);
  }

  .stepper-input {
    width: 70px;
    text-align: center;
    border-radius: 0;
    border-left: none;
    border-right: none;
  }

  .stepper-input:focus {
    border-color: var(--border);
  }

  /* Toggle Switch */
  .toggle-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .toggle.active {
    background: var(--long);
    border-color: var(--long);
  }

  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    background: var(--text);
    border-radius: 50%;
    transition: transform 0.3s;
  }

  .toggle.active::after {
    transform: translateX(20px);
  }

  .toggle-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .toggle.active + .toggle-label {
    color: var(--long);
  }

  /* Select */
  .config-select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 16px; /* 防止移动端输入时页面放大 */
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    cursor: pointer;
  }

  .config-select:focus {
    border-color: var(--accent);
  }

  /* ── Save Button ── */
  .save-btn {
    position: fixed;
    bottom: 90px;
    right: 20px;
    padding: 14px 24px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #48BB78, #38A169);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(72,187,120,0.3);
    transition: all 0.2s;
    z-index: 40;
  }

  .save-btn:active {
    transform: scale(0.97);
  }

  .save-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ── Modified Indicator ── */
  .config-item.modified {
    border-color: var(--accent);
    background: rgba(99,179,237,0.03);
  }

  /* ── Reset Button ── */
  .reset-btn {
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: all 0.2s;
  }

  .reset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .reset-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ── Reset All Button ── */
  .reset-all-btn {
    position: fixed;
    bottom: 90px;
    left: 20px;
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 40;
  }

  .reset-all-btn:hover {
    border-color: #E53E3E;
    color: #E53E3E;
  }

  .reset-all-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
</style>
<script>document.write(getCommonStyles())</script>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="logo">
      <span class="logo-label">CONFIG MANAGER</span>
      <span class="logo-title">配置管理</span>
    </div>
    <button class="refresh-btn" onclick="load()">↻</button>
  </div>
  <div id="configEnvironmentBar" style="margin-top:12px;"></div>
</div>

<!-- Content -->
<div class="content" id="configContainer">
  <div class="loading">LOADING...</div>
</div>

<!-- Save Button -->
<button class="save-btn" id="saveBtn" onclick="saveAll()" disabled>保存配置</button>

<!-- Reset All Button -->
<button class="reset-all-btn" id="resetAllBtn" onclick="resetAll()" disabled>重置全部</button>

<!-- Bottom Nav -->
<div id="navContainer"></div>

<script>
// ── 初始化 ──
requireAuth('/ibkr_config.html')

let configs = []
let configRecords = []
let originalValues = {}
let modifiedKeys = new Set()
let activeTab = localStorage.getItem('config_active_tab') || 'all'
let configEnvironment = getCurrentConfigEnvironment()
const LEGACY_KEY_REDIRECTS = {
  health_check_email: 'health_check_notify_enabled'
}

}

const CONFIG_META = {

  risk_reward_ratio: meta('盈亏比', '风险参数', 200),

  sync_end_time: meta('同步窗口结束', '任务调度', 410),

  ibkr_watchlist_backfill_stale_min: meta('底池回补滞后阈值', '任务调度', 445, '20'),

  order_validation_notify_enabled: meta('订单校验异常告警', '通知中心', 580),
  atr_stop_adjust_notify_enabled: meta('ATR 止损调整通知', '通知中心', 590),

  health_check_enabled: meta('健康检查总开关', '健康巡检', 700),

  health_check_nontrading_interval_hours: meta('非交易时段健康检查间隔', '健康巡检', 720),

  ibkr_compute_enabled: meta('IBKR Compute 服务开关', 'PB / IBKR 服务', 910),

  market_index_symbols: meta('大盘指数标的', '市场分析', 1000),
  ibkr_target_filter_on: meta('每日目标筛选', '市场分析', 1010)

const BOOLEAN_CONFIG_KEYS = new Set([
  'ibkr_trading_enabled',
  'health_check_enabled',
  'health_check_email',
  'status_notify_enabled',
  'order_notify_enabled',
  'daily_summary_notify_enabled',
  'manual_stop_notify_enabled',
  'health_check_notify_enabled',
  'inspection_notify_enabled',
  'order_validation_notify_enabled',
  'atr_stop_adjust_notify_enabled',
  'clear_daily_cache',
  'signal_auto_confirm',
  'pb_scheduler_enabled',
  'ibkr_compute_enabled',
  'ibkr_bar_publish_enabled',
  'ibkr_target_filter_on'
])

const SELECT_CONFIGS = {
  notification_channel: [
    { value: 'feishu', label: 'feishu (默认飞书)' },
    { value: 'email', label: 'email (仅邮件)' },
    { value: 'all', label: 'all (飞书 + 邮件)' }
  ],
  log_level: [
    { value: 'DEBUG', label: 'DEBUG (详细)' },
    { value: 'INFO', label: 'INFO (重要)' },
    { value: 'WARN', label: 'WARN (告警)' },
    { value: 'ERROR', label: 'ERROR (错误)' }
  ],
  deployment_mode: [
    { value: 'live', label: 'live (实盘)' },
    { value: 'paper', label: 'paper (模拟盘)' }
  ]
}

// ── 渲染导航 ──
document.getElementById('navContainer').innerHTML = renderNav('/ibkr_config.html')

function normalizeConfigRecordEnvironment(record) {
  return String(record?.environment || '').trim().toLowerCase()
}

function getConfigScopeLabel(environment) {
  return getEnvironmentLabel(environment || 'global', true)
}

function buildConfigView(records) {
  const byKey = new Map()

  records.forEach((record) => {
    if (!record?.key) return
    if (!byKey.has(record.key)) byKey.set(record.key, [])
    byKey.get(record.key).push(record)
  })

  Object.entries(CONFIG_META).forEach(([key, metaInfo]) => {
    if (byKey.has(key)) return
    byKey.set(key, [{
      key,
      id: '',
      environment: configEnvironment === 'global' ? 'global' : '',
      value: metaInfo.default_value ?? '',
      default_value: metaInfo.default_value ?? '',
      display_name: metaInfo.display_name || key,
      group_name: metaInfo.group_name || '其他 / 未归类',
      sort_order: metaInfo.sort_order ?? 9999
    }])
  })

  return Array.from(byKey.entries()).map(([key, keyRecords]) => {
    const selectedRecord = keyRecords.find((record) => normalizeConfigRecordEnvironment(record) === configEnvironment) || null
    const globalRecord = keyRecords.find((record) => {
      const environment = normalizeConfigRecordEnvironment(record)
      return environment === 'global' || environment === ''
    }) || null
    const sourceRecord = selectedRecord || globalRecord || keyRecords[0]
    const editableRecord = configEnvironment === 'global'
      ? (globalRecord || selectedRecord || sourceRecord)
      : selectedRecord

    return {
      ...sourceRecord,
      id: editableRecord?.id || '',
      value: sourceRecord?.value ?? '',
      _source_environment: normalizeConfigRecordEnvironment(sourceRecord) || 'global',
      _editable_environment: configEnvironment,
      _editable_id: editableRecord?.id || '',
      _has_override: Boolean(selectedRecord),
    }
  })
}

function renderConfigEnvironmentBar() {
  document.getElementById('configEnvironmentBar').innerHTML = renderPageContextBar(
    '配置作用域',
    {
      allowGlobal: true,
      description: 'global 为默认基线，live / paper / backtest 为覆盖层'
    }
  )
}

function findConfig(key) {
  return configs.find(c => c.key === key)
}

function getVisibleConfigs() {
  const keySet = new Set(configs.map(c => c.key))

  return configs
    .filter(config => {
      const redirectKey = LEGACY_KEY_REDIRECTS[config.key]
      return !(redirectKey && keySet.has(redirectKey))
    })
    .map(config => {
      const fallbackMeta = CONFIG_META[config.key] || meta(config.key, '其他 / 未归类', 9999)
      const sortOrder = Number.isFinite(Number(config.sort_order)) ? Number(config.sort_order) : fallbackMeta.sort_order

      config._display_name = config.display_name || fallbackMeta.display_name || config.key
      config._group_name = config.group_name || fallbackMeta.group_name || '其他 / 未归类'
      config._sort_order = sortOrder
      return config
    })
    .sort((a, b) => {
      if (a._sort_order !== b._sort_order) return a._sort_order - b._sort_order
      return String(a.key || '').localeCompare(String(b.key || ''))
    })
}

function getGroupedConfigs() {
  const visibleConfigs = getVisibleConfigs()
  const groupedConfigs = []
  let currentGroupName = ''
  let currentGroupItems = []

  visibleConfigs.forEach(config => {
    if (config._group_name !== currentGroupName) {
      if (currentGroupItems.length > 0) {
        groupedConfigs.push([currentGroupName, currentGroupItems])
      }
      currentGroupName = config._group_name
      currentGroupItems = [config]
    } else {
      currentGroupItems.push(config)
    }
  })

  if (currentGroupItems.length > 0) {
    groupedConfigs.push([currentGroupName, currentGroupItems])
  }

  return groupedConfigs
}

function getTabs(groupedConfigs) {
  return [
    { id: 'all', label: '全部', count: groupedConfigs.reduce((sum, [, items]) => sum + items.length, 0) },
    ...groupedConfigs.map(([groupName, items]) => ({
      id: groupName,
      label: groupName,
      count: items.length
    }))
  ]
}

function renderTabs(tabs) {
  return `
    <div class="config-toolbar">
      <div class="config-tabs">
        ${tabs.map(tab => `
          <button
            type="button"
            class="config-tab ${activeTab === tab.id ? 'active' : ''}"
            onclick="setConfigTab('${tab.id.replace(/'/g, "\\'")}')"
          >
            <span>${tab.label}</span>
            <span class="config-tab-count">${tab.count}</span>
          </button>
        `).join('')}
      </div>
      <div class="config-tab-summary">
        ${activeTab === 'all'
          ? `当前显示全部功能配置，共 ${tabs[0]?.count || 0} 项`
          : `当前功能页：${activeTab}`}
      </div>
    </div>
  `
}

// ── 加载配置 ──
async function load() {
  try {
    const data = await apiFetch('config', {
      perPage: 500,
      sort: 'key,-updated'
    })

    configRecords = data.items || []
    configs = buildConfigView(configRecords)
    originalValues = {}
    modifiedKeys.clear()

    configs.forEach(c => {
      originalValues[c.key] = c.value
    })

    render()
  } catch (err) {
    console.error('[Config] 加载失败:', err)
    document.getElementById('configContainer').innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-text">连接失败，请检查网络</div>
      </div>
    `
  }
}

// ── 渲染 ──
function render() {
  const container = document.getElementById('configContainer')
  const groupedConfigs = getGroupedConfigs()
  const visibleConfigs = groupedConfigs.flatMap(([, items]) => items)

  if (visibleConfigs.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-text">暂无配置</div></div>'
    updateSaveButton()
    return
  }

  const tabs = getTabs(groupedConfigs)
  if (!tabs.some(tab => tab.id === activeTab)) {
    activeTab = 'all'
    localStorage.setItem('config_active_tab', activeTab)
  }

  const displayGroups = activeTab === 'all'
    ? groupedConfigs
    : groupedConfigs.filter(([groupName]) => groupName === activeTab)

  let html = ''
  html += renderTabs(tabs)

  for (const [groupName, groupItems] of displayGroups) {
    html += `
      <div class="config-section">
        <div class="section-title">
          <span>${groupName}</span>
          <span class="section-count">${groupItems.length} 项</span>
        </div>
    `

    for (const config of groupItems) {
      const key = config.key

      const isModified = modifiedKeys.has(key)
      const modifiedClass = isModified ? 'modified' : ''

      // 检查是否可以重置
      const canReset = config.value !== config.default_value && config.default_value !== null && config.default_value !== ''
      const resetDisabled = canReset ? '' : 'disabled'

      html += `
        <div class="config-item ${modifiedClass}" data-key="${key}">
          <div class="config-header">
            <div class="config-title-wrap">
              <div class="config-name">${config._display_name}</div>
              <div class="config-key">${key} · 来源 ${getConfigScopeLabel(config._source_environment)}${config._has_override ? '' : (configEnvironment === 'global' ? '' : ' · 继承')}</div>
            </div>
            <div class="config-default">默认: ${config.default_value ?? '-'}</div>
          </div>
          <div class="config-desc">${config.description || ''}</div>
          ${renderControl(config)}
          <div style="margin-top: 8px; text-align: right;">
            <button class="reset-btn" onclick="resetOne('${key}')" ${resetDisabled}>重置</button>
          </div>
        </div>
      `
    }

    html += `</div>`
  }

  container.innerHTML = html
  updateSaveButton()
}

window.setConfigTab = async function(tabId) {
  activeTab = tabId
  localStorage.setItem('config_active_tab', activeTab)
  await load()
}

// ── 渲染控件 ──
function renderControl(config) {
  const key = config.key
  const value = config.value ?? config.default_value ?? ''
  const normalizedValue = String(value).toUpperCase()

  // 布尔值 - Toggle
  if (BOOLEAN_CONFIG_KEYS.has(key) || normalizedValue === 'TRUE' || normalizedValue === 'FALSE') {
    const isActive = normalizedValue === 'TRUE'
    return `
      <div class="toggle-container">
        <div class="toggle ${isActive ? 'active' : ''}" onclick="toggleBool('${key}', this)"></div>
        <span class="toggle-label">${isActive ? '开启' : '关闭'}</span>
      </div>
    `
  }

  // 邮箱收件人 - Email Input
  if (key === 'alert_email') {
    return `<input type="email" class="config-input" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" value="${value}" oninput="updateValue('${key}', this.value)">`
  }

  if (SELECT_CONFIGS[key]) {
    return `
      <select class="config-select" onchange="updateValue('${key}', this.value)">
        ${SELECT_CONFIGS[key].map(option => `
          <option value="${option.value}" ${value === option.value ? 'selected' : ''}>${option.label}</option>
        `).join('')}
      </select>
    `
  }

  // 时间类 - Time Input (如 09:20, 15:30)
  if (key.endsWith('_time')) {
    return `<input type="time" class="config-input" value="${value}" onchange="updateValue('${key}', this.value)">`
  }

  // 数字类 - Number Input with range
  if (key.includes('max_') || key.includes('_mult') || key.includes('interval') || key.includes('deviation') || key.includes('ratio') || key.includes('validity')) {
    const step = key.includes('deviation') || key.includes('ratio') || key.includes('mult') ? '0.1' : '1'
    // 设置合理的 min/max 范围
    let min = '0', max = '9999', stepVal = '1', isInt = 'true'
    if (key.includes('max_positions')) { min = '1'; max = '10'; stepVal = '1' }
    else if (key.includes('max_daily_sl')) { min = '1'; max = '10'; stepVal = '1' }
    else if (key.includes('max_loss')) { min = '10'; max = '1000'; stepVal = '10' }
    else if (key.includes('interval') && key.includes('min')) { min = '1'; max = '60'; stepVal = '1' }
    else if (key.includes('interval') && key.includes('hours')) { min = '1'; max = '24'; stepVal = '1' }
    else if (key.includes('validity')) { min = '5'; max = '120'; stepVal = '5' }
    else if (key.includes('atr_mult')) { min = '0.5'; max = '5.0'; stepVal = '0.1'; isInt = 'false' }
    else if (key.includes('atr_deviation')) { min = '0.05'; max = '1.0'; stepVal = '0.05'; isInt = 'false' }
    else if (key.includes('ratio')) { min = '0.5'; max = '5.0'; stepVal = '0.1'; isInt = 'false' }

    // 自然整数使用步进按钮，其他用普通输入框
    if (stepVal === '1' || stepVal === '10') {
      return `
        <div class="stepper-container">
          <button class="stepper-btn" onclick="stepValue('${key}', -${stepVal})">−</button>
          <input type="number" step="${stepVal}" min="${min}" max="${max}" class="config-input stepper-input" value="${value}" oninput="updateValue('${key}', this.value)">
          <button class="stepper-btn" onclick="stepValue('${key}', ${stepVal})">+</button>
        </div>
      `
    }

    return `<input type="number" step="${step}" min="${min}" max="${max}" class="config-input" value="${value}" oninput="updateValue('${key}', this.value)">`
  }

  // 文本 - Text Input
  return `<input type="text" class="config-input" value="${value}" oninput="updateValue('${key}', this.value)">`
}

// ── 步进数值 ──
window.stepValue = function(key, delta) {
  const config = findConfig(key)
  if (!config) return

  const currentVal = parseFloat(config.value) || 0
  const newVal = Math.round((currentVal + delta) * 100) / 100

  updateValue(key, String(newVal))

  // 直接更新该 input 的值，不重新渲染整个页面
  const input = document.querySelector(`.config-item[data-key="${key}"] .stepper-input`)
  if (input) {
    input.value = String(newVal)
  }
}

// ── Toggle 布尔值 ──
window.toggleBool = function(key, el) {
  const isActive = el.classList.contains('active')
  const newValue = isActive ? 'FALSE' : 'TRUE'

  el.classList.toggle('active')
  const label = el.nextElementSibling
  label.textContent = isActive ? '关闭' : '开启'
  label.style.color = isActive ? 'var(--muted)' : 'var(--long)'

  updateValue(key, newValue)
}

// ── 更新值 ──
window.updateValue = function(key, newValue) {
  const config = findConfig(key)
  if (!config) return

  config.value = newValue

  if (newValue !== originalValues[key]) {
    modifiedKeys.add(key)
  } else {
    modifiedKeys.delete(key)
  }

  // 更新 modified 样式
  const item = document.querySelector(`.config-item[data-key="${key}"]`)
  if (item) {
    if (modifiedKeys.has(key)) {
      item.classList.add('modified')
    } else {
      item.classList.remove('modified')
    }
  }

  updateSaveButton()
}

// ── 更新保存按钮 ──
function updateSaveButton() {
  const btn = document.getElementById('saveBtn')
  const resetAllBtn = document.getElementById('resetAllBtn')
  const visibleConfigs = getVisibleConfigs()
  btn.disabled = modifiedKeys.size === 0
  btn.textContent = modifiedKeys.size > 0 ? `保存配置 (${modifiedKeys.size})` : '保存配置'

  // 检查是否有可重置的配置（当前值与默认值不同）
  const hasResettable = visibleConfigs.some(c => c.value !== c.default_value && c.default_value !== null)
  resetAllBtn.disabled = !hasResettable
}

// ── 保存所有修改 ──
async function saveAll() {
  const btn = document.getElementById('saveBtn')
  btn.disabled = true
  btn.textContent = '保存中...'

  let success = 0
  let failed = 0

  for (const key of modifiedKeys) {
    const config = findConfig(key)
    if (!config) continue

    try {
      const token = getToken()
      const payload = config._editable_id
        ? { value: config.value, environment: configEnvironment }
        : {
            key: config.key,
            value: config.value,
            default_value: config.default_value ?? '',
            description: config.description ?? '',
            display_name: config.display_name || config._display_name || '',
            group_name: config.group_name || config._group_name || '',
            sort_order: config.sort_order ?? config._sort_order ?? 0,
            environment: configEnvironment
          }
      const endpoint = config._editable_id
        ? `${BASE_URL}/api/collections/config/records/${config._editable_id}`
        : `${BASE_URL}/api/collections/config/records`
      const res = await fetch(endpoint, {
        method: config._editable_id ? 'PATCH' : 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      })

      if (res.ok) {
        originalValues[key] = config.value
        success++
      } else {
        failed++
      }
    } catch (err) {
      console.error(`[Config] 保存 ${key} 失败:`, err)
      failed++
    }
  }

  modifiedKeys.clear()

  if (failed === 0) {
    showToast(`✅ 成功保存 ${success} 项配置`)
  } else {
    showToast(`⚠️ 保存完成: 成功 ${success}, 失败 ${failed}`)
  }

  await load()
}

// ── 重置单个配置 ──
window.resetOne = function(key) {
  const config = findConfig(key)
  if (!config || config.default_value === null || config.default_value === undefined) return

  config.value = config.default_value

  if (config.value !== originalValues[key]) {
    modifiedKeys.add(key)
  } else {
    modifiedKeys.delete(key)
  }

  render()
  showToast(`已重置 ${config._display_name || key} 为默认值`)
}

// ── 重置全部配置 ──
async function resetAll() {
  const resettableConfigs = getVisibleConfigs().filter(c =>
    c.default_value !== null &&
    c.default_value !== undefined &&
    c.default_value !== '' &&
    c.value !== c.default_value
  )

  if (resettableConfigs.length === 0) {
    showToast('没有可重置的配置')
    return
  }

  if (!confirm(`确定要重置 ${resettableConfigs.length} 项配置为默认值吗？`)) {
    return
  }

  let success = 0
  let failed = 0

  for (const config of resettableConfigs) {
    try {
      const token = getToken()
      const payload = config._editable_id
        ? { value: config.default_value, environment: configEnvironment }
        : {
            key: config.key,
            value: config.default_value,
            default_value: config.default_value ?? '',
            description: config.description ?? '',
            display_name: config.display_name || config._display_name || '',
            group_name: config.group_name || config._group_name || '',
            sort_order: config.sort_order ?? config._sort_order ?? 0,
            environment: configEnvironment
          }
      const endpoint = config._editable_id
        ? `${BASE_URL}/api/collections/config/records/${config._editable_id}`
        : `${BASE_URL}/api/collections/config/records`
      const res = await fetch(endpoint, {
        method: config._editable_id ? 'PATCH' : 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      })

      if (res.ok) {
        config.value = config.default_value
        originalValues[config.key] = config.default_value
        modifiedKeys.delete(config.key)
        success++
      } else {
        failed++
      }
    } catch (err) {
      console.error(`[Config] 重置 ${config.key} 失败:`, err)
      failed++
    }
  }

  if (failed === 0) {
    showToast(`✅ 成功重置 ${success} 项配置`)
  } else {
    showToast(`⚠️ 重置完成: 成功 ${success}, 失败 ${failed}`)
  }

  render()
}

// ── 初始加载 ──
renderConfigEnvironmentBar()
load()

window.onEnvironmentChange = function(environment) {
  configEnvironment = environment
  location.href = buildPageUrl('/ibkr_config.html', { environment }, { allowGlobal: true })
}
</script>
