<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>反向信号</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <style>
        .search-row {
            margin-bottom: 8px;
        }

        .search-row > div:first-child {
            margin-bottom: 4px;
        }

        .search-row .date-btn {
            padding: 6px 10px;
            font-size: 11px;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .stats-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 4px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        /* 状态筛选 Tab */
        .status-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 2px;
            overflow-x: auto;
            padding: 4px 0;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .direction-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 2px;
            overflow-x: auto;
            padding: 4px 0;
            background: var(--bg);
            position: sticky;
            top: 32px;
            z-index: 9;
        }

        .status-tab {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--muted);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .status-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .status-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        .stat-chip .stat-label {
            color: var(--muted);
        }

        .stat-chip .stat-value {
            color: var(--accent);
            font-weight: 700;
        }

        .signal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .signal-card:active {
            transform: scale(0.98);
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .signal-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .signal-icon {
            font-size: 20px;
        }

        .signal-symbol {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .signal-direction {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .signal-direction.long {
            background: rgba(72,187,120,0.15);
            color: var(--long);
        }

        .signal-direction.short {
            background: rgba(252,129,129,0.15);
            color: var(--short);
        }

        .signal-strength {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            margin-left: 6px;
        }

        .strength-strong {
            background: rgba(252,129,129,0.2);
            color: var(--short);
        }

        .strength-medium {
            background: rgba(246,173,85,0.2);
            color: var(--pending);
        }

        .strength-weak {
            background: rgba(113,128,150,0.2);
            color: var(--rejected);
        }

        .signal-action-type {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            margin-left: 6px;
        }

        .action-close {
            background: rgba(252,129,129,0.2);
            color: var(--short);
        }

        .action-cancel {
            background: rgba(246,173,85,0.2);
            color: var(--pending);
        }

        .action-adjust {
            background: rgba(99,179,237,0.2);
            color: var(--accent);
        }

        .signal-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(246,173,85,0.2);
            color: var(--pending);
        }

        .status-confirmed {
            background: rgba(104,211,145,0.2);
            color: var(--executed);
        }

        .status-cancelled {
            background: rgba(252,129,129,0.2);
            color: var(--short);
        }

        .status-expired {
            background: rgba(113,128,150,0.2);
            color: var(--rejected);
        }

        .status-auto {
            background: rgba(139,92,246,0.2);
            color: #a78bfa;
        }

        .signal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .signal-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .signal-item.full-width {
            grid-column: span 2;
        }

        .signal-label {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        .signal-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .signal-note {
            background: rgba(99,179,237,0.05);
            border-left: 2px solid var(--accent);
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--muted);
        }

        .signal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 8px;
            font-size: clamp(11px, 3vw, 12px);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .btn-execute {
            background: var(--long);
            color: var(--bg);
        }

        .btn-execute:active {
            background: #38a169;
        }

        .btn-dismiss {
            background: var(--short);
            color: var(--bg);
        }

        .btn-dismiss:active {
            background: #e53e3e;
        }

        .btn-details {
            grid-column: 1 / -1;
            background: var(--accent);
            color: var(--bg);
        }

        .btn-details:active {
            background: #4299e1;
        }

        /* 指标徽章 */
        .indicator-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .indicator-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .badge-crsi {
            background: rgba(139,92,246,0.2);
            color: #a78bfa;
        }

        .badge-obv {
            background: rgba(72,187,120,0.2);
            color: var(--long);
        }

        .badge-vwap {
            background: rgba(246,173,85,0.2);
            color: var(--pending);
        }

        .badge-priority {
            background: rgba(99,179,237,0.2);
            color: var(--accent);
        }

        .badge-source {
            background: rgba(113,128,150,0.2);
            color: var(--rejected);
        }

        .load-more-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more-btn:active {
            background: var(--surface);
        }

        .load-more-btn:disabled {
            color: var(--muted);
            cursor: not-allowed;
        }

        .header-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
        }

        .refresh-control {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .search-row .refresh-control .refresh-btn {
            padding: 8px 10px;
            font-size: 12px;
        }

        .search-row .refresh-control .refresh-select {
            padding: 8px 10px;
            font-size: 11px;
        }

        /* 覆盖 date-picker 样式 */
        .date-picker {
            margin-bottom: 0 !important;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:active {
            color: var(--accent);
            border-color: var(--accent);
        }

        .refresh-select {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            cursor: pointer;
        }

        .refresh-select:focus {
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-label">TRADING</div>
                <div class="logo-title">🔄 反向信号</div>
            </div>
            <div class="live-badge">
                <div class="live-dot"></div>
                LIVE
            </div>
        </div>
    </div>

    <div class="content">
        <div class="search-row">
            <div style="display:flex;gap:8px;align-items:center;">
                <div id="datePicker" style="flex:1;"></div>
                <div class="refresh-control">
                    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄</button>
                    <select class="refresh-select" id="refreshInterval" onchange="changeRefreshInterval(this.value)">
                        <option value="0">关闭</option>
                        <option value="5">5秒</option>
                        <option value="30" selected>30秒</option>
                        <option value="60">1分钟</option>
                    </select>
                </div>
            </div>
            <input class="search-input" id="searchInput" placeholder="🔍 搜索股票/信号ID..." oninput="onSearchChange(this.value)">
        </div>

        <!-- 状态筛选 Tab -->
        <div class="status-tabs">
            <button class="status-tab active" data-status="all" onclick="selectStatus('all', this)">全部</button>
            <button class="status-tab" data-status="pending" onclick="selectStatus('pending', this)">待处理</button>
            <button class="status-tab" data-status="confirmed" onclick="selectStatus('confirmed', this)">已确认</button>
            <button class="status-tab" data-status="cancelled" onclick="selectStatus('cancelled', this)">已取消</button>
        </div>

        <div id="directionTabs"></div>

        <div class="stats-bar">
            <div class="stat-chip">
                <span class="stat-label">总计</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">待处理</span>
                <span class="stat-value" id="stat-pending">0</span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">已确认</span>
                <span class="stat-value" id="stat-confirmed">0</span>
            </div>
        </div>

        <div id="signalsContainer">
            <div class="loading">加载中...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreSignals()" style="display: none;">加载更多</button>
    </div>

    <div id="nav"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const pb = new PocketBase('https://pb.lzw-glory.top');
        let allSignals = [];
        let currentDate = new Date().toISOString().split('T')[0];
        let currentDirection = 'all';
        let currentStatus = 'all';
        let currentAction = 'all';
        let currentSearch = '';
        let refreshTimer = null;
        let currentInterval = 30;

        // Pagination
        let currentPage = 1;
        const itemsPerPage = 10;
        let displayedSignals = [];

        async function initAuth() {
            const token = getToken();
            if (!token) {
                location.href = '/login.html?from=/reverse_signals.html';
                return;
            }
            pb.authStore.save(token, null);
        }

        async function loadSignals() {
            try {
                const startDate_obj = new Date(currentDate + 'T00:00:00Z');
                const endDate_obj = new Date(currentDate + 'T23:59:59Z');
                const startTimeMs = startDate_obj.getTime();
                const endTimeMs = endDate_obj.getTime();

                // 获取今日的反向信号，按时间倒序
                allSignals = await pb.collection('reverse_signals').getFullList({
                    filter: `bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}`,
                    sort: '-created',
                    $autoCancel: false
                });

                resetPagination();
                updateStats();
                renderSignals();
                updateLoadMoreButton();
            } catch (error) {
                console.error('加载失败:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                showToast('加载失败: ' + error.message);
            }
        }

        function updateStats() {
            const filtered = filterSignalsAll();
            document.getElementById('stat-total').textContent = filtered.length;
            document.getElementById('stat-pending').textContent = filtered.filter(s => s.status === 'pending').length;
            document.getElementById('stat-confirmed').textContent = filtered.filter(s => s.status === 'confirmed').length;
        }

        function filterSignalsAll() {
            let filtered = allSignals;

            // 状态筛选 - 使用 status 字段
            if (currentStatus === 'pending') {
                filtered = filtered.filter(s => s.status === 'pending');
            } else if (currentStatus === 'confirmed') {
                filtered = filtered.filter(s => s.status === 'confirmed');
            } else if (currentStatus === 'cancelled') {
                filtered = filtered.filter(s => s.status === 'cancelled');
            }

            // 操作类型筛选
            if (currentAction !== 'all') {
                filtered = filtered.filter(s => s.action_type === currentAction);
            }

            // 方向筛选
            if (currentDirection !== 'all') {
                filtered = filtered.filter(s => s.direction === currentDirection);
            }

            // 搜索筛选
            if (currentSearch) {
                const s = currentSearch.toUpperCase();
                filtered = filtered.filter(sig =>
                    (sig.symbol || '').toUpperCase().includes(s) ||
                    ((sig.extra && sig.extra.signal_id) || '').toUpperCase().includes(s) ||
                    ((sig.extra && sig.extra.origin_signal_id) || '').toUpperCase().includes(s) ||
                    ((sig.extra && sig.extra.order_id) || '').toUpperCase().includes(s)
                );
            }

            return filtered;
        }

        function getFilteredSignals() {
            return filterSignalsAll();
        }

        function getPaginatedSignals() {
            const filtered = getFilteredSignals();
            const start = (currentPage - 1) * itemsPerPage;
            return filtered.slice(0, start + itemsPerPage);
        }

        function updateLoadMoreButton() {
            const btn = document.getElementById('loadMoreBtn');
            const filtered = getFilteredSignals();
            const hasMore = displayedSignals.length < filtered.length;
            btn.style.display = hasMore ? 'block' : 'none';
            btn.textContent = hasMore ? `加载更多 (${displayedSignals.length}/${filtered.length})` : '没有更多了';
            btn.disabled = !hasMore;
        }

        function loadMoreSignals() {
            currentPage++;
            displayedSignals = getPaginatedSignals();
            renderSignals();
            updateLoadMoreButton();
        }

        function resetPagination() {
            currentPage = 1;
            displayedSignals = getPaginatedSignals();
        }

        function onSearchChange(val) {
            currentSearch = val.trim();
            resetPagination();
            updateStats();
            renderSignals();
            updateLoadMoreButton();
        }

        // 状态筛选 Tab
        window.selectStatus = function(status, btn) {
            document.querySelectorAll('.status-tab[data-status]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentStatus = status;
            resetPagination();
            updateStats();
            renderSignals();
            updateLoadMoreButton();
        };

        // 操作类型筛选 Tab
        window.selectAction = function(action, btn) {
            document.querySelectorAll('.status-tab[data-action]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentAction = action;
            resetPagination();
            updateStats();
            renderSignals();
            updateLoadMoreButton();
        };

        function renderSignals() {
            const container = document.getElementById('signalsContainer');
            const filtered = getPaginatedSignals();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">暂无反向信号</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(signal => {
                const directionIcon = signal.direction === 'long' ? '📈' : '📉';
                const directionClass = signal.direction === 'long' ? 'long' : 'short';

                // 强度
                const strengthClass = signal.strength === 'strong' ? 'strength-strong' :
                                     signal.strength === 'medium' ? 'strength-medium' : 'strength-weak';
                const strengthText = signal.strength === 'strong' ? '强' :
                                   signal.strength === 'medium' ? '中' : '弱';

                // 操作类型
                const actionTypeText = {
                    'close': '平仓',
                    'cancel': '取消',
                    'adjust_sl': '调止损',
                    'adjust_tp': '调止盈'
                }[signal.action_type] || signal.action_type;
                const actionTypeClass = signal.action_type === 'close' ? 'action-close' :
                                       signal.action_type === 'cancel' ? 'action-cancel' : 'action-adjust';

                // 状态 - 使用 status 字段
                const statusClass = signal.status === 'confirmed' ? 'status-confirmed' :
                                   signal.status === 'cancelled' ? 'status-cancelled' :
                                   signal.status === 'expired' ? 'status-expired' : 'status-pending';
                const statusText = signal.status === 'confirmed' ? '已确认' :
                                   signal.status === 'cancelled' ? '已取消' :
                                   signal.status === 'expired' ? '已过期' : '待处理';

                // 源
                const sourceText = {
                    'signal': '信号触发',
                    'indicator': '指标触发',
                    'manual': '手动'
                }[signal.source] || signal.source;

                // 从 extra 获取技术指标和 signal_id
                const extra = signal.extra || {};
                const signalId = extra.signal_id;  // QC 回写的（权威）
                const originSignalId = extra.origin_signal_id;  // webhook 触发时的
                const orderId = extra.order_id;
                const crsi = extra.crsi;
                const obvRsi = extra.obv_rsi;
                const vwapDist = extra.vwap_dist;
                const close = extra.close;

                // 解析 triggered_signals
                let triggeredSignalsText = '';
                try {
                    const triggered = signal.triggered_signals;
                    if (Array.isArray(triggered) && triggered.length > 0) {
                        triggeredSignalsText = triggered.map(t => t.symbol || t.signal_id || t).join(', ');
                    }
                } catch(e) {}

                // 构建指标徽章
                const badges = [];
                if (crsi !== undefined && crsi !== null) {
                    badges.push(`<span class="indicator-badge badge-crsi">CRSI ${crsi.toFixed(1)}</span>`);
                }
                if (obvRsi !== undefined && obvRsi !== null) {
                    badges.push(`<span class="indicator-badge badge-obv">OBV RSI ${obvRsi.toFixed(1)}</span>`);
                }
                if (vwapDist !== undefined && vwapDist !== null) {
                    const vwapText = vwapDist > 0 ? `+${vwapDist.toFixed(2)}%` : vwapDist.toFixed(2) + '%';
                    badges.push(`<span class="indicator-badge badge-vwap">VWAP ${vwapText}</span>`);
                }
                badges.push(`<span class="indicator-badge badge-priority">优先级 ${signal.priority || '-'}</span>`);
                badges.push(`<span class="indicator-badge badge-source">${sourceText}</span>`);

                const isPending = signal.status === 'pending';

                return `
                    <div class="signal-card" data-signal-id="${signal.id}">
                        <div class="signal-header">
                            <div class="signal-title">
                                <span class="signal-icon">${directionIcon}</span>
                                <span class="signal-symbol">${signal.symbol}</span>
                                <span class="signal-direction ${directionClass}">${signal.direction.toUpperCase()}</span>
                                <span class="signal-strength ${strengthClass}">${strengthText}</span>
                                <span class="signal-action-type ${actionTypeClass}">${actionTypeText}</span>
                            </div>
                            <div class="signal-status ${statusClass}">${statusText}</div>
                        </div>

                        <div class="signal-grid">
                            <div class="signal-item">
                                <div class="signal-label">评分</div>
                                <div class="signal-value">${(signal.score || 0).toFixed(1)}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">当前价格</div>
                                <div class="signal-value">${close ? '$' + close.toFixed(2) : 'N/A'}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">时间</div>
                                <div class="signal-value">${formatBeijingTime(signal.created, 'time')}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">处理时间</div>
                                <div class="signal-value">${signal.processed_time ? formatBeijingTime(signal.processed_time, 'time') : '-'}</div>
                            </div>
                            ${signal.reason ? `
                            <div class="signal-item full-width">
                                <div class="signal-label">原因</div>
                                <div class="signal-value" style="font-size: 12px;">${signal.reason}</div>
                            </div>
                            ` : ''}
                        </div>

                        ${triggeredSignalsText ? `<div class="signal-note"><strong>触发信号:</strong> ${triggeredSignalsText}</div>` : ''}
                        ${signalId ? `<div class="signal-note"><strong>关联信号ID:</strong> ${signalId}</div>` : ''}
                        ${originSignalId && originSignalId !== signalId ? `<div class="signal-note"><strong>原始信号ID:</strong> ${originSignalId}</div>` : ''}
                        ${orderId ? `<div class="signal-note"><strong>关联订单ID:</strong> ${orderId}</div>` : ''}

                        ${badges.length > 0 ? `
                            <div class="indicator-badges">
                                ${badges.join('')}
                            </div>
                        ` : ''}

                        <div class="signal-actions">
                            ${isPending ? `
                                <button class="action-btn btn-execute" onclick="confirmSignal('${signal.id}', 'confirmed')">
                                    ✓ 确认
                                </button>
                                <button class="action-btn btn-dismiss" onclick="cancelSignal('${signal.id}')">
                                    ✕ 取消
                                </button>
                            ` : `
                                <button class="action-btn btn-details" disabled style="opacity: 0.6">
                                    ${signal.status === 'confirmed' ? '✓ 已确认' : signal.status === 'cancelled' ? '✕ 已取消' : signal.status === 'expired' ? '⏰ 已过期' : '已处理'}
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function confirmSignal(id, status) {
            if (!confirm('确认此反向信号？')) return;

            try {
                const now = new Date().toISOString();
                await pb.collection('reverse_signals').update(id, {
                    status: 'confirmed',
                    processed_time: now
                });
                showToast('✓ 已确认');
                await loadSignals();
            } catch (error) {
                console.error('确认失败:', error);
                showToast('✗ 确认失败: ' + error.message);
            }
        }

        async function cancelSignal(id) {
            const reason = prompt('请输入取消原因（可选）:');
            if (reason === null) return;  // 用户点击取消

            try {
                const now = new Date().toISOString();
                await pb.collection('reverse_signals').update(id, {
                    status: 'cancelled',
                    reason: reason || '',
                    processed_time: now
                });
                showToast('✓ 已取消');
                await loadSignals();
            } catch (error) {
                console.error('取消失败:', error);
                showToast('✗ 取消失败: ' + error.message);
            }
        }

        window.onDateChange = function(startDate, endDate) {
            currentDate = startDate;
            loadSignals();
        };

        window.onDirectionChange = function(direction) {
            currentDirection = direction;
            resetPagination();
            updateStats();
            renderSignals();
            updateLoadMoreButton();
        };

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 600);
            loadSignals();
        }

        function changeRefreshInterval(seconds) {
            currentInterval = parseInt(seconds);
            if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
            if (currentInterval > 0) {
                refreshTimer = setInterval(loadSignals, currentInterval * 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            document.getElementById('nav').innerHTML = renderNav('/reverse_signals.html');
            document.getElementById('directionTabs').innerHTML = renderDirectionTabs();

            // 处理 URL 参数（signal_id 或 order_id 筛选）
            const urlParams = new URLSearchParams(window.location.search);
            const filterSignalId = urlParams.get('signal_id');
            const filterOrderId = urlParams.get('order_id');
            const urlDate = urlParams.get('date');

            // 优先使用 URL 参数中的日期
            if (urlDate) {
                currentDate = urlDate;
            }

            // 渲染日期选择器
            document.getElementById('datePicker').innerHTML = renderDatePicker();

            // 如果是 URL 参数的日期，更新日期选择器的显示
            if (urlDate) {
                const dateInput = document.getElementById('customDate');
                if (dateInput) dateInput.value = urlDate;
            }

            if (filterSignalId) {
                currentSearch = filterSignalId;
                document.getElementById('searchInput').value = filterSignalId;
            }
            if (filterOrderId) {
                currentSearch = filterOrderId;
                document.getElementById('searchInput').value = filterOrderId;
            }

            loadSignals();

            // 初始化定时刷新（默认30秒）
            changeRefreshInterval(30);
        });
    </script>
</body>
</html>
