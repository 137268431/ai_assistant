<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <style>
        .search-row {
            margin-bottom: 10px;
        }

        .search-row > div:first-child {
            margin-bottom: 8px;
        }

        .refresh-control {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .summary-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .summary-card {
            background: linear-gradient(180deg, rgba(99,179,237,0.10), rgba(20,28,46,0.95));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .summary-label {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.4px;
        }

        .summary-value {
            margin-top: 4px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .status-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 8px 0 2px;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .direction-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 6px 0 2px;
            background: var(--bg);
            position: sticky;
            top: 50px;
            z-index: 9;
        }

        .status-tab,
        .dir-tab {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #C4D4E4;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .status-tab.active,
        .dir-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .tab-count {
            margin-left: 2px;
            font-size: 10px;
            opacity: 0.85;
        }

        .filter-note {
            margin-bottom: 12px;
            padding: 10px 12px;
            background: rgba(99,179,237,0.08);
            border: 1px solid rgba(99,179,237,0.18);
            border-radius: 12px;
            color: var(--accent);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .group-card {
            background: linear-gradient(180deg, rgba(14,20,32,0.98), rgba(20,28,46,0.96));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .group-symbol-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .group-symbol {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .direction-badge,
        .status-badge,
        .role-badge,
        .relation-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .direction-badge.long {
            background: rgba(72,187,120,0.16);
            color: var(--long);
        }

        .direction-badge.short {
            background: rgba(252,129,129,0.16);
            color: var(--short);
        }

        .status-init { background: rgba(99,179,237,0.18); color: var(--accent); }
        .status-submitted { background: rgba(246,173,85,0.18); color: var(--pending); }
        .status-filled { background: rgba(104,211,145,0.18); color: var(--executed); }
        .status-canceled { background: rgba(113,128,150,0.18); color: var(--rejected); }
        .status-closed { background: rgba(252,129,129,0.18); color: var(--short); }

        .role-entry { background: rgba(99,179,237,0.16); color: var(--accent); }
        .role-take-profit,
        .role-repair-tp { background: rgba(72,187,120,0.16); color: var(--long); }
        .role-stop-loss,
        .role-repair-sl { background: rgba(252,129,129,0.16); color: var(--short); }
        .role-other { background: rgba(160,174,192,0.16); color: #CBD5E0; }

        .relation-active { background: rgba(72,187,120,0.12); color: var(--long); }
        .relation-closed { background: rgba(160,174,192,0.12); color: #CBD5E0; }
        .relation-orphaned { background: rgba(252,129,129,0.12); color: var(--short); }

        .group-subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.5;
            word-break: break-all;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .chip {
            padding: 5px 8px;
            border-radius: 10px;
            background: rgba(99,179,237,0.08);
            border: 1px solid rgba(99,179,237,0.15);
            color: #C4D4E4;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
        }

        .highlight-chip {
            background: rgba(72,187,120,0.10);
            border-color: rgba(72,187,120,0.18);
            color: var(--long);
        }

        .warn-chip {
            background: rgba(252,129,129,0.10);
            border-color: rgba(252,129,129,0.18);
            color: var(--short);
        }

        .group-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .metric-card {
            background: rgba(20,28,46,0.92);
            border: 1px solid rgba(99,179,237,0.10);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .metric-label {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.4px;
        }

        .metric-value {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            word-break: break-all;
        }

        .relationship-strip {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(99,179,237,0.06);
            border: 1px solid rgba(99,179,237,0.14);
            margin-bottom: 12px;
        }

        .relationship-node {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(20,28,46,0.92);
            border: 1px solid rgba(99,179,237,0.10);
            color: var(--text);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
        }

        .relationship-arrow {
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 11px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .order-item-card {
            background: rgba(20,28,46,0.86);
            border: 1px solid rgba(99,179,237,0.10);
            border-radius: 14px;
            padding: 12px;
        }

        .order-item-card.primary {
            border-color: rgba(99,179,237,0.20);
            box-shadow: inset 0 0 0 1px rgba(99,179,237,0.10);
        }

        .order-item-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .order-item-id {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            word-break: break-all;
        }

        .order-item-sub {
            margin-top: 4px;
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
        }

        .mini-chip-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 10px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .detail-value {
            font-size: 12px;
            color: var(--text);
            font-weight: 600;
            word-break: break-all;
        }

        .action-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .action-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-view {
            background: var(--accent);
            color: var(--bg);
        }

        .btn-cancel {
            background: var(--short);
            color: var(--bg);
        }

        .btn-close {
            background: var(--short);
            color: var(--bg);
        }

        .btn-secondary {
            background: rgba(99,179,237,0.12);
            color: var(--accent);
            border: 1px solid rgba(99,179,237,0.18);
        }

        .action-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .load-more-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--accent);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            .summary-bar,
            .group-grid,
            .detail-grid {
                grid-template-columns: 1fr;
            }

            .group-header,
            .order-item-head {
                flex-direction: column;
            }

            .mini-chip-row {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-label">TRADING</div>
                <div class="logo-title">📋 订单关系视图</div>
            </div>
            <div class="live-badge">
                <div class="live-dot"></div>
                LIVE
            </div>
        </div>
    </div>

    <div class="content">
        <div class="search-row">
            <div style="display:flex;gap:8px;align-items:center;">
                <div id="datePicker" style="flex:1;"></div>
                <div class="refresh-control">
                    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄</button>
                    <select class="refresh-select" id="refreshInterval" onchange="changeRefreshInterval(this.value)">
                        <option value="0">关闭</option>
                        <option value="5">5秒</option>
                        <option value="30" selected>30秒</option>
                        <option value="60">1分钟</option>
                    </select>
                </div>
            </div>
            <input class="search-input" id="searchInput" placeholder="搜索 标的 / signal_id / trade_group_id / unique_id / broker_order_id" oninput="onSearchChange(this.value)">
        </div>

        <div class="summary-bar" id="summaryBar">
            <div class="summary-card"><div class="summary-label">TRADE GROUPS</div><div class="summary-value">0</div></div>
            <div class="summary-card"><div class="summary-label">ORDERS</div><div class="summary-value">0</div></div>
            <div class="summary-card"><div class="summary-label">OPEN GROUPS</div><div class="summary-value">0</div></div>
        </div>

        <div id="filterNote"></div>

        <div class="status-tabs">
            <button class="status-tab active" data-status="all" onclick="selectStatus('all', this)">全部<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Init" onclick="selectStatus('Init', this)">Init<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Submitted" onclick="selectStatus('Submitted', this)">Submitted<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Filled" onclick="selectStatus('Filled', this)">Filled<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Canceled" onclick="selectStatus('Canceled', this)">Canceled<span class="tab-count">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Closed" onclick="selectStatus('Closed', this)">Closed<span class="tab-count">(<span class="count-value">0</span>)</span></button>
        </div>

        <div id="directionTabs"></div>

        <div id="ordersContainer">
            <div class="loading">加载中...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreGroups()" style="display:none;">加载更多</button>
    </div>

    <div id="nav"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const pb = new PocketBase(BASE_URL);
        const ORDER_STATUS_TEXT = {
            Init: '初始化',
            Submitted: '已提交',
            Filled: '已成交',
            Canceled: '已取消',
            Closed: '已平仓'
        };
        const ROLE_TEXT = {
            entry: '主单',
            take_profit: '止盈',
            stop_loss: '止损',
            repair_tp: '修复止盈',
            repair_sl: '修复止损'
        };

        let allOrders = [];
        let allGroups = [];
        let displayedGroups = [];
        let currentDate = new Date().toISOString().split('T')[0];
        let currentStatus = 'all';
        let currentDirection = 'all';
        let currentSearch = '';
        let refreshTimer = null;
        let currentInterval = 30;
        let currentPage = 1;
        const itemsPerPage = 6;
        let filterSignalId = '';
        let filterTradeGroupId = '';

        function parseJsonLike(value) {
            if (!value) return {};
            if (typeof value === 'object') return value;
            try {
                return JSON.parse(value);
            } catch (_) {
                return {};
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function firstDefined() {
            for (const value of arguments) {
                if (value !== undefined && value !== null && value !== '') return value;
            }
            return '';
        }

        function toNumber(value) {
            if (value === null || value === undefined || value === '') return null;
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

        function formatMoney(value) {
            const num = toNumber(value);
            return num === null ? '-' : `$${num.toFixed(2)}`;
        }

        function formatQty(value) {
            const num = toNumber(value);
            return num === null ? '-' : `${num}`;
        }

        function formatTimePair(record) {
            const us = record.us_time || (record.bar_time_ms ? formatBarTimeMsToET(record.bar_time_ms) : '');
            const cn = record.cn_time || '';
            if (!us && !cn) return '-';
            if (!cn) return `${us} ET`;
            return `${us} ET / ${cn} CN`;
        }

        function initAuth() {
            const token = getToken();
            if (!token) {
                location.href = '/login.html?from=/orders.html';
                return false;
            }
            pb.authStore.save(token, null);
            return true;
        }

        function roleClass(role) {
            if (role === 'entry') return 'role-entry';
            if (role === 'take_profit') return 'role-take-profit';
            if (role === 'repair_tp') return 'role-repair-tp';
            if (role === 'stop_loss') return 'role-stop-loss';
            if (role === 'repair_sl') return 'role-repair-sl';
            return 'role-other';
        }

        function relationClass(status) {
            if (status === 'active') return 'relation-active';
            if (status === 'orphaned') return 'relation-orphaned';
            return 'relation-closed';
        }

        function statusClass(status) {
            return `status-${String(status || 'Init').toLowerCase()}`;
        }

        function getOrderTypeText(orderType) {
            return {
                Entry: 'Entry',
                TakeProfit: 'TakeProfit',
                StopLoss: 'StopLoss'
            }[orderType] || orderType || '-';
        }

        function getRoleText(role, orderType) {
            return ROLE_TEXT[role] || getOrderTypeText(orderType);
        }

        function normalizeOrder(raw) {
            const extra = parseJsonLike(raw.extra);
            const orderType = firstDefined(raw.order_type, extra.order_type, 'Entry');
            const role = firstDefined(
                raw.role,
                extra.role,
                orderType === 'Entry' ? 'entry' : orderType === 'TakeProfit' ? 'take_profit' : orderType === 'StopLoss' ? 'stop_loss' : ''
            );
            const uniqueId = firstDefined(raw.unique_id, extra.unique_id, raw.order_id, raw.id);
            const entryOrderUniqueId = firstDefined(raw.entry_order_unique_id, extra.entry_order_unique_id, role === 'entry' ? uniqueId : '', uniqueId);
            const tradeGroupId = firstDefined(raw.trade_group_id, extra.trade_group_id, entryOrderUniqueId, uniqueId);
            const brokerOrderId = firstDefined(raw.broker_order_id, extra.broker_order_id, raw.order_id, '');
            const direction = firstDefined(raw.position_side, raw.direction, extra.position_side, extra.direction, '');
            const barTimeMs = toNumber(firstDefined(raw.bar_time_ms, extra.bar_time_ms));
            const timeKey = barTimeMs || Date.parse(firstDefined(raw.us_time, raw.created, '')) || Date.now();

            return {
                ...raw,
                extra,
                order_type: orderType,
                role,
                unique_id: uniqueId,
                entry_order_unique_id: entryOrderUniqueId,
                trade_group_id: tradeGroupId,
                parent_order_unique_id: firstDefined(raw.parent_order_unique_id, extra.parent_order_unique_id, role !== 'entry' ? entryOrderUniqueId : ''),
                sibling_order_unique_id: firstDefined(raw.sibling_order_unique_id, extra.sibling_order_unique_id, ''),
                relation_status: firstDefined(raw.relation_status, extra.relation_status, ['Canceled', 'Closed'].includes(raw.status) ? 'closed' : 'active'),
                broker_order_id: brokerOrderId,
                direction,
                position_side: direction,
                quantity: toNumber(firstDefined(raw.quantity, extra.quantity)),
                filled_qty: toNumber(firstDefined(raw.filled_qty, extra.filled_qty)),
                limit_price: toNumber(firstDefined(raw.limit_price, extra.limit_price)),
                fill_price: toNumber(firstDefined(raw.fill_price, extra.fill_price)),
                tp_price: toNumber(firstDefined(raw.tp_price, extra.tp_price)),
                sl_price: toNumber(firstDefined(raw.sl_price, extra.sl_price)),
                signal_id: firstDefined(raw.signal_id, extra.signal_id, ''),
                bar_time_ms: barTimeMs,
                time_key: timeKey,
                order_time: firstDefined(raw.order_time, extra.order_time, raw.us_time, ''),
                us_time: firstDefined(raw.us_time, extra.us_time, ''),
                cn_time: firstDefined(raw.cn_time, extra.cn_time, ''),
                fill_time: firstDefined(raw.fill_time, extra.fill_time, '')
            };
        }

        function roleRank(role) {
            return {
                entry: 0,
                take_profit: 1,
                repair_tp: 1,
                stop_loss: 2,
                repair_sl: 2
            }[role] ?? 9;
        }

        function sortOrdersInGroup(left, right) {
            const roleDiff = roleRank(left.role) - roleRank(right.role);
            if (roleDiff !== 0) return roleDiff;
            const timeDiff = (right.time_key || 0) - (left.time_key || 0);
            if (timeDiff !== 0) return timeDiff;
            return String(left.unique_id || '').localeCompare(String(right.unique_id || ''));
        }

        function pickPrimaryOrder(orders) {
            return orders.find((order) => order.role === 'entry')
                || orders.find((order) => order.unique_id === order.entry_order_unique_id)
                || [...orders].sort((a, b) => a.time_key - b.time_key)[0]
                || orders[0];
        }

        function buildTradeGroups(orders) {
            const grouped = new Map();
            orders.forEach((order) => {
                const key = order.trade_group_id || order.entry_order_unique_id || order.unique_id || order.id;
                if (!grouped.has(key)) grouped.set(key, []);
                grouped.get(key).push(order);
            });

            return Array.from(grouped.entries()).map(([groupId, ordersInGroup]) => {
                const ordersSorted = [...ordersInGroup].sort(sortOrdersInGroup);
                const primaryOrder = pickPrimaryOrder(ordersSorted);
                const latestEvent = [...ordersInGroup].sort((a, b) => b.time_key - a.time_key)[0];
                const exitOrder = ordersSorted.find((order) => order.role !== 'entry' && order.status === 'Filled') || null;
                const relationAlert = ordersSorted.find((order) => order.relation_status === 'orphaned') || null;
                return {
                    group_id: groupId,
                    trade_group_id: groupId,
                    orders: ordersSorted,
                    primaryOrder,
                    latestEvent,
                    exitOrder,
                    relationAlert,
                    symbol: primaryOrder?.symbol || latestEvent?.symbol || '-',
                    direction: primaryOrder?.position_side || primaryOrder?.direction || latestEvent?.direction || '',
                    signal_id: primaryOrder?.signal_id || latestEvent?.signal_id || '',
                    status: primaryOrder?.status || latestEvent?.status || 'Init',
                    latest_time: Math.max(...ordersInGroup.map((order) => order.time_key || 0)),
                    activeChildCount: ordersInGroup.filter((order) => order.role !== 'entry' && order.relation_status === 'active').length
                };
            }).sort((left, right) => right.latest_time - left.latest_time);
        }

        function matchesSearch(group, keyword) {
            if (!keyword) return true;
            const search = keyword.toUpperCase();
            const fields = [
                group.symbol,
                group.signal_id,
                group.trade_group_id,
                group.primaryOrder?.entry_order_unique_id,
                group.primaryOrder?.broker_order_id,
                ...group.orders.flatMap((order) => [
                    order.unique_id,
                    order.broker_order_id,
                    order.parent_order_unique_id,
                    order.sibling_order_unique_id,
                    order.role,
                    order.order_type,
                    order.signal_id
                ])
            ];
            return fields.some((field) => String(field || '').toUpperCase().includes(search));
        }

        function filterGroups(groups) {
            return groups.filter((group) => {
                if (currentStatus !== 'all' && group.status !== currentStatus) return false;
                if (currentDirection !== 'all' && group.direction !== currentDirection) return false;
                if (filterSignalId && !group.orders.some((order) => order.signal_id === filterSignalId)) return false;
                if (filterTradeGroupId && group.trade_group_id !== filterTradeGroupId) return false;
                if (!matchesSearch(group, currentSearch)) return false;
                return true;
            });
        }

        function resetPagination() {
            currentPage = 1;
            displayedGroups = filterGroups(allGroups).slice(0, itemsPerPage);
        }

        function loadMoreGroups() {
            currentPage += 1;
            displayedGroups = filterGroups(allGroups).slice(0, currentPage * itemsPerPage);
            renderGroups();
            updateLoadMoreButton();
        }

        function updateLoadMoreButton() {
            const btn = document.getElementById('loadMoreBtn');
            const filtered = filterGroups(allGroups);
            const hasMore = displayedGroups.length < filtered.length;
            btn.style.display = hasMore ? 'block' : 'none';
            btn.textContent = hasMore ? `加载更多 (${displayedGroups.length}/${filtered.length})` : `已加载全部 (${filtered.length})`;
            btn.disabled = !hasMore;
        }

        function updateSummaryBar() {
            const filtered = filterGroups(allGroups);
            const summary = document.getElementById('summaryBar');
            const openGroups = filtered.filter((group) => !group.exitOrder && group.status !== 'Canceled' && group.status !== 'Closed').length;
            summary.innerHTML = `
                <div class="summary-card"><div class="summary-label">TRADE GROUPS</div><div class="summary-value">${filtered.length}</div></div>
                <div class="summary-card"><div class="summary-label">ORDERS</div><div class="summary-value">${filtered.reduce((sum, group) => sum + group.orders.length, 0)}</div></div>
                <div class="summary-card"><div class="summary-label">OPEN GROUPS</div><div class="summary-value">${openGroups}</div></div>
            `;
        }

        function updateStatusTabCounts() {
            const statuses = ['Init', 'Submitted', 'Filled', 'Canceled', 'Closed'];
            const counts = { all: allGroups.length };
            statuses.forEach((status) => {
                counts[status] = allGroups.filter((group) => group.status === status).length;
            });
            document.querySelectorAll('.status-tab').forEach((button) => {
                const status = button.dataset.status;
                const valueNode = button.querySelector('.count-value');
                if (valueNode) valueNode.textContent = counts[status] || 0;
            });
        }

        function updateDirectionTabCounts() {
            const directions = ['long', 'short'];
            const counts = { all: allGroups.length };
            directions.forEach((direction) => {
                counts[direction] = allGroups.filter((group) => group.direction === direction).length;
            });
            document.querySelectorAll('.dir-tab').forEach((button) => {
                const direction = button.dataset.dir;
                const valueNode = button.querySelector('.count-value');
                if (valueNode) valueNode.textContent = counts[direction] || 0;
            });
        }

        function renderFilterNote() {
            const notes = [];
            if (filterSignalId) notes.push(`signal_id=${filterSignalId}`);
            if (filterTradeGroupId) notes.push(`trade_group_id=${filterTradeGroupId}`);
            if (currentSearch) notes.push(`search=${currentSearch}`);
            document.getElementById('filterNote').innerHTML = notes.length
                ? `<div class="filter-note">当前过滤: ${escapeHtml(notes.join(' · '))}</div>`
                : '';
        }

        function renderRelationshipStrip(group) {
            const nodes = group.orders.map((order) => `
                <span class="relationship-node">
                    <span>${escapeHtml(getRoleText(order.role, order.order_type))}</span>
                    <span class="${statusClass(order.status)} status-badge">${escapeHtml(order.status)}</span>
                </span>
            `);
            return `
                <div class="relationship-strip">
                    ${nodes.map((node, index) => `${index > 0 ? '<span class="relationship-arrow">→</span>' : ''}${node}`).join('')}
                </div>
            `;
        }

        function renderMetric(label, value) {
            return `<div class="metric-card"><div class="metric-label">${escapeHtml(label)}</div><div class="metric-value">${value}</div></div>`;
        }

        function renderDetail(label, value) {
            return `
                <div class="detail-item">
                    <div class="detail-label">${escapeHtml(label)}</div>
                    <div class="detail-value">${value}</div>
                </div>
            `;
        }

        function renderOrderCard(order, isPrimary) {
            return `
                <div class="order-item-card ${isPrimary ? 'primary' : ''}">
                    <div class="order-item-head">
                        <div>
                            <div class="order-item-id">${escapeHtml(order.unique_id || '-')}</div>
                            <div class="order-item-sub">broker=${escapeHtml(order.broker_order_id || '-')}</div>
                        </div>
                        <div class="mini-chip-row">
                            <span class="role-badge ${roleClass(order.role)}">${escapeHtml(getRoleText(order.role, order.order_type))}</span>
                            <span class="status-badge ${statusClass(order.status)}">${escapeHtml(ORDER_STATUS_TEXT[order.status] || order.status || '-')}</span>
                            <span class="relation-badge ${relationClass(order.relation_status)}">${escapeHtml(order.relation_status || '-')}</span>
                        </div>
                    </div>
                    <div class="detail-grid">
                        ${renderDetail('order_type', escapeHtml(getOrderTypeText(order.order_type)))}
                        ${renderDetail('signal_id', escapeHtml(order.signal_id || '-'))}
                        ${renderDetail('数量 / 已成交', `${escapeHtml(formatQty(order.quantity))} / ${escapeHtml(formatQty(order.filled_qty))}`)}
                        ${renderDetail('限价 / 成交价', `${escapeHtml(formatMoney(order.limit_price))} / ${escapeHtml(formatMoney(order.fill_price))}`)}
                        ${renderDetail('parent_order', escapeHtml(order.parent_order_unique_id || '-'))}
                        ${renderDetail('sibling_order', escapeHtml(order.sibling_order_unique_id || '-'))}
                        ${renderDetail('entry_order', escapeHtml(order.entry_order_unique_id || '-'))}
                        ${renderDetail('time', escapeHtml(formatTimePair(order)))}
                    </div>
                </div>
            `;
        }

        function renderGroupCard(group) {
            const primary = group.primaryOrder;
            const tpOrder = group.orders.find((order) => order.role === 'take_profit' || order.role === 'repair_tp');
            const slOrder = group.orders.find((order) => order.role === 'stop_loss' || order.role === 'repair_sl');
            const exitText = group.exitOrder
                ? `已由 ${getRoleText(group.exitOrder.role, group.exitOrder.order_type)} 成交退出`
                : group.activeChildCount > 0
                    ? `保护单激活中 (${group.activeChildCount})`
                    : '等待后续状态';
            const actionTargetId = primary?.entry_order_unique_id || primary?.unique_id || group.trade_group_id;
            const canCancel = primary?.role === 'entry' && (primary?.status === 'Init' || primary?.status === 'Submitted');
            const canClose = primary?.role === 'entry' && primary?.status === 'Filled';

            return `
                <div class="group-card">
                    <div class="group-header">
                        <div>
                            <div class="group-symbol-row">
                                <span class="group-symbol">${escapeHtml(group.symbol)}</span>
                                <span class="direction-badge ${escapeHtml(group.direction || 'long')}">${escapeHtml((group.direction || '-').toUpperCase())}</span>
                                <span class="status-badge ${statusClass(group.status)}">${escapeHtml(ORDER_STATUS_TEXT[group.status] || group.status || '-')}</span>
                                ${group.exitOrder ? `<span class="chip highlight-chip">${escapeHtml(getRoleText(group.exitOrder.role, group.exitOrder.order_type))} 成交</span>` : ''}
                                ${group.relationAlert ? `<span class="chip warn-chip">存在孤儿单</span>` : ''}
                            </div>
                            <div class="group-subtitle">${escapeHtml(exitText)}</div>
                        </div>
                        <div class="group-subtitle">${escapeHtml(formatTimePair(group.latestEvent || primary || {}))}</div>
                    </div>

                    <div class="chip-row">
                        <span class="chip">trade_group_id=${escapeHtml(group.trade_group_id)}</span>
                        <span class="chip">entry=${escapeHtml(primary?.entry_order_unique_id || '-')}</span>
                        <span class="chip">signal_id=${escapeHtml(group.signal_id || '-')}</span>
                    </div>

                    <div class="group-grid">
                        ${renderMetric('Entry QC / Broker', `${escapeHtml(primary?.unique_id || '-')}<br><span style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;">${escapeHtml(primary?.broker_order_id || '-')}</span>`)}
                        ${renderMetric('Qty / Filled', `${escapeHtml(formatQty(primary?.quantity))} / ${escapeHtml(formatQty(primary?.filled_qty))}`)}
                        ${renderMetric('Entry Limit / Fill', `${escapeHtml(formatMoney(primary?.limit_price))} / ${escapeHtml(formatMoney(primary?.fill_price))}`)}
                        ${renderMetric('TP / SL', `${escapeHtml(formatMoney(tpOrder?.limit_price ?? primary?.tp_price))} / ${escapeHtml(formatMoney(slOrder?.limit_price ?? primary?.sl_price))}`)}
                    </div>

                    ${renderRelationshipStrip(group)}

                    <div class="section-title">Orders In Group</div>
                    <div class="order-list">
                        ${group.orders.map((order) => renderOrderCard(order, order.unique_id === primary?.unique_id)).join('')}
                    </div>

                    <div class="action-panel">
                        <div class="action-row">
                            ${group.signal_id ? `<button class="action-btn btn-secondary" onclick="viewSignal('${encodeURIComponent(group.signal_id)}')">📡 信号</button>` : ''}
                            <button class="action-btn btn-view" onclick="viewTradeGroup('${encodeURIComponent(group.trade_group_id)}')">📜 交易组明细</button>
                        </div>
                        <div class="action-row">
                            ${canCancel ? `<button class="action-btn btn-cancel" onclick="cancelOrder('${encodeURIComponent(actionTargetId)}', '${escapeHtml(group.symbol)}')">✕ 取消主单</button>` : ''}
                            ${canClose ? `<button class="action-btn btn-close" onclick="closePosition('${encodeURIComponent(actionTargetId)}', '${escapeHtml(group.symbol)}')">🔒 平仓整组</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGroups() {
            const container = document.getElementById('ordersContainer');
            if (displayedGroups.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">没有符合条件的交易组</div>
                    </div>
                `;
                return;
            }
            container.innerHTML = displayedGroups.map(renderGroupCard).join('');
        }

        async function loadOrders() {
            try {
                const startTimeMs = new Date(`${currentDate}T00:00:00Z`).getTime();
                const endTimeMs = startTimeMs + 24 * 60 * 60 * 1000;
                const records = await pb.collection('orders').getFullList({
                    filter: `bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}`,
                    sort: '-bar_time_ms,-created',
                    $autoCancel: false
                });

                allOrders = records.map(normalizeOrder);
                allGroups = buildTradeGroups(allOrders);
                resetPagination();
                renderFilterNote();
                updateSummaryBar();
                updateStatusTabCounts();
                updateDirectionTabCounts();
                renderGroups();
                updateLoadMoreButton();
            } catch (error) {
                console.error('加载订单失败:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-text">加载失败: ${escapeHtml(error.message || 'unknown error')}</div>
                    </div>
                `;
            }
        }

        function onSearchChange(value) {
            currentSearch = value.trim();
            resetPagination();
            renderFilterNote();
            updateSummaryBar();
            renderGroups();
            updateLoadMoreButton();
        }

        window.selectStatus = function(status, button) {
            document.querySelectorAll('.status-tab').forEach((node) => node.classList.remove('active'));
            button.classList.add('active');
            currentStatus = status;
            resetPagination();
            updateSummaryBar();
            renderGroups();
            updateLoadMoreButton();
        };

        window.onDirectionChange = function(direction) {
            currentDirection = direction;
            resetPagination();
            updateSummaryBar();
            renderGroups();
            updateLoadMoreButton();
        };

        window.onDateChange = function(startDate) {
            currentDate = startDate;
            loadOrders();
        };

        async function closePosition(uniqueId, symbol) {
            if (!confirm(`确认平仓 ${symbol} 的整组订单？`)) return;
            try {
                await fetch(`/webhook/order/close?id=${decodeURIComponent(uniqueId)}`);
                showToast('已发送平仓整组请求');
                loadOrders();
            } catch (error) {
                showToast(`平仓失败: ${error.message}`);
            }
        }

        async function cancelOrder(uniqueId, symbol) {
            if (!confirm(`确认取消 ${symbol} 的主入场单？`)) return;
            try {
                await fetch(`/webhook/order/cancel?id=${decodeURIComponent(uniqueId)}`);
                showToast('已发送取消主单请求');
                loadOrders();
            } catch (error) {
                showToast(`取消失败: ${error.message}`);
            }
        }

        function viewSignal(signalId) {
            const decoded = decodeURIComponent(signalId);
            location.href = `/signals.html?signal_id=${encodeURIComponent(decoded)}&date=${encodeURIComponent(currentDate)}`;
        }

        function viewTradeGroup(groupId) {
            const decoded = decodeURIComponent(groupId);
            location.href = `/order_details.html?trade_group_id=${encodeURIComponent(decoded)}&date=${encodeURIComponent(currentDate)}`;
        }

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 600);
            loadOrders();
        }

        function changeRefreshInterval(seconds) {
            currentInterval = Number(seconds) || 0;
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            if (currentInterval > 0) {
                refreshTimer = setInterval(loadOrders, currentInterval * 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!initAuth()) return;

            document.getElementById('nav').innerHTML = renderNav('/orders.html');
            document.getElementById('directionTabs').innerHTML = renderDirectionTabs();
            document.getElementById('datePicker').innerHTML = renderDatePicker();

            const params = new URLSearchParams(window.location.search);
            filterSignalId = params.get('signal_id') || '';
            filterTradeGroupId = params.get('trade_group_id') || '';
            currentSearch = params.get('search') || '';
            currentDate = params.get('date') || currentDate;

            document.getElementById('searchInput').value = currentSearch;
            const dateInput = document.getElementById('customDate');
            if (dateInput) dateInput.value = currentDate;

            await loadOrders();
            changeRefreshInterval(30);
        });
    </script>
</body>
</html>
