<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <style>
        .search-row {
            margin-bottom: 6px;
        }

        .search-row > div:first-child {
            margin-bottom: 4px;
        }

        .search-row .refresh-control {
            gap: 4px;
        }

        .search-row .refresh-btn {
            padding: 4px 6px;
            font-size: 12px;
        }

        .search-row .refresh-select {
            padding: 4px 6px;
            font-size: 11px;
        }

        .search-input {
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        /* 状态筛选 Tab */
        .status-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 8px 0;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .direction-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 8px 0;
            background: var(--bg);
            position: sticky;
            top: 50px;
            z-index: 9;
        }

        .status-tab {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #C4D4E4;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .status-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .status-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .status-tab .tab-count {
            font-size: 10px;
            margin-left: 2px;
            opacity: 0.8;
        }

        .dir-tab .tab-count {
            font-size: 10px;
            margin-left: 2px;
            opacity: 0.8;
        }

        /* 订单卡片 */
        .order-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .order-card:active {
            transform: scale(0.98);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .order-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-icon {
            font-size: 20px;
        }

        .order-symbol {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .order-direction {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .order-direction.long {
            background: rgba(72,187,120,0.15);
            color: var(--long);
        }

        .order-direction.short {
            background: rgba(252,129,129,0.15);
            color: var(--short);
        }

        .order-type-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-left: 6px;
        }

        .type-entry {
            background: rgba(59,130,246,0.2);
            color: #60a5fa;
        }

        .type-takeprofit {
            background: rgba(72,187,120,0.2);
            color: var(--long);
        }

        .type-stoploss {
            background: rgba(252,129,129,0.2);
            color: var(--short);
        }

        .order-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-init {
            background: rgba(99,179,237,0.2);
            color: var(--accent);
        }

        .status-submitted {
            background: rgba(246,173,85,0.2);
            color: var(--pending);
        }

        .status-filled {
            background: rgba(104,211,145,0.2);
            color: var(--executed);
        }

        .status-canceled {
            background: rgba(113,128,150,0.2);
            color: var(--rejected);
        }

        .order-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .order-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .order-label {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        .order-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            word-break: break-all;
        }

        /* 操作区域 */
        .signal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .signal-actions .action-btns-row {
            display: flex;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .signal-actions .action-btns-row .action-btn {
            flex: 1;
            padding: 8px 4px;
            font-size: 11px;
            white-space: nowrap;
        }

        .action-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: clamp(12px, 3vw, 14px);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-view {
            grid-column: 1 / -1;
            background: var(--accent);
            color: var(--bg);
        }

        .btn-view:active {
            background: #4299e1;
        }

        .btn-close {
            background: var(--short);
            color: var(--bg);
        }

        .btn-close:active:not(:disabled) {
            background: #e53e3e;
        }

        .btn-cancel {
            background: var(--short);
            color: var(--bg);
        }

        .btn-cancel:active:not(:disabled) {
            background: #e53e3e;
        }

        /* 刷新控件 */
        .refresh-control {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:active {
            color: var(--accent);
            border-color: var(--accent);
        }

        .refresh-btn.spinning {
            animation: spin 0.6s linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .refresh-select {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            cursor: pointer;
        }

        .refresh-select:focus {
            border-color: var(--accent);
        }

        .search-row .refresh-control .refresh-btn {
            padding: 8px 10px;
            font-size: 12px;
        }

        .search-row .refresh-control .refresh-select {
            padding: 8px 10px;
            font-size: 11px;
        }

        .signal-link {
            background: rgba(99,179,237,0.1);
            border: 1px solid rgba(99,179,237,0.2);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .signal-link:active {
            background: rgba(99,179,237,0.2);
            transform: scale(0.98);
        }

        .signal-link-icon {
            font-size: 16px;
        }

        .signal-link-text {
            flex: 1;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-weight: 700;
        }

        .signal-link-arrow {
            font-size: 14px;
            color: var(--accent);
        }

        .load-more-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more-btn:active {
            background: var(--surface);
        }

        .load-more-btn:disabled {
            color: var(--muted);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-label">TRADING</div>
                <div class="logo-title">📋 订单</div>
            </div>
            <div class="live-badge">
                <div class="live-dot"></div>
                LIVE
            </div>
        </div>
    </div>

    <div class="content">
        <div class="search-row">
            <div style="display:flex;gap:8px;align-items:center;">
                <div id="datePicker" style="flex:1;"></div>
                <div class="refresh-control">
                    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄</button>
                    <select class="refresh-select" id="refreshInterval" onchange="changeRefreshInterval(this.value)">
                        <option value="0">关闭</option>
                        <option value="5">5秒</option>
                        <option value="30" selected>30秒</option>
                        <option value="60">1分钟</option>
                    </select>
                </div>
            </div>
            <input class="search-input" id="searchInput" placeholder="🔍 搜索股票/信号ID/订单ID..." oninput="onSearchChange(this.value)">
        </div>
        <div class="status-tabs">
            <button class="status-tab active" data-status="all" onclick="selectStatus('all', this)">全部<span class="tab-count" data-status="all">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Init" onclick="selectStatus('Init', this)">初始化<span class="tab-count" data-status="Init">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Submitted" onclick="selectStatus('Submitted', this)">已提交<span class="tab-count" data-status="Submitted">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Filled" onclick="selectStatus('Filled', this)">已成交<span class="tab-count" data-status="Filled">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Canceled" onclick="selectStatus('Canceled', this)">已取消<span class="tab-count" data-status="Canceled">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="Closed" onclick="selectStatus('Closed', this)">已平仓<span class="tab-count" data-status="Closed">(<span class="count-value">0</span>)</span></button>
        </div>

        <div id="directionTabs"></div>

        <div id="ordersContainer">
            <div class="loading">加载中...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreOrders()" style="display: none;">加载更多</button>
    </div>

    <div id="nav"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const pb = new PocketBase('https://pb.lzw-glory.top');
        let allOrders = [];
        let currentDate = new Date().toISOString().split('T')[0];
        let currentDirection = 'all';
        let currentSearch = '';
        let refreshTimer = null;
        let currentInterval = 30;
        let orderReverseSignalsMap = {};   // { order_id: true/false }
        let filterSignalId = null;
        let currentStatus = 'all';
        let orderValidityMinutes = 30;

        // Pagination
        let currentPage = 1;
        const itemsPerPage = 10;
        let displayedOrders = [];

        async function initAuth() {
            const token = getToken();
            if (!token) {
                location.href = '/login.html?from=/orders.html';
                return;
            }
            pb.authStore.save(token, null);
        }

        async function loadOrders() {
            try {
                // 读取订单有效期配置
                try {
                    const configResult = await pb.collection('config').getFirstListItem('key = "order_validity_minutes"');
                    if (configResult && configResult.value) {
                        orderValidityMinutes = parseInt(configResult.value) || 30;
                    }
                } catch (e) {
                    orderValidityMinutes = 30;
                }

                const currentDate_obj = new Date(currentDate + 'T00:00:00Z');
                const nextDate_obj = new Date(currentDate_obj.getTime() + 86400000);
                const startTimeMs = currentDate_obj.getTime();
                const endTimeMs = nextDate_obj.getTime();

                allOrders = await pb.collection('orders').getFullList({
                    filter: `bar_time_ms >= ${startTimeMs} && bar_time_ms < ${endTimeMs}`,
                    sort: '-created',
                    expand: 'indicators_via_signal_id',
                    $autoCancel: false
                });

                // 加载反向信号映射
                await loadReverseSignalsMap();

                resetPagination();
                renderOrders();
                updateLoadMoreButton();
                await updateStatusTabCounts();
                await updateDirectionTabCounts();
            } catch (error) {
                console.error('加载失败:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                showToast('加载失败: ' + error.message);
            }
        }

        // 加载反向信号映射（按 symbol 分组）
        async function loadReverseSignalsMap() {
            orderReverseSignalsMap = {};
            try {
                const startTime = `${currentDate} 00:00:00`;
                const endTime = `${currentDate} 23:59:59`;

                // 查询今日所有已确认的反向信号
                const reverseSignals = await pb.collection('reverse_signals').getFullList({
                    filter: `created >= "${startTime}" && created <= "${endTime}" && status = "confirmed"`,
                    $autoCancel: false
                });

                // 按 order_id 建立映射（从 extra 中获取）
                reverseSignals.forEach(rs => {
                    const rsExtra = rs.extra || {};
                    const orderId = rsExtra.order_id;
                    if (orderId) {
                        orderReverseSignalsMap[orderId] = true;
                    }
                });

                console.log('[ReverseSignals] 加载完成:', orderReverseSignalsMap);
            } catch (error) {
                console.error('加载反向信号失败:', error);
            }
        }

        function updateStats() {
            // 状态统计由 Tab count 显示，无需额外处理
        }

        function filterOrdersAll() {
            let filtered = allOrders;
            if (currentStatus !== 'all') {
                filtered = filtered.filter(o => o.status === currentStatus);
            }
            if (currentDirection !== 'all') {
                filtered = filtered.filter(o => o.direction === currentDirection);
            }
            if (filterSignalId) {
                filtered = filtered.filter(o => o.signal_id === filterSignalId);
            }
            if (currentSearch) {
                const s = currentSearch.toUpperCase();
                filtered = filtered.filter(o =>
                    (o.symbol || '').toUpperCase().includes(s) ||
                    (o.signal_id || '').toUpperCase().includes(s) ||
                    (o.order_id || '').toUpperCase().includes(s) ||
                    (o.unique_id || '').toUpperCase().includes(s) ||
                    (o.order_type || '').toUpperCase().includes(s)
                );
            }
            return filtered;
        }

        function getFilteredOrders() {
            return filterOrdersAll();
        }

        function getPaginatedOrders() {
            const filtered = getFilteredOrders();
            const start = (currentPage - 1) * itemsPerPage;
            return filtered.slice(0, start + itemsPerPage);
        }

        function updateLoadMoreButton() {
            const btn = document.getElementById('loadMoreBtn');
            const filtered = getFilteredOrders();
            const hasMore = displayedOrders.length < filtered.length;
            btn.style.display = hasMore ? 'block' : 'none';
            btn.textContent = hasMore ? `加载更多 (${displayedOrders.length}/${filtered.length})` : '没有更多了';
            btn.disabled = !hasMore;
        }

        function loadMoreOrders() {
            currentPage++;
            displayedOrders = getPaginatedOrders();
            renderOrders();
            updateLoadMoreButton();
        }

        function resetPagination() {
            currentPage = 1;
            displayedOrders = getPaginatedOrders();
        }

        function filterOrders() {
            return displayedOrders;
        }

        function onSearchChange(val) {
            currentSearch = val.trim();
            resetPagination();
            renderOrders();
            updateLoadMoreButton();
            updateStatusTabCounts();
            updateDirectionTabCounts();
        }

        // 状态筛选 Tab
        window.selectStatus = function(status, btn) {
            document.querySelectorAll('.status-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentStatus = status;
            loadOrders();
        };

        // 更新状态标签的数量显示
        async function updateStatusTabCounts() {
            const statuses = ['Init', 'Submitted', 'Filled', 'Canceled', 'Closed'];
            const counts = {};
            const total = allOrders.length;
            counts['all'] = total;
            statuses.forEach(s => { counts[s] = allOrders.filter(o => o.status === s).length; });
            ['all', ...statuses].forEach(s => {
                const tab = document.querySelector(`.status-tab .tab-count[data-status="${s}"] .count-value`);
                if (tab) tab.textContent = counts[s] || 0;
            });
        }

        // 更新方向标签的数量显示
        async function updateDirectionTabCounts() {
            const directions = ['long', 'short'];
            const counts = {};
            directions.forEach(d => { counts[d] = allOrders.filter(o => o.direction === d).length; });
            ['all', ...directions].forEach(d => {
                const tab = document.querySelector(`.dir-tab .tab-count[data-dir="${d}"] .count-value`);
                if (tab) tab.textContent = counts[d] || 0;
            });
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const filtered = filterOrders();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">暂无订单</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(order => {
                const directionIcon = order.direction === 'long' ? '📈' : '📉';
                const directionClass = order.direction === 'long' ? 'long' : 'short';
                const orderType = order.order_type || 'Entry';
                const orderTypeClass = orderType.toLowerCase().replace(/\s/g, '');
                const orderTypeText = {
                    'Entry': '入场',
                    'TakeProfit': '止盈',
                    'StopLoss': '止损'
                }[orderType] || orderType;

                const statusClass = (order.status || 'Submitted').toLowerCase();
                const statusText = {
                    'init': '初始化',
                    'submitted': '已提交',
                    'filled': '已成交',
                    'canceled': '已取消',
                    'closed': '已平仓'
                }[statusClass] || order.status;

                // 判断是否可以平仓或取消
                const isEntry = orderType === 'Entry';
                const isSubmitted = order.status === 'Submitted';
                const isFilled = order.status === 'Filled';
                const canClose = isEntry && isFilled;
                const canCancel = isEntry && isSubmitted;

                // 倒计时
                const showCountdown = order.status === 'Init' || order.status === 'Submitted';
                const orderUniqueId = order.unique_id || order.order_id;
                const hasReverseSignal = orderReverseSignalsMap[orderUniqueId] || false;

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="order-title">
                                <span class="order-icon">${directionIcon}</span>
                                <span class="order-symbol">${order.symbol}</span>
                                <span class="order-direction ${directionClass}">${order.direction.toUpperCase()}</span>
                                <span class="order-type-badge type-${orderTypeClass}">${orderTypeText}</span>
                            </div>
                            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                                <div class="order-status status-${statusClass}">${statusText}</div>
                                ${showCountdown ? `
                                <div class="countdown-display" data-bar-time="${order.bar_time_ms || ''}" style="font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--pending);">
                                    ⏱️ <span class="countdown-value">${calculateOrderCountdown(order.bar_time_ms) || '-'}</span>
                                </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="order-grid">
                            <div class="order-item">
                                <div class="order-label">QC 订单ID</div>
                                <div class="order-value" style="font-size:11px;font-family:'JetBrains Mono',monospace;">${orderUniqueId || '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">IB 券商订单ID</div>
                                <div class="order-value" style="font-size:11px;font-family:'JetBrains Mono',monospace;">${order.order_id || '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">信号ID</div>
                                <div class="order-value" style="font-size:11px;font-family:'JetBrains Mono',monospace;">${order.signal_id || '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">限价</div>
                                <div class="order-value">${order.limit_price != null ? '$' + order.limit_price.toFixed(2) : '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">成交价</div>
                                <div class="order-value">${order.fill_price != null ? '$' + order.fill_price.toFixed(2) : '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">数量</div>
                                <div class="order-value">${order.quantity != null ? order.quantity : '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">已成交</div>
                                <div class="order-value">${order.filled_qty != null ? order.filled_qty : '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">止损价</div>
                                <div class="order-value">${order.sl_price != null ? '$' + order.sl_price.toFixed(2) : '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">止盈价</div>
                                <div class="order-value">${order.tp_price != null ? '$' + order.tp_price.toFixed(2) : '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">风报比</div>
                                <div class="order-value">${order.rr_ratio != null ? order.rr_ratio.toFixed(2) + 'x' : '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">下单时间</div>
                                <div class="order-value" style="font-size:10px;font-family:'JetBrains Mono',monospace;word-break:break-all;">
                                    ${order.us_time ? order.us_time.replace(' ', '') + '/ET' : '-'}${order.cn_time ? ' ' + order.cn_time.replace(' ', '') + '/CN' : ''}
                                </div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">成交时间</div>
                                <div class="order-value" style="font-size:10px;font-family:'JetBrains Mono',monospace;word-break:break-all;">${order.fill_time ? order.fill_time.replace(' ', '') : '-'}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">PB 新建</div>
                                <div class="order-value" style="font-size:11px;font-family:'JetBrains Mono',monospace;">${formatTime(order.created, 'America/New_York', 'short')}</div>
                            </div>
                            <div class="order-item">
                                <div class="order-label">PB 更新</div>
                                <div class="order-value" style="font-size:11px;font-family:'JetBrains Mono',monospace;">${formatTime(order.updated, 'America/New_York', 'short')}</div>
                            </div>
                        </div>

                        ${hasReverseSignal ? `
                            <div class="signal-link" onclick="viewReverseSignal('${orderUniqueId}')">
                                <span class="signal-link-icon">🔄</span>
                                <span class="signal-link-text">反向信号</span>
                                <span class="signal-link-arrow">→</span>
                            </div>
                        ` : ''}

                        <div class="signal-actions" style="display:flex;flex-direction:column;gap:8px;">
                            <div class="action-btns-row">
                                ${order.signal_id ? `
                                <button class="action-btn btn-view" onclick="viewSignal('${order.signal_id}')">
                                    📡 查看关联信号
                                </button>` : ''}
                                <button class="action-btn btn-view" onclick="viewOrderDetails('${order.id}', '${order.symbol}')">
                                    📜 明细
                                </button>
                            </div>
                            ${canClose || canCancel ? `
                            <div style="display:flex;gap:6px;justify-content:flex-end;">
                                ${canClose ? `<button class="action-btn btn-close" onclick="closePosition('${orderUniqueId}', '${order.symbol}')">🔒 平仓</button>` : ''}
                                ${canCancel ? `<button class="action-btn btn-cancel" onclick="cancelOrder('${orderUniqueId}', '${order.symbol}')">✕ 取消</button>` : ''}
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function closePosition(uniqueId, symbol) {
            if (!confirm(`确认平仓 ${symbol}？`)) return;
            try {
                const resp = await fetch(`/webhook/order/close?id=${encodeURIComponent(uniqueId)}`);
                const text = await resp.text();
                showToast('✓ 平仓请求已发送');
                await loadOrders();
            } catch (error) {
                console.error('平仓失败:', error);
                showToast('✗ 平仓失败: ' + error.message);
            }
        }

        async function cancelOrder(uniqueId, symbol) {
            if (!confirm(`确认取消 ${symbol} 订单？`)) return;
            try {
                const resp = await fetch(`/webhook/order/cancel?id=${encodeURIComponent(uniqueId)}`);
                const text = await resp.text();
                showToast('✓ 取消请求已发送');
                await loadOrders();
            } catch (error) {
                console.error('取消失败:', error);
                showToast('✗ 取消失败: ' + error.message);
            }
        }

        function viewSignal(signalId) {
            if (!signalId) {
                showToast('无法找到关联信号');
                return;
            }
            // 从 bar_time_ms 提取 UTC 日期传给 signals.html 同步日期选择器
            const order = allOrders.find(o => o.signal_id === signalId);
            const dateParam = order && order.bar_time_ms
                ? new Date(order.bar_time_ms).toISOString().split('T')[0]
                : '';
            const params = new URLSearchParams({ signal_id: signalId });
            if (dateParam) params.set('date', dateParam);
            location.href = `/signals.html?${params.toString()}`;
        }

        function viewReverseSignal(orderId) {
            if (!orderId) {
                showToast('无法找到反向信号');
                return;
            }
            location.href = `/reverse_signals.html?order_id=${encodeURIComponent(orderId)}`;
        }

        function viewOrderDetails(uniqueId, symbol) {
            if (!uniqueId) {
                showToast('无法找到订单明细');
                return;
            }
            location.href = `/order_details.html?order_id=${encodeURIComponent(uniqueId)}`;
        }

        window.onDateChange = function(startDate, endDate) {
            currentDate = startDate;
            loadOrders();
        };

        window.onDirectionChange = function(direction) {
            currentDirection = direction;
            resetPagination();
            renderOrders();
            updateLoadMoreButton();
            updateStatusTabCounts();
            updateDirectionTabCounts();
        };

        // 计算订单倒计时
        function calculateOrderCountdown(barTimeMs) {
            if (!barTimeMs) return '';
            const expiryTime = new Date(parseInt(barTimeMs) + orderValidityMinutes * 60 * 1000);
            const now = new Date();
            const usEasternTime = new Date(now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC');
            const remainingMs = expiryTime - usEasternTime;
            if (remainingMs <= 0) return '';
            const hours = Math.floor(remainingMs / (60 * 60 * 1000));
            const minutes = Math.floor((remainingMs % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((remainingMs % (60 * 1000)) / 1000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 更新所有倒计时显示
        function updateOrderCountdowns() {
            const countdownElements = document.querySelectorAll('.countdown-display');
            countdownElements.forEach(el => {
                const barTime = el.getAttribute('data-bar-time');
                const valueEl = el.querySelector('.countdown-value');
                if (valueEl && barTime) {
                    const remainingMs = parseInt(barTime) + orderValidityMinutes * 60 * 1000 - new Date().getTime();
                    if (remainingMs > 0 && remainingMs < 5 * 60 * 1000) {
                        valueEl.style.color = 'var(--short)';
                        el.style.color = 'var(--short)';
                    } else {
                        valueEl.style.color = '';
                        el.style.color = '';
                    }
                    valueEl.textContent = calculateOrderCountdown(barTime) || '-';
                }
            });
        }

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 600);
            loadOrders();
        }

        function changeRefreshInterval(seconds) {
            currentInterval = parseInt(seconds);
            if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
            if (currentInterval > 0) {
                refreshTimer = setInterval(loadOrders, currentInterval * 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            document.getElementById('nav').innerHTML = renderNav('/orders.html');
            document.getElementById('directionTabs').innerHTML = renderDirectionTabs();

            // 检查 URL 参数
            const urlParams = new URLSearchParams(window.location.search);
            const signalId = urlParams.get('signal_id');
            const orderId = urlParams.get('order_id');
            const action = urlParams.get('action');
            const urlDate = urlParams.get('date');
            const searchParam = urlParams.get('search');

            // 优先使用 URL 参数中的日期
            if (urlDate) {
                currentDate = urlDate;
            }

            document.getElementById('datePicker').innerHTML = renderDatePicker();

            // 如果是 URL 参数的日期，更新日期选择器的显示
            if (urlDate) {
                const dateInput = document.getElementById('customDate');
                if (dateInput) dateInput.value = urlDate;
            }

            if (signalId) {
                filterSignalId = signalId;
                showToast(`📡 筛选信号: ${signalId.substring(0, 20)}...`);
            }

            // 如果有搜索参数，填充搜索框
            if (searchParam) {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.value = searchParam;
                    currentSearch = searchParam;
                }
            }

            loadOrders();

            // 处理飞书通知的操作请求
            if (orderId && action) {
                setTimeout(async () => {
                    const order = allOrders.find(o => o.unique_id === orderId);
                    if (order) {
                        if (action === 'cancel') {
                            if (confirm(`确认取消 ${order.symbol} 订单？`)) {
                                await cancelOrder(order.id, order.symbol);
                            }
                        } else if (action === 'close') {
                            if (confirm(`确认平仓 ${order.symbol}？`)) {
                                await closePosition(order.id, order.symbol);
                            }
                        }
                        // 清除 URL 参数
                        window.history.replaceState({}, '', '/orders.html');
                    } else {
                        showToast('未找到指定订单');
                    }
                }, 1500);
            }

            // 初始化定时刷新（默认30秒）
            changeRefreshInterval(30);

            // 初始化倒计时更新（每秒）
            setInterval(updateOrderCountdowns, 1000);
        });
    </script>
</body>
</html>
