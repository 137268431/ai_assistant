<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IBKR 图表 - Trading Flight</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        .hero {
            padding: 8px 16px 14px;
        }

        .hero-card {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(11, 17, 28, 0.98), rgba(15, 23, 38, 0.96));
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
            padding: 18px;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .hero-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, #7dd3fc, #86efac 72%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-copy {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.8;
            max-width: 760px;
        }

        .hero-status {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .hero-chip {
            border: 1px solid rgba(99,179,237,0.16);
            border-radius: 999px;
            background: rgba(20, 28, 46, 0.88);
            color: var(--text);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            padding: 8px 12px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 14px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .toolbar-filters {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .filter-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .toolbar-label {
            color: var(--muted);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .symbol-form {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .symbol-input {
            width: 120px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(99,179,237,0.18);
            background: rgba(8, 12, 20, 0.92);
            color: var(--text);
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            text-transform: uppercase;
        }

        .symbol-input:focus {
            border-color: rgba(99,179,237,0.42);
            box-shadow: 0 0 0 3px rgba(99,179,237,0.12);
        }

        .toolbar-btn {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(99,179,237,0.18);
            background: rgba(20, 28, 46, 0.92);
            color: var(--text);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
        }

        .toolbar-btn.primary {
            background: linear-gradient(180deg, rgba(99,179,237,0.22), rgba(255,255,255,0.04));
            color: #d7f0ff;
        }

        .toolbar-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .tf-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .range-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .tf-btn {
            padding: 9px 12px;
            border-radius: 999px;
            border: 1px solid rgba(99,179,237,0.14);
            background: rgba(8, 12, 20, 0.92);
            color: var(--muted);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .tf-btn.active {
            border-color: rgba(72,187,120,0.42);
            background: rgba(72,187,120,0.14);
            color: #bbf7d0;
            transform: translateY(-1px);
        }

        .range-btn {
            padding: 9px 12px;
            border-radius: 999px;
            border: 1px solid rgba(99,179,237,0.14);
            background: rgba(8, 12, 20, 0.92);
            color: var(--muted);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .range-btn.active {
            border-color: rgba(246,173,85,0.42);
            background: rgba(246,173,85,0.14);
            color: #fbd38d;
            transform: translateY(-1px);
        }

        .summary-strip {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .layer-strip {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .cursor-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .summary-chip {
            border-radius: 10px;
            border: 1px solid rgba(99,179,237,0.12);
            background: rgba(8, 12, 20, 0.78);
            color: var(--muted);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            padding: 8px 10px;
        }

        .layer-btn {
            border-radius: 999px;
            border: 1px solid rgba(99,179,237,0.14);
            background: rgba(8, 12, 20, 0.82);
            color: var(--muted);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            padding: 8px 11px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .layer-btn.active {
            color: #e2eaf4;
            border-color: rgba(99,179,237,0.28);
            background: rgba(99,179,237,0.14);
            transform: translateY(-1px);
        }

        .cursor-card {
            border-radius: 12px;
            border: 1px solid rgba(99,179,237,0.12);
            background: rgba(8, 12, 20, 0.76);
            padding: 10px 12px;
        }

        .cursor-label {
            color: var(--muted);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 5px;
        }

        .cursor-value {
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            line-height: 1.45;
        }

        .cursor-value.compact {
            font-size: 12px;
            font-weight: 600;
        }

        .compare-status-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .compare-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid rgba(99,179,237,0.14);
            background: rgba(8, 12, 20, 0.88);
            color: var(--muted);
        }

        .compare-pill.match {
            border-color: rgba(72,187,120,0.22);
            color: #bbf7d0;
        }

        .compare-pill.mismatch,
        .compare-pill.missing_stored,
        .compare-pill.missing_ibkr {
            border-color: rgba(252,129,129,0.24);
            color: #fecaca;
        }

        .compare-list {
            display: grid;
            gap: 8px;
            margin-top: 12px;
        }

        .compare-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border-radius: 12px;
            background: rgba(20, 28, 46, 0.72);
            padding: 10px;
            align-items: center;
        }

        .compare-item.interactive {
            cursor: pointer;
            border: 1px solid transparent;
            transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
        }

        .compare-item.interactive:hover {
            border-color: rgba(99,179,237,0.22);
            background: rgba(24, 36, 58, 0.9);
            transform: translateY(-1px);
        }

        .compare-item.disabled {
            opacity: 0.66;
        }

        .compare-side {
            display: grid;
            gap: 4px;
            min-width: 0;
        }

        .compare-title {
            font-size: 12px;
            color: var(--text);
            font-weight: 700;
        }

        .compare-meta {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .compare-copy {
            margin-top: 6px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.7;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 14px;
            padding: 0 16px 16px;
            align-items: start;
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(11, 17, 28, 0.98), rgba(15, 23, 38, 0.96));
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.24);
        }

        .chart-panel {
            overflow: hidden;
        }

        .chart-shell {
            padding: 0 12px 12px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 18px 12px;
            border-bottom: 1px solid rgba(99,179,237,0.08);
            flex-wrap: wrap;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        .panel-copy {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.7;
        }

        .panel-meta {
            color: var(--muted);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
        }

        .tv-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 4px 10px;
            flex-wrap: wrap;
        }

        .tv-toolbar-cluster {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tv-toolbar-copy {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            color: var(--muted);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .tv-tool-btn,
        .tv-copy-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 34px;
            padding: 0 12px;
            border-radius: 12px;
            border: 1px solid rgba(99,179,237,0.14);
            background: linear-gradient(180deg, rgba(18, 28, 46, 0.96), rgba(8, 12, 20, 0.98));
            color: #cdd9ea;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
        }

        .tv-tool-btn {
            cursor: pointer;
        }

        .tv-tool-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: rgba(125, 211, 252, 0.26);
            background: linear-gradient(180deg, rgba(25, 38, 62, 0.98), rgba(11, 17, 28, 0.98));
        }

        .tv-tool-btn:disabled {
            opacity: 0.44;
            cursor: not-allowed;
        }

        .tv-tool-btn.accent {
            color: #dff7ff;
            border-color: rgba(125, 211, 252, 0.22);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .tv-copy-chip {
            background: rgba(8, 12, 20, 0.86);
            color: var(--muted);
        }

        .chart-stage-shell {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid rgba(99,179,237,0.10);
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent 28%),
                radial-gradient(circle at top right, rgba(72, 187, 120, 0.08), transparent 22%),
                linear-gradient(180deg, rgba(7, 12, 20, 0.96), rgba(10, 16, 28, 0.98));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
            overscroll-behavior: contain;
            touch-action: pan-x pan-y pinch-zoom;
        }

        .chart-stage-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }

        .tv-floating-legend {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: grid;
            gap: 8px;
            align-content: start;
        }

        .tv-floating-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tv-floating-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 30px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid rgba(99,179,237,0.14);
            background: rgba(8, 12, 20, 0.82);
            color: #d7e2f0;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }

        .tv-floating-pill.brand {
            border-color: rgba(125, 211, 252, 0.22);
            color: #dff7ff;
            background: rgba(7, 19, 31, 0.88);
        }

        .tv-floating-pill.positive,
        .tv-floating-pill.match {
            color: #bbf7d0;
            border-color: rgba(72,187,120,0.22);
        }

        .tv-floating-pill.long {
            color: #bbf7d0;
            border-color: rgba(72,187,120,0.22);
        }

        .tv-floating-pill.negative,
        .tv-floating-pill.mismatch,
        .tv-floating-pill.missing_stored,
        .tv-floating-pill.missing_ibkr {
            color: #fecaca;
            border-color: rgba(252,129,129,0.24);
        }

        .tv-floating-pill.short {
            color: #fecaca;
            border-color: rgba(252,129,129,0.24);
        }

        .tv-watermark {
            position: absolute;
            right: 18px;
            bottom: 44px;
            color: rgba(139, 164, 196, 0.18);
            font-size: clamp(26px, 2vw, 34px);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: right;
            line-height: 1.15;
            text-shadow: 0 6px 30px rgba(0,0,0,0.3);
        }

        .chart-stage {
            height: 74vh;
            min-height: 660px;
            width: 100%;
        }

        .chart-empty {
            min-height: 360px;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 13px;
            padding: 30px 18px;
            text-align: center;
            line-height: 1.8;
        }

        .chart-bottom-bar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 10px 4px 0;
            flex-wrap: wrap;
        }

        .chart-bottom-status,
        .chart-shortcut-strip {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .chart-status-chip,
        .chart-shortcut-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid rgba(99,179,237,0.12);
            background: rgba(8, 12, 20, 0.72);
            color: var(--muted);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .chart-shortcut-chip strong {
            color: #d7e2f0;
            font-weight: 700;
        }

        .chart-note {
            padding: 0 18px 16px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.8;
        }

        .rail {
            display: grid;
            gap: 12px;
        }

        .rail-shell {
            display: grid;
            gap: 10px;
            align-content: start;
        }

        .rail-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .rail-nav:empty {
            display: none;
        }

        .rail-nav-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 30px;
            padding: 0 12px;
            border-radius: 999px;
            border: 1px solid rgba(99,179,237,0.14);
            background: rgba(8, 12, 20, 0.82);
            color: var(--muted);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: border-color 0.16s ease, transform 0.16s ease, background 0.16s ease;
        }

        .rail-nav-chip:hover {
            border-color: rgba(125, 211, 252, 0.24);
            transform: translateY(-1px);
            background: rgba(12, 18, 31, 0.92);
        }

        .rail-nav-chip.active {
            color: #dff7ff;
            border-color: rgba(125, 211, 252, 0.26);
            background: rgba(17, 31, 49, 0.96);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .mobile-dock {
            display: none;
        }

        .mobile-dock:empty {
            display: none;
        }

        .mobile-quick-panel {
            position: fixed;
            inset: 0;
            z-index: 1520;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .mobile-quick-panel.show {
            pointer-events: auto;
        }

        .mobile-quick-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 16, 0.54);
            opacity: 0;
            transition: opacity 0.18s ease;
        }

        .mobile-quick-panel.show .mobile-quick-backdrop {
            opacity: 1;
        }

        .mobile-quick-card {
            position: relative;
            width: min(100vw, 100vw);
            transform: translateY(104%);
            transition: transform 0.22s ease;
            border-top: 1px solid rgba(99,179,237,0.16);
            border-radius: 22px 22px 0 0;
            background: linear-gradient(180deg, rgba(9, 14, 24, 0.98), rgba(13, 20, 34, 0.98));
            padding: 14px 12px calc(18px + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 -20px 46px rgba(0,0,0,0.32);
        }

        .mobile-quick-panel.show .mobile-quick-card {
            transform: translateY(0);
        }

        .mobile-quick-grabber {
            width: 54px;
            height: 5px;
            border-radius: 999px;
            background: rgba(139, 164, 196, 0.28);
            margin: 0 auto 12px;
        }

        .mobile-quick-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .mobile-quick-title {
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
        }

        .mobile-quick-close {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            border: 1px solid rgba(99,179,237,0.14);
            background: rgba(8, 12, 20, 0.86);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
        }

        .mobile-quick-section {
            margin-top: 12px;
        }

        .mobile-quick-label {
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 8px;
        }

        .mobile-quick-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .mobile-quick-chip {
            min-height: 38px;
            padding: 0 10px;
            border-radius: 12px;
            border: 1px solid rgba(99,179,237,0.14);
            background: rgba(8, 12, 20, 0.82);
            color: var(--muted);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
        }

        .mobile-quick-chip.active {
            color: #dff7ff;
            border-color: rgba(125, 211, 252, 0.26);
            background: rgba(17, 31, 49, 0.96);
        }

        .rail-card {
            border: 1px solid rgba(99,179,237,0.1);
            border-radius: 16px;
            background: rgba(10, 16, 26, 0.86);
            padding: 14px;
        }

        .rail-kicker {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 8px;
        }

        .rail-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 700;
            line-height: 1.1;
        }

        .rail-sub {
            margin-top: 6px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.7;
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .metric-item {
            border-radius: 12px;
            background: rgba(20, 28, 46, 0.72);
            padding: 10px;
        }

        .metric-label {
            color: var(--muted);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 4px;
        }

        .metric-value {
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
        }

        .signal-list {
            display: grid;
            gap: 8px;
        }

        .signal-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border-radius: 12px;
            background: rgba(20, 28, 46, 0.72);
            padding: 10px;
            align-items: center;
        }

        .signal-item.interactive {
            cursor: pointer;
            border: 1px solid transparent;
            transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
        }

        .signal-item.interactive:hover,
        .signal-item.interactive.active {
            border-color: rgba(99,179,237,0.22);
            background: rgba(24, 36, 58, 0.9);
            transform: translateY(-1px);
        }

        .signal-side {
            display: grid;
            gap: 2px;
            min-width: 0;
        }

        .signal-title {
            font-size: 12px;

<body>
    <div id="contextBar"></div>
    <div id="pageBridge"></div>

    <section class="hero">
        <div class="hero-card">
            <div class="hero-top">
                <div>
                    <div class="hero-title" id="heroTitle">IBKR 图表工作台</div>
                    <div class="hero-copy">做成类似 TradingView 的全屏分析页：主图展示 K 线 / EMA / VWAP / 买卖点，副图展示 CRSI、OBV RSI、ATR% 和成交量。图表指标与信号统一基于当前环境的 <code>ibkr_bars</code> 实时重算，也可以手动切换标的和周期。</div>
                </div>
                <div class="hero-status" id="heroStatus"></div>
            </div>
            <div class="toolbar">
                <div class="symbol-form">
                    <input id="chartSymbolInput" class="symbol-input" type="text" placeholder="AAPL" maxlength="12">
                    <button class="toolbar-btn primary" type="button" onclick="loadSymbolFromInput()">加载标的</button>
                    <button class="toolbar-btn" id="compareBtn" type="button" onclick="runIbkrCompare()">IBKR 对比</button>
                    <button class="toolbar-btn" id="clearCompareBtn" type="button" onclick="clearIbkrCompare()">清空对比</button>
                    <button class="toolbar-btn" type="button" onclick="reloadChartPage()">刷新图表</button>
                </div>
                <div class="toolbar-filters">
                    <div class="filter-block">
                        <div class="toolbar-label">周期</div>
                        <div class="tf-group" id="timeframeGroup"></div>
                    </div>
                    <div class="filter-block">
                        <div class="toolbar-label">时间范围</div>
                        <div class="range-group" id="rangeGroup"></div>
                    </div>
                </div>
            </div>
            <div class="summary-strip" id="summaryStrip"></div>
            <div class="layer-strip" id="layerStrip"></div>
            <div class="cursor-strip" id="cursorStrip"></div>
        </div>
    </section>

    <section class="workspace">
        <div class="panel chart-panel">
            <div class="panel-header">
                <div>
                    <div class="panel-title" id="chartPanelTitle">图表加载中</div>
                    <div class="panel-copy">主图的指标与信号点按当前 bars 实时重算；5m 之外通常不展示信号点，只保留价格与指标轨迹。</div>
                </div>
                <div class="panel-meta" id="chartMeta">--</div>
            </div>
            <div class="chart-shell">
                <div class="tv-toolbar" id="chartToolbar"></div>
                <div class="chart-stage-shell">
                    <div class="chart-stage-overlay">
                        <div class="tv-floating-legend" id="chartFloatingLegend"></div>
                        <div class="tv-watermark" id="chartWatermark">Trading Flight<br><span id="chartWatermarkSymbol">--</span></div>
                    </div>
                    <div id="chartCanvas" class="chart-stage"></div>
                </div>
                <div class="chart-bottom-bar">
                    <div class="chart-bottom-status" id="chartBottomStatus"></div>
                    <div class="chart-shortcut-strip" id="chartShortcutStrip"></div>
                </div>
            </div>
            <div class="chart-note" id="chartNote">等待基于 bars 实时重算图表 ...</div>
        </div>

        <div class="rail-shell">

        </div>

    <div id="nav"></div>

    <script>
        const SUPPORTED_INTERVALS = ['5m', '15m', '30m', '1h', '4h', '1d'];
        const RANGE_PRESETS = [
            { key: '1d', shortLabel: '1D', longLabel: '最近1天', durationMs: 24 * 60 * 60 * 1000 },
            { key: '3d', shortLabel: '3D', longLabel: '最近3天', durationMs: 3 * 24 * 60 * 60 * 1000 },
            { key: '1w', shortLabel: '1W', longLabel: '最近1周', durationMs: 7 * 24 * 60 * 60 * 1000 },
            { key: '1m', shortLabel: '1M', longLabel: '最近1月', durationMs: 31 * 24 * 60 * 60 * 1000 },
            { key: 'all', shortLabel: 'ALL', longLabel: '全部历史', durationMs: 0 },
        ];
        let currentEnvironment = getCurrentRuntimeEnvironment();
        let currentSymbol = '';
        let currentInterval = '5m';
        let currentRangeKey = '1d';
        let currentAnchorMs = 0;
        let currentIndicatorId = '';
        let chartInstance = null;
        let lastPayload = null;
        let comparePayload = null;
        let compareLoading = false;
        let compareError = '';
        let selectedBarIndex = -1;
        let selectedSignalId = '';
        let hoverBarIndex = -1;
        let activeDrawerSignalId = '';
        let chartZoomState = null;
        let chartViewportState = { start: 0, end: 100, startIndex: 0, endIndex: 0, visibleBars: 0, totalBars: 0 };
        let activeRailCardIndex = 0;
        let mobileQuickPanelOpen = false;
        let chartLayerState = {
            ema: true,
            vwap: true,
            signals: true,
            volume: true,
        };

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeInterval(value, fallback = '5m') {
            const text = String(value || '').trim().toLowerCase();
            const map = {
                '5': '5m',
                '5m': '5m',
                '15': '15m',
                '15m': '15m',
                '30': '30m',
                '30m': '30m',
                '60': '1h',
                '60m': '1h',
                '1h': '1h',
                '1hr': '1h',
                '240': '4h',
                '240m': '4h',
                '4h': '4h',
                '1d': '1d',
                'd': '1d',
                'day': '1d'
            };
            const normalized = map[text] || text;
            return SUPPORTED_INTERVALS.includes(normalized) ? normalized : fallback;
        }

        function getDefaultRangeKey(interval) {
            const normalized = normalizeInterval(interval || '5m');
            const defaults = {
                '5m': '1d',
                '15m': '3d',
                '30m': '1w',
                '1h': '1m',
                '4h': '1m',
                '1d': '1m',
            };
            return defaults[normalized] || '1d';
        }

        function normalizeRangeKey(value, interval = currentInterval) {
            const key = String(value || '').trim().toLowerCase();
            const exists = RANGE_PRESETS.some((item) => item.key === key);
            return exists ? key : getDefaultRangeKey(interval);
        }

        function getRangePreset(rangeKey) {
            return RANGE_PRESETS.find((item) => item.key === normalizeRangeKey(rangeKey, currentInterval)) || RANGE_PRESETS[0];
        }

        function getRangeLabel(rangeKey) {
            return getRangePreset(rangeKey)?.longLabel || '最近1天';
        }

        function getRangeStartMs(endMs, rangeKey) {
            const durationMs = Number(getRangePreset(rangeKey)?.durationMs || 0);
            return durationMs > 0 && endMs > 0 ? Math.max(0, endMs - durationMs) : 0;
        }

        function buildIntervalAliases(interval) {
            const normalized = normalizeInterval(interval || '5m');
            const map = {
                '5m': ['5m', '5'],
                '15m': ['15m', '15'],
                '30m': ['30m', '30'],
                '1h': ['1h', '60', '60m', '1hr'],
                '4h': ['4h', '240', '240m'],
                '1d': ['1d', 'd', 'day'],
            };
            return map[normalized] || [normalized];
        }

        function buildIntervalFilterExpression(interval, fields = ['interval']) {
            const conditions = [];
            buildIntervalAliases(interval).forEach((alias) => {
                fields.forEach((field) => {
                    conditions.push(`${field} = "${escapeQueryValue(alias)}"`);
                });
            });
            return `(${conditions.join(' || ')})`;
        }

        function toChartValue(value) {
            if (value === null || value === undefined || value === '') return null;
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

        function parseRecordExtra(extra) {
            if (!extra) return {};
            if (typeof extra === 'object') return extra;
            if (typeof extra === 'string') {
                try {
                    const parsed = JSON.parse(extra);
                    return parsed && typeof parsed === 'object' ? parsed : {};
                } catch (_) {
                    return {};
                }
            }
            return {};
        }

        function normalizeIndicatorRecord(record) {
            if (!record || typeof record !== 'object') return record;
            const extra = parseRecordExtra(record.extra);
            const normalized = { ...record };
            Object.entries(extra).forEach(([key, value]) => {
                if (normalized[key] === undefined || normalized[key] === null || normalized[key] === '') {
                    normalized[key] = value;
                }
            });
            normalized._extra = extra;
            return normalized;
        }

        function getInitialZoom(rangeKey, barsCount) {
            if (!barsCount) return { start: 0, end: 100 };
            if (normalizeRangeKey(rangeKey, currentInterval) !== 'all') return { start: 0, end: 100 };
            const visibleBars = Math.min(240, barsCount);
            const start = Math.max(0, 100 - (visibleBars / barsCount) * 100);
            return { start, end: 100 };
        }

        function clampNumber(value, min, max) {
            const num = Number(value);
            if (!Number.isFinite(num)) return min;
            return Math.min(Math.max(num, min), max);
        }

        function clampIndex(index, barsCount) {
            if (!barsCount) return 0;
            return Math.min(Math.max(Math.round(Number(index) || 0), 0), barsCount - 1);
        }

        function percentToIndex(percent, barsCount) {
            if (!barsCount) return 0;
            if (barsCount === 1) return 0;
            return clampIndex((clampNumber(percent, 0, 100) / 100) * (barsCount - 1), barsCount);
        }

        function indexToPercent(index, barsCount) {
            if (!barsCount || barsCount === 1) return 0;
            return clampNumber((clampIndex(index, barsCount) / (barsCount - 1)) * 100, 0, 100);
        }

        function applyChartViewportState(zoom, barsCount) {
            const fallback = getInitialZoom(currentRangeKey, barsCount);
            const start = clampNumber(zoom?.start ?? fallback.start, 0, 100);
            const end = clampNumber(zoom?.end ?? fallback.end, 0, 100);
            const safeEnd = end <= start ? Math.min(100, start + 6) : end;
            const startIndex = percentToIndex(start, barsCount);
            const endIndex = percentToIndex(safeEnd, barsCount);
            chartZoomState = { start, end: safeEnd };
            chartViewportState = {
                start,
                end: safeEnd,
                startIndex,
                endIndex,
                visibleBars: Math.max(1, endIndex - startIndex + 1),
                totalBars: barsCount,
            };
            return chartViewportState;
        }

        function getCurrentZoomWindow(barsCount) {
            return applyChartViewportState(chartZoomState || getInitialZoom(currentRangeKey, barsCount), barsCount);
        }

        function isCompactViewport() {
            return Number(window.innerWidth || 0) <= 768;
        }

        function isPhoneViewport() {

        function getIntervalLabel(interval) {

                '30m': '30分钟',
                '1h': '1小时',
                '4h': '4小时',
                '1d': '1天',
            };
            return map[String(interval || '').trim().toLowerCase()] || String(interval || '--');
        }

        function formatPrice(value) {
            const num = Number(value);
            return Number.isFinite(num) ? `$${num.toFixed(2)}` : '--';
        }

        function formatNumber(value, digits = 2) {
            const num = Number(value);
            return Number.isFinite(num) ? num.toFixed(digits) : '--';
        }

        function formatPercent(value, digits = 2) {
            const num = Number(value);
            return Number.isFinite(num) ? `${num > 0 ? '+' : ''}${num.toFixed(digits)}%` : '--';
        }

        function signedColor(value) {
            const num = Number(value);
            if (!Number.isFinite(num) || num === 0) return 'var(--text)';
            return num > 0 ? 'var(--long)' : 'var(--short)';
        }

        function formatSignedPriceDelta(value) {
            const num = Number(value);
            return Number.isFinite(num) ? `${num > 0 ? '+' : ''}${formatPrice(num).replace('$', '$')}` : '--';
        }

        function getTrendText(value) {
            const num = Number(value || 0);
            if (num > 0) return '📈 多头';
            if (num < 0) return '📉 空头';

        }

        function formatSignalTime(item) {
            if (item?.us_time) return String(item.us_time);
            const ms = Number(item?.bar_time_ms || 0);
            return ms ? formatBarTimeMsToET(ms) : '--';

        function deriveItemDate(item) {
            const fromUs = String(item?.us_time || '').trim();
            if (/^\d{4}-\d{2}-\d{2}/.test(fromUs)) return fromUs.slice(0, 10);
            const ms = Number(item?.bar_time_ms || 0);
            if (ms > 0) return new Date(ms).toISOString().slice(0, 10);
            return new Date().toISOString().slice(0, 10);
        }

        function buildOrderDetailsUrl(signal, fallbackDate = '') {
            if (!signal || typeof signal !== 'object') return '';

            if (isComputedSignal(signal) && !tradeGroupId && !orderId) return '';

            const params = { date: fallbackDate || deriveItemDate(signal) };
            if (signalId) params.signal_id = signalId;

        function parseQueryContext() {

            return {

        async function fetchWithRetry(collection, params, maxRetries = 2) {
            let lastError = null;
            for (let attempt = 0; attempt <= maxRetries; attempt += 1) {
                try {
                    return await apiFetch(collection, params);
                } catch (error) {
                    lastError = error;
                    const message = String(error?.message || error || '');
                    const retryable = message.includes('502') || message.includes('Failed to fetch');
                    if (!retryable || attempt === maxRetries) break;
                    await new Promise((resolve) => setTimeout(resolve, 300 * (attempt + 1)));
                }
            }
            throw lastError || new Error(`Failed to fetch ${collection}`);
        }

        function getAuthHeaders(extra = {}) {
            const headers = { ...extra };
            const token = getToken();
            if (token) headers.Authorization = `Bearer ${token}`;
            return headers;
        }

        async function requestChartJson(path, { method = 'GET', body = null } = {}, maxRetries = 1) {
            let lastError = null;
            for (let attempt = 0; attempt <= maxRetries; attempt += 1) {
                try {
                    const options = {
                        method,
                        headers: getAuthHeaders(body ? { 'Content-Type': 'application/json' } : {})
                    };
                    if (body) options.body = JSON.stringify(body);
                    const response = await fetch(buildPageUrl(path, {}, { environment: currentEnvironment }), options);
                    if (response.status === 401 || response.status === 403) {
                        clearToken();
                        location.href = `/login.html?from=${encodeURIComponent(`${location.pathname}${location.search}`)}`;
                        throw new Error('Authentication failed');
                    }
                    const text = await response.text();
                    let data = {};
                    try {
                        data = text ? JSON.parse(text) : {};
                    } catch (_) {
                        data = { ok: false, raw: text };
                    }
                    if (!response.ok) {
                        throw new Error(data.message || data.error || `Request failed (${response.status})`);
                    }
                    if (data && data.ok === false) {
                        throw new Error(data.error || data.message || 'Request failed');
                    }
                    return data;
                } catch (error) {
                    lastError = error;
                    const message = String(error?.message || error || '');
                    const retryable = message.includes('502') || message.includes('Failed to fetch');
                    if (!retryable || attempt === maxRetries) break;
                    await new Promise((resolve) => setTimeout(resolve, 300 * (attempt + 1)));
                }
            }
            throw lastError || new Error(`Failed to request ${path}`);
        }

        function buildTimelinePayloadFromResponse(response) {
            const bars = Array.isArray(response?.bars)
                ? response.bars.slice().sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0))
                : [];
            const indicators = Array.isArray(response?.indicator_timeline)
                ? response.indicator_timeline.map((item) => normalizeIndicatorRecord(item)).sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0))
                : [];
            const signals = Array.isArray(response?.signals)
                ? response.signals.slice().sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0))
                : [];
            const latestIndicator = normalizeIndicatorRecord(response?.latest_indicator || null) || (indicators.length ? indicators[indicators.length - 1] : null);
            return {
                latestIndicator,
                bars,
                indicators,
                signals,
                meta: response?.meta && typeof response.meta === 'object' ? response.meta : {}
            };
        }

        function buildComparePayloadFromResponse(response) {
            const comparison = response?.comparison && typeof response.comparison === 'object'
                ? response.comparison
                : { summary: {}, timeline: [], mismatch_examples: [] };
            const timeline = Array.isArray(comparison.timeline)
                ? comparison.timeline.slice().sort((a, b) => Number(a.bar_time_ms || 0) - Number(b.bar_time_ms || 0))
                : [];
            return {
                storedTimeline: buildTimelinePayloadFromResponse(response?.stored_timeline || {}),
                ibkrTimeline: buildTimelinePayloadFromResponse(response?.ibkr_timeline || {}),
                comparison: {
                    summary: comparison.summary || {},
                    timeline,
                    mismatch_examples: Array.isArray(comparison.mismatch_examples) ? comparison.mismatch_examples : []
                },
                meta: response?.meta && typeof response.meta === 'object' ? response.meta : {},
                rowByMs: new Map(
                    timeline
                        .map((item) => [Number(item?.bar_time_ms || 0), item])
                        .filter(([barTimeMs]) => barTimeMs > 0)
                )
            };
        }

        function getCompareStatusLabel(status) {

        function buildCompareStatusPills(statusMap) {

        function summarizeCompareFields(group, emptyText = '一致') {
            if (!group || typeof group !== 'object') return emptyText;
            const status = String(group.status || '').trim().toLowerCase();
            if (status === 'match') return emptyText;
            if (status === 'missing_stored') return 'Stored 缺失';
            if (status === 'missing_ibkr') return 'IBKR 缺失';
            if (status === 'absent') return '无数据';
            const fields = Array.isArray(group.fields) ? group.fields : [];

        async function resolveInitialContext() {
            const query = parseQueryContext();
            const hasExplicitRange = RANGE_PRESETS.some((item) => item.key === query.range);
            currentIndicatorId = query.indicatorId;
            currentSymbol = query.symbol;
            currentInterval = query.interval;
            currentRangeKey = normalizeRangeKey(query.range, currentInterval);
            currentAnchorMs = query.barTimeMs;

            if (currentIndicatorId) {
                try {
                    const indicatorResp = await fetchWithRetry('ibkr_indicators', {
                        filter: `id = "${escapeQueryValue(currentIndicatorId)}" && environment = "${escapeQueryValue(currentEnvironment)}"`,
                        perPage: 1
                    });
                    const indicator = normalizeIndicatorRecord(Array.isArray(indicatorResp?.items) ? indicatorResp.items[0] : null);
                    if (indicator) {
                        currentSymbol = String(indicator.symbol || currentSymbol).trim().toUpperCase();
                        currentInterval = normalizeInterval(indicator.interval || currentInterval, currentInterval || '5m');
                        if (!hasExplicitRange) currentRangeKey = getDefaultRangeKey(currentInterval);
                        currentAnchorMs = Number(indicator.bar_time_ms || currentAnchorMs) || currentAnchorMs;
                        return;
                    }
                } catch (_) {}
            }

            if (currentSymbol) return;

            const latestBarResp = await fetchWithRetry('ibkr_bars', {
                filter: `environment = "${escapeQueryValue(currentEnvironment)}" && ${buildIntervalFilterExpression('5m', ['interval'])}`,
                sort: '-bar_time_ms',

            currentInterval = normalizeInterval(latestBar?.interval || '5m');

        function buildContext(payload, index, signalId = '') {
            const bars = Array.isArray(payload?.bars) ? payload.bars : [];
            if (!bars.length) return null;
            const indicators = Array.isArray(payload?.indicators) ? payload.indicators : [];
            const indicatorMap = new Map(indicators.map((item) => [Number(item?.bar_time_ms || 0), item]));
            const signals = Array.isArray(payload?.signals) ? payload.signals : [];
            const safeIndex = Math.min(Math.max(Number(index) || 0, 0), bars.length - 1);
            const bar = bars[safeIndex] || null;
            const signalMatches = signals.filter((item) => Number(item?.bar_time_ms || 0) === Number(bar?.bar_time_ms || 0));
            const activeSignal = signalMatches.find((item) => String(item?.signal_id || item?.id || '') === String(signalId || ''))
                || signalMatches[0]
                || null;
            return {
                index: safeIndex,
                bar,
                indicator: indicatorMap.get(Number(bar?.bar_time_ms || 0)) || payload?.latestIndicator || null,
                signalMatches,
                activeSignal,
            };

            if (selectedBarIndex >= 0) return clampIndex(selectedBarIndex, bars.length);

            const indexByMs = new Map(bars.map((bar, index) => [Number(bar?.bar_time_ms || 0), index]));

            const rail = document.getElementById('infoRail');

            const cards = rail ? Array.from(rail.querySelectorAll('.rail-card')) : [];
            const chips = nav ? Array.from(nav.querySelectorAll('.rail-nav-chip')) : [];
            if (!cards.length) return;
            const safeIndex = Math.max(0, Math.min(Number(index) || 0, cards.length - 1));

            });
            chips.forEach((chip, chipIndex) => {

            if (compact) {

            const bars = Array.isArray(payload?.bars) ? payload.bars : [];

            const viewport = applyChartViewportState(zoom, bars.length);
            chartInstance.dispatchAction({
                type: 'dataZoom',
                start: viewport.start,
                end: viewport.end,
            });
            renderChartBottomBar(payload);

            chartZoomState = null;

        }

        function ensureBarVisible(index, payload = lastPayload, { center = false, paddingBars = 10 } = {}) {
            const bars = Array.isArray(payload?.bars) ? payload.bars : [];
            if (!chartInstance || !bars.length) return;
            const targetIndex = clampIndex(index, bars.length);
            const viewport = chartViewportState.totalBars === bars.length
                ? chartViewportState
                : getCurrentZoomWindow(bars.length);
            const visibleBars = Math.max(8, viewport.visibleBars || Math.min(96, bars.length));
            const minVisible = viewport.startIndex + Math.min(paddingBars, Math.max(2, Math.floor(visibleBars / 4)));
            const maxVisible = viewport.endIndex - Math.min(paddingBars, Math.max(2, Math.floor(visibleBars / 4)));
            if (!center && targetIndex >= minVisible && targetIndex <= maxVisible) return;
            let startIndex = targetIndex - Math.floor(visibleBars / 2);
            startIndex = Math.max(0, Math.min(startIndex, Math.max(0, bars.length - visibleBars)));
            const endIndex = Math.min(bars.length - 1, startIndex + visibleBars - 1);
            setChartZoomWindow({
                start: indexToPercent(startIndex, bars.length),
                end: indexToPercent(endIndex, bars.length),
            }, payload);
        }

        function zoomChartAroundFocus(factor, payload = lastPayload) {
            const bars = Array.isArray(payload?.bars) ? payload.bars : [];
            if (!chartInstance || !bars.length) return;
            const viewport = chartViewportState.totalBars === bars.length
                ? chartViewportState
                : getCurrentZoomWindow(bars.length);
            const currentVisible = Math.max(8, viewport.visibleBars || Math.min(120, bars.length));
            const nextVisible = Math.max(12, Math.min(bars.length, Math.round(currentVisible * factor)));
            const anchorIndex = getEffectiveCursorIndex(payload);
            let startIndex = clampIndex(anchorIndex - Math.floor(nextVisible / 2), bars.length);
            if (startIndex + nextVisible > bars.length) {
                startIndex = Math.max(0, bars.length - nextVisible);
            }
            const endIndex = Math.min(bars.length - 1, startIndex + nextVisible - 1);
            setChartZoomWindow({

                end: indexToPercent(endIndex, bars.length),

                    <div class="rail-sub">当前只在 5m 周期叠加按 bars 实时重算的买卖点；其它周期专注指标与价格结构。</div>
                </div>
                <div class="rail-card">
                    <div class="rail-kicker">Recent Signals</div>
                    <div class="signal-list">
                        ${signals.slice(0, 5).map((signal) => {
                            const signalKey = String(signal.signal_id || signal.id || '');
                            const encodedSignalKey = encodeURIComponent(signalKey);
                            const signalMs = Number(signal.bar_time_ms || 0) || 0;
                            const isActive = activeSignalKey && activeSignalKey === signalKey;
                            return `
                            <div class="signal-item interactive ${isActive ? 'active' : ''}" onclick="focusSignalBar('${signalMs}', '${encodedSignalKey}')">
                                <div class="signal-side">
                                    <div class="signal-title">${escapeHtml(signal.signal || signal.direction || '--')}</div>
                                    <div class="signal-meta">${escapeHtml(formatSignalTime(signal))}</div>
                                </div>
                                <span class="signal-badge ${String(signal.direction || '').toLowerCase() === 'short' ? 'short' : 'long'}">${escapeHtml(String(signal.direction || '--').toUpperCase())}</span>
                            </div>
                        `;
                        }).join('') || '<div class="signal-item"><div class="signal-side"><div class="signal-title">暂无信号</div><div class="signal-meta">当前时间窗没有实时重算出的信号</div></div></div>'}
                    </div>
                </div>
            `;
            renderRailNav();
        }

        function formatChartLabel(item) {
            if (item?.us_time) return String(item.us_time).slice(5, 16);
            const ms = Number(item?.bar_time_ms || 0);
            if (!ms) return '--';
            const date = new Date(ms);
            if (Number.isNaN(date.getTime())) return '--';
            return `${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')} ${String(date.getUTCHours()).padStart(2, '0')}:${String(date.getUTCMinutes()).padStart(2, '0')}`;
        }

        function buildSignalScatter(signals, bars, priceResolver, color) {
            const indexByMs = new Map(bars.map((bar, index) => [Number(bar.bar_time_ms || 0), index]));
            return signals.map((signal) => {
                const barMs = Number(signal.bar_time_ms || 0);
                const xIndex = indexByMs.get(barMs);
                if (xIndex === undefined) return null;
                const yValue = Number(priceResolver(signal) || 0);
                if (!Number.isFinite(yValue) || yValue <= 0) return null;
                return {
                    value: [xIndex, yValue],
                    itemStyle: { color },
                    name: signal.signal || signal.direction || '',
                    signal_id: signal.signal_id || '',
                };
            }).filter(Boolean);
        }

        function buildTooltipHtml(payload, index) {
            const context = buildContext(payload, index, '');
            const bar = context?.bar || null;
            if (!bar) return '';
            const indicator = context?.indicator || null;
            const signal = context?.activeSignal || null;
            const direction = String(signal?.direction || '').toLowerCase();
            const signalColor = direction === 'short' ? '#FC8181' : '#48BB78';
            return `
                <div style="font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.75;min-width:240px;">
                    <div style="font-size:12px;font-weight:700;color:#E2EAF4;margin-bottom:6px;">${escapeHtml(bar.us_time || '--')}</div>
                    <div>O ${escapeHtml(formatPrice(bar.open))} · H ${escapeHtml(formatPrice(bar.high))}</div>
                    <div>L ${escapeHtml(formatPrice(bar.low))} · C ${escapeHtml(formatPrice(bar.close))}</div>
                    <div>Vol ${escapeHtml(formatNumber(bar.volume || 0, 0))}</div>
                    <div style="margin-top:6px;color:#8BA4C4;">EMA20 ${indicator ? escapeHtml(formatPrice(indicator.ema_fast)) : '--'} · EMA50 ${indicator ? escapeHtml(formatPrice(indicator.ema_slow)) : '--'}</div>
                    <div style="color:#8BA4C4;">EMA100 ${indicator ? escapeHtml(formatPrice(indicator.ema_trend)) : '--'} · VWAP ${indicator ? escapeHtml(formatPrice(indicator.vwap)) : '--'}</div>
                    <div style="color:#8BA4C4;">CRSI ${indicator ? escapeHtml(formatNumber(indicator.crsi)) : '--'} · OBV ${indicator ? escapeHtml(formatNumber(indicator.obv_rsi)) : '--'} · ATR ${indicator ? escapeHtml(formatPercent(indicator.atr_pct)) : '--'}</div>
                    <div style="margin-top:6px;color:${signal ? signalColor : '#8BA4C4'};">${signal ? `${escapeHtml(String(signal.signal || signal.direction || '--'))} · ${escapeHtml(String(signal.direction || '--').toUpperCase())}` : 'No signal on this bar'}</div>
                </div>
            `;
        }

        function renderChart(payload) {

            const emaFast = sortedBars.map((bar) => toChartValue(indicatorMap.get(Number(bar.bar_time_ms || 0))?.ema_fast));

            const longSignals = buildSignalScatter(

            const series = [

                        label: {
