<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单明细</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <style>
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-row {
            margin-bottom: 6px;
        }

        .search-row > div:first-child {
            margin-bottom: 4px;
        }

        .search-row .date-picker {
            margin-bottom: 0;
            gap: 6px;
        }

        .search-row .date-btn {
            padding: 6px 10px;
            font-size: 11px;
        }

        .search-row .refresh-control {
            gap: 4px;
        }

        .search-row .refresh-btn {
            padding: 4px 6px;
            font-size: 12px;
        }

        .search-row .refresh-select {
            padding: 4px 6px;
            font-size: 11px;
        }

        /* 覆盖 date-picker 样式 */
        .date-picker {
            margin-bottom: 0 !important;
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        .search-input:focus { border-color: var(--accent); }

        /* 统一卡片（signal-* 规范） */
        .signal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .signal-symbol {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .signal-direction {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .signal-direction.long  { background: rgba(72,187,120,0.15); color: var(--long); }
        .signal-direction.short { background: rgba(252,129,129,0.15); color: var(--short); }

        .signal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .signal-item { display: flex; flex-direction: column; gap: 4px; }

        .signal-label {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        .signal-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .signal-note {
            background: rgba(99,179,237,0.05);
            border-left: 2px solid var(--accent);
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        /* 事件徽章 */
        .event-badge {
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .event-entry       { background: rgba(59,130,246,0.2);  color: #60a5fa; }
        .event-takeprofit  { background: rgba(72,187,120,0.2);  color: var(--long); }
        .event-stoploss    { background: rgba(252,129,129,0.2); color: var(--short); }
        .event-init        { background: rgba(99,179,237,0.2);  color: var(--accent); }
        .event-submitted   { background: rgba(246,173,85,0.2);  color: var(--pending); }
        .event-filled      { background: rgba(104,211,145,0.2); color: var(--executed); }
        .event-canceled    { background: rgba(113,128,150,0.2); color: var(--rejected); }
        .event-closed      { background: rgba(252,129,129,0.2); color: var(--short); }

        /* 时间线（flow） */
        .flow-timeline {
            position: relative;
            padding-left: 24px;
            margin-top: 20px;
        }

        .flow-timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }

        .flow-item {
            position: relative;
            padding-bottom: 16px;
        }

        .flow-dot {
            position: absolute;
            left: -20px;
            top: 16px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .flow-init       { background: var(--accent); }
        .flow-submitted  { background: var(--pending); }
        .flow-filled     { background: var(--executed); }
        .flow-canceled   { background: var(--rejected); }
        .flow-closed     { background: var(--short); }

        .flow-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }

        .flow-event-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .flow-time {
            font-size: 11px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* 按钮 */
        .action-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: clamp(12px, 3vw, 14px);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .btn-view { grid-column: 1 / -1; background: var(--accent); color: var(--bg); }
        .btn-view:active { background: #4299e1; }
        .btn-confirm { background: var(--long); color: var(--bg); }
        .btn-cancel { background: var(--short); color: var(--bg); }

        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .back-btn:active { background: var(--surface); }

        /* 加载更多 */
        .load-more-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more-btn:active { background: var(--surface); }
        .load-more-btn:disabled { color: var(--muted); cursor: not-allowed; }

        /* 刷新控件 */
        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:active { color: var(--accent); border-color: var(--accent); }
        .refresh-btn.spinning { animation: spin 0.6s linear; }

        .refresh-control { display: flex; gap: 6px; align-items: center; }

        .refresh-select {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            cursor: pointer;
        }

        .refresh-select:focus { border-color: var(--accent); }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-label">TRADING</div>
                <div class="logo-title">📜 订单明细</div>
            </div>
            <div class="live-badge">
                <div class="live-dot"></div>
                LIVE
            </div>
        </div>
    </div>

    <div class="content">
        <div class="search-row">
            <div style="display:flex;gap:8px;align-items:center;">
                <div id="datePicker" style="flex:1;"></div>
                <div class="refresh-control">
                    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄</button>
                    <select class="refresh-select" id="refreshInterval" onchange="changeRefreshInterval(this.value)">
                        <option value="0">关闭</option>
                        <option value="5">5秒</option>
                        <option value="30" selected>30秒</option>
                        <option value="60">1分钟</option>
                    </select>
                </div>
            </div>
            <input class="search-input" id="searchInput" placeholder="🔍 搜索股票/订单ID..." oninput="onSearchChange()">
        </div>
        <div id="detailsContainer"><div class="loading">加载中...</div></div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreDetails()" style="display: none;">加载更多</button>
    </div>

    <div id="nav"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const pb = new PocketBase('https://pb.lzw-glory.top');
        let allDetails = [];
        let filterDetailId = null;
        let currentDate = new Date().toISOString().split('T')[0];
        let refreshTimer = null;
        let currentInterval = 30;

        // Pagination
        let currentPage = 1;
        const itemsPerPage = 10;
        let displayedDetails = [];
        let hasMore = false;
        let totalItems = 0;

        async function initAuth() {
            const token = getToken();
            if (!token) { location.href = '/login.html?from=/order_details.html'; return; }
            pb.authStore.save(token, null);
        }

        // ============================================================
        // 多模式查询: id / order_id / signal_id / list
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const filterSignalId = urlParams.get('signal_id');
        const filterOrderId = urlParams.get('order_id');
        const filterDetailId = urlParams.get('id');

        // 优先级: id > order_id > signal_id
        let queryMode = 'list';
        let effectiveFilter = null;
        if (filterDetailId) { queryMode = 'id'; effectiveFilter = filterDetailId; }
        else if (filterOrderId) { queryMode = 'order_id'; effectiveFilter = filterOrderId; }
        else if (filterSignalId) { queryMode = 'signal_id'; effectiveFilter = filterSignalId; }

        async function loadDetails() {
            try {
                let filters = [];
                if (queryMode === 'id') {
                    filters.push(`id = "${effectiveFilter}"`);
                } else if (queryMode === 'order_id') {
                    filters.push(`order_id = "${effectiveFilter}"`);
                } else if (queryMode === 'signal_id') {
                    filters.push(`signal_id = "${effectiveFilter}"`);
                } else {
                    const startTime = `${currentDate} 00:00:00`;
                    const endTime = `${currentDate} 23:59:59`;
                    filters.push(`created >= "${startTime}" && created <= "${endTime}"`);
                }
                const filter = filters.join(' && ');

                const result = await pb.collection('order_details').getList(currentPage, itemsPerPage, {
                    filter: filter,
                    sort: 'created',
                    $autoCancel: false
                });
                allDetails = result.items || [];
                hasMore = result.items.length === itemsPerPage;
                totalItems = result.totalItems || 0;
                resetPagination();
                renderDetails();
                updateLoadMoreButton();
            } catch (error) {
                console.error('加载失败:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                document.getElementById('detailsContainer').innerHTML =
                    `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">加载失败: ${error.message}</div></div>`;
            }
        }

        function getFilteredDetails() {
            const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();
            return searchTerm ? allDetails.filter(d =>
                (d.symbol || '').toLowerCase().includes(searchTerm) ||
                (d.id || '').toLowerCase().includes(searchTerm) ||
                (d.order_id || '').toLowerCase().includes(searchTerm) ||
                (d.signal_id || '').toLowerCase().includes(searchTerm)
            ) : allDetails;
        }

        function getPaginatedDetails() {
            const filtered = getFilteredDetails();
            const start = (currentPage - 1) * itemsPerPage;
            return filtered.slice(0, start + itemsPerPage);
        }

        function updateLoadMoreButton() {
            const btn = document.getElementById('loadMoreBtn');
            if (!btn) return;
            const filtered = getFilteredDetails();
            const hasMore = displayedDetails.length < filtered.length;
            btn.style.display = hasMore ? 'block' : 'none';
            btn.textContent = hasMore ? `加载更多 (${displayedDetails.length}/${filtered.length})` : '没有更多了';
            btn.disabled = !hasMore;
        }

        async function loadMoreDetails() {
            if (!hasMore) return;
            try {
                const token = getToken();
                if (!token) return;

                currentPage++;

                let filters = [];
                if (queryMode === 'id') {
                    filters.push(`id = "${effectiveFilter}"`);
                } else if (queryMode === 'order_id') {
                    filters.push(`order_id = "${effectiveFilter}"`);
                } else if (queryMode === 'signal_id') {
                    filters.push(`signal_id = "${effectiveFilter}"`);
                } else {
                    const startTime = `${currentDate} 00:00:00`;
                    const endTime = `${currentDate} 23:59:59`;
                    filters.push(`created >= "${startTime}" && created <= "${endTime}"`);
                }
                const filter = filters.join(' && ');

                const result = await pb.collection('order_details').getList(currentPage, itemsPerPage, {
                    filter: filter,
                    sort: 'created',
                    $autoCancel: false
                });

                allDetails = [...allDetails, ...result.items];
                hasMore = result.items.length === itemsPerPage;
                totalItems = result.totalItems || 0;

                displayedDetails = allDetails;
                renderDetails();
                updateLoadMoreButton();
            } catch (error) {
                console.error('加载更多失败:', error);
                currentPage--;
            }
        }

        function resetPagination() {
            currentPage = 1;
            displayedDetails = getPaginatedDetails();
        }

        function renderDetails() {
            const container = document.getElementById('detailsContainer');

            if (queryMode !== 'list' && allDetails.length > 0) {
                renderFlowView(container);
                return;
            }

            const filtered = displayedDetails;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">暂无明细</div></div>`;
                return;
            }
            container.innerHTML = filtered.map(renderDetailCard).join('');
        }

        function onSearchChange() {
            resetPagination();
            renderDetails();
            updateLoadMoreButton();
        }

        function formatBarTimeMsToET(barTimeMs) {
            if (!barTimeMs) return '-';
            const d = new Date(parseInt(barTimeMs));
            const et = new Date(d.toLocaleString('en-US', { timeZone: 'America/New_York' }));
            return et.toLocaleString('en-US', {
                timeZone: 'America/New_York',
                month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            });
        }

        function renderFlowView(container) {
            const detail = allDetails[0];
            const symbol = detail?.symbol || 'N/A';
            const direction = detail?.direction || '';
            const signalId = detail?.signal_id || '';
            const orderId = detail?.order_id || '';

            const sorted = [...allDetails].sort((a, b) =>
                new Date(a.us_time || a.created) - new Date(b.us_time || b.created)
            );

            container.innerHTML = `
                <div class="signal-card">
                    <div class="signal-header">
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span class="signal-symbol">${symbol}</span>
                            <span class="signal-direction ${direction}">${direction.toUpperCase()}</span>
                        </div>
                        ${signalId ? `<span class="signal-label">📡 ${signalId}</span>` : ''}
                    </div>
                </div>
                <div class="flow-timeline">
                    ${sorted.map((detail, i) => {
                        const extra = detail.extra || {};
                        const evt = detail.order_type || 'Entry';
                        const sts = (detail.status || 'Init').toLowerCase();
                        const statusText = { 'init':'初始化','submitted':'已提交','filled':'已成交','canceled':'已取消','closed':'已平仓' }[sts] || detail.status || '';
                        return `
                        <div class="flow-item">
                            <div class="flow-dot flow-${sts}"></div>
                            <div class="flow-card">
                                <div class="flow-event-row">
                                    <div style="display:flex;gap:6px;align-items:center;">
                                        <span class="event-badge event-${evt.toLowerCase()}">${evt}</span>
                                        <span class="event-badge event-${sts}">${statusText}</span>
                                    </div>
                                    <span class="flow-time">
                                        ${detail.us_time ? detail.us_time + ' ET' : '-'}
                                        ${detail.cn_time ? ' / ' + detail.cn_time + ' CN' : ''}
                                        ${detail.bar_time_ms ? `<br><span style="font-size:10px;opacity:0.7;">⏱ ${formatBarTimeMsToET(detail.bar_time_ms)}</span>` : ''}
                                    </span>
                                </div>
                                <div class="signal-grid">
                                    <div class="signal-item"><div class="signal-label">限价</div><div class="signal-value">${extra.limit_price != null ? '$' + Number(extra.limit_price).toFixed(2) : '-'}</div></div>
                                    <div class="signal-item"><div class="signal-label">成交价</div><div class="signal-value">${extra.fill_price != null ? '$' + Number(extra.fill_price).toFixed(2) : '-'}</div></div>
                                    <div class="signal-item"><div class="signal-label">数量</div><div class="signal-value">${extra.quantity != null ? extra.quantity : '-'}</div></div>
                                    <div class="signal-item"><div class="signal-label">已成交</div><div class="signal-value">${extra.filled_qty != null ? extra.filled_qty : '-'}</div></div>
                                    ${extra.tp_price ? `<div class="signal-item"><div class="signal-label">止盈</div><div class="signal-value">$${Number(extra.tp_price).toFixed(2)}</div></div>` : ''}
                                    ${extra.sl_price ? `<div class="signal-item"><div class="signal-label">止损</div><div class="signal-value">$${Number(extra.sl_price).toFixed(2)}</div></div>` : ''}
                                    <div class="signal-item"><div class="signal-label">PB 新建</div><div class="signal-value" style="font-size:11px;">${formatTime(detail.created, 'America/New_York', 'short')}</div></div>
                                    <div class="signal-item"><div class="signal-label">PB 更新</div><div class="signal-value" style="font-size:11px;">${formatTime(detail.updated, 'America/New_York', 'short')}</div></div>
                                    ${extra.sequence != null ? `<div class="signal-item"><div class="signal-label">序号</div><div class="signal-value">#${extra.sequence}</div></div>` : ''}
                                </div>
                                ${detail.reason ? `<div class="signal-note">${detail.reason}</div>` : ''}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
                ${signalId ? `
                <div style="margin-top:12px;">
                    <a href="/signals.html?signal_id=${signalId}&date=${currentDate}" class="action-btn btn-view" style="display:block;text-align:center;text-decoration:none;">📡 查看关联信号</a>
                </div>` : ''}
            `;
        }

        function renderDetailCard(detail) {
            const extra = detail.extra || {};
            const evt = detail.order_type || 'Entry';
            const sts = (detail.status || 'Init').toLowerCase();
            const statusText = { 'init':'初始化','submitted':'已提交','filled':'已成交','canceled':'已取消','closed':'已平仓' }[sts] || detail.status || '';
            const signalId = detail.signal_id || '';
            const orderId = detail.order_id || '';

            return `
                <div class="signal-card">
                    <div class="signal-header">
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span class="signal-symbol">${detail.symbol || 'N/A'}</span>
                            <span class="signal-direction ${detail.direction}">${(detail.direction || '').toUpperCase()}</span>
                            <span class="event-badge event-${evt.toLowerCase()}">${evt}</span>
                            <span class="event-badge event-${sts}">${statusText}</span>
                        </div>
                        <span class="flow-time">
                            ${detail.us_time ? detail.us_time + ' ET' : '-'}${detail.cn_time ? ' / ' + detail.cn_time + ' CN' : ''}
                        </span>
                    </div>
                    <div class="signal-grid">
                        <div class="signal-item"><div class="signal-label">QC 订单ID</div><div class="signal-value" style="font-size:10px;word-break:break-all;">${orderId || '-'}</div></div>
                        ${detail.order_id && detail.order_id !== orderId ? `<div class="signal-item"><div class="signal-label">IB 订单ID</div><div class="signal-value" style="font-size:10px;">${detail.order_id}</div></div>` : ''}
                        ${signalId ? `<div class="signal-item"><div class="signal-label">信号ID</div><div class="signal-value" style="font-size:10px;">${signalId}</div></div>` : ''}
                        <div class="signal-item"><div class="signal-label">限价</div><div class="signal-value">${extra.limit_price != null ? '$' + Number(extra.limit_price).toFixed(2) : '-'}</div></div>
                        <div class="signal-item"><div class="signal-label">成交价</div><div class="signal-value">${extra.fill_price != null ? '$' + Number(extra.fill_price).toFixed(2) : '-'}</div></div>
                        <div class="signal-item"><div class="signal-label">数量</div><div class="signal-value">${extra.quantity != null ? extra.quantity : '-'}</div></div>
                        <div class="signal-item"><div class="signal-label">已成交</div><div class="signal-value">${extra.filled_qty != null ? extra.filled_qty : '-'}</div></div>
                        ${extra.tp_price ? `<div class="signal-item"><div class="signal-label">止盈</div><div class="signal-value">$${Number(extra.tp_price).toFixed(2)}</div></div>` : ''}
                        ${extra.sl_price ? `<div class="signal-item"><div class="signal-label">止损</div><div class="signal-value">$${Number(extra.sl_price).toFixed(2)}</div></div>` : ''}
                        <div class="signal-item"><div class="signal-label">PB 新建</div><div class="signal-value" style="font-size:11px;">${formatTime(detail.created, 'America/New_York', 'short')}</div></div>
                        <div class="signal-item"><div class="signal-label">PB 更新</div><div class="signal-value" style="font-size:11px;">${formatTime(detail.updated, 'America/New_York', 'short')}</div></div>
                    </div>
                    ${detail.reason ? `<div class="signal-note">${detail.reason}</div>` : ''}
                    ${signalId ? `
                    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
                        <a href="/signals.html?signal_id=${signalId}&date=${currentDate}" class="action-btn btn-view" style="display:block;text-align:center;text-decoration:none;">📡 查看关联信号</a>
                    </div>` : ''}
                </div>
            `;
        }

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 600);
            loadDetails();
        }

        function changeRefreshInterval(seconds) {
            currentInterval = parseInt(seconds);
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            if (currentInterval > 0) {
                refreshTimer = setInterval(loadDetails, currentInterval * 1000);
            }
        }

        window.onDateChange = function(startDate, endDate) {
            currentDate = startDate;
            loadDetails();
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            document.getElementById('nav').innerHTML = renderNav('/order_details.html');
            document.getElementById('datePicker').innerHTML = renderDatePicker();

            // 非列表模式：隐藏搜索框，显示返回按钮
            if (queryMode !== 'list') {
                const searchRow = document.querySelector('.search-row');
                const datePicker = searchRow?.querySelector('#datePicker');
                const searchInput = searchRow?.querySelector('#searchInput');
                if (datePicker) datePicker.style.display = 'none';
                if (searchInput) searchInput.style.display = 'none';

                const backUrl = queryMode === 'signal_id'
                    ? `/signals.html?date=${currentDate}`
                    : '/orders.html';
                const backLabel = queryMode === 'signal_id' ? '← 返回信号' : '← 返回订单';
                if (searchRow) {
                    searchRow.innerHTML = `<a href="${backUrl}" class="back-btn">${backLabel}</a>`;
                }
            }

            loadDetails();
            changeRefreshInterval(30);

            // 向下滚动自动加载更多
            let isLoadingMore = false;
            window.addEventListener('scroll', () => {
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const scrollHeight = document.documentElement.scrollHeight;
                const clientHeight = document.documentElement.clientHeight;
                if (scrollTop + clientHeight >= scrollHeight - 200) {
                    if (!isLoadingMore && hasMore && queryMode === 'list') {
                        isLoadingMore = true;
                        loadMoreDetails().finally(() => { isLoadingMore = false; });
                    }
                }
            });
        });
    </script>
</body>
</html>
