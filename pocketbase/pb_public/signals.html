<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>信号</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="common.js"></script>
    <script>document.write(getCommonStyles());</script>
    <script>document.write('<style>' + getIndicatorModalStyles() + '</style>');</script>
    <style>
        .search-row {
            margin-bottom: 6px;
        }

        .search-row > div:first-child {
            margin-bottom: 4px;
        }

        .search-row .date-picker {
            margin-bottom: 0;
            gap: 6px;
        }

        .search-row .date-btn {
            padding: 6px 10px;
            font-size: 11px;
        }

        .search-row .refresh-control {
            gap: 4px;
        }

        .search-row .refresh-btn {
            padding: 4px 6px;
            font-size: 12px;
        }

        .search-row .refresh-select {
            padding: 4px 6px;
            font-size: 11px;
        }

        .search-input {
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stats-bar .stat-chip:nth-child(4),
        .stats-bar .stat-chip:nth-child(5) {
            grid-column: auto;
        }

        .stats-bar .stat-chip:nth-child(4) {
            justify-self: end;
        }

        .stats-bar .stat-chip:nth-child(5) {
            justify-self: start;
        }

        /* 状态筛选 Tab */
        .status-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 8px 0;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .direction-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 8px 0;
            background: var(--bg);
            position: sticky;
            top: 50px;
            z-index: 9;
        }

        .status-tab {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #C4D4E4;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .status-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .status-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .status-tab .tab-count {
            font-size: 10px;
            margin-left: 2px;
            opacity: 0.8;
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        .stat-chip .stat-label {
            color: var(--muted);
        }

        .stat-chip .stat-value {
            color: var(--accent);
            font-weight: 700;
        }

        .signal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .signal-card:active {
            transform: scale(0.98);
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .signal-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .signal-icon {
            font-size: 20px;
        }

        .signal-symbol {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .signal-direction {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .signal-direction.long {
            background: rgba(72,187,120,0.15);
            color: var(--long);
        }

        .signal-direction.short {
            background: rgba(252,129,129,0.15);
            color: var(--short);
        }

        .signal-daychange {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            margin-left: 8px;
        }

        .signal-daychange.text-long {
            color: var(--long);
        }

        .signal-daychange.text-short {
            color: var(--short);
        }

        .signal-interval {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--surface2);
            color: var(--accent);
            margin-left: 6px;
        }

        .signal-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-pending,
        .status-awaiting_confirm {
            background: rgba(246,173,85,0.2);
            color: var(--pending);
        }

        .status-executed {
            background: rgba(104,211,145,0.2);
            color: var(--executed);
        }

        .status-expired, .status-rejected {
            background: rgba(113,128,150,0.2);
            color: var(--rejected);
        }

        .status-closed {
            background: rgba(139,92,246,0.2);
            color: #a78bfa;
        }

        .signal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .signal-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .signal-item.full-width {
            grid-column: span 3;
        }

        .signal-item.shares-amount {
            grid-column: span 2;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            background: var(--surface2);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .shares-amount-left, .shares-amount-right {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .shares-amount-right {
            text-align: right;
        }

        .shares-amount-left .signal-value, .shares-amount-right .signal-value {
            font-size: 16px;
        }

        .shares-amount-divider {
            width: 1px;
            height: 30px;
            background: var(--border);
        }

        .signal-label {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        .signal-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .signal-note {
            background: rgba(99,179,237,0.05);
            border-left: 2px solid var(--accent);
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--muted);
        }

        .signal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .signal-actions .action-btns-row {
            display: flex;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .signal-actions .action-btns-row .action-btn {
            flex: 1;
            padding: 8px 4px;
            font-size: 11px;
            white-space: nowrap;
        }

        .action-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: clamp(12px, 3vw, 14px);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .btn-confirm {
            background: var(--long);
            color: var(--bg);
        }

        .btn-confirm:active {
            background: #38a169;
        }

        .btn-cancel {
            background: var(--short);
            color: var(--bg);
        }

        .btn-cancel:active {
            background: #e53e3e;
        }

        .btn-view {
            grid-column: 1 / -1;
            background: var(--accent);
            color: var(--bg);
        }

        .btn-view:active {
            background: #4299e1;
        }

        /* ATR 波动率行 */
        .atr-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .atr-label {
            font-size: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .atr-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }
        .atr-high   { background: rgba(229,62,62,0.15); color: #e53e3e; }
        .atr-medium { background: rgba(237,137,54,0.15); color: #ed8936; }
        .atr-low    { background: rgba(72,187,120,0.15); color: #48bb78; }
        .atr-sl {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
        }
        .sl-ok   { color: #48bb78; }
        .sl-warn { color: #e53e3e; }

        .amount-highlight {
            background: rgba(99,179,237,0.1);
            border: 1px solid rgba(99,179,237,0.2);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .amount-label {
            font-size: 11px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .amount-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .indicator-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .indicator-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .badge-change-up {
            background: rgba(72,187,120,0.2);
            color: var(--long);
        }

        .badge-change-down {
            background: rgba(252,129,129,0.2);
            color: var(--short);
        }

        .badge-div {
            background: rgba(99,179,237,0.2);
            color: var(--accent);
        }

        .badge-fractal {
            background: rgba(246,173,85,0.2);
            color: var(--pending);
        }

        .badge-ema {
            background: rgba(139,92,246,0.2);
            color: #a78bfa;
        }

        .badge-reverse {
            background: rgba(252,129,129,0.2);
            color: var(--short);
        }

        /* 技术指标详情图标按钮 */
        .indicator-details-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .indicator-details-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .view-details-btn {
            margin-top: 10px;
            padding: 8px;
            background: rgba(99,179,237,0.1);
            border: 1px solid rgba(99,179,237,0.2);
            border-radius: 8px;
            color: var(--accent);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .view-details-btn:active {
            background: rgba(99,179,237,0.2);
        }

        .load-more-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more-btn:active {
            background: var(--surface);
        }

        .load-more-btn:disabled {
            color: var(--muted);
            cursor: not-allowed;
        }

        .date-range-picker {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
        }

        .date-range-picker input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .date-range-picker input::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
        }

        .date-range-picker span {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .apply-range-btn {
            padding: 10px 14px;
            background: var(--accent);
            border: none;
            color: var(--bg);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            white-space: nowrap;
        }

        .apply-range-btn:hover {
            opacity: 0.9;
        }

        .header-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
        }

        .refresh-control {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .search-row .refresh-control .refresh-btn {
            padding: 8px 10px;
            font-size: 12px;
        }

        .search-row .refresh-control .refresh-select {
            padding: 8px 10px;
            font-size: 11px;
        }

        /* 覆盖 date-picker 样式 */
        .date-picker {
            margin-bottom: 0 !important;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:active {
            color: var(--accent);
            border-color: var(--accent);
        }

        .refresh-select {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            cursor: pointer;
        }

        .refresh-select:focus {
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-label">TRADING</div>
                <div class="logo-title">📡 信号</div>
            </div>
            <div class="live-badge">
                <div class="live-dot"></div>
                LIVE
            </div>
        </div>
    </div>

    <div class="content">
        <div class="search-row">
            <div style="display:flex;gap:8px;align-items:center;">
                <div id="datePicker" style="flex:1;"></div>
                <div class="refresh-control">
                    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄</button>
                    <select class="refresh-select" id="refreshInterval" onchange="changeRefreshInterval(this.value)">
                        <option value="0">关闭</option>
                        <option value="5">5秒</option>
                        <option value="30" selected>30秒</option>
                        <option value="60">1分钟</option>
                    </select>
                </div>
            </div>
            <input class="search-input" id="searchInput" placeholder="🔍 搜索股票/信号ID..." oninput="onSearchChange(this.value)">
        </div>
        <!-- 状态筛选 Tab -->
        <div class="status-tabs">
            <button class="status-tab active" data-status="all" onclick="selectStatus('all', this)">全部<span class="tab-count" data-status="all">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="awaiting_confirm" onclick="selectStatus('awaiting_confirm', this)">待确认<span class="tab-count" data-status="awaiting_confirm">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="pending" onclick="selectStatus('pending', this)">等待执行<span class="tab-count" data-status="pending">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="executed" onclick="selectStatus('executed', this)">已执行<span class="tab-count" data-status="executed">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="closed" onclick="selectStatus('closed', this)">已平仓<span class="tab-count" data-status="closed">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="expired" onclick="selectStatus('expired', this)">已过期<span class="tab-count" data-status="expired">(<span class="count-value">0</span>)</span></button>
            <button class="status-tab" data-status="rejected" onclick="selectStatus('rejected', this)">已拒绝<span class="tab-count" data-status="rejected">(<span class="count-value">0</span>)</span></button>
        </div>

        <div id="directionTabs"></div>

        <div id="signalsContainer">
            <div class="loading">加载中...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreSignals()" style="display: none;">加载更多</button>
    </div>

    <div id="nav"></div>

    <!-- 技术指标详情浮层（由 common.js 动态注入） -->
    <div id="indicatorModalContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.min.js"></script>
    <script>
        const pb = new PocketBase('https://pb.lzw-glory.top');
        let allSignals = [];
        let signalIndicatorsMap = {}; // { signalId: normalizedIndicator }
        let reverseSignalsMap = {};   // { symbol: [reverseSignals] }
        let currentDate = new Date().toISOString().split('T')[0];
        let rangeStartDate = null;
        let rangeEndDate = null;
        let currentDirection = 'all';
        let currentStatus = 'all';
        let currentSearch = '';
        let refreshTimer = null;
        let currentInterval = 30;

        // Pagination
        let currentPage = 1;
        const itemsPerPage = 10;
        let displayedSignals = [];
        let hasMore = false;
        let totalItems = 0;

        // Signal validity configuration (from config table, default 30 minutes)
        let signalValidityMinutes = 30;

        async function initAuth() {
            const token = getToken();
            if (!token) {
                location.href = '/login.html?from=/signals.html';
                return;
            }
            pb.authStore.save(token, null);
        }

        // 防止重复加载的标志
        let isLoadingSignals = false;

        async function loadSignals() {
            // 防止重复调用
            if (isLoadingSignals) return;
            isLoadingSignals = true;

            // 重置为第一页
            currentPage = 1;

            try {
                // Load signal validity configuration from config table
                try {
                    const configResult = await pb.collection('config').getFirstListItem('key = "signal_validity_minutes"');
                    console.log('[Signals] signal_validity_minutes 配置结果:', configResult);
                    if (configResult && configResult.value) {
                        signalValidityMinutes = parseInt(configResult.value) || 30;
                        console.log('[Signals] signal_validity_minutes 配置值:', signalValidityMinutes);
                    }
                } catch (e) {
                    console.warn('[Signals] 无法读取 signal_validity_minutes 配置，使用默认值 30 分钟:', e);
                    signalValidityMinutes = 30;
                }
                let startTime, endTime;

                // 优先使用日期范围
                if (rangeStartDate && rangeEndDate) {
                    startTime = `${rangeStartDate} 00:00:00`;
                    endTime = `${rangeEndDate} 23:59:59`;
                } else {
                    startTime = `${currentDate} 00:00:00`;
                    endTime = `${currentDate} 23:59:59`;
                }

                // 构建 filter 条件（使用 us_time 而非 created，因为 created 是服务器时间）
                const conditions = [`us_time >= "${startTime}"`, `us_time <= "${endTime}"`];

                // 状态筛选
                if (currentStatus !== 'all') {
                    conditions.push(`status = "${currentStatus}"`);
                }

                // 方向筛选
                if (currentDirection !== 'all') {
                    conditions.push(`direction = "${currentDirection}"`);
                }

                // 搜索筛选（symbol 或 signal_id）
                if (currentSearch) {
                    const s = currentSearch.toUpperCase();
                    conditions.push(`(symbol ~ "${s}" || signal_id ~ "${s}")`);
                }

                const filter = conditions.join(' && ');

                // 使用分页 API，每次请求 100 条用于统计
                const page = currentPage;
                const perPage = 10;

                showLoading('加载中...');
                const result = await pb.collection('signals').getList(page, perPage, {
                    filter: filter,
                    sort: '-created',
                    $autoCancel: false
                });

                allSignals = result.items;

                // 更新分页状态
                hasMore = result.items.length === perPage;
                totalItems = result.totalItems;
                displayedSignals = allSignals;

                // 加载反向信号、指标和订单
                await loadReverseSignalsMap();
                await loadSignalIndicators();
                await loadOrdersMap();

                renderSignals();
                updateCountdowns();
                updateLoadMoreButton();
                await updateStatusTabCounts();
            } catch (error) {
                console.error('加载失败:', error);
                if (error.status === 401 || error.status === 403) {
                    handleAuthError();
                    return;
                }
                showToast('加载失败: ' + error.message);
            } finally {
                isLoadingSignals = false;
                hideLoading();
            }
        }

        // 日期范围筛选函数
        function applyDateRange() {
            const startInput = document.getElementById('rangeStartDate').value;
            const endInput = document.getElementById('rangeEndDate').value;

            if (!startInput || !endInput) {
                showToast('请选择开始日期和结束日期');
                return;
            }

            if (new Date(startInput) > new Date(endInput)) {
                showToast('开始日期不能晚于结束日期');
                return;
            }

                if (rangeStartDate && rangeEndDate) {
                    // 日期范围模式
                    const startDate = new Date(rangeStartDate + 'T00:00:00Z');
                    const endDate = new Date(rangeEndDate + 'T23:59:59Z');
                    startTimeMs = startDate.getTime();
                    endTimeMs = endDate.getTime();
                } else {
                    // 单日期模式

                    startTimeMs = date.getTime();
                    endTimeMs = date.getTime() + 86400000; // 加一天

                const symbolFilter = symbols.map(s => `symbol = "${s}"`).join(' || ');

                const latestBySymbol = {};

                        latestBySymbol[item.symbol] = item;
                    }

                // 处理结果
                Object.keys(latestBySymbol).forEach(symbol => {
                    const data = latestBySymbol[symbol];
                    // 复用 common.js 中的 normalizeIndicatorRecord，确保所有字段齐全
                    const normalized = normalizeIndicatorRecord(data);

                    // Map 到所有使用该 symbol 的信号
                    allSignals.forEach(signal => {
                        if (signal.symbol === symbol) {
                            signalIndicatorsMap[signal.id] = normalized;

            if (typeof marketIndexes === 'string') {
                try {

                }

            const marketRelation = signalExtra.market_relation || 'neutral';
            const marketRelationText = signalExtra.market_relation_text || '';

            if (!marketIndexes || marketIndexes.length === 0) {
                return '';
            }

            const badges = [];

            // 顺势/逆势标签
            if (marketRelation === 'with_trend') {
                badges.push('<span class="indicator-badge badge-change-up">✅ 顺势</span>');
            } else if (marketRelation === 'against_trend') {
                badges.push('<span class="indicator-badge badge-change-down">⚠️ 逆势</span>');

        // 计算信号倒计时（从 bar_time_ms 开始，有效期从 config 读取）
        function calculateCountdown(barTimeMs) {
            if (!barTimeMs) return '';
            const barTime = new Date(barTimeMs);

            // 使用全局配置的有效期（从 config 表读取，默认 30 分钟）
            const validityMinutes = signalValidityMinutes;

            const expiryTime = new Date(barTime.getTime() + validityMinutes * 60 * 1000);

            // 获取美国东部时间的当前时间
            const now = new Date();
            const usEasternTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));

            const remainingMs = expiryTime - usEasternTime;

            if (remainingMs <= 0) {
                return ''; // 已过期不显示倒计时
            }

            const hours = Math.floor(remainingMs / (60 * 60 * 1000));
            const minutes = Math.floor((remainingMs % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((remainingMs % (60 * 1000)) / 1000);

            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

                                    ${intervalBadge}
                                </div>
                                <div class="signal-label" style="font-size:11px;">${signal.us_time || '-'}</div>
                            </div>
                            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                                <div class="signal-status status-${statusClass}">${statusText}</div>
                            </div>
                        </div>

                        <div class="signal-grid">
                            <div class="signal-item">
                                <div class="signal-label">信号ID</div>
                                <div class="signal-value" style="font-size:12px;font-family:'JetBrains Mono',monospace;">${signal.signal_id || '-'}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">入场价</div>
                                <div class="signal-value">$${(signal.entry || 0).toFixed(2)}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">止损价</div>
                                <div class="signal-value">$${(signal.stop_loss || 0).toFixed(2)}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">止盈价</div>
                                <div class="signal-value">$${(signal.take_profit || 0).toFixed(2)}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">风险回报比</div>
                                <div class="signal-value">${signal.rr || 'N/A'}</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">股数 / 开仓金额</div>
                                <div class="signal-value">${signal.shares || 0} 股 / $${positionSize.toFixed(2)}</div>
                            </div>
                            ${dayChangePct ? `
                            <div class="signal-item">
                                <div class="signal-label">涨幅</div>
                                <div class="signal-value signal-daychange ${dayChangeClass}" style="font-size:11px;">${dayChangePct}</div>
                            </div>
                            ` : ''}
                            ${atrVolLevel ? `
                            <div class="signal-item">
                                <div class="signal-label">波动率</div>
                                <div class="signal-value">${atrVolLabel} ${atrPct.toFixed(2)}%</div>
                            </div>
                            ` : ''}
                        </div>

                        ${signal.reason ? `<div class="signal-note"><strong>原因:</strong> ${signal.reason}</div>` : ''}
                        ${signal.note ? `<div class="signal-note"><strong>备注:</strong> ${signal.note}</div>` : ''}

                        <div class="signal-item full-width shares-amount">
                            <div class="shares-amount-left">
                                <div class="signal-label">预计盈利</div>
                                <div class="signal-value" style="color:var(--long);">$${expectedProfit.toFixed(2)}</div>
                            </div>
                            <div class="shares-amount-divider"></div>
                            <div class="shares-amount-right">
                                <div class="signal-label">预计亏损</div>
                                <div class="signal-value" style="color:var(--short);">$${expectedLoss.toFixed(2)}</div>
                            </div>
                        </div>


                        ${marketIndexBadges ? `
                            <div class="indicator-badges">
                                ${marketIndexBadges}
                            </div>
                        ` : ''}

                        ${reverseSignalBadge || orderBadge ? `
                            <div class="indicator-badges">
                                ${reverseSignalBadge}
                                ${orderBadge}
                            </div>
                        ` : ''}

                        <div class="signal-actions" style="display:flex;flex-direction:column;gap:8px;">
                            <div class="action-btns-row">
                                <button class="action-btn btn-view${latestIndicator ? '' : ' disabled'}" onclick="showIndicatorDetails('${signal.id}')" ${latestIndicator ? '' : 'disabled'}>
                                    📊 技术指标${latestIndicator ? '' : '(无)'}
                                </button>
                                <button class="action-btn btn-view${hasReverseSignal ? '' : ' disabled'}" onclick="viewReverseSignal('${signal.signal_id}')" ${hasReverseSignal ? '' : 'disabled'}>
                                    🔄 反向信号${hasReverseSignal ? '' : '(无)'}
                                </button>
                                <button class="action-btn btn-view${signalOrders.length > 0 ? '' : ' disabled'}" onclick="viewSignalOrders('${signal.signal_id}')" ${signalOrders.length > 0 ? '' : 'disabled'}>
                                    📋 订单${signalOrders.length > 0 ? `(${signalOrders.length})` : '(无)'}
                                </button>
                            </div>
                            ${isPending ? `
                                <div style="display:flex;gap:6px;justify-content:flex-end;">
                                    <button class="action-btn btn-confirm" onclick="confirmSignal('${signal.id}')">
                                        ✓ 确认
                                    </button>
                                    <button class="action-btn btn-cancel" onclick="cancelSignal('${signal.id}')">
                                        ✕ 取消
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 更新所有倒计时显示
        function updateCountdowns() {
            const countdownElements = document.querySelectorAll('.countdown-display');
            countdownElements.forEach(el => {
                const barTime = el.getAttribute('data-bar-time');
                if (barTime) {
                    el.textContent = calculateCountdown(parseInt(barTime)) || '-';
                }
            });
        }

        async function confirmSignal(id) {
            if (!confirm('确认执行此信号？')) return;
            try {
                // awaiting_confirm → pending（已确认，等待QC执行）
                // pending → executed（QC直接执行）
                const signal = allSignals.find(s => s.id === id);
                const newStatus = (signal?.status === 'awaiting_confirm') ? 'pending' : 'executed';
                await pb.collection('signals').update(id, { status: newStatus });
                showToast(newStatus === 'pending' ? '✓ 信号已确认，等待执行' : '✓ 信号已执行');
                await loadSignals();
            } catch (error) {
                console.error('确认失败:', error);
                showToast('✗ 确认失败: ' + error.message);
            }
        }

        async function cancelSignal(id) {
            if (!confirm('确认拒绝此信号？')) return;
            try {
                await pb.collection('signals').update(id, { status: 'rejected' });
                showToast('✓ 信号已拒绝');
                await loadSignals();
            } catch (error) {
                console.error('拒绝失败:', error);
                showToast('✗ 拒绝失败: ' + error.message);
            }
        }

        function viewSignalOrders(signalId) {
            if (!signalId) {
                showToast('无法找到关联订单');
                return;
            }
            const signal = allSignals.find(s => s.signal_id === signalId);
            const orders = ordersMap[signalId] || [];

            if (orders.length === 0) {
                showToast('暂无关联订单');
                return;
            }

            // 把第一个订单号作为搜索参数
            const firstOrderId = orders[0].unique_id || orders[0].order_id;
            location.href = `/orders.html?search=${encodeURIComponent(firstOrderId)}&date=${encodeURIComponent(currentDate)}`;
        }

        function viewReverseSignal(signalId) {
            if (!signalId) {
                showToast('无法找到反向信号');
                return;
            }
            // 跳转到反向信号页面并按 signal_id 筛选
            location.href = `/reverse_signals.html?signal_id=${encodeURIComponent(signalId)}&date=${encodeURIComponent(currentDate)}`;
        }

        function showIndicatorDetails(signalId) {
            const signal = allSignals.find(s => s.id === signalId);
            if (!signal) return;

            const latestIndicator = signalIndicatorsMap[signalId] || null;

            if (!latestIndicator) {
                showToast('暂无技术指标数据');
                return;
            }

            // 调用 common.js 公用弹窗
            showIndicatorModal(latestIndicator);
        }

        window.onDateChange = function(startDate, endDate) {
            currentDate = startDate;
            loadSignals();
        };

        window.onDirectionChange = function(direction) {
            currentDirection = direction;
            loadSignals();
        };

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 600);
            loadSignals();
        }

        function changeRefreshInterval(seconds) {
            currentInterval = parseInt(seconds);

            // 清除旧的定时器
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }

            // 设置新的定时器（不弹提示）
            if (currentInterval > 0) {
                refreshTimer = setInterval(loadSignals, currentInterval * 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            document.getElementById('nav').innerHTML = renderNav('/signals.html');
            document.getElementById('datePicker').innerHTML = renderDatePicker();
            document.getElementById('directionTabs').innerHTML = renderDirectionTabs();
            loadSignals();

            // 初始化定时刷新（默认30秒）
            changeRefreshInterval(30);

            // 设置倒计时更新定时器（每秒更新一次）
            setInterval(updateCountdowns, 1000);

            // 滚动到底部自动加载更多
            let isLoadingMore = false;
            window.addEventListener('scroll', () => {
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const scrollHeight = document.documentElement.scrollHeight;
                const clientHeight = document.documentElement.clientHeight;

                // 距离底部 200px 时触发加载
                if (scrollTop + clientHeight >= scrollHeight - 200) {
                    if (!isLoadingMore && hasMore && !isLoadingSignals) {
                        isLoadingMore = true;
                        loadMoreSignals().finally(() => {
                            isLoadingMore = false;
                        });
                    }
                }
            });

            // 处理 URL 参数（从飞书通知跳转）
            const urlParams = new URLSearchParams(window.location.search);
            const signalId = urlParams.get('signal_id');

            if (signalId) {
                // 等待信号加载完成
                setTimeout(async () => {
                    const signal = allSignals.find(s => s.signal_id === signalId);
                    if (signal) {
                        // 滚动到对应信号
                        const signalCard = document.querySelector(`[data-signal-id="${signalId}"]`);
                        if (signalCard) {
                            signalCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            signalCard.style.boxShadow = '0 0 20px rgba(59, 130, 246, 0.5)';
                            setTimeout(() => {
                                signalCard.style.boxShadow = '';
                            }, 2000);
                        }
                        showToast(`已定位到信号: ${signal.symbol}`);
                    } else {
                        showToast('未找到指定信号');
                    }
                }, 1000);
            }
        });
    </script>
</body>
</html>
